<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>برا السالفة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#e9e4d6;
      --olive:#4e5a2a;
      --panel:#6e7b46;
      --beige:#e5d9b6;
      --black:#111;
      --yellow:#ffd21a;
      --blue:#bfe4ff;
      --shadow: 0 12px 0 rgba(0,0,0,.18);

      --out:#d93a3a;
      --in:#26b45a;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"Baloo Bhaijaan 2",Arial,sans-serif;color:var(--black)}
    .wrap{min-height:100svh;display:flex;justify-content:center;padding:18px 14px 22px}
    .card{width:min(620px,100%);position:relative}

    .top{position:relative;padding:10px 8px 0;min-height:110px}
    .logo{
      position:absolute;left:10px;top:10px;
      width:86px;height:86px;object-fit:contain;pointer-events:none;user-select:none;
    }
    .title{
      margin:16px 0 0;
      text-align:right;
      color:var(--olive);
      font-weight:900;
      font-size:44px;
      padding:0 0 0 96px;
    }

    .namePill{
      margin:18px auto 14px;
      width:min(520px,100%);
      background:var(--beige);
      border-radius:22px;
      padding:16px 18px;
      text-align:center;
      color:var(--olive);
      font-weight:900;
      font-size:52px;
    }

    .panel{
      background:var(--panel);
      border-radius:28px;
      padding:20px 18px 18px;
      margin:0 6px 14px;
      box-shadow:0 14px 0 rgba(0,0,0,.12);
      min-height:44svh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:14px;
    }

    .hint{
      color:#fff;
      font-weight:900;
      font-size:36px;
      line-height:1.25;
      text-align:center;
      padding:0 6px;
    }

    .readyCard{
      background:rgba(0,0,0,.10);
      border:5px solid rgba(0,0,0,.18);
      border-radius:24px;
      padding:18px 14px;
      min-height:140px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
      font-weight:900;
      font-size:52px;
      cursor:pointer;
      user-select:none;
      transition:transform .08s ease, filter .15s ease;
    }
    .readyCard:active{transform:translateY(2px)}

    .readyCard.out{background:var(--out)}
    .readyCard.in{background:var(--in)}
    .readyCard.neutral{background:rgba(0,0,0,.10)}

    .namePillBottom{
      margin:0 auto 0;
      width:min(520px,100%);
      background:var(--beige);
      border-radius:22px;
      padding:14px 18px;
      text-align:center;
      color:var(--olive);
      font-weight:900;
      font-size:46px;
    }

    /* Home */
    .homeBtn{
      position:fixed;
      left:14px;
      bottom:14px;
      width:74px;height:74px;
      border-radius:22px;
      border:6px solid var(--black);
      background:var(--blue);
      box-shadow:0 10px 0 rgba(0,0,0,.18);
      display:grid;place-items:center;
      z-index:40;
      cursor:pointer;
    }
    .homeBtn:active{transform:translateY(2px)}
    .homeBtn svg{width:38px;height:38px}

    @media (max-width:420px){
      .title{font-size:38px}
      .namePill{font-size:46px}
      .hint{font-size:30px}
      .readyCard{font-size:44px; min-height:128px}
      .namePillBottom{font-size:40px}
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <div class="top">
        <img class="logo" src="logo.PNG" alt="logo">
        <div class="title">لعبة برا السالفة</div>
      </div>

      <div id="nameTop" class="namePill">—</div>

      <div class="panel">
        <div class="hint">إذا كنت جاهز اضغط<br>على المربع</div>

        <div id="readyCard" class="readyCard neutral">اضغط جاهز</div>
      </div>

      <div id="nameBottom" class="namePillBottom">—</div>
    </div>
  </div>

  <button id="homeBtn" class="homeBtn" type="button" aria-label="الرئيسية">
    <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10.5L12 3l9 7.5"></path>
      <path d="M5 10v10h14V10"></path>
      <path d="M9 20v-7h6v7"></path>
    </svg>
  </button>

<script>
  function getJSON(key, fallback){
    try{ return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
    catch(e){ return fallback; }
  }

  const params = new URLSearchParams(location.search);
  const mode = (params.get('mode') || localStorage.getItem('bara_mode') || '').toLowerCase(); // multi
  const room = params.get('room') || localStorage.getItem('bara_room') || '';
  const role = (params.get('role') || 'player').toLowerCase(); // player | host
  const cat  = params.get('cat') || localStorage.getItem('bara_cat') || '';

  const nameTop = document.getElementById('nameTop');
  const nameBottom = document.getElementById('nameBottom');
  const readyCard = document.getElementById('readyCard');

  // اسم اللاعب (في الأجهزة المتعددة)
  let myName = '—';
  if(mode === 'multi' && room){
    myName = localStorage.getItem(`bara_room_${room}_myname`) || 'لاعب';
  }else{
    // لو فتحها المقدم للتجربة
    myName = 'المقدم';
  }

  nameTop.textContent = myName;
  nameBottom.textContent = myName;

  // Home behavior حسب الاتفاق
  document.getElementById('homeBtn').onclick = () => {
    if(role === 'host'){
      location.href = 'index.html';
      return;
    }
    // لاعب
    if(mode === 'multi'){
      if(room) location.href = 'waiting.html?room=' + encodeURIComponent(room);
      else location.href = 'waiting.html';
    }else{
      location.href = 'index.html';
    }
  };

  // بيانات الجولة (محفوظة من categories.html للمقدم)
  let topic = '';
  let outName = '';
  if(mode === 'multi' && room){
    topic = localStorage.getItem(`bara_room_${room}_topic`) || '';
    outName = localStorage.getItem(`bara_room_${room}_outName`) || '';
  }

  // لو ما فيه بيانات (مثلاً فتحها لاعب قبل ما المقدم يبدأ)
  if(mode === 'multi' && room && (!topic || !outName)){
    readyCard.textContent = 'بانتظار المقدم...';
    readyCard.className = 'readyCard neutral';
  }

  let revealed = false;

  readyCard.addEventListener('click', ()=>{
    if(revealed) return;
    // إذا ما فيه سالفة بعد، لا تكشف
    if(mode === 'multi' && room && (!topic || !outName)) return;

    revealed = true;

    const isOut = (mode === 'multi' && room) ? (String(myName).trim() === String(outName).trim()) : false;

    if(isOut){
      readyCard.className = 'readyCard out';
      readyCard.textContent = 'برا السالفة';
    }else{
      readyCard.className = 'readyCard in';
      readyCard.textContent = topic ? topic : 'داخل السالفة';
    }
  });
</script>
</body>
</html>
