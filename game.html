<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>بداية اللعبة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{--bg:#e9e4d6;--olive:#3f4a1f;--panel:#6e7b46;--black:#111;--yellow:#ffd21a}
    body{margin:0;background:var(--bg);font-family:"Baloo Bhaijaan 2",Arial,sans-serif;color:#111}
    .wrap{min-height:100svh;display:flex;justify-content:center;align-items:center;padding:18px}
    .box{
      width:min(560px,100%);
      background:var(--panel);
      border-radius:28px;
      padding:24px;
      color:#fff;
      border:6px solid #111;
      box-shadow:0 12px 0 rgba(0,0,0,.18);
      text-align:center;
      font-size:26px;
      font-weight:900;
      line-height:1.8;
    }
    .btn{
      margin-top:18px;
      width:min(420px,100%);
      background:var(--yellow);
      border:5px solid var(--black);
      border-radius:999px;
      padding:16px 16px;
      font-weight:900;font-size:38px;
      box-shadow:0 10px 0 rgba(0,0,0,.18);
      cursor:pointer;
    }
    .btn:active{transform:translateY(2px)}
  </style>
</head>
<body>

  <div class="wrap">
    <div class="box">
      تم اختيار الكتاغوري وبدأنا التجهيز<br>
      (هذه صفحة مؤقتة — الخطوة الجاية: منطق اللعبة وجولات برا السالفة)
      <br>
      <button class="btn" onclick="location.href='categories.html'">رجوع للكتاغوريات</button>
    </div>
  </div>

</body>
</html>
