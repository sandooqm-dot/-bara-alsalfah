<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>برا السالفة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    /* ❗❗ لم يتم تعديل أي حجم أو تصميم ❗❗ */
    :root{
      --bg:#e9e4d6;
      --olive:#4e5a2a;
      --panel:#6e7b46;
      --beige:#e5d9b6;
      --black:#111;
      --yellow:#ffd21a;
      --blue:#bfe4ff;
      --shadow: 0 12px 0 rgba(0,0,0,.18);
      --out:#d93a3a;
      --in:#26b45a;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"Baloo Bhaijaan 2",Arial,sans-serif;color:var(--black)}
    .wrap{min-height:100svh;display:flex;justify-content:center;padding:18px 14px 22px}
    .card{width:min(620px,100%);position:relative}
    .top{position:relative;padding:10px 8px 0;min-height:110px}
    .logo{position:absolute;left:10px;top:10px;width:86px;height:86px}
    .title{margin:16px 0 0;text-align:right;color:var(--olive);font-weight:900;font-size:44px;padding:0 0 0 96px}
    .namePill{margin:18px auto 14px;width:min(520px,100%);background:var(--beige);border-radius:22px;padding:16px 18px;text-align:center;color:var(--olive);font-weight:900;font-size:52px}
    .panel{background:var(--panel);border-radius:28px;padding:20px 18px;margin:0 6px 14px;min-height:44svh;display:flex;flex-direction:column;justify-content:center;gap:14px}
    .hint{color:#fff;font-weight:900;font-size:36px;text-align:center}
    .readyCard{background:rgba(0,0,0,.10);border:5px solid rgba(0,0,0,.18);border-radius:24px;padding:18px 14px;min-height:140px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:52px;cursor:pointer}
    .readyCard.out{background:var(--out)}
    .readyCard.in{background:var(--in)}
    .namePillBottom{margin:0 auto;width:min(520px,100%);background:var(--beige);border-radius:22px;padding:14px 18px;text-align:center;color:var(--olive);font-weight:900;font-size:46px}
  </style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <div class="top">
      <img class="logo" src="logo.PNG">
      <div class="title">لعبة برا السالفة</div>
    </div>

    <div id="nameTop" class="namePill">—</div>

    <div class="panel">
      <div class="hint">إذا كنت جاهز اضغط<br>على المربع</div>
      <div id="readyCard" class="readyCard">جاهز</div>
    </div>

    <div id="nameBottom" class="namePillBottom">—</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, doc, updateDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDQx4gJZMHNWQBeMYsU4fknZHG0WFJ_ckc",
  authDomain: "bara-alsalfah.firebaseapp.com",
  projectId: "bara-alsalfah",
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const room = params.get("room");
const role = params.get("role") || "player";

const myName = localStorage.getItem(`bara_room_${room}_myname`) || "لاعب";
document.getElementById("nameTop").textContent = myName;
document.getElementById("nameBottom").textContent = myName;

const readyCard = document.getElementById("readyCard");
const roomRef = doc(db,"bara_rooms",room);

let clicked = false;

readyCard.onclick = async ()=>{
  if(clicked) return;
  clicked = true;
  readyCard.textContent = "تم";
  readyCard.classList.add("in");

  await updateDoc(roomRef,{
    readyPlayers:{
      [myName]: true
    },
    updatedAt: serverTimestamp()
  });
};

onSnapshot(roomRef,(snap)=>{
  const data = snap.data() || {};
  if(data.topic && data.outName){
    if(myName === data.outName){
      readyCard.className="readyCard out";
      readyCard.textContent="برا السالفة";
    }
  }
});
</script>
</body>
</html>
