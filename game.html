<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برا السالفة</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

<style>
/* ⚠️ لم يتم تغيير أي أحجام أو ألوان */

:root{
  --bg:#e9e4d6;
  --olive:#4e5a2a;
  --panel:#6e7b46;
  --beige:#e5d9b6;
  --black:#111;
  --yellow:#ffd21a;
  --blue:#bfe4ff;
  --out:#d93a3a;
  --in:#26b45a;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Baloo Bhaijaan 2",Arial}

.hidden{display:none}

/* ===== المرحلة الأولى (جاهز) ===== */
.readyCard{cursor:pointer}

/* ===== المرحلة الثانية (Board) ===== */
.board{
  background:var(--panel);
  border-radius:28px;
  padding:18px;
  margin:12px;
}

.boardGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.boardItem{
  background:#fff;
  border:5px solid var(--black);
  border-radius:18px;
  padding:14px;
  text-align:center;
  font-size:28px;
  font-weight:900;
}

.boardItem.done{
  background:var(--blue);
}

.nextBtn{
  margin-top:18px;
  width:100%;
  background:var(--yellow);
  border:5px solid var(--black);
  border-radius:999px;
  padding:16px;
  font-size:36px;
  font-weight:900;
  opacity:.4;
}
.nextBtn.enabled{opacity:1}
</style>
</head>

<body>

<!-- ===== المرحلة الأولى ===== -->
<div id="phaseReady">

  <div style="text-align:center;font-size:44px;font-weight:900" id="myNameTop">—</div>

  <div class="readyCard" id="readyCard"
       style="margin:40px auto;width:80%;text-align:center;
       padding:40px;font-size:40px;border-radius:24px;
       background:rgba(0,0,0,.1)">
    اضغط جاهز
  </div>

  <button id="understandBtn" class="hidden"
    style="display:block;margin:30px auto;font-size:36px;
    padding:16px;border-radius:999px;background:var(--yellow);
    border:5px solid var(--black)">فهمت</button>

</div>

<!-- ===== المرحلة الثانية ===== -->
<div id="phaseBoard" class="hidden">
  <div class="board">
    <div class="boardGrid" id="boardGrid"></div>

    <button id="nextBtn" class="nextBtn">التالي</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, doc, updateDoc, onSnapshot, arrayUnion } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDQx4gJZMHNWQBeMYsU4fknZHG0WFJ_ckc",
  authDomain: "bara-alsalfah.firebaseapp.com",
  projectId: "bara-alsalfah"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const room = params.get("room");
const role = params.get("role") || "player";

const roomRef = doc(db,"bara_rooms",room);

const myName =
  localStorage.getItem(`bara_room_${room}_myname`) || "المقدم";

document.getElementById("myNameTop").textContent = myName;

let topic="", outName="";

onSnapshot(roomRef,s=>{
  const d=s.data()||{};
  topic=d.topic||"";
  outName=d.outName||"";
  renderBoard(d.boardDone||[]);
});

/* ===== المرحلة الأولى ===== */
let revealed=false;
document.getElementById("readyCard").onclick=()=>{
  if(revealed) return;
  revealed=true;
  const isOut=myName===outName;
  const el=document.getElementById("readyCard");
  el.style.background=isOut? "var(--out)" : "var(--in)";
  el.textContent=isOut? "برا السالفة 👀" : topic;
  document.getElementById("understandBtn").classList.remove("hidden");
};

document.getElementById("understandBtn").onclick=async()=>{
  document.getElementById("phaseReady").classList.add("hidden");
  document.getElementById("phaseBoard").classList.remove("hidden");

  await updateDoc(roomRef,{
    boardDone: arrayUnion(myName)
  });
};

/* ===== المرحلة الثانية ===== */
const grid=document.getElementById("boardGrid");
const nextBtn=document.getElementById("nextBtn");

function renderBoard(done){
  grid.innerHTML="";
  let all=true;
  done=done||[];

  const players=[...(new Set(done.concat()))];

  players.forEach(n=>{
    const d=document.createElement("div");
    d.className="boardItem"+(done.includes(n)?" done":"");
    d.textContent=n;
    if(!done.includes(n)) all=false;
    grid.appendChild(d);
  });

  if(role==="host" && all){
    nextBtn.classList.add("enabled");
  }
}

nextBtn.onclick=()=>{
  if(!nextBtn.classList.contains("enabled")) return;
  alert("جاهز للمرحلة القادمة");
};
</script>

</body>
</html>
