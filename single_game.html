<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>لعبة برا السالفة - اللعب الفردي</title>

  <style>
    :root{
      --bg:#e9e4d6;
      --frame:#3f5a2a;
      --card:#6a8450;
      --card2:#d8cfb1;
      --text:#1b1b1b;
      --white:#ffffff;

      --yellow:#f2c21b;
      --yellowText:#111;

      --purple:#7a44a3;
      --vote:#7b1f1f;   /* أحمر داكن */
      --shadow: 0 10px 0 rgba(0,0,0,.25);

      --containerMax: 520px;
      --radiusBig: 26px;
      --radiusMid: 18px;

      --boxPad: 22px;
      --boxMinH: 260px;

      --titleSize: 18px;
      --headerSize: 26px;
      --bigWordSize: 54px;
      --playerNameSize: 36px;
      --askLineSize: 36px;
      --subTextSize: 22px;
      --subTextSizeSmall: 22px;

      --btnH: 62px;
      --btnRadius: 26px;

      --homeSize: 60px;
      --homeGap: 12px;
      --bottomGap: 16px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      color:var(--text);
    }

    .wrap{
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:18px 14px 120px;
    }
    .frame{
      width:min(var(--containerMax), 100%);
      border:10px solid var(--frame);
      border-radius: var(--radiusBig);
      background:transparent;
      padding:18px 16px 24px;
      position:relative;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
    }
    .brandTitle{
      font-size:var(--titleSize);
      font-weight:700;
      color:#2f3f22;
      opacity:.95;
    }
    .logo{
      width:54px;height:54px;
      object-fit:contain;
    }

    .badgeTitle{
      margin:14px auto 16px;
      width:fit-content;
      max-width:100%;
      padding:14px 26px;
      border-radius: 22px;
      background: rgba(216,207,177,.9);
      color:#395427;
      font-weight:900;
      font-size: var(--headerSize);
      line-height:1;
      text-align:center;
    }

    .bigCard{
      background:var(--card);
      color:var(--white);
      border-radius: var(--radiusBig);
      padding: var(--boxPad);
      min-height: var(--boxMinH);
      box-shadow: 0 0 0 8px rgba(216,207,177,.75) inset;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      position:relative;
    }

    .innerCream{
      width:100%;
      border-radius: var(--radiusBig);
      background: rgba(216,207,177,.55);
      padding: 16px 18px;
      margin: 0 auto 12px;
      color:#2f3f22;
      font-weight:900;
      text-align:center;
    }

    .playerNameBox{
      margin: 10px auto 16px;
      width:100%;
      border-radius: 22px;
      background: rgba(216,207,177,.55);
      padding: 18px 16px;
      font-weight:900;
      font-size: var(--playerNameSize);
      color:#3a5227;
      text-align:center;
    }

    .msgText{
      font-size: var(--subTextSize);
      font-weight:800;
      line-height:1.6;
      padding: 0 10px;
    }

    .topicWord{
      font-size: var(--bigWordSize);
      font-weight:1000;
      letter-spacing:.5px;
    }

    .askLine{
      font-size: var(--askLineSize);
      font-weight:1000;
      line-height:1.2;
      margin-bottom: 18px;
    }
    .askLine .who{ color: var(--yellow); }
    .askLine .mid{ color: #fff; margin:0 10px; }
    .askHelpBox{
      width:100%;
      max-width: 420px;
      margin: 0 auto;
      border-radius: 22px;
      background: rgba(0,0,0,.08);
      padding: 18px 18px;
      font-size: var(--subTextSizeSmall);
      font-weight:900;
      line-height:1.6;
    }

    .bottomBar{
      position:fixed;
      left:0; right:0;
      bottom: var(--bottomGap);
      display:flex;
      justify-content:center;
      pointer-events:none;
      z-index:9999;
    }
    .bottomInner{
      width:min(var(--containerMax), calc(100% - 28px));
      position:relative;
      pointer-events:none;
    }

    .homeBtn{
      position:absolute;
      left: var(--homeGap);
      bottom:0;
      width: var(--homeSize);
      height: var(--homeSize);
      border-radius: 50%;
      background: #bfe7ff;
      border:4px solid #000;
      box-shadow: var(--shadow);
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:auto;
      cursor:pointer;
    }
    .homeBtn svg{ width:34px;height:34px; }

    .cta{
      height: var(--btnH);
      border-radius: var(--btnRadius);
      background: var(--yellow);
      color: var(--yellowText);
      border:4px solid #000;
      box-shadow: var(--shadow);
      font-size: 28px;
      font-weight:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      width: 86%;
      max-width: 420px;
      margin: 0 auto;
      pointer-events:auto;
      cursor:pointer;
      user-select:none;
      text-align:center;
      padding: 0 14px;
    }

    @media (max-width: 420px){ .cta{ width: 88%; } }
    @media (max-width: 360px){
      .cta{ width: 90%; font-size: 26px; }
      .homeBtn{ width:56px;height:56px; }
      .homeBtn svg{ width:30px;height:30px; }
    }

    .cta.vote{
      background: var(--vote);
      color:#fff;
      max-width: 360px;
    }

    .cta.compact{
      height: 56px;
      border-radius: 22px;
      max-width: 360px;
      width: 78%;
      font-size: 26px;
    }

    .spacerBottom{ height: 18px; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="frame" id="frame">
      <div class="topbar">
        <div class="brandTitle">لعبة برا السالفة</div>
        <img class="logo" src="logo.PNG" alt="logo" />
      </div>

      <div class="badgeTitle" id="pageTitle"> </div>
      <div id="content"></div>
      <div class="spacerBottom"></div>
    </div>
  </div>

  <div class="bottomBar">
    <div class="bottomInner">
      <button class="homeBtn" id="homeBtn" aria-label="الرئيسية" title="الرئيسية">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 11.5L12 4l9 7.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6.5 10.5V20h11V10.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="cta compact" id="ctaBtn">التالي</button>
    </div>
  </div>

<script>
/* =========================
   Session helpers
   ========================= */
function getSessionJSON(key){
  try{
    const v = sessionStorage.getItem(key);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
function setSessionJSON(key, val){
  sessionStorage.setItem(key, JSON.stringify(val));
}
function firstNonEmptySession(keys){
  for(const k of keys){
    const v = sessionStorage.getItem(k);
    if(v && String(v).trim()) return String(v).trim();
  }
  return "";
}

/* =========================
   Read players + category (supports old/new keys)
   ========================= */
function readPlayers(){
  const keys = [
    "players",
    "bara_players",
    "bara_players_list",
    "baraPlayers",
    "bara_players_names",
    "bara_players_names_list"
  ];
  for(const k of keys){
    const arr = getSessionJSON(k);
    if(Array.isArray(arr) && arr.length) return arr;
  }
  return [];
}
function readCategoryKey(){
  const v = firstNonEmptySession([
    "bara_category_id",
    "categoryKey",
    "bara_selectedCategory",
    "bara_category",
    "selectedCategory"
  ]);
  return (v || "zoo").toLowerCase();
}

/* =========================
   Load words from /data/*.js (your repo format)
   Supports:
   - const car = ["..."]
   - var car = ["..."]
   - window.car = [...]
   - export default [...]
   - export const words = [...]
   ========================= */
async function loadWordsForCategory(key){
  // 1) Try module import (if file is ES module)
  try{
    const mod = await import(`./data/${key}.js?v=${Date.now()}`);
    const cand =
      (mod && Array.isArray(mod.default) ? mod.default : null) ||
      (mod && Array.isArray(mod.words) ? mod.words : null) ||
      (mod && Array.isArray(mod.data) ? mod.data : null) ||
      null;
    if(cand && cand.length){
      return cand.map(x => String(x).trim()).filter(Boolean);
    }
  }catch(e){}

  // 2) Fetch JS text and evaluate safely (works for const/var inside file)
  try{
    const r = await fetch(`data/${key}.js?v=${Date.now()}`, { cache: "no-store" });
    if(r.ok){
      let code = await r.text();

      // إذا فيه export نحوله لصيغة عادية
      code = code
        .replace(/export\s+default\s+/g, "const __default__ = ")
        .replace(/export\s+const\s+/g, "const ")
        .replace(/export\s+let\s+/g, "let ")
        .replace(/export\s+var\s+/g, "var ")
        .replace(/export\s*\{[^}]*\}\s*;?/g, "");

      const safeKey = /^[a-zA-Z_$][\w$]*$/.test(key) ? key : null;

      const fn = new Function("key", `
        "use strict";
        ${code}

        // Common candidates
        let cand =
          (typeof __default__ !== "undefined" ? __default__ : undefined) ||
          (typeof words !== "undefined" ? words : undefined) ||
          (typeof data !== "undefined" ? data : undefined) ||
          (typeof list !== "undefined" ? list : undefined);

        // If variable name matches category key (car/frot/...)
        ${safeKey ? `if(!cand && typeof ${safeKey} !== "undefined") cand = ${safeKey};` : ""}

        // If attached to window (in non-module scripts)
        if(!cand && typeof window !== "undefined"){
          cand =
            window[key] ||
            window[key + "Words"] ||
            window[key + "Data"] ||
            window["DATA_" + key] ||
            window["bara_" + key];
        }

        return cand;
      `);

      const out = fn(key);
      if(Array.isArray(out) && out.length){
        return out.map(x => String(x).trim()).filter(Boolean);
      }
    }
  }catch(e){}

  // 3) Fallback (never crash)
  const FALLBACK = {
    zoo:  ["زرافة","أسد","نمر","فيل","ذئب","غزال","قرد","حصان","ثعلب","دب"],
    car:  ["تويوتا","مرسيدس","هوندا","هيونداي","نيسان","كيا","شفروليه","فورد","بي إم دبليو","أودي"],
    frot: ["تفاح","موز","عنب","برتقال","فراولة","مانجو","رمان","خيار","طماطم","بطيخ"],
    cola: ["كولا","بيبسي","سفن أب","ميرندا","عصير برتقال","عصير تفاح","شاي مثلج","قهوة","حليب","ماء غازي"],
    eat:  ["كبسة","مندي","بيتزا","شاورما","برجر","مكرونة","سمبوسة","جريش","مضغوط","فلافل"],
    play: ["كرة قدم","بلوت","شطرنج","فورتنايت","فيفا","ببجي","كود","مونوبولي","أونو","ليدو"]
  };
  return FALLBACK[key] || FALLBACK.zoo;
}

function pickRandom(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

/* =========================
   Boot
   ========================= */
(async function boot(){
  const players = readPlayers();
  const categoryKey = readCategoryKey();

  if(!players.length){
    location.href = "index.html";
    return;
  }

  // توحيد مفاتيح القراءة لباقي الصفحات
  sessionStorage.setItem("players", JSON.stringify(players));
  sessionStorage.setItem("bara_category_id", categoryKey);
  sessionStorage.setItem("categoryKey", categoryKey);

  // حافظ على السالفة وبرا السالفة حتى لو صار Refresh
  let topicWord = firstNonEmptySession(["bara_topic_word","topicWord"]);
  let outsiderIndexStr = firstNonEmptySession(["bara_out_index","outsiderIndex"]);
  let outsiderIndex = outsiderIndexStr ? Number(outsiderIndexStr) : NaN;

  if(!topicWord){
    const words = await loadWordsForCategory(categoryKey);
    topicWord = pickRandom(words);
    sessionStorage.setItem("bara_topic_word", topicWord);
    sessionStorage.setItem("topicWord", topicWord);
  }

  if(!Number.isInteger(outsiderIndex) || outsiderIndex < 0 || outsiderIndex >= players.length){
    outsiderIndex = Math.floor(Math.random() * players.length);
    sessionStorage.setItem("bara_out_index", String(outsiderIndex));
    sessionStorage.setItem("outsiderIndex", String(outsiderIndex));
  }

  const outsiderName = players[outsiderIndex];

  let state = getSessionJSON("singleState");
  if(!state){
    state = { screen:0, revealIndex:0, askIndex:0, pairings:[] };

    const n = players.length;
    for(let i=0;i<n;i++){
      let targetIndex = i;
      while(targetIndex === i){
        targetIndex = Math.floor(Math.random()*n);
      }
      state.pairings.push({ asker: players[i], target: players[targetIndex] });
    }
    setSessionJSON("singleState", state);
  }

  const pageTitle = document.getElementById("pageTitle");
  const content = document.getElementById("content");
  const ctaBtn = document.getElementById("ctaBtn");
  const homeBtn = document.getElementById("homeBtn");

  homeBtn.addEventListener("click", () => {
    // تصفير كل بيانات اللعبة عند الرجوع للرئيسية
    const keysToRemove = [
      "players","bara_players","bara_players_list","baraPlayers","bara_players_names","bara_players_names_list",
      "bara_category_id","categoryKey","bara_selectedCategory","bara_category","selectedCategory",
      "singleState","bara_topic_word","topicWord","bara_out_index","outsiderIndex"
    ];
    keysToRemove.forEach(k => sessionStorage.removeItem(k));
    location.href = "index.html";
  });

  ctaBtn.addEventListener("click", () => next());

  function render(){
    ctaBtn.classList.add("compact");
    ctaBtn.classList.remove("vote");
    ctaBtn.textContent = "التالي";

    const s = state.screen;

    if(s === 0){
      const p = players[state.revealIndex];
      pageTitle.textContent = " ";
      content.innerHTML = `
        <div class="playerNameBox">${escapeHtml(p)}</div>
        <div class="bigCard" style="min-height:260px;">
          <div class="msgText">
            اعطو الجوال لـ <span style="color:var(--yellow); font-weight:1000;">${escapeHtml(p)}</span><br/>
            اضغط التالي حتى تعرف انت برا السالفة! أو داخلها<br/>
            ولا تخلي احد غيرك يشوف الشاشة!
          </div>
        </div>
      `;
      return;
    }

    if(s === 1){
      const p = players[state.revealIndex];
      const isOut = (p === outsiderName);

      pageTitle.textContent = " ";
      if(isOut){
        content.innerHTML = `
          <div class="bigCard">
            <div>
              <div class="innerCream" style="font-size:40px; font-weight:1000;">السالفة هي :</div>
              <div class="topicWord" style="margin-top:20px;">أنت برا السالفة 👀</div>
            </div>
          </div>
        `;
      }else{
        content.innerHTML = `
          <div class="bigCard">
            <div>
              <div class="innerCream" style="font-size:40px; font-weight:1000;">السالفة هي :</div>
              <div class="topicWord" style="margin-top:20px;">${escapeHtml(topicWord)}</div>
            </div>
          </div>
        `;
      }
      return;
    }

    if(s === 2){
      pageTitle.textContent = "وقت الاسئلة";
      content.innerHTML = `
        <div class="bigCard" style="min-height:280px;">
          <div class="msgText">
            كل شخص راح يسأل شخص ثاني سؤال متعلق بالسالفة<br/>
            اضغط التالي حتى تعرفون مين يسأل مين
          </div>
        </div>
      `;
      return;
    }

    if(s === 3){
      pageTitle.textContent = "وقت الاسئلة";
      const pair = state.pairings[state.askIndex];
      content.innerHTML = `
        <div class="bigCard" style="min-height:320px;">
          <div style="width:100%;">
            <div class="askLine">
              <span class="who">${escapeHtml(pair.asker)}</span>
              <span class="mid">يسأل</span>
              <span class="who">${escapeHtml(pair.target)}</span>
            </div>

            <div class="msgText" style="margin-bottom:12px;">
              سؤال متعلق بالسالفة!
            </div>

            <div class="askHelpBox">
              اختر سؤالك بعناية حتى اللي برا السالفة ما يعرف عن إيش تتكلمون
            </div>
          </div>
        </div>
      `;
      return;
    }

    if(s === 4){
      pageTitle.textContent = "ما تأكدت صح ؟";
      ctaBtn.textContent = "تصويت";
      ctaBtn.classList.add("vote");
      ctaBtn.classList.add("compact");

      content.innerHTML = `
        <div class="bigCard" style="min-height:320px;">
          <div class="msgText">
            الحين يقدر أي أحد يسأل شخص يشك إنه هو اللي برا السالفة<br/><br/>
            <div style="font-size:22px; font-weight:1000; opacity:.95;">
              بعد الانتهاء من الأسئلة اضغط <span style="color:var(--yellow);">تصويت</span>
            </div>
          </div>
        </div>
      `;
      return;
    }
  }

  function next(){
    const s = state.screen;

    if(s === 0){
      state.screen = 1;
      saveAndRender();
      return;
    }

    if(s === 1){
      state.revealIndex++;
      if(state.revealIndex >= players.length){
        state.screen = 2;
      }else{
        state.screen = 0;
      }
      saveAndRender();
      return;
    }

    if(s === 2){
      state.screen = 3;
      state.askIndex = 0;
      saveAndRender();
      return;
    }

    if(s === 3){
      state.askIndex++;
      if(state.askIndex >= state.pairings.length){
        state.screen = 4;
      }
      saveAndRender();
      return;
    }

    if(s === 4){
      // حسب اتفاقك: بعد ضغط "تصويت" نوقف
      return;
    }
  }

  function saveAndRender(){
    setSessionJSON("singleState", state);
    render();
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  render();
})();
</script>

</body>
</html>
