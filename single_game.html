<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>لعبة برا السالفة - اللعب الفردي</title>

  <style>
    :root{
      --bg:#e9e4d6;
      --frame:#3f5a2a;
      --card:#6a8450;
      --card2:#d8cfb1;
      --text:#1b1b1b;
      --white:#ffffff;

      --yellow:#f2c21b;
      --yellowText:#111;

      --vote:#7b1f1f;   /* أحمر داكن */
      --shadow: 0 10px 0 rgba(0,0,0,.25);

      /* مقاسات قابلة للتعديل بسرعة */
      --containerMax: 520px;
      --radiusBig: 26px;

      --boxPad: 22px;
      --boxMinH: 300px;     /* ✅ أكبر شوي */

      --titleSize: 18px;
      --headerSize: 26px;

      --bigWordSize: 56px;     /* ✅ أكبر */
      --playerNameSize: 38px;  /* ✅ أكبر */
      --askLineSize: 38px;     /* ✅ أكبر */
      --subTextSize: 24px;     /* ✅ أكبر */
      --subTextSizeSmall: 24px;

      --btnH: 58px;
      --btnRadius: 22px;

      --homeSize: 60px;
      --homeGap: 12px;
      --bottomGap: 16px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      color:var(--text);
    }

    .wrap{
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:18px 14px 120px;
    }
    .frame{
      width:min(var(--containerMax), 100%);
      border:10px solid var(--frame);
      border-radius: var(--radiusBig);
      background:transparent;
      padding:18px 16px 24px;
      position:relative;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
    }
    .brandTitle{
      font-size:var(--titleSize);
      font-weight:700;
      color:#2f3f22;
      opacity:.95;
    }
    .logo{
      width:54px;height:54px;
      object-fit:contain;
    }

    .badgeTitle{
      margin:14px auto 16px;
      width:fit-content;
      max-width:100%;
      padding:14px 26px;
      border-radius: 22px;
      background: rgba(216,207,177,.9);
      color:#395427;
      font-weight:900;
      font-size: var(--headerSize);
      line-height:1;
      text-align:center;
    }

    .bigCard{
      background:var(--card);
      color:var(--white);
      border-radius: var(--radiusBig);
      padding: var(--boxPad);
      min-height: var(--boxMinH);
      box-shadow: 0 0 0 8px rgba(216,207,177,.75) inset;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      position:relative;
    }

    /* ✅ نفس ستايل مربعات السالفة (أكبر وواضح) */
    .topicBlock{
      width:100%;
      border-radius: 24px;
      background: rgba(216,207,177,.60);
      padding: 18px 16px;
      margin: 0 auto 14px;
      color:#2f3f22;
      font-weight:1000;
      text-align:center;
      box-shadow: inset 0 0 0 4px rgba(0,0,0,.10);
    }
    .topicBlock .label{
      font-size: 40px;
      margin-bottom: 10px;
    }
    .topicWord{
      font-size: var(--bigWordSize);
      font-weight:1000;
      letter-spacing:.5px;
      color:#243417;
    }
    .topicWord.out{
      color:#111;
    }

    .playerNameBox{
      margin: 10px auto 16px;
      width:100%;
      border-radius: 22px;
      background: rgba(216,207,177,.55);
      padding: 18px 16px;
      font-weight:900;
      font-size: var(--playerNameSize);
      color:#3a5227;
      text-align:center;
    }

    .msgText{
      font-size: var(--subTextSize);
      font-weight:900;
      line-height:1.65;
      padding: 0 10px;
    }

    .askLine{
      font-size: var(--askLineSize);
      font-weight:1000;
      line-height:1.2;
      margin-bottom: 18px;
    }
    .askLine .who{ color: var(--yellow); }
    .askLine .mid{ color: #fff; margin:0 10px; }

    /* ✅ أكبر */
    .askHelpBox{
      width:100%;
      max-width: 440px;
      margin: 0 auto;
      border-radius: 22px;
      background: rgba(0,0,0,.10);
      padding: 20px 18px;
      font-size: var(--subTextSizeSmall);
      font-weight:1000;
      line-height:1.7;
    }

    /* ✅ شريط ثابت أسفل + منع التداخل */
    .bottomBar{
      position:fixed;
      left:0; right:0;
      bottom: var(--bottomGap);
      display:flex;
      justify-content:center;
      pointer-events:none;
      z-index:9999;
    }
    .bottomInner{
      width:min(var(--containerMax), calc(100% - 28px));
      position:relative;
      pointer-events:none;
    }

    .homeBtn{
      position:absolute;
      left: var(--homeGap);
      bottom:0;
      width: var(--homeSize);
      height: var(--homeSize);
      border-radius: 50%;
      background: #bfe7ff;
      border:4px solid #000;
      box-shadow: var(--shadow);
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:auto;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .homeBtn:active{ transform: translateY(1px); }
    .homeBtn svg{ width:34px;height:34px; }

    .cta{
      height: var(--btnH);
      border-radius: var(--btnRadius);
      background: var(--yellow);
      color: var(--yellowText);
      border:4px solid #000;
      box-shadow: var(--shadow);
      font-size: 26px;
      font-weight:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      width: 76%;               /* ✅ أصغر أطراف */
      max-width: 360px;         /* ✅ أصغر */
      margin: 0 auto;
      pointer-events:auto;
      cursor:pointer;
      user-select:none;
      text-align:center;
      padding: 0 14px;

      /* ✅ مسافة تمنع التداخل مع زر المنزل */
      margin-left: calc(var(--homeSize) + var(--homeGap) + 10px);
      -webkit-tap-highlight-color: transparent;
    }
    .cta:active{ transform: translateY(1px); }

    .cta.vote{
      background: var(--vote);
      color:#fff;
    }

    .spacerBottom{ height: 18px; }

    @media (max-width: 360px){
      .cta{ width: 78%; font-size: 24px; }
      .homeBtn{ width:56px;height:56px; }
      .homeBtn svg{ width:30px;height:30px; }
      .topicWord{ font-size: 52px; }
      .playerNameBox{ font-size: 34px; }
      .askLine{ font-size: 34px; }
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="frame" id="frame">
      <div class="topbar">
        <div class="brandTitle">لعبة برا السالفة</div>
        <img class="logo" src="logo.PNG" alt="logo" />
      </div>

      <div class="badgeTitle" id="pageTitle"> </div>

      <div id="content"></div>

      <div class="spacerBottom"></div>
    </div>
  </div>

  <div class="bottomBar">
    <div class="bottomInner">
      <button class="homeBtn" id="homeBtn" aria-label="الرئيسية" title="الرئيسية" type="button">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 11.5L12 4l9 7.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6.5 10.5V20h11V10.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="cta" id="ctaBtn" type="button">التالي</button>
    </div>
  </div>

<script>
function getSessionJSON(key){
  try{
    const v = sessionStorage.getItem(key);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
function setSessionJSON(key, val){
  sessionStorage.setItem(key, JSON.stringify(val));
}

/* ✅ اللاعبين + الكتاغوري (يدعم المفاتيح الجديدة والقديمة) */
const players = getSessionJSON("players") || getSessionJSON("bara_players") || [];
const categoryKeyRaw =
  (sessionStorage.getItem("categoryKey") ||
   sessionStorage.getItem("bara_category_id") ||
   sessionStorage.getItem("bara_category_id".trim()) ||
   "").trim();

if(!players.length){
  location.href = "index.html";
}

/* ✅ إذا ما فيه كتاغوري مختار، رجّعه للكتاغوريات */
if(!categoryKeyRaw){
  location.href = "categories.html";
}

const TOPICS = {
  zoo:  ["زرافة","أسد","نمر","فيل","ذئب","غزال","قرد","حصان","ثعلب","دب"],
  car:  ["تويوتا","مرسيدس","هوندا","هيونداي","نيسان","كيا","شفروليه","فورد","بي إم دبليو","أودي"],
  frot: ["تفاح","موز","عنب","برتقال","فراولة","مانجو","رمان","خيار","طماطم","بطيخ"],
  cola: ["كولا","بيبسي","سفن أب","ميرندا","عصير برتقال","عصير تفاح","شاي مثلج","قهوة","حليب","ماء غازي"],
  eat:  ["كبسة","مندي","بيتزا","شاورما","برجر","مكرونة","سمبوسة","جريش","مضغوط","فلافل"],
  play: ["كرة قدم","بلوت","شطرنج","فورتنايت","فيفا","ببجي","كود","مونوبولي","أونو","ليدو"]
};

function pickRandom(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

/* ✅ لا نطيح على zoo إلا إذا الكتاغوري فعلًا غير موجود */
const topicList = TOPICS[categoryKeyRaw] || null;
if(!topicList){
  // لو مفاتيح غلط: رجّعه للكتاغوريات بدل ما يعطيه zoo
  location.href = "categories.html";
}
const topicWord = pickRandom(topicList);

/* اختيار برا السالفة */
const outsiderIndex = Math.floor(Math.random() * players.length);
const outsiderName = players[outsiderIndex];

let state = getSessionJSON("singleState");
if(!state){
  state = {
    screen: 0,
    revealIndex: 0,
    askIndex: 0,
    pairings: []
  };

  const n = players.length;
  for(let i=0;i<n;i++){
    let targetIndex = i;
    while(targetIndex === i){
      targetIndex = Math.floor(Math.random()*n);
    }
    state.pairings.push({ asker: players[i], target: players[targetIndex] });
  }

  setSessionJSON("singleState", state);
}

const pageTitle = document.getElementById("pageTitle");
const content = document.getElementById("content");
const ctaBtn = document.getElementById("ctaBtn");
const homeBtn = document.getElementById("homeBtn");

homeBtn.addEventListener("click", () => {
  sessionStorage.removeItem("players");
  sessionStorage.removeItem("bara_players");
  sessionStorage.removeItem("categoryKey");
  sessionStorage.removeItem("bara_category_id");
  sessionStorage.removeItem("singleState");
  location.href = "index.html";
});

ctaBtn.addEventListener("click", () => next());

render();

function render(){
  ctaBtn.classList.remove("vote");
  ctaBtn.textContent = "التالي";

  const s = state.screen;

  if(s === 0){
    const p = players[state.revealIndex];
    pageTitle.textContent = " ";
    content.innerHTML = `
      <div class="playerNameBox">${escapeHtml(p)}</div>
      <div class="bigCard">
        <div class="msgText">
          اعطو الجوال لـ <span style="color:var(--yellow); font-weight:1000;">${escapeHtml(p)}</span><br/>
          اضغط التالي حتى تعرف انت برا السالفة أو داخلها!<br/>
          ولا تخلي احد غيرك يشوف الشاشة!
        </div>
      </div>
    `;
    return;
  }

  if(s === 1){
    const p = players[state.revealIndex];
    const isOut = (p === outsiderName);

    pageTitle.textContent = " ";
    if(isOut){
      content.innerHTML = `
        <div class="bigCard">
          <div style="width:100%;">
            <div class="topicBlock">
              <div class="label">السالفة هي :</div>
              <div class="topicWord out">أنت برا السالفة</div>
            </div>
          </div>
        </div>
      `;
    }else{
      content.innerHTML = `
        <div class="bigCard">
          <div style="width:100%;">
            <div class="topicBlock">
              <div class="label">السالفة هي :</div>
              <div class="topicWord">${escapeHtml(topicWord)}</div>
            </div>
          </div>
        </div>
      `;
    }
    return;
  }

  if(s === 2){
    pageTitle.textContent = "وقت الاسئلة";
    content.innerHTML = `
      <div class="bigCard">
        <div class="msgText">
          كل شخص راح يسأل شخص ثاني سؤال متعلق بالسالفة<br/>
          اضغط التالي حتى تعرفون مين يسأل مين
        </div>
      </div>
    `;
    return;
  }

  if(s === 3){
    pageTitle.textContent = "وقت الاسئلة";
    const pair = state.pairings[state.askIndex];
    content.innerHTML = `
      <div class="bigCard" style="min-height:340px;">
        <div style="width:100%;">
          <div class="askLine">
            <span class="who">${escapeHtml(pair.asker)}</span>
            <span class="mid">يسأل</span>
            <span class="who">${escapeHtml(pair.target)}</span>
          </div>

          <div class="msgText" style="margin-bottom:14px;">
            سؤال متعلق بالسالفة!
          </div>

          <div class="askHelpBox">
            اختر سؤالك بعناية حتى اللي برا السالفة ما يعرف عن إيش تتكلمون
          </div>
        </div>
      </div>
    `;
    return;
  }

  if(s === 4){
    pageTitle.textContent = "ما تأكدت صح ؟";
    ctaBtn.textContent = "تصويت";
    ctaBtn.classList.add("vote");

    content.innerHTML = `
      <div class="bigCard" style="min-height:340px;">
        <div class="msgText">
          الحين يقدر اي احد يسأل شخص يشك انه هو الي برا السالفة<br/><br/>
          <div style="font-size:24px; font-weight:1000; opacity:.98;">
            بعد الانتهاء من الاسالة اضغط <span style="color:var(--yellow);">تصويت</span>
          </div>
        </div>
      </div>
    `;
    return;
  }
}

function next(){
  const s = state.screen;

  if(s === 0){
    state.screen = 1;
    saveAndRender();
    return;
  }

  if(s === 1){
    state.revealIndex++;
    if(state.revealIndex >= players.length){
      state.screen = 2;
    }else{
      state.screen = 0;
    }
    saveAndRender();
    return;
  }

  if(s === 2){
    state.screen = 3;
    state.askIndex = 0;
    saveAndRender();
    return;
  }

  if(s === 3){
    state.askIndex++;
    if(state.askIndex >= state.pairings.length){
      state.screen = 4;
    }
    saveAndRender();
    return;
  }

  if(s === 4){
    return; // وقفنا هنا حسب الاتفاق
  }
}

function saveAndRender(){
  setSessionJSON("singleState", state);
  render();
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
</script>

</body>
</html>
