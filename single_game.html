<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>لعبة برا السالفة - اللعب الفردي</title>

  <style>
    :root{
      --bg:#e9e4d6;
      --frame:#3f5a2a;
      --card:#6a8450;
      --card2:#d8cfb1;
      --text:#1b1b1b;
      --white:#ffffff;

      --yellow:#f2c21b;
      --yellowText:#111;

      --purple:#7a44a3;
      --vote:#7b1f1f;   /* أحمر داكن */
      --shadow: 0 10px 0 rgba(0,0,0,.25);

      /* مقاسات قابلة للتعديل بسرعة */
      --containerMax: 520px;
      --radiusBig: 26px;
      --radiusMid: 18px;

      --boxPad: 22px;
      --boxMinH: 260px;

      --titleSize: 18px;
      --headerSize: 26px;
      --bigWordSize: 54px;     /* كلمة السالفة */
      --playerNameSize: 36px;  /* اسم اللاعب الكبير */
      --askLineSize: 36px;     /* (أحمد يسأل طلال) */
      --subTextSize: 22px;     /* نصوص التعليمات داخل المربعات */
      --subTextSizeSmall: 22px;

      --btnH: 62px;            /* ارتفاع زر التالي/تصويت */
      --btnRadius: 26px;

      --homeSize: 60px;        /* حجم زر الرئيسية */
      --homeGap: 14px;         /* مسافة زر الرئيسية عن الحواف */
      --bottomGap: 16px;       /* مسافة أسفل */
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      color:var(--text);
    }

    /* إطار اللعبة */
    .wrap{
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:18px 14px 28px; /* ✅ تم تقليل مساحة الأسفل لأن الزر لم يعد ثابت */
    }
    .frame{
      width:min(var(--containerMax), 100%);
      border:10px solid var(--frame);
      border-radius: var(--radiusBig);
      background:transparent;
      padding:18px 16px 24px;
      position:relative;
    }

    /* رأس الصفحة (شعار + عنوان) */
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
    }
    .brandTitle{
      font-size:var(--titleSize);
      font-weight:700;
      color:#2f3f22;
      opacity:.95;
    }
    .logo{
      width:54px;height:54px;
      object-fit:contain;
    }

    /* شارة/عنوان كبير */
    .badgeTitle{
      margin:14px auto 16px;
      width:fit-content;
      max-width:100%;
      padding:14px 26px;
      border-radius: 22px;
      background: rgba(216,207,177,.9);
      color:#395427;
      font-weight:900;
      font-size: var(--headerSize);
      line-height:1;
      text-align:center;
    }

    .playerNameBox{
      margin: 10px auto 16px;
      width:100%;
      border-radius: 22px;
      background: rgba(216,207,177,.55);
      padding: 18px 16px;
      font-weight:900;
      font-size: var(--playerNameSize);
      color:#3a5227;
      text-align:center;
    }

    /* صندوق كبير */
    .bigCard{
      background:var(--card);
      color:var(--white);
      border-radius: var(--radiusBig);
      padding: var(--boxPad);
      min-height: var(--boxMinH);
      box-shadow: 0 0 0 8px rgba(216,207,177,.75) inset;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      position:relative;
    }

    /* صندوق داخلي للكلمة/السالفة */
    .innerCream{
      width:100%;
      border-radius: var(--radiusBig);
      background: rgba(216,207,177,.55);
      padding: 16px 18px;
      margin: 0 auto 12px;
      color:#2f3f22;
      font-weight:900;
      text-align:center;
    }

    .msgText{
      font-size: var(--subTextSize);
      font-weight:800;
      line-height:1.6;
      padding: 0 10px;
    }
    .msgTextSmall{
      font-size: var(--subTextSizeSmall);
      font-weight:800;
      line-height:1.6;
      padding: 0 10px;
    }

    /* صفحة السالفة: كلمة كبيرة */
    .topicWord{
      font-size: var(--bigWordSize);
      font-weight:1000;
      letter-spacing:.5px;
    }

    /* صفحة وقت الأسئلة */
    .askLine{
      font-size: var(--askLineSize);
      font-weight:1000;
      line-height:1.2;
      margin-bottom: 18px;
    }
    .askLine .who{ color: var(--yellow); }
    .askLine .mid{ color: #fff; margin:0 10px; }
    .askHelpBox{
      width:100%;
      max-width: 420px;
      margin: 0 auto;
      border-radius: 22px;
      background: rgba(0,0,0,.08);
      padding: 18px 18px;
      font-size: var(--subTextSizeSmall);
      font-weight:900;
      line-height:1.6;
    }

    /* ✅ زر الرئيسية ثابت أسفل يسار */
    .homeBtn{
      position: fixed;
      left: var(--homeGap);
      bottom: calc(var(--bottomGap) + env(safe-area-inset-bottom));
      width: var(--homeSize);
      height: var(--homeSize);
      border-radius: 18px;
      background: #bfe7ff;
      border:4px solid #000;
      box-shadow: var(--shadow);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      z-index:9999;
    }
    .homeBtn svg{ width:34px;height:34px; }

    /* ✅ مكان زر التالي/تصويت الجديد داخل الإطار (مثل اللون الأصفر بالصورة) */
    .ctaArea{
      display:flex;
      justify-content:center;
      margin: 16px auto 0;
      padding-bottom: 6px;
    }

    .cta{
      height: var(--btnH);
      border-radius: var(--btnRadius);
      background: var(--yellow);
      color: var(--yellowText);
      border:4px solid #000;
      box-shadow: var(--shadow);
      font-size: 28px;
      font-weight:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      width: 86%;
      max-width: 420px;
      cursor:pointer;
      user-select:none;
      text-align:center;
      padding: 0 14px;
    }

    @media (max-width: 420px){
      .cta{ width: 88%; }
    }
    @media (max-width: 360px){
      .cta{ width: 90%; font-size: 26px; height:56px; border-radius:22px; }
      .homeBtn{ width:56px;height:56px; }
      .homeBtn svg{ width:30px;height:30px; }
    }

    /* زر تصويت */
    .cta.vote{
      background: var(--vote);
      color:#fff;
      max-width: 360px;
    }

    .spacerBottom{ height: 10px; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="frame" id="frame">
      <div class="topbar">
        <div class="brandTitle">لعبة برا السالفة</div>
        <img class="logo" src="logo.PNG" alt="logo" />
      </div>

      <div class="badgeTitle" id="pageTitle"> </div>
      <div id="content"></div>

      <!-- ✅ زر التالي/تصويت بالمكان الجديد -->
      <div class="ctaArea">
        <button class="cta" id="ctaBtn">التالي</button>
      </div>

      <div class="spacerBottom"></div>
    </div>
  </div>

  <!-- زر الرئيسية ثابت -->
  <button class="homeBtn" id="homeBtn" aria-label="الرئيسية" title="الرئيسية">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M3 11.5L12 4l9 7.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6.5 10.5V20h11V10.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

<script>
/* =========================================================
   ✅ حل جذري لمشكلة "أكثر من واحد برا السالفة"
   - نحدد برا السالفة بالـ index (رقم اللاعب) وليس بالاسم
   - نحفظ outsiderIndex + topicWord داخل state في sessionStorage
   - نقرأ مفاتيح التخزين القديمة/الجديدة (حتى لو تغيّر عندك الاسم)
   - نحمّل كلمات الداتا من data/<key>.js عبر <script> (بدون fetch مشاكل)
   ========================================================= */

function getSessionJSON(key){
  try{
    const v = sessionStorage.getItem(key);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
function setSessionJSON(key, val){
  sessionStorage.setItem(key, JSON.stringify(val));
}

/* ---------- قراءة اللاعبين من أي مفتاح موجود ---------- */
function readPlayers(){
  const a = getSessionJSON("bara_players");
  if (Array.isArray(a) && a.length) return a;

  const b = getSessionJSON("players");
  if (Array.isArray(b) && b.length) return b;

  const c = getSessionJSON("baraPlayers");
  if (Array.isArray(c) && c.length) return c;

  return [];
}

/* ---------- قراءة الكتاغوري من أي مفتاح موجود ---------- */
function readCategoryKey(){
  const k1 = (sessionStorage.getItem("bara_category_id") || "").trim();
  if (k1) return k1;

  const k2 = (sessionStorage.getItem("categoryKey") || "").trim();
  if (k2) return k2;

  const k3 = (sessionStorage.getItem("bara_selectedCategory") || "").trim();
  if (k3) return k3;

  return "zoo";
}

const players = readPlayers();
const categoryKey = readCategoryKey();

/* إذا دخل بدون أسماء -> يرجع لصفحة إدخال الأسماء (single.html) */
if(!players.length){
  location.href = "single.html";
}

/* ---------- تحميل ملف الداتا ---------- */
function loadCategoryWords(key){
  return new Promise((resolve) => {
    // إذا الكلمات موجودة مسبقاً
    if (window.BARA_WORDS && Array.isArray(window.BARA_WORDS[key]) && window.BARA_WORDS[key].length){
      resolve(window.BARA_WORDS[key]);
      return;
    }

    // جرّب تحميل سكربت الداتا
    const s = document.createElement("script");
    s.src = `data/${encodeURIComponent(key)}.js?v=${Date.now()}`;
    s.onload = () => {
      if (window.BARA_WORDS && Array.isArray(window.BARA_WORDS[key]) && window.BARA_WORDS[key].length){
        resolve(window.BARA_WORDS[key]);
      }else{
        resolve([]);
      }
    };
    s.onerror = () => resolve([]);
    document.head.appendChild(s);
  });
}

function pickRandom(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

/* ---------- State ---------- */
let state = getSessionJSON("singleState");

/* لو ما فيه state أو state ناقص -> ننشئه/نكمله ونثبت السالفة + برا السالفة */
async function ensureState(){
  if(!state){
    state = {
      screen: 0,
      revealIndex: 0,
      askIndex: 0,
      pairings: [],
      outsiderIndex: -1,
      topicWord: ""
    };

    // توليد أزواج عشوائية (كل واحد يسأل واحد مختلف)
    const n = players.length;
    for(let i=0;i<n;i++){
      let targetIndex = i;
      while(targetIndex === i){
        targetIndex = Math.floor(Math.random()*n);
      }
      state.pairings.push({ asker: players[i], target: players[targetIndex] });
    }

    // تثبيت برا السالفة بالـ index
    state.outsiderIndex = Math.floor(Math.random() * players.length);

    // تثبيت السالفة من الداتا
    const words = await loadCategoryWords(categoryKey);
    state.topicWord = (words && words.length) ? pickRandom(words) : "سالفة";
    setSessionJSON("singleState", state);
    return;
  }

  // إذا state موجود لكن ناقص بيانات (احتياط)
  if(typeof state.outsiderIndex !== "number" || state.outsiderIndex < 0 || state.outsiderIndex >= players.length){
    state.outsiderIndex = Math.floor(Math.random() * players.length);
  }

  if(!state.topicWord || typeof state.topicWord !== "string"){
    const words = await loadCategoryWords(categoryKey);
    state.topicWord = (words && words.length) ? pickRandom(words) : "سالفة";
  }

  if(!Array.isArray(state.pairings) || !state.pairings.length){
    state.pairings = [];
    const n = players.length;
    for(let i=0;i<n;i++){
      let targetIndex = i;
      while(targetIndex === i){
        targetIndex = Math.floor(Math.random()*n);
      }
      state.pairings.push({ asker: players[i], target: players[targetIndex] });
    }
  }

  setSessionJSON("singleState", state);
}

/* عناصر DOM */
const pageTitle = document.getElementById("pageTitle");
const content = document.getElementById("content");
const ctaBtn = document.getElementById("ctaBtn");
const homeBtn = document.getElementById("homeBtn");

/* زر الرئيسية: يرجع للرئيسية + يصفر بيانات الجلسة */
homeBtn.addEventListener("click", () => {
  // امسح كل المفاتيح المحتملة (قديمة/جديدة)
  sessionStorage.removeItem("bara_players");
  sessionStorage.removeItem("players");
  sessionStorage.removeItem("baraPlayers");

  sessionStorage.removeItem("bara_category_id");
  sessionStorage.removeItem("categoryKey");
  sessionStorage.removeItem("bara_selectedCategory");

  sessionStorage.removeItem("singleState");
  location.href = "index.html";
});

/* زر CTA */
ctaBtn.addEventListener("click", () => next());

/* ابدأ */
(async function boot(){
  // شاشة تحميل بسيطة
  pageTitle.textContent = " ";
  content.innerHTML = `
    <div class="bigCard" style="min-height:260px;">
      <div class="msgText">جاري تجهيز الجولة...</div>
    </div>
  `;

  await ensureState();
  render();
})();

/* =========================
   Render Screens
   ========================= */
function render(){
  ctaBtn.classList.remove("vote");
  ctaBtn.textContent = "التالي";

  const s = state.screen;

  if(s === 0){
    const p = players[state.revealIndex];
    pageTitle.textContent = " ";
    content.innerHTML = `
      <div class="playerNameBox">${escapeHtml(p)}</div>
      <div class="bigCard" style="min-height:260px;">
        <div class="msgText">
          اعطو الجوال لـ <span style="color:var(--yellow); font-weight:1000;">${escapeHtml(p)}</span><br/>
          اضغط التالي حتى تعرف أنت برا السالفة أو داخلها<br/>
          ولا تخلي أحد غيرك يشوف الشاشة!
        </div>
      </div>
    `;
    return;
  }

  if(s === 1){
    const p = players[state.revealIndex];

    // ✅ الحل الجذري: برا السالفة بالـ index وليس الاسم
    const isOut = (state.revealIndex === state.outsiderIndex);

    pageTitle.textContent = " ";
    if(isOut){
      content.innerHTML = `
        <div class="bigCard">
          <div>
            <div class="innerCream" style="font-size:40px; font-weight:1000;">السالفة هي :</div>
            <div class="topicWord" style="margin-top:20px;">أنت برا السالفة 👀</div>
          </div>
        </div>
      `;
    }else{
      content.innerHTML = `
        <div class="bigCard">
          <div>
            <div class="innerCream" style="font-size:40px; font-weight:1000;">السالفة هي :</div>
            <div class="topicWord" style="margin-top:20px;">${escapeHtml(state.topicWord)}</div>
          </div>
        </div>
      `;
    }
    return;
  }

  if(s === 2){
    pageTitle.textContent = "وقت الاسئلة";
    content.innerHTML = `
      <div class="bigCard" style="min-height:280px;">
        <div class="msgText">
          كل شخص راح يسأل شخص ثاني سؤال متعلق بالسالفة<br/>
          اضغط التالي حتى تعرفون مين يسأل مين
        </div>
      </div>
    `;
    return;
  }

  if(s === 3){
    pageTitle.textContent = "وقت الاسئلة";
    const pair = state.pairings[state.askIndex];
    content.innerHTML = `
      <div class="bigCard" style="min-height:320px;">
        <div style="width:100%;">
          <div class="askLine">
            <span class="who">${escapeHtml(pair.asker)}</span>
            <span class="mid">يسأل</span>
            <span class="who">${escapeHtml(pair.target)}</span>
          </div>

          <div class="msgText" style="margin-bottom:12px;">
            سؤال متعلق بالسالفة!
          </div>

          <div class="askHelpBox">
            اختر سؤالك بعناية حتى اللي برا السالفة ما يعرف عن إيش تتكلمون
          </div>
        </div>
      </div>
    `;
    return;
  }

  if(s === 4){
    pageTitle.textContent = "ما تأكدت صح ؟";
    ctaBtn.textContent = "تصويت";
    ctaBtn.classList.add("vote");

    content.innerHTML = `
      <div class="bigCard" style="min-height:320px;">
        <div class="msgText">
          الحين يقدر أي أحد يسأل شخص يشك إنه هو اللي برا السالفة<br/><br/>
          <div style="font-size:22px; font-weight:1000; opacity:.95;">
            بعد الانتهاء من الأسئلة اضغط <span style="color:var(--yellow);">تصويت</span>
          </div>
        </div>
      </div>
    `;
    return;
  }
}

/* =========================
   Next Logic
   ========================= */
function next(){
  const s = state.screen;

  if(s === 0){
    state.screen = 1;
    saveAndRender();
    return;
  }

  if(s === 1){
    state.revealIndex++;
    if(state.revealIndex >= players.length){
      state.screen = 2;
    }else{
      state.screen = 0;
    }
    saveAndRender();
    return;
  }

  if(s === 2){
    state.screen = 3;
    state.askIndex = 0;
    saveAndRender();
    return;
  }

  if(s === 3){
    state.askIndex++;
    if(state.askIndex >= state.pairings.length){
      state.screen = 4;
    }
    saveAndRender();
    return;
  }

  if(s === 4){
    // حسب اتفاقنا: بعد ضغط "تصويت" نوقف
    return;
  }
}

function saveAndRender(){
  setSessionJSON("singleState", state);
  render();
}

/* =========================
   Utils
   ========================= */
function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
</script>

</body>
</html>
