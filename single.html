<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>برا السالفة - جهاز واحد</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#e9e4d6;
      --olive:#3f4a1f;
      --panel:#6e7b46;
      --beige:#e5d9b6;
      --yellow:#ffd21a;
      --black:#111;
      --blue:#bfe4ff;
      --shadow: 0 12px 0 rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"Baloo Bhaijaan 2",Arial,sans-serif;color:var(--black)}
    .wrap{min-height:100svh;display:flex;justify-content:center;padding:18px 14px 22px}
    .card{width:min(620px,100%);position:relative}

    .top{position:relative;padding:10px 8px 0;min-height:110px}
    .logo{
      position:absolute;left:10px;top:10px;
      width:86px;height:86px;object-fit:contain;pointer-events:none;user-select:none;
    }
    .title{
      margin:16px 0 0;
      text-align:right;
      color:var(--olive);
      font-weight:900;
      font-size:44px;
      padding:0 0 0 96px;
    }

    .namePill{
      margin:18px auto 18px;
      width:min(520px,100%);
      background:var(--beige);
      border-radius:22px;
      padding:18px 18px;
      text-align:center;
      color:var(--olive);
      font-weight:900;
      font-size:52px;
    }

    .panel{
      background:var(--panel);
      border-radius:28px;
      padding:22px 18px;
      margin:0 6px 18px;
      box-shadow:0 14px 0 rgba(0,0,0,.12);
      min-height:46svh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:18px;
    }

    .bigText{
      color:#fff;
      font-weight:900;
      font-size:42px;
      line-height:1.15;
      text-align:center;
      padding:4px 6px;
    }
    .bigText .hl{
      color:var(--yellow);
      font-weight:900;
    }

    .subText{
      color:#fff;
      font-weight:900;
      font-size:40px;
      line-height:1.2;
      text-align:center;
    }

    .topicTop{
      color:#fff;
      font-weight:900;
      font-size:44px;
      text-align:right;
      margin-top:-8px;
      padding-right:10px;
    }

    .topicCenter{
      color:#fff;
      font-weight:900;
      font-size:58px;
      text-align:center;
      margin-top:18px;
      direction:rtl;
    }

    .btnWrap{display:flex;justify-content:center;margin-top:8px}
    .btn{
      width:min(420px,100%);
      background:var(--yellow);
      border:6px solid var(--black);
      border-radius:22px;
      padding:18px 16px;
      font-weight:900;
      font-size:54px;
      cursor:pointer;
      box-shadow:var(--shadow);
    }
    .btn:active{transform:translateY(2px)}

    /* Home */
    .homeBtn{
      position:fixed;
      left:14px;
      bottom:14px;
      width:74px;height:74px;
      border-radius:22px;
      border:6px solid var(--black);
      background:var(--blue);
      box-shadow:0 10px 0 rgba(0,0,0,.18);
      display:grid;place-items:center;
      z-index:40;
      cursor:pointer;
    }
    .homeBtn:active{transform:translateY(2px)}
    .homeBtn svg{width:38px;height:38px}

    /* small */
    @media (max-width:420px){
      .title{font-size:38px}
      .namePill{font-size:46px}
      .bigText{font-size:34px}
      .subText{font-size:32px}
      .topicTop{font-size:36px}
      .topicCenter{font-size:48px}
      .btn{font-size:46px}
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <div class="top">
        <img class="logo" src="logo.PNG" alt="logo">
        <div class="title">لعبة برا السالفة</div>
      </div>

      <div id="namePill" class="namePill">—</div>

      <div id="panel" class="panel">
        <!-- يتغير المحتوى بالجافاسكربت -->
      </div>

      <div class="btnWrap">
        <button id="nextBtn" class="btn" type="button">التالي</button>
      </div>
    </div>
  </div>

  <button id="homeBtn" class="homeBtn" type="button" aria-label="الرئيسية">
    <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10.5L12 3l9 7.5"></path>
      <path d="M5 10v10h14V10"></path>
      <path d="M9 20v-7h6v7"></path>
    </svg>
  </button>

<script>
  // ---------- Helpers ----------
  function getJSON(key, fallback){
    try{ return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
    catch(e){ return fallback; }
  }
  function setJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

  // ---------- Params / Mode ----------
  const params = new URLSearchParams(location.search);
  const mode = (params.get('mode') || 'single').toLowerCase(); // single | multi
  const room = params.get('room') || '';
  const cat  = params.get('cat')  || localStorage.getItem('bara_cat') || '';

  // Home behavior:
  // - المقدم (جهاز واحد): يرجع للصفحة الرئيسية
  // - اللاعبين (أجهزة متعددة): يرجع لصفحة الانتظار
  document.getElementById('homeBtn').onclick = () => {
    if(mode === 'multi'){
      // لاعب
      if(room) location.href = 'waiting.html?room=' + encodeURIComponent(room);
      else location.href = 'waiting.html';
    }else{
      // مقدم
      location.href = 'index.html';
    }
  };

  // ---------- Data Sources ----------
  // أسماء اللاعبين في جهاز واحد (لازم تكون محفوظة مسبقًا من صفحة إضافة اللاعبين عند المقدم)
  // احنا ندعم أكثر من مفتاح احتياطاً
  let players =
    getJSON('bara_single_players', []) ||
    getJSON('bara_players', []) ||
    [];

  if(!Array.isArray(players)) players = [];
  players = players.map(x => (x||'').trim()).filter(Boolean);

  // كلمات الكتاغوري: نقرأها من localStorage بهذا الشكل:
  // bara_words_<cat> = ["زرافة","نمر",...]
  // إذا ما لقينا، نحط كلمة افتراضية مؤقتًا
  const wordsKey = cat ? ('bara_words_' + cat) : '';
  let words = wordsKey ? getJSON(wordsKey, []) : [];
  if(!Array.isArray(words)) words = [];

  // ---------- Round Setup ----------
  // تخزين جولة واحدة في جهاز واحد
  const ROUND_KEY = 'bara_single_round';
  let round = getJSON(ROUND_KEY, null);

  function newRound(){
    if(players.length < 2){
      return {
        error: true,
        msg: 'لازم تضيف أسماء لاعبين أولاً قبل البدء.'
      };
    }
    const topic = (words.length>0) ? words[Math.floor(Math.random()*words.length)] : 'السالفة';
    const outIndex = Math.floor(Math.random()*players.length); // برا السالفة عشوائي
    return {
      error:false,
      cat,
      topic,
      outIndex,
      step:'handover', // handover | reveal
      i:0
    };
  }

  if(!round || round.error || !round.topic || !Array.isArray(players) || players.length<2){
    round = newRound();
    setJSON(ROUND_KEY, round);
  }

  // ---------- UI ----------
  const namePill = document.getElementById('namePill');
  const panel = document.getElementById('panel');
  const nextBtn = document.getElementById('nextBtn');

  function render(){
    // خطأ
    if(round.error){
      namePill.textContent = '—';
      panel.innerHTML = `<div class="bigText">${round.msg}</div>`;
      nextBtn.textContent = 'رجوع';
      nextBtn.onclick = () => location.href = 'index.html';
      return;
    }

    const currentName = players[round.i] || '';
    namePill.textContent = currentName;

    if(round.step === 'handover'){
      panel.innerHTML = `
        <div class="bigText">اعطو الجوال <span class="hl">${currentName}</span></div>
        <div class="subText">اضغط التالي حتى تعرف<br>انت برا السالفة أو داخلها<br>ولاتخلي احد غيرك يشوف الشاشة !</div>
      `;
      nextBtn.textContent = 'التالي';
    }else{
      const isOut = (round.i === round.outIndex);
      panel.innerHTML = `
        <div class="topicTop">السالفة هي :</div>
        <div class="topicCenter">${isOut ? '👀 انت برا السالفة' : escapeHTML(round.topic)}</div>
      `;
      nextBtn.textContent = 'التالي';
    }
  }

  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, (m)=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
  }

  // ---------- Flow ----------
  nextBtn.addEventListener('click', ()=>{
    if(round.error) return;

    if(round.step === 'handover'){
      round.step = 'reveal';
      setJSON(ROUND_KEY, round);
      render();
      return;
    }

    // reveal -> next player
    round.step = 'handover';
    round.i++;

    if(round.i >= players.length){
      // انتهى عرض الأدوار لكل اللاعبين
      // مؤقتاً نرجّع للمقدم للكتاغوري (لين نكمل بقية مراحل اللعبة)
      localStorage.removeItem(ROUND_KEY);
      location.href = 'categories.html' + (room ? ('?room=' + encodeURIComponent(room) + '&mode=single') : '');
      return;
    }

    setJSON(ROUND_KEY, round);
    render();
  });

  render();
</script>
</body>
</html>
