<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>لعبة برا السالفة - جهاز واحد</title>

  <style>
    :root{
      --bg:#e9e3d6;          /* البيج */
      --frame:#e9e3d6;
      --green:#3f5b2a;       /* أخضر الإطار */
      --green2:#6e8554;
      --yellow:#f2c300;      /* زر أصفر */
      --purple:#8b49b9;      /* زر + */
      --text:#1a1a1a;
      --muted:#9a9a9a;
      --shadow: 0 10px 0 rgba(0,0,0,0.18);
      --shadowSmall: 0 8px 0 rgba(0,0,0,0.18);
      --border: 5px solid #000;
      --radius: 28px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--text);
    }

    /* يضمن أن البيج يملأ أي فراغ على الشاشات الكبيرة */
    .page{
      min-height: 100vh;
      padding: 14px 12px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .frame{
      width: min(520px, 100%);
      background: var(--frame);
      border: 6px solid var(--green);
      border-radius: 26px;
      padding: 18px 16px 18px;
      position: relative;

      /* مهم: نخليها تتوسع لو زادت الأسماء (فالزر ينزل تحت تلقائياً) */
      min-height: calc(100vh - 28px);
      display:flex;
      flex-direction:column;
    }

    .topRow{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 10px;
    }

    .title{
      font-weight: 800;
      color: var(--green);
      font-size: 16px;
      line-height: 1.2;
      margin-top: 4px;
      text-align:right;
    }

    .logo{
      width: 70px;
      height: 36px;
      object-fit: contain;
      opacity: 0.95;
    }

    h2{
      margin: 10px 0 14px;
      text-align:center;
      color: var(--green);
      font-size: 22px;
      font-weight: 900;
    }

    .inputs{
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top: 2px;
    }

    .nameInput{
      width: 100%;
      padding: 14px 14px;
      border: 4px solid var(--green2);
      border-radius: 18px;
      background:#fff;
      font-size: 20px;
      font-weight: 700;
      color:#111;
      outline:none;
      text-align:center;
    }
    .nameInput::placeholder{
      color: var(--muted);
      font-weight: 800;
      font-size: 18px; /* أصغر */
      opacity: 0.75;   /* أبهت */
    }

    /* زر + */
    .plusWrap{
      display:flex;
      justify-content:center;
      margin: 18px 0 6px;
    }
    .plusBtn{
      width: 62px;
      height: 62px;
      border-radius: 14px;
      border: 4px solid #000;
      background: var(--purple);
      display:flex;
      justify-content:center;
      align-items:center;
      box-shadow: var(--shadowSmall);
      cursor:pointer;
      user-select:none;
    }
    .plusBtn span{
      color:#fff;            /* الزائد أبيض */
      font-size: 40px;
      font-weight: 900;
      line-height: 1;
      transform: translateY(-1px);
    }

    /* منطقة زر ابدأ اللعب — في المكان اللي رسمته */
    .actionArea{
      margin-top: auto; /* هذا يخليه ينزل تحت إذا في فراغ، وإذا كثر المحتوى ينزل تحت تلقائي */
      display:flex;
      justify-content:center;
      padding: 18px 0 calc(18px + env(safe-area-inset-bottom));
    }

    .startBtn{
      border: 4px solid #000;
      background: var(--yellow);
      color:#111;              /* النص أسود */
      font-weight: 900;
      font-size: 24px;
      border-radius: 22px;
      padding: 12px 26px;      /* تصغير الحواف */
      min-width: 220px;        /* أصغر من قبل */
      max-width: 78%;
      box-shadow: var(--shadow);
      cursor:pointer;
    }

    /* زر الرئيسية (لا يتداخل مع زر ابدأ اللعب) */
    .homeBtn{
      position: fixed;
      left: 18px;
      bottom: calc(18px + env(safe-area-inset-bottom));
      width: 64px;
      height: 64px;
      border-radius: 18px;
      border: 4px solid #000;
      background: #bfe3ff;
      box-shadow: var(--shadowSmall);
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      z-index: 9999;
    }
    .homeBtn svg{
      width: 34px;
      height: 34px;
      fill: #111;
    }

    /* تحسين على الشاشات الصغيرة جدًا */
    @media (max-width: 360px){
      h2{ font-size: 20px; }
      .nameInput{ font-size: 18px; }
      .startBtn{ font-size: 22px; min-width: 200px; }
      .plusBtn{ width: 58px; height: 58px; }
      .plusBtn span{ font-size: 38px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="frame">
      <div class="topRow">
        <div class="title">لعبة برا السالفة</div>
        <!-- غيّر اسم اللوقو لو عندك مختلف -->
        <img class="logo" src="logo.PNG" alt="logo">
      </div>

      <h2>ادخل اسماء اللاعبين :</h2>

      <div class="inputs" id="inputs">
        <input class="nameInput" type="text" placeholder="اللاعب رقم 1" />
        <input class="nameInput" type="text" placeholder="اللاعب رقم 2" />
        <input class="nameInput" type="text" placeholder="اللاعب رقم 3" />
      </div>

      <div class="plusWrap">
        <div class="plusBtn" id="addBtn" aria-label="إضافة لاعب">
          <span>+</span>
        </div>
      </div>

      <div class="actionArea">
        <button class="startBtn" id="startBtn">ابدأ اللعب</button>
      </div>
    </div>
  </div>

  <!-- زر الرئيسية ثابت -->
  <div class="homeBtn" id="homeBtn" title="الرئيسية" aria-label="الرئيسية">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/>
    </svg>
  </div>

  <script>
    // يخلي النص (placeholder) يختفي فور الضغط على المربع
    document.addEventListener('focusin', (e) => {
      if (e.target.classList && e.target.classList.contains('nameInput')) {
        e.target.dataset.ph = e.target.placeholder;
        e.target.placeholder = '';
      }
    });
    document.addEventListener('focusout', (e) => {
      if (e.target.classList && e.target.classList.contains('nameInput')) {
        if (!e.target.value.trim()) {
          e.target.placeholder = e.target.dataset.ph || '';
        }
      }
    });

    const inputsWrap = document.getElementById('inputs');
    const addBtn = document.getElementById('addBtn');
    const startBtn = document.getElementById('startBtn');
    const homeBtn = document.getElementById('homeBtn');

    function nextIndex(){
      return inputsWrap.querySelectorAll('.nameInput').length + 1;
    }

    // ✅ إصلاح مشكلة اختفاء الأسماء: لا نعيد بناء القائمة نهائياً، فقط نضيف input جديد
    addBtn.addEventListener('click', () => {
      const i = document.createElement('input');
      i.className = 'nameInput';
      i.type = 'text';
      i.placeholder = `اللاعب رقم ${nextIndex()}`;
      inputsWrap.appendChild(i);
      i.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => i.focus(), 200);
    });

    function clearBaraState(){
      // يمسح أي بيانات تخص اللعبة فقط (bara_)
      for (let k = localStorage.length - 1; k >= 0; k--) {
        const key = localStorage.key(k);
        if (key && key.startsWith('bara_')) localStorage.removeItem(key);
      }
      sessionStorage.removeItem('bara_players');
      sessionStorage.removeItem('bara_selectedCategory');
      sessionStorage.removeItem('bara_secretWord');
      sessionStorage.removeItem('bara_outPlayerIndex');
    }

    homeBtn.addEventListener('click', () => {
      clearBaraState();
      window.location.href = 'index.html';
    });

    startBtn.addEventListener('click', () => {
      const names = Array.from(inputsWrap.querySelectorAll('.nameInput'))
        .map(i => i.value.trim())
        .filter(Boolean);

      if (names.length < 3) {
        alert('لازم تدخل 3 أسماء على الأقل');
        return;
      }

      // نخزنها خلال اللعب فقط (إذا قفل المتصفح تروح)
      sessionStorage.setItem('bara_players', JSON.stringify(names));

      // نوديه صفحة الكتاغوريات
      window.location.href = 'categories.html';
    });
  </script>
</body>
</html>
