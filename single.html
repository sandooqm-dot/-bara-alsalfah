<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>اللعب من جهاز واحد</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{--bg:#e9e4d6;--olive:#4e5a2a;--panel:#6e7b46;--card:#fff;--black:#111;--yellow:#ffd21a;--btnShadow:rgba(0,0,0,.22)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"Baloo Bhaijaan 2",Arial,sans-serif;color:var(--black)}
    .page{min-height:100svh;display:flex;justify-content:center;padding:18px 16px 28px}
    .frame{width:min(560px,100%);border-radius:26px;border:6px solid var(--olive);padding:18px 14px 22px;position:relative}
    .logo{position:absolute;left:14px;top:10px;width:92px;height:auto;pointer-events:none}
    .home{
      position:fixed;left:16px;bottom:16px;width:64px;height:64px;border-radius:50%;
      background:#bfe0ff;border:5px solid var(--black);display:grid;place-items:center;z-index:10;
      box-shadow:0 10px 0 rgba(0,0,0,.14); cursor:pointer;
    }
    .home svg{width:34px;height:34px}
    h1{
      margin:56px 0 14px;text-align:center;font-size:44px;color:var(--olive);font-weight:900;
      white-space:nowrap; /* سطر واحد */
    }

    .panel{width:92%;margin:0 auto;background:var(--panel);border-radius:26px;padding:18px 16px 18px;box-shadow:0 10px 0 rgba(0,0,0,.12)}
    .sub{color:#fff;font-size:28px;font-weight:900;margin:6px 0 14px;text-align:center}
    .box{
      background:rgba(0,0,0,.15);
      border-radius:20px;
      padding:14px;
      border:6px solid rgba(0,0,0,.45);
    }

    .name{
      width:100%;
      background:#fff;
      border-radius:999px;
      border:4px solid rgba(0,0,0,.45);
      padding:14px 16px;
      font-size:28px;
      font-weight:900;
      text-align:center;
      outline:none;
      margin:10px 0;
    }

    .plusWrap{display:flex;justify-content:center;margin:14px 0 8px}
    .plus{
      width:72px;height:72px;border-radius:16px;background:#b25bd8;border:5px solid rgba(0,0,0,.35);
      box-shadow:0 10px 0 rgba(0,0,0,.18);
      font-size:44px;font-weight:900;color:#fff;cursor:pointer;
      display:grid;place-items:center;
    }
    .plus:active{transform:translateY(2px)}

    .start{
      width:100%;
      background:var(--yellow);
      color:#000; /* نص أسود */
      border:6px solid var(--black);
      border-radius:999px;
      font-size:44px;
      font-weight:900;
      padding:16px 14px;
      box-shadow:0 12px 0 var(--btnShadow);
      cursor:pointer;
      opacity:.45;
      pointer-events:none;
      margin-top:14px;
    }
    .start.enabled{opacity:1;pointer-events:auto}
    .start:active{transform:translateY(2px)}
  </style>
</head>
<body>

  <button class="home" onclick="location.href='index.html'" aria-label="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10.5L12 3l9 7.5"></path>
      <path d="M5 10v10h14V10"></path>
      <path d="M9 20v-6h6v6"></path>
    </svg>
  </button>

  <div class="page">
    <div class="frame">
      <img class="logo" src="logo.PNG" alt="logo">

      <h1>اللعب من جهاز واحد</h1>

      <div class="panel">
        <div class="sub">ادخل أسماء اللاعبين :</div>

        <div class="box" id="namesBox">
          <input class="name" placeholder="اللاعب 1" />
          <input class="name" placeholder="اللاعب 2" />
          <input class="name" placeholder="اللاعب 3" />
        </div>

        <div class="plusWrap">
          <button id="addBtn" class="plus" type="button">+</button>
        </div>

        <button id="startBtn" class="start" type="button">ابدأ اللعب</button>
      </div>

    </div>
  </div>

  <script>
    const namesBox = document.getElementById('namesBox');
    const addBtn = document.getElementById('addBtn');
    const startBtn = document.getElementById('startBtn');

    function allInputs(){
      return Array.from(namesBox.querySelectorAll('input.name'));
    }

    function countValidPlayers(){
      return allInputs().filter(i => (i.value || '').trim().length > 0).length;
    }

    function refreshStart(){
      const ok = countValidPlayers() >= 3;
      startBtn.classList.toggle('enabled', ok);
    }

    namesBox.addEventListener('input', refreshStart);

    addBtn.addEventListener('click', ()=>{
      // إضافة بدون مسح الأسماء السابقة
      const n = allInputs().length + 1;
      const inp = document.createElement('input');
      inp.className = 'name';
      inp.placeholder = `اللاعب ${n}`;
      namesBox.appendChild(inp);
      inp.focus();
      refreshStart();
    });

    startBtn.addEventListener('click', ()=>{
      if(countValidPlayers() < 3) return;
      const players = allInputs().map(i => (i.value||'').trim()).filter(Boolean);
      localStorage.setItem('bara_players_single', JSON.stringify(players));
      location.href = 'categories.html';
    });

    refreshStart();
  </script>

</body>
</html>
