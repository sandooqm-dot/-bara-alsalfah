<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لعبة برا السالفة - إدخال الأسماء</title>

  <style>
    :root{
      --bg: #E9E4D8;          /* الخلفية */
      --green: #647B4A;       /* أخضر الإطار/الصندوق */
      --greenDark: #3C4F2A;
      --card: #F2E8D2;        /* بيج الصناديق */
      --white: #ffffff;
      --black: #111111;
      --yellow: #F2C315;      /* زر التالي/ابدأ */
      --purple: #A55AC8;      /* زر + */
      --border: #1A1A1A;
      --shadow: 0 10px 0 rgba(0,0,0,.25);
      --radius: 22px;
      --radiusSoft: 18px;
    }

    *{ box-sizing: border-box; }
    body{
      margin:0;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--black);
    }

    /* إطار الصفحة مثل الصورة */
    .frame{
      width: min(92vw, 560px);
      height: min(92vh, 980px);
      margin: 24px auto;
      border: 8px solid var(--greenDark);
      border-radius: 26px;
      padding: 16px 14px 0;
      position: relative;
      background: transparent;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* الهيدر */
    .top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
      padding: 6px 6px 0;
      flex: 0 0 auto;
    }
    .brand{
      font-weight: 800;
      color: var(--greenDark);
      font-size: 16px;
      margin-top: 2px;
      white-space: nowrap;
    }
    .logo{
      width: 56px;
      height: 56px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    /* محتوى قابل للتمرير (عشان إذا كثرت الأسماء) */
    .content{
      flex: 1 1 auto;
      overflow: auto;
      padding: 10px 6px 140px; /* مساحة للزر السفلي */
    }

    h1{
      margin: 14px 0 14px;
      text-align:center;
      color: var(--greenDark);
      font-size: 26px;
      font-weight: 900;
    }

    .inputs{
      display: grid;
      gap: 14px;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .player-input{
      width: 100%;
      background: var(--white);
      border: 4px solid var(--green);
      border-radius: var(--radiusSoft);
      padding: 14px 14px;
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      outline: none;
    }
    .player-input::placeholder{
      color: rgba(0,0,0,.35);
      font-weight: 800;
    }

    /* زر + */
    .add-wrap{
      display:flex;
      justify-content:center;
      margin: 14px 0 6px;
    }
    .add-btn{
      width: 66px;
      height: 66px;
      border-radius: 16px;
      border: 4px solid var(--border);
      background: var(--purple);
      box-shadow: var(--shadow);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
    }
    .add-btn span{
      font-size: 44px;
      line-height: 1;
      font-weight: 1000;
      color: #fff; /* + أبيض */
      transform: translateY(-2px);
    }
    .add-btn:active{
      transform: translateY(2px);
      box-shadow: 0 6px 0 rgba(0,0,0,.25);
    }

    /* الشريط السفلي الثابت */
    .bottom-bar{
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 14px 14px 16px;
      background: linear-gradient(to top, rgba(233,228,216,1) 70%, rgba(233,228,216,0));
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 12px;
      z-index: 5;
      pointer-events: none; /* نفعّل على الأزرار فقط */
    }

    .home-btn{
      pointer-events: auto;
      position: absolute;
      left: 14px;
      bottom: 18px;
      width: 66px;
      height: 66px;
      border-radius: 18px;
      border: 4px solid var(--border);
      background: #B7E1FF;
      box-shadow: var(--shadow);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }
    .home-btn svg{
      width: 36px;
      height: 36px;
    }
    .home-btn:active{
      transform: translateY(2px);
      box-shadow: 0 6px 0 rgba(0,0,0,.25);
    }

    .primary-btn{
      pointer-events: auto;
      width: min(92%, 460px);
      height: 74px;
      border-radius: 22px;
      border: 4px solid var(--border);
      background: var(--yellow);
      box-shadow: var(--shadow);
      font-size: 30px;
      font-weight: 1000;
      color: var(--black); /* النص أسود */
      cursor:pointer;
      text-align:center;
      /* عشان ما يتداخل مع زر الرئيسية: نترك مساحة يسار */
      padding-left: 74px;
      padding-right: 18px;
    }
    .primary-btn:active{
      transform: translateY(2px);
      box-shadow: 0 6px 0 rgba(0,0,0,.25);
    }

    /* على الشاشات الصغيرة جداً */
    @media (max-height: 720px){
      h1{ font-size: 24px; }
      .player-input{ font-size: 20px; padding: 12px; }
      .primary-btn{ height: 70px; font-size: 28px; }
      .add-btn{ width: 62px; height: 62px; }
      .add-btn span{ font-size: 42px; }
    }
  </style>
</head>

<body>
  <div class="frame">
    <div class="top">
      <div class="brand">لعبة برا السالفة</div>
      <!-- تأكد أن اسم اللوجو مطابق لملفك: logo.PNG أو logo.png -->
      <img class="logo" src="logo.PNG" alt="logo">
    </div>

    <div class="content">
      <h1>ادخل اسماء اللاعبين :</h1>

      <div class="inputs" id="inputs"></div>

      <div class="add-wrap">
        <div class="add-btn" id="addBtn" role="button" aria-label="إضافة لاعب">
          <span>+</span>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <button class="home-btn" id="homeBtn" title="الرئيسية" aria-label="الرئيسية">
        <!-- أيقونة منزل -->
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 11.2L12 4l9 7.2v9.3a1.5 1.5 0 0 1-1.5 1.5H4.5A1.5 1.5 0 0 1 3 20.5v-9.3Z" stroke="#111" stroke-width="2.2" />
          <path d="M9 22v-7h6v7" stroke="#111" stroke-width="2.2" />
        </svg>
      </button>

      <button class="primary-btn" id="startBtn">ابدأ اللعب</button>
    </div>
  </div>

  <script>
    // ====== إعدادات ======
    const MIN_PLAYERS = 3;
    const MAX_PLAYERS = 10;

    // نحفظ أسماء اللاعبين أثناء اللعب فقط (لو خرج/قفل المتصفح، يبدأ من جديد)
    // تخزين مؤقت في sessionStorage
    const KEY = "bara_players_session";

    // ====== Helpers ======
    function loadPlayers(){
      try{
        const raw = sessionStorage.getItem(KEY);
        const arr = raw ? JSON.parse(raw) : null;
        if(Array.isArray(arr)) return arr;
      }catch(e){}
      return [];
    }

    function savePlayers(){
      const values = Array.from(document.querySelectorAll(".player-input")).map(i => i.value.trim());
      sessionStorage.setItem(KEY, JSON.stringify(values));
    }

    function createInput(index, value){
      const input = document.createElement("input");
      input.type = "text";
      input.className = "player-input";
      input.placeholder = "اللاعب رقم " + (index + 1);
      input.value = value || "";
      input.addEventListener("input", savePlayers);
      return input;
    }

    function renderInputs(count, existingValues){
      const wrap = document.getElementById("inputs");
      wrap.innerHTML = "";
      for(let i=0;i<count;i++){
        wrap.appendChild(createInput(i, existingValues[i] || ""));
      }
    }

    // ====== Init ======
    (function init(){
      const stored = loadPlayers();
      const count = Math.max(MIN_PLAYERS, Math.min(MAX_PLAYERS, stored.length || MIN_PLAYERS));
      renderInputs(count, stored);
    })();

    // ====== زر + (بدون ما يضيع الأسماء) ======
    document.getElementById("addBtn").addEventListener("click", () => {
      const inputs = Array.from(document.querySelectorAll(".player-input"));
      const currentCount = inputs.length;
      if(currentCount >= MAX_PLAYERS) return;

      const values = inputs.map(i => i.value);
      renderInputs(currentCount + 1, values);
      savePlayers();
      // نزّل للآخر شوي
      setTimeout(() => {
        const content = document.querySelector(".content");
        content.scrollTop = content.scrollHeight;
      }, 0);
    });

    // ====== زر الرئيسية (يصفر كل شيء ويرجع للصفحة الرئيسية) ======
    document.getElementById("homeBtn").addEventListener("click", () => {
      sessionStorage.removeItem(KEY);        // حذف الأسماء (تصفيير)
      // لو عندك مفاتيح أخرى للعبة لاحقاً، أضفها هنا
      window.location.href = "index.html";
    });

    // ====== ابدأ اللعب ======
    document.getElementById("startBtn").addEventListener("click", () => {
      const inputs = Array.from(document.querySelectorAll(".player-input"));
      const names = inputs.map(i => i.value.trim()).filter(Boolean);

      if(names.length < MIN_PLAYERS){
        alert("لازم تدخل على الأقل " + MIN_PLAYERS + " أسماء.");
        return;
      }

      // احفظ الأسماء للجلسة (أثناء اللعب)
      sessionStorage.setItem(KEY, JSON.stringify(names));

      // انتقل لصفحة الكتاغوريات
      window.location.href = "categories.html";
    });
  </script>
</body>
</html>
