<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>اللعب من جهاز واحد</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --beige:#e9e1cf;
      --olive:#6f7a52;
      --olive-dark:#3f4e2c;
      --cream:#efe7d7;
      --yellow:#f3c515;
      --black:#111;
      --input-border:#4f6a2a;
      --plus:#b46ac6;
      --home-blue:#86c9ff;
      --roof:#ff5b6a;
      --placeholder: rgba(0,0,0,.35);
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      background:var(--beige);
      font-family:"Baloo Bhaijaan 2", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      display:flex;
      justify-content:center;
      align-items:stretch;
      padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
      color:#111;
    }

    .page{
      width:min(560px, 100%);
      min-height:calc(100vh - (env(safe-area-inset-top) + env(safe-area-inset-bottom)));
      margin:auto;
      border:6px solid var(--olive-dark);
      border-radius:22px;
      background:var(--beige);
      padding:22px 18px 24px;
      position:relative;
      overflow:hidden;
    }

    .logo{
      position:absolute;
      left:18px;
      top:22px;
      width:78px;
      height:auto;
      object-fit:contain;
      pointer-events:none;
      user-select:none;
    }

    h1{
      margin:62px 0 10px;
      text-align:center;
      color:var(--olive-dark);
      font-weight:900;
      font-size:clamp(34px, 7vw, 54px);
      letter-spacing:.2px;
    }

    .panel{
      width:min(520px, 100%);
      margin:10px auto 0;
      background:var(--olive);
      border-radius:18px;
      padding:18px 16px 20px;
      box-shadow:0 14px 0 rgba(0,0,0,.10);
    }

    .panel-title{
      text-align:center;
      color:#fff;
      font-weight:900;
      font-size:clamp(26px, 5.4vw, 42px);
      margin:6px 0 12px;
    }

    .inner{
      background:var(--beige);
      border-radius:18px;
      border:8px solid #111;
      padding:18px 14px 16px;
      min-height:420px;
    }

    .inputs{
      display:flex;
      flex-direction:column;
      gap:14px;
      align-items:center;
    }

    .player-input{
      width:min(420px, 100%);
      height:68px;
      border-radius:22px;
      border:4px solid var(--input-border);
      background:#fff;
      outline:none;
      padding:0 18px;
      font-size:clamp(22px, 5vw, 34px);
      font-weight:900;
      text-align:center;
    }

    .player-input::placeholder{
      color:var(--placeholder);
      font-weight:800;
      font-size:0.78em; /* أصغر */
    }

    .plus-wrap{
      width:min(420px, 100%);
      display:flex;
      justify-content:center;
      padding-top:6px;
    }

    .plus{
      width:74px;height:74px;
      border:none;
      background:transparent;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .plus svg{filter: drop-shadow(0 6px 0 rgba(0,0,0,.18));}

    .btn{
      display:block;
      width:min(420px, 100%);
      margin:16px auto 0;
      border:4px solid var(--black);
      border-radius:30px;
      padding:16px 16px;
      font-size:clamp(30px, 6.2vw, 48px);
      font-weight:900;
      background:var(--yellow);
      color:#111;
      cursor:pointer;
      box-shadow:0 12px 0 rgba(0,0,0,.22);
      -webkit-tap-highlight-color:transparent;
      transition:transform .05s ease, opacity .15s ease;
      text-align:center;
    }
    .btn:active{transform:translateY(1px)}
    .btn[disabled]{opacity:.45; cursor:not-allowed; box-shadow:none}

    .home{
      position:absolute;
      left:22px;
      bottom:22px;
      width:88px;
      height:88px;
      border-radius:999px;
      border:6px solid #000;
      background:var(--home-blue);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      box-shadow:0 10px 0 rgba(0,0,0,.18);
    }
    .home:active{transform:translateY(1px)}
  </style>
</head>

<body>
  <main class="page">
    <img class="logo" src="logo.PNG" alt="شعار صندوق المسابقات">
    <h1>اللعب من جهاز واحد</h1>

    <section class="panel">
      <div class="panel-title">ادخل اسماء اللاعبين :</div>

      <div class="inner">
        <div id="inputs" class="inputs"></div>

        <div class="plus-wrap">
          <button id="addBtn" class="plus" type="button" aria-label="إضافة لاعب">
            <svg width="74" height="74" viewBox="0 0 64 64" aria-hidden="true">
              <path d="M30 10h4v44h-4z" fill="var(--plus)" stroke="#000" stroke-width="2" />
              <path d="M10 30h44v4H10z" fill="var(--plus)" stroke="#000" stroke-width="2" />
            </svg>
          </button>
        </div>
      </div>

      <button id="startBtn" class="btn" type="button" disabled>ابدأ اللعب</button>
    </section>

    <button class="home" id="homeBtn" type="button" aria-label="الصفحة الرئيسية">
      <svg width="52" height="52" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M10 30 L32 12 L54 30" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18 28 V54 H46 V28" fill="#fff" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
        <path d="M28 54 V38 H36 V54" fill="#86c9ff" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
        <path d="M21 26 L32 17 L43 26" fill="none" stroke="var(--roof)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </main>

  <script>
    const STORE_PREFIX = "bara_";

    function clearAllGameState(){
      // امسح أي شيء قديم حتى تبدأ دايم من جديد
      const ssKeys = [];
      for(let i=0; i<sessionStorage.length; i++){
        const k = sessionStorage.key(i);
        if(k) ssKeys.push(k);
      }
      ssKeys.forEach(k => { if(k.startsWith(STORE_PREFIX)) sessionStorage.removeItem(k); });

      const lsKeys = [];
      for(let i=0; i<localStorage.length; i++){
        const k = localStorage.key(i);
        if(k) lsKeys.push(k);
      }
      lsKeys.forEach(k => { if(k.startsWith(STORE_PREFIX)) localStorage.removeItem(k); });
    }

    // هذه الصفحة لازم تكون جديدة كل مرة
    clearAllGameState();

    const inputsWrap = document.getElementById("inputs");
    const addBtn = document.getElementById("addBtn");
    const startBtn = document.getElementById("startBtn");
    const homeBtn = document.getElementById("homeBtn");

    let count = 3;

    function makeInput(i){
      const input = document.createElement("input");
      input.type = "text";
      input.className = "player-input";
      input.autocomplete = "off";
      input.spellcheck = false;

      const ph = `اللاعب رقم ${i}`;
      input.placeholder = ph;

      // ✅ يختفي فور الضغط (فوكس)
      input.addEventListener("focus", () => {
        input.dataset.ph = input.placeholder;
        input.placeholder = "";
      });
      input.addEventListener("blur", () => {
        if(!input.value.trim()){
          input.placeholder = input.dataset.ph || ph;
        }
      });

      input.addEventListener("input", validate);
      return input;
    }

    function render(){
      inputsWrap.innerHTML = "";
      for(let i=1;i<=count;i++){
        inputsWrap.appendChild(makeInput(i));
      }
      validate();
    }

    function validate(){
      const values = [...document.querySelectorAll(".player-input")]
        .map(i => i.value.trim())
        .filter(Boolean);

      startBtn.disabled = values.length < 3;
    }

    addBtn.addEventListener("click", () => {
      count++;
      render();
    });

    startBtn.addEventListener("click", () => {
      const names = [...document.querySelectorAll(".player-input")]
        .map(i => i.value.trim())
        .filter(Boolean);

      if(names.length < 3) return;

      // ✅ نحفظ الأسماء (للجولة الحالية فقط)
      sessionStorage.setItem("bara_players", JSON.stringify(names));

      // نروح للكتاغوريات
      window.location.href = "categories.html";
    });

    homeBtn.addEventListener("click", () => {
      clearAllGameState();
      window.location.href = "index.html";
    });

    render();
  </script>
</body>
</html>
