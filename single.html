<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>اللعب من جهاز واحد</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{--bg:#e9e4d6;--olive:#3f4a1f;--panel:#6e7b46;--black:#111;--yellow:#ffd21a;--blue:#bfe4ff}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"Baloo Bhaijaan 2",Arial,sans-serif;color:#111}
    .wrap{min-height:100svh;display:flex;justify-content:center;padding:18px 14px 22px}
    .card{width:min(560px,100%);position:relative}
    .top{position:relative;padding:8px 6px 0;min-height:96px}
    .logo{position:absolute;left:6px;top:6px;width:78px;height:78px;object-fit:contain;pointer-events:none}
    h1{margin:78px 0 16px;text-align:center;color:var(--olive);font-weight:900;font-size:44px;padding:0 86px}

    .panel{
      background:var(--panel);border-radius:28px;padding:18px 16px 16px;margin:0 6px 18px;
      min-height:62svh;display:flex;flex-direction:column;gap:14px
    }
    .panelTitle{color:#fff;font-weight:900;text-align:center;font-size:34px;margin-top:2px}
    .box{
      flex:1;
      background:rgba(0,0,0,.08);
      border-radius:22px;
      padding:16px 14px;
      border:6px solid #111;
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    .input{
      width:100%;
      background:#fff;
      border:4px solid #3f4a1f;
      border-radius:999px;
      padding:14px 14px;
      font-weight:900;
      font-size:28px;
      text-align:center;
      outline:none;
    }
    .plusBtn{
      align-self:center;
      width:68px;height:68px;
      border-radius:18px;
      border:4px solid rgba(0,0,0,.18);
      background:#c65ad3;
      color:#fff;
      font-size:44px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 8px 0 rgba(0,0,0,.18);
    }
    .plusBtn:active{transform:translateY(2px)}

    .btn{
      width:100%;
      background:var(--yellow);
      border:5px solid var(--black);
      border-radius:999px;
      padding:16px 14px;
      font-weight:900;
      font-size:34px;
      cursor:pointer;
      box-shadow:0 10px 0 rgba(0,0,0,.18);
    }
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .btn:active{transform:translateY(2px)}

    .homeBtn{
      position:fixed;left:14px;bottom:14px;width:64px;height:64px;border-radius:18px;
      border:5px solid var(--black);background:var(--blue);box-shadow:0 10px 0 rgba(0,0,0,.18);
      display:grid;place-items:center;z-index:40;cursor:pointer;
    }
    .homeBtn svg{width:34px;height:34px}
  </style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <div class="top">
        <img class="logo" src="logo.PNG" alt="logo">
        <h1>اللعب من جهاز واحد</h1>
      </div>

      <div class="panel">
        <div class="panelTitle">ادخل اسماء اللاعبين :</div>

        <div class="box" id="inputsBox"></div>

        <button id="addBtn" class="plusBtn" type="button">+</button>
        <button id="startBtn" class="btn" type="button" disabled>ابدأ اللعب</button>
      </div>
    </div>
  </div>

  <button class="homeBtn" type="button" onclick="location.href='index.html'" aria-label="الرئيسية">
    <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10.5L12 3l9 7.5"></path>
      <path d="M5 10v10h14V10"></path>
      <path d="M9 20v-7h6v7"></path>
    </svg>
  </button>

  <script>
    const inputsBox = document.getElementById('inputsBox');
    const addBtn = document.getElementById('addBtn');
    const startBtn = document.getElementById('startBtn');

    let players = [];

    function makeInput(i){
      const inp = document.createElement('input');
      inp.className = 'input';
      inp.placeholder = 'اللاعب ' + (i+1);
      inp.value = players[i] || '';
      inp.addEventListener('input', ()=>{
        players[i] = inp.value;
        checkStart();
      });
      return inp;
    }

    function render(){
      inputsBox.innerHTML = '';
      players.forEach((_, i)=> inputsBox.appendChild(makeInput(i)));
      checkStart();
    }

    function checkStart(){
      const filled = players.filter(n => (n||'').trim().length>0);
      startBtn.disabled = filled.length < 3;
    }

    function addPlayer(){
      // لا نمسح الموجود
      players.push('');
      render();
      // فوكس على آخر واحد
      const last = inputsBox.querySelectorAll('input');
      last[last.length-1]?.focus();
    }

    // أول تشغيل: 3 خانات ثابتة
    players = ['','',''];
    render();

    addBtn.addEventListener('click', addPlayer);

    startBtn.addEventListener('click', ()=>{
      const filled = players.map(x=> (x||'').trim()).filter(Boolean);
      localStorage.setItem('bara_mode','one');
      localStorage.setItem('bara_one_players', JSON.stringify(filled));
      location.href = 'categories.html?mode=one';
    });
  </script>
</body>
</html>
