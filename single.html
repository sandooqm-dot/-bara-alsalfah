<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>لعبة برا السالفة - جهاز واحد</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --beige:#e9e3d6;
      --green:#6f8250;
      --green-dark:#3f4e2c;
      --cream:#efe7d7;

      --yellow:#f3c515;
      --black:#111;

      --purple:#8b49b9;
      --home-blue:#bfe7ff;

      --shadow:0 12px 0 rgba(0,0,0,.22);
      --shadowSmall:0 10px 0 rgba(0,0,0,.18);
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      background:var(--beige);
      font-family:"Baloo Bhaijaan 2", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      display:flex;
      justify-content:center;
      align-items:stretch;
      padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
      color:#111;
    }

    .page{
      width:min(560px, 100%);
      min-height:calc(100vh - (env(safe-area-inset-top) + env(safe-area-inset-bottom)));
      margin:auto;
      border:6px solid var(--green-dark);
      border-radius:22px;
      background:var(--beige);
      padding:22px 18px 24px;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    /* شعار أعلى يسار + عنوان أعلى يمين مثل الصورة */
    .logo{
      position:absolute;
      left:18px;
      top:18px;
      width:90px;
      height:auto;
      object-fit:contain;
      pointer-events:none;
      user-select:none;
    }
    .topTitle{
      position:absolute;
      right:18px;
      top:22px;
      font-weight:900;
      color:var(--green-dark);
      font-size:18px;
      opacity:.95;
    }

    /* العنوان الكبير */
    h1{
      margin:72px 0 18px;
      text-align:center;
      color:var(--green-dark);
      font-weight:900;
      font-size:clamp(34px, 6.2vw, 56px);
      line-height:1.05;
      letter-spacing:.2px;
    }

    /* لوحة خضراء داخلية مثل الصورة */
    .panel{
      width:min(520px, 100%);
      margin:0 auto;
      background:var(--green);
      border-radius:26px;
      padding:18px 16px 20px;
      box-shadow:0 18px 0 rgba(0,0,0,.10);
      position:relative;
      display:flex;
      flex-direction:column;
      gap:14px;
      flex:1;
    }

    .panelTitle{
      text-align:center;
      color:#fff;
      font-weight:900;
      font-size:clamp(28px, 5.6vw, 44px);
      line-height:1.1;
      margin-top:2px;
    }

    /* صندوق الأسماء الكبير (بيج) بإطار أسود سميك */
    .namesBox{
      background:rgba(233,227,214,.92);
      border:7px solid #000;
      border-radius:26px;
      padding:18px 16px 18px;
      min-height:300px;              /* يعطي نفس الفراغ بالصورة */
      box-shadow:0 14px 0 rgba(0,0,0,.20);
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .nameInput{
      width:100%;
      background:#fff;
      border:5px solid var(--green-dark);
      border-radius:999px;
      padding:14px 14px;
      font-size:clamp(22px, 4.2vw, 34px);
      font-weight:900;
      color:#111;
      outline:none;
      text-align:center;
    }
    .nameInput::placeholder{
      color:rgba(0,0,0,.35);
      font-weight:900;
    }

    /* زر + (شكل زائد بنفس الصورة: بدون مربع) */
    .plusWrap{
      display:flex;
      justify-content:center;
      margin-top:2px;
      margin-bottom:2px;
    }
    .plusBtn{
      width:86px;
      height:86px;
      border-radius:999px;
      background:transparent;
      border:none;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
    }
    .plusIcon{
      width:64px;
      height:64px;
      display:block;
      filter: drop-shadow(0 8px 0 rgba(0,0,0,.25));
    }

    /* زر ابدأ اللعب داخل اللوحة بأسفل مثل الصورة */
    .startWrap{
      display:flex;
      justify-content:center;
      margin-top:auto; /* ينزل تلقائياً إذا زاد المحتوى */
      padding-top:8px;
    }
    .startBtn{
      width:min(420px, 92%);
      border:6px solid #000;
      border-radius:999px;
      padding:14px 18px;
      font-size:clamp(30px, 5.8vw, 44px);
      font-weight:900;
      background:var(--yellow);
      color:#111;
      cursor:pointer;
      box-shadow:0 12px 0 rgba(0,0,0,.22);
      -webkit-tap-highlight-color:transparent;
      transition:transform .05s ease, opacity .2s ease, filter .2s ease;
    }
    .startBtn:active{transform:translateY(1px)}
    .startBtn[disabled]{
      opacity:.55;
      filter:saturate(.6);
      cursor:not-allowed;
      transform:none;
    }

    /* زر الرئيسية (آمن وما يتداخل) */
    .home{
      position:fixed;
      left:18px;
      bottom:calc(18px + env(safe-area-inset-bottom));
      width:72px;
      height:72px;
      border-radius:999px;
      border:6px solid #000;
      background:var(--home-blue);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      box-shadow:0 10px 0 rgba(0,0,0,.18);
      z-index:9999;
    }
    .home:active{transform:translateY(1px)}
    .home svg{width:40px;height:40px}

    @media (max-width:360px){
      .namesBox{min-height:270px}
      .home{width:66px;height:66px}
      .home svg{width:36px;height:36px}
      .plusBtn{width:78px;height:78px}
      .plusIcon{width:58px;height:58px}
    }
  </style>
</head>

<body>
  <main class="page">
    <img class="logo" src="logo.PNG" alt="شعار صندوق المسابقات">
    <div class="topTitle">اللعب من جهاز واحد</div>

    <h1>اللعب من جهاز واحد</h1>

    <section class="panel">
      <div class="panelTitle">ادخل اسماء اللاعبين :</div>

      <div class="namesBox" id="inputs">
        <input class="nameInput" type="text" placeholder="اللاعب رقم 1" />
        <input class="nameInput" type="text" placeholder="اللاعب رقم 2" />
        <input class="nameInput" type="text" placeholder="اللاعب رقم 3" />
      </div>

      <div class="plusWrap">
        <button class="plusBtn" id="addBtn" type="button" aria-label="إضافة لاعب">
          <!-- زائد بنفس شكل الصورة (بنفسجي + ظل + إطار أسود) -->
          <svg class="plusIcon" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M28 10h8v44h-8z" fill="var(--purple)" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
            <path d="M10 28h44v8H10z" fill="var(--purple)" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="startWrap">
        <button class="startBtn" id="startBtn" type="button">ابدأ اللعب</button>
      </div>
    </section>
  </main>

  <button class="home" id="homeBtn" type="button" aria-label="الصفحة الرئيسية">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M10 30 L32 12 L54 30" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18 28 V54 H46 V28" fill="#fff" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
      <path d="M28 54 V38 H36 V54" fill="#86c9ff" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
      <path d="M21 26 L32 17 L43 26" fill="none" stroke="#c84b4b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <script>
    const inputsWrap = document.getElementById('inputs');
    const addBtn = document.getElementById('addBtn');
    const startBtn = document.getElementById('startBtn');
    const homeBtn  = document.getElementById('homeBtn');

    function nextIndex(){
      return inputsWrap.querySelectorAll('.nameInput').length + 1;
    }

    // ✅ لا تختفي الأسماء: نضيف input جديد فقط
    addBtn.addEventListener('click', () => {
      const i = document.createElement('input');
      i.className = 'nameInput';
      i.type = 'text';
      i.placeholder = `اللاعب رقم ${nextIndex()}`;
      inputsWrap.appendChild(i);
      i.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => i.focus(), 200);
    });

    function clearBaraState(){
      // امسح مفاتيح اللعبة المحتملة (قديمة/جديدة)
      sessionStorage.removeItem('bara_players');
      sessionStorage.removeItem('players');
      sessionStorage.removeItem('baraPlayers');

      sessionStorage.removeItem('bara_category_id');
      sessionStorage.removeItem('bara_category_label');
      sessionStorage.removeItem('categoryKey');
      sessionStorage.removeItem('bara_selectedCategory');

      sessionStorage.removeItem('singleState');
    }

    homeBtn.addEventListener('click', () => {
      clearBaraState();
      window.location.href = 'index.html';
    });

    startBtn.addEventListener('click', () => {
      const names = Array.from(inputsWrap.querySelectorAll('.nameInput'))
        .map(i => i.value.trim())
        .filter(Boolean);

      if (names.length < 3) {
        alert('لازم تدخل 3 أسماء على الأقل');
        return;
      }

      // ✅ نخزنها بأكثر من مفتاح (عشان أي صفحة قديمة/جديدة تقدر تقرأها)
      sessionStorage.setItem('bara_players', JSON.stringify(names));
      sessionStorage.setItem('players', JSON.stringify(names));
      sessionStorage.setItem('baraPlayers', JSON.stringify(names));

      // نبدأ جولة جديدة
      sessionStorage.removeItem('singleState');

      window.location.href = 'categories.html';
    });
  </script>
</body>
</html>
