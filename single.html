<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>إدخال أسماء اللاعبين</title>

  <style>
    :root{
      --beige:#e8e2d4;
      --green:#6f8250;
      --green-dark:#3e4f23;
      --yellow:#f6c61a;
      --black:#111;
      --shadow: rgba(0,0,0,.22);
      --plus:#b05bbd; /* بنفسجي */
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--beige);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color:#111;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .page{
      width:min(520px, 100%);
      min-height:100vh;
      padding:18px 14px 22px;
      position:relative;
    }

    .frame{
      border:10px solid var(--green-dark);
      border-radius:26px;
      background:var(--beige);
      padding:14px 14px 130px; /* مساحة للأزرار الثابتة تحت */
      min-height:calc(100vh - 40px);
      box-shadow:0 6px 18px rgba(0,0,0,.12);
      position:relative;
      overflow:hidden;
    }

    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }

    .logo{
      width:86px;
      height:auto;
      object-fit:contain;
    }

    .gameName{
      margin:0;
      font-weight:900;
      color:var(--green-dark);
      font-size:18px;
      line-height:1.1;
      text-align:right;
      padding-top:6px;
    }

    .title{
      text-align:center;
      margin:8px 0 12px;
      font-weight:900;
      color:var(--green-dark);
      font-size:clamp(26px, 4.6vw, 38px);
    }

    .list{
      display:flex;
      flex-direction:column;
      gap:14px;
      padding:4px 0 8px;
      margin:0 auto;
      width:min(430px, 94%);
    }

    .nameInput{
      width:100%;
      border:5px solid var(--green-dark);
      border-radius:18px;
      background:#fff;
      text-align:center;
      font-weight:900;
      color:#111;
      padding:16px 14px;
      font-size:clamp(20px, 4.2vw, 30px);
      outline:none;
    }

    .nameInput::placeholder{
      color: rgba(0,0,0,.35);
      font-weight:800;
      font-size: .82em;
    }
    .nameInput:focus::placeholder{ color: transparent; }

    .controls{
      width:min(430px, 94%);
      margin:10px auto 0;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:12px;
    }

    /* ✅ زر + أصغر + علامة + باللون الأبيض */
    .plusBtn{
      width:70px;
      height:70px;
      border-radius:18px;
      border:6px solid #000;
      background:var(--plus);
      box-shadow:0 10px 0 var(--shadow);
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      user-select:none;
    }
    .plusBtn:active{ transform:translateY(1px); box-shadow:0 9px 0 var(--shadow); }

    .plusIcon{
      width:36px;
      height:36px;
      display:block;
    }

    /* ✅ شريط أزرار ثابت تحت: (ابدأ اللعب بالوسط) + (المنزل يسار) */
    .fixedBottom{
      position:absolute;
      left:0;
      right:0;
      bottom:16px;
      display:flex;
      justify-content:center;
      align-items:flex-end;
      pointer-events:none; /* نرجعها للأزرار فقط */
    }
    .fixedBottomInner{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      pointer-events:none;
    }

    .startBtn{
      pointer-events:auto;
      width:min(420px, 92%);
      background:var(--yellow);
      border:6px solid #000;
      border-radius:999px;
      font-size:clamp(26px, 5vw, 40px);
      font-weight:900;
      padding:16px 18px;
      cursor:pointer;
      box-shadow:0 10px 0 var(--shadow);
      color:#111;              /* ✅ النص أسود */
      -webkit-text-fill-color:#111; /* ✅ يمنع تغيّر اللون في بعض الأجهزة */
      text-decoration:none;
    }
    .startBtn:active{ transform:translateY(1px); box-shadow:0 9px 0 var(--shadow); }

    .homeBtn{
      pointer-events:auto;
      position:absolute;
      left:14px;
      bottom:-2px;
      width:72px;
      height:72px;
      border-radius:50%;
      border:6px solid #000;
      background:#a9dbff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:0 8px 0 var(--shadow);
    }
    .homeBtn:active{ transform:translateY(1px); box-shadow:0 7px 0 var(--shadow); }

    .homeSvg{
      width:44px;
      height:44px;
      display:block;
    }

    @media (max-width:360px){
      .plusBtn{ width:64px; height:64px; border-width:5px; }
      .plusIcon{ width:34px; height:34px; }
      .homeBtn{ width:66px; height:66px; }
      .homeSvg{ width:40px; height:40px; }
      .nameInput{ border-width:4px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="frame">
      <div class="topbar">
        <img class="logo" src="logo.PNG" alt="logo">
        <h3 class="gameName">لعبة برا السالفة</h3>
      </div>

      <div class="title">ادخل اسماء اللاعبين :</div>

      <div class="list" id="list"></div>

      <div class="controls">
        <button class="plusBtn" id="plusBtn" aria-label="add">
          <!-- ✅ + أبيض -->
          <svg class="plusIcon" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M28 10h8v18h18v8H36v18h-8V36H10v-8h18V10z" fill="#fff"/>
          </svg>
        </button>
      </div>

      <!-- ✅ أزرار ثابتة أسفل -->
      <div class="fixedBottom">
        <div class="fixedBottomInner">
          <button class="startBtn" id="startBtn">ابدأ اللعب</button>

          <button class="homeBtn" id="homeBtn" aria-label="home">
            <!-- ✅ أيقونة منزل SVG (بدون صورة خارجية) -->
            <svg class="homeSvg" viewBox="0 0 64 64" aria-hidden="true">
              <path d="M8 30L32 10l24 20" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M16 28v26h32V28" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M26 54V40h12v14" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const KEY_NAMES = "bara_players";
    const KEY_DATE  = "bara_session_date";

    function todayKey(){
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const da = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${da}`;
    }

    function resetAll(){
      sessionStorage.removeItem(KEY_NAMES);
      sessionStorage.removeItem(KEY_DATE);
    }

    (function ensureFreshSession(){
      const t = todayKey();
      const saved = sessionStorage.getItem(KEY_DATE);
      if(saved && saved !== t){
        resetAll();
      }
      sessionStorage.setItem(KEY_DATE, t);
    })();

    const listEl = document.getElementById("list");
    const plusBtn = document.getElementById("plusBtn");
    const startBtn = document.getElementById("startBtn");
    const homeBtn = document.getElementById("homeBtn");

    function getNames(){
      try{
        const v = sessionStorage.getItem(KEY_NAMES);
        const arr = v ? JSON.parse(v) : [];
        return Array.isArray(arr) ? arr : [];
      }catch(e){
        return [];
      }
    }

    function saveNames(arr){
      sessionStorage.setItem(KEY_NAMES, JSON.stringify(arr));
    }

    function buildDefaultIfEmpty(){
      const arr = getNames();
      if(arr.length === 0){
        saveNames(["","",""]);
      }
    }

    function render(){
      const arr = getNames();
      listEl.innerHTML = "";

      arr.forEach((val, idx) => {
        const input = document.createElement("input");
        input.className = "nameInput";
        input.type = "text";
        input.dir = "rtl";
        input.autocomplete = "off";
        input.value = val || "";
        input.placeholder = `اللاعب رقم ${idx+1}`;

        input.addEventListener("input", () => {
          const names = getNames();
          names[idx] = input.value.trim();
          saveNames(names);
        });

        listEl.appendChild(input);
      });
    }

    plusBtn.addEventListener("click", () => {
      const arr = getNames();
      arr.push("");
      saveNames(arr);
      render();
      const inputs = listEl.querySelectorAll("input.nameInput");
      const last = inputs[inputs.length - 1];
      if(last) last.focus();
    });

    startBtn.addEventListener("click", () => {
      const raw = getNames();
      const cleaned = raw.map(x => (x || "").trim()).filter(x => x.length > 0);

      if(cleaned.length < 3){
        alert("لازم تدخل 3 أسماء على الأقل");
        return;
      }

      saveNames(cleaned);
      window.location.href = "categories.html";
    });

    homeBtn.addEventListener("click", () => {
      resetAll();
      window.location.href = "index.html";
    });

    buildDefaultIfEmpty();
    render();
  </script>
</body>
</html>
