<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>لعبة برا السالفة - جهاز واحد</title>

  <style>
    :root{
      --bg:#e9e3d6;
      --green:#3f5b2a;
      --green2:#6e8554;
      --yellow:#f2c300;
      --purple:#8b49b9;
      --text:#1a1a1a;
      --muted:#9a9a9a;

      --shadow: 0 10px 0 rgba(0,0,0,0.18);
      --shadowSmall: 0 8px 0 rgba(0,0,0,0.18);

      /* ✅ مكان الأزرار حسب تحديدك (أحمر/أزرق) */
      --controlsBottom: 110px; /* ارفع/نزّلها لو احتجت (لكن هذا أقرب لمكان الأحمر بالصورة) */
      --controlsSideGap: 18px; /* مسافة زر الرئيسية من يسار الشاشة */
      --controlsBarWidthGap: 24px; /* هامش عرض البار */
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--text);
    }

    .page{
      min-height: 100vh;
      padding: 14px 12px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .frame{
      width: min(520px, 100%);
      background: var(--bg);
      border: 6px solid var(--green);
      border-radius: 26px;
      padding: 18px 16px 18px;
      position: relative;

      min-height: calc(100vh - 28px);
      display:flex;
      flex-direction:column;

      /* ✅ مساحة تحت حتى ما تغطي الأزرار الثابتة المحتوى */
      padding-bottom: 220px;
    }

    /* ✅ رأس الصفحة */
    .topRow{
      position: relative;
      min-height: 86px;
      margin-bottom: 10px;
      padding-left: 118px;
      display:flex;
      align-items:flex-start;
      justify-content:flex-end;
    }

    .title{
      font-weight: 800;
      color: var(--green);
      font-size: 16px;
      line-height: 1.2;
      margin-top: 6px;
      text-align:right;
    }

    /* ✅ اللوجو */
    .logo{
      position:absolute;
      left: 10px;
      top: 2px;
      width: 98px;
      height: 98px;
      object-fit: contain;
      opacity: 0.98;
      pointer-events:none;
    }

    h2{
      margin: 10px 0 14px;
      text-align:center;
      color: var(--green);
      font-size: 22px;
      font-weight: 900;
    }

    .inputs{
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top: 2px;
    }

    .nameInput{
      width: 100%;
      padding: 14px 14px;
      border: 4px solid var(--green2);
      border-radius: 18px;
      background:#fff;
      font-size: 20px;
      font-weight: 700;
      color:#111;
      outline:none;
      text-align:center;
    }
    .nameInput::placeholder{
      color: var(--muted);
      font-weight: 800;
      font-size: 18px;
      opacity: 0.75;
    }

    .plusWrap{
      display:flex;
      justify-content:center;
      margin: 18px 0 6px;
    }
    .plusBtn{
      width: 58px;
      height: 58px;
      border-radius: 14px;
      border: 4px solid #000;
      background: var(--purple);
      display:flex;
      justify-content:center;
      align-items:center;
      box-shadow: var(--shadowSmall);
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }
    .plusBtn span{
      color:#fff;
      font-size: 36px;
      font-weight: 900;
      line-height: 1;
      transform: translateY(-1px);
    }

    /* =========================
       ✅ الشريط السفلي الثابت (حسب الأحمر/الأزرق)
       ========================= */
    .bottomBar{
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(var(--controlsBottom) + env(safe-area-inset-bottom));
      display:flex;
      justify-content:center;
      z-index: 9999;
      pointer-events:none;
    }
    .bottomInner{
      width: min(520px, calc(100% - var(--controlsBarWidthGap)));
      position: relative;
      pointer-events:none;
      min-height: 80px;
    }

    /* ✅ زر ابدأ اللعب (في مكان الأحمر) */
    .startBtn{
      border: 4px solid #000;
      background: var(--yellow);
      color:#111;
      font-weight: 900;
      font-size: 24px;
      border-radius: 22px;
      padding: 12px 26px;
      min-width: 220px;
      max-width: 78%;
      box-shadow: var(--shadow);
      cursor:pointer;
      pointer-events:auto;
      display:block;
      margin: 0 auto;
      -webkit-tap-highlight-color:transparent;
    }
    .startBtn:active{ transform: translateY(1px); box-shadow: 0 9px 0 rgba(0,0,0,0.18); }

    /* ✅ زر الرئيسية (في مكان الأزرق) - SVG مضمون ما يخرب */
    .homeBtn{
      position: absolute;
      left: var(--controlsSideGap);
      bottom: -6px;
      width: 64px;
      height: 64px;
      border-radius: 18px;
      border: 4px solid #000;
      background: #bfe3ff;
      box-shadow: var(--shadowSmall);
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      pointer-events:auto;
      z-index: 2;
      -webkit-tap-highlight-color:transparent;
    }
    .homeBtn:active{ transform: translateY(1px); box-shadow: 0 7px 0 rgba(0,0,0,0.18); }
    .homeBtn svg{
      width: 34px;
      height: 34px;
      fill: #111;
    }

    @media (max-width: 360px){
      .topRow{ min-height: 78px; padding-left: 108px; }
      .logo{ width: 90px; height: 90px; left: 10px; top: 2px; }
      h2{ font-size: 20px; }
      .nameInput{ font-size: 18px; }
      .startBtn{ font-size: 22px; min-width: 200px; }
      .plusBtn{ width: 54px; height: 54px; }
      .plusBtn span{ font-size: 34px; }
      .homeBtn{ width: 60px; height: 60px; border-radius: 16px; }
      .homeBtn svg{ width: 32px; height: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="frame">
      <div class="topRow">
        <div class="title">لعبة برا السالفة</div>
        <img class="logo" src="logo.PNG" alt="logo">
      </div>

      <h2>ادخل اسماء اللاعبين :</h2>

      <div class="inputs" id="inputs">
        <input class="nameInput" type="text" placeholder="اللاعب رقم 1" />
        <input class="nameInput" type="text" placeholder="اللاعب رقم 2" />
        <input class="nameInput" type="text" placeholder="اللاعب رقم 3" />
      </div>

      <div class="plusWrap">
        <div class="plusBtn" id="addBtn" aria-label="إضافة لاعب">
          <span>+</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ الأزرار الثابتة (أحمر/أزرق) -->
  <div class="bottomBar" aria-hidden="false">
    <div class="bottomInner">
      <button class="homeBtn" id="homeBtn" title="الرئيسية" aria-label="الرئيسية">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/>
        </svg>
      </button>

      <button class="startBtn" id="startBtn">ابدأ اللعب</button>
    </div>
  </div>

  <script>
    document.addEventListener('focusin', (e) => {
      if (e.target.classList && e.target.classList.contains('nameInput')) {
        e.target.dataset.ph = e.target.placeholder;
        e.target.placeholder = '';
      }
    });
    document.addEventListener('focusout', (e) => {
      if (e.target.classList && e.target.classList.contains('nameInput')) {
        if (!e.target.value.trim()) {
          e.target.placeholder = e.target.dataset.ph || '';
        }
      }
    });

    const inputsWrap = document.getElementById('inputs');
    const addBtn = document.getElementById('addBtn');
    const startBtn = document.getElementById('startBtn');
    const homeBtn = document.getElementById('homeBtn');

    function nextIndex(){
      return inputsWrap.querySelectorAll('.nameInput').length + 1;
    }

    addBtn.addEventListener('click', () => {
      const i = document.createElement('input');
      i.className = 'nameInput';
      i.type = 'text';
      i.placeholder = `اللاعب رقم ${nextIndex()}`;
      inputsWrap.appendChild(i);
      i.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => i.focus(), 200);
    });

    function clearBaraState(){
      for (let k = localStorage.length - 1; k >= 0; k--) {
        const key = localStorage.key(k);
        if (key && key.startsWith('bara_')) localStorage.removeItem(key);
      }
      sessionStorage.removeItem('bara_players');
      sessionStorage.removeItem('bara_selectedCategory');
      sessionStorage.removeItem('bara_secretWord');
      sessionStorage.removeItem('bara_outPlayerIndex');
    }

    homeBtn.addEventListener('click', () => {
      clearBaraState();
      window.location.href = 'index.html';
    });

    startBtn.addEventListener('click', () => {
      const names = Array.from(inputsWrap.querySelectorAll('.nameInput'))
        .map(i => i.value.trim())
        .filter(Boolean);

      if (names.length < 3) {
        alert('لازم تدخل 3 أسماء على الأقل');
        return;
      }

      sessionStorage.setItem('bara_players', JSON.stringify(names));
      window.location.href = 'categories.html';
    });
  </script>
</body>
</html>

<!-- single.html – إصدار تعديل (تحريك زر ابدأ + زر الرئيسية حسب الصورة) -->
