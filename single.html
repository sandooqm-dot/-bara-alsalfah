<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>لعبة برا السالفة - جهاز واحد</title>

  <style>
    :root{
      --bg:#e9e3d6;          /* البيج */
      --frame:#e9e3d6;
      --green:#3f5b2a;       /* أخضر الإطار */
      --green2:#6e8554;
      --yellow:#f2c300;      /* زر أصفر */
      --purple:#8b49b9;      /* لون + */
      --text:#1a1a1a;
      --muted:#9a9a9a;
      --shadow: 0 10px 0 rgba(0,0,0,0.18);
      --shadowSmall: 0 8px 0 rgba(0,0,0,0.18);
      --radius: 28px;

      /* ✅ رفع زر "ابدأ اللعب" للأعلى (عدّل الرقم إذا تبي أعلى/أخفض) */
      --start-bottom-gap: 92px; /* كل ما زاد الرقم يرتفع الزر */
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--text);
    }

    .page{
      min-height: 100vh;
      padding: 14px 12px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .frame{
      width: min(520px, 100%);
      background: var(--frame);
      border: 6px solid var(--green);
      border-radius: 26px;
      padding: 18px 16px 18px;
      position: relative;

      min-height: calc(100vh - 28px);
      display:flex;
      flex-direction:column;
    }

    .topRow{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 10px;
    }

    .title{
      font-weight: 800;
      color: var(--green);
      font-size: 16px;
      line-height: 1.2;
      margin-top: 4px;
      text-align:right;
    }

    .logo{
      width: 70px;
      height: 36px;
      object-fit: contain;
      opacity: 0.95;
    }

    h2{
      margin: 10px 0 14px;
      text-align:center;
      color: var(--green);
      font-size: 22px;
      font-weight: 900;
    }

    .inputs{
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top: 2px;
    }

    .nameInput{
      width: 100%;
      padding: 14px 14px;
      border: 4px solid var(--green2);
      border-radius: 18px;
      background:#fff;
      font-size: 20px;
      font-weight: 700;
      color:#111;
      outline:none;
      text-align:center;
    }
    .nameInput::placeholder{
      color: var(--muted);
      font-weight: 800;
      font-size: 18px;
      opacity: 0.75;
    }

    /* ✅ زر + (نفس شكل الصورة الأولى) */
    .plusWrap{
      display:flex;
      justify-content:center;
      margin: 18px 0 6px;
    }
    .plusBtn{
      width: 78px;
      height: 78px;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
    }
    .plusBtn svg{
      width: 70px;
      height: 70px;
      display:block;
      filter: drop-shadow(0 8px 0 rgba(0,0,0,0.22));
    }
    .plusBtn:active svg{
      transform: translateY(1px);
      filter: drop-shadow(0 7px 0 rgba(0,0,0,0.22));
    }

    /* ✅ منطقة زر ابدأ اللعب — يرتفع للمكان المطلوب */
    .actionArea{
      margin-top: auto;
      display:flex;
      justify-content:center;
      padding: 12px 0 calc(var(--start-bottom-gap) + env(safe-area-inset-bottom));
    }

    .startBtn{
      border: 4px solid #000;
      background: var(--yellow);
      color:#111;
      font-weight: 900;
      font-size: 24px;
      border-radius: 22px;
      padding: 12px 26px;
      min-width: 220px;
      max-width: 78%;
      box-shadow: var(--shadow);
      cursor:pointer;
    }

    /* زر الرئيسية (ثابت وما يتداخل مع زر ابدأ اللعب) */
    .homeBtn{
      position: fixed;
      left: 18px;
      bottom: calc(18px + env(safe-area-inset-bottom));
      width: 64px;
      height: 64px;
      border-radius: 18px;
      border: 4px solid #000;
      background: #bfe3ff;
      box-shadow: var(--shadowSmall);
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      z-index: 9999;
    }
    .homeBtn svg{
      width: 34px;
      height: 34px;
      fill: #111;
    }

    @media (max-width: 360px){
      h2{ font-size: 20px; }
      .nameInput{ font-size: 18px; }
      .startBtn{ font-size: 22px; min-width: 200px; }
      .plusBtn{ width: 74px; height: 74px; }
      .plusBtn svg{ width: 66px; height: 66px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="frame">
      <div class="topRow">
        <div class="title">لعبة برا السالفة</div>
        <img class="logo" src="logo.PNG" alt="logo">
      </div>

      <h2>ادخل اسماء اللاعبين :</h2>

      <div class="inputs" id="inputs">
        <input class="nameInput" type="text" placeholder="اللاعب رقم 1" />
        <input class="nameInput" type="text" placeholder="اللاعب رقم 2" />
        <input class="nameInput" type="text" placeholder="اللاعب رقم 3" />
      </div>

      <div class="plusWrap">
        <button class="plusBtn" id="addBtn" type="button" aria-label="إضافة لاعب">
          <!-- ✅ نفس شكل + بالصورة الأولى -->
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path
              d="M41 10h18c6 0 11 5 11 11v20h20c6 0 11 5 11 11v18c0 6-5 11-11 11H70v20c0 6-5 11-11 11H41c-6 0-11-5-11-11V81H10C4 81-1 76-1 70V52c0-6 5-11 11-11h20V21c0-6 5-11 11-11z"
              fill="var(--purple)"
              stroke="#000"
              stroke-width="8"
              stroke-linejoin="round"
            />
            <!-- لمعة خفيفة بسيطة -->
            <path
              d="M45 16h10c4 0 7 3 7 7v19h19c4 0 7 3 7 7v10"
              fill="none"
              stroke="rgba(255,255,255,0.25)"
              stroke-width="6"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>

      <div class="actionArea">
        <button class="startBtn" id="startBtn" type="button">ابدأ اللعب</button>
      </div>
    </div>
  </div>

  <!-- زر الرئيسية ثابت -->
  <div class="homeBtn" id="homeBtn" title="الرئيسية" aria-label="الرئيسية">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/>
    </svg>
  </div>

  <script>
    // يخلي النص (placeholder) يختفي فور الضغط على المربع
    document.addEventListener('focusin', (e) => {
      if (e.target.classList && e.target.classList.contains('nameInput')) {
        e.target.dataset.ph = e.target.placeholder;
        e.target.placeholder = '';
      }
    });
    document.addEventListener('focusout', (e) => {
      if (e.target.classList && e.target.classList.contains('nameInput')) {
        if (!e.target.value.trim()) {
          e.target.placeholder = e.target.dataset.ph || '';
        }
      }
    });

    const inputsWrap = document.getElementById('inputs');
    const addBtn = document.getElementById('addBtn');
    const startBtn = document.getElementById('startBtn');
    const homeBtn = document.getElementById('homeBtn');

    function nextIndex(){
      return inputsWrap.querySelectorAll('.nameInput').length + 1;
    }

    // ✅ لا تختفي الأسماء: نضيف input جديد فقط
    addBtn.addEventListener('click', () => {
      const i = document.createElement('input');
      i.className = 'nameInput';
      i.type = 'text';
      i.placeholder = `اللاعب رقم ${nextIndex()}`;
      inputsWrap.appendChild(i);
      i.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => i.focus(), 200);
    });

    function clearBaraState(){
      for (let k = localStorage.length - 1; k >= 0; k--) {
        const key = localStorage.key(k);
        if (key && key.startsWith('bara_')) localStorage.removeItem(key);
      }
      sessionStorage.removeItem('bara_players');
      sessionStorage.removeItem('bara_selectedCategory');
      sessionStorage.removeItem('bara_secretWord');
      sessionStorage.removeItem('bara_outPlayerIndex');
    }

    homeBtn.addEventListener('click', () => {
      clearBaraState();
      window.location.href = 'index.html';
    });

    startBtn.addEventListener('click', () => {
      const names = Array.from(inputsWrap.querySelectorAll('.nameInput'))
        .map(i => i.value.trim())
        .filter(Boolean);

      if (names.length < 3) {
        alert('لازم تدخل 3 أسماء على الأقل');
        return;
      }

      sessionStorage.setItem('bara_players', JSON.stringify(names));
      window.location.href = 'categories.html';
    });
  </script>
</body>
</html>
