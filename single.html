<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>لعبة برا السالفة - جهاز واحد</title>

  <style>
    :root{
      --bg:#e9e3d6;          /* البيج */
      --frame:#e9e3d6;
      --green:#3f5b2a;       /* أخضر الإطار */
      --green2:#6e8554;
      --yellow:#f2c300;      /* زر أصفر */
      --purple:#8b49b9;      /* زر + */
      --text:#1a1a1a;
      --muted:#9a9a9a;
      --shadow: 0 10px 0 rgba(0,0,0,0.18);
      --shadowSmall: 0 8px 0 rgba(0,0,0,0.18);
      --radius: 28px;

      /* ✅ مقاسات زر الرئيسية داخل منطقة الأزرار */
      --homeSize: 62px;
      --homeGap: 12px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--text);
    }

    .page{
      min-height: 100vh;
      padding: 14px 12px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .frame{
      width: min(520px, 100%);
      background: var(--frame);
      border: 6px solid var(--green);
      border-radius: 26px;
      padding: 18px 16px 18px;
      position: relative;

      /* ✅ يتمدد لو زادت الأسماء (فيتحرك زر ابدأ اللعب للأسفل تلقائيًا) */
      min-height: calc(100vh - 28px);
      display:flex;
      flex-direction:column;
    }

    .topRow{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 10px;
    }

    .title{
      font-weight: 800;
      color: var(--green);
      font-size: 16px;
      line-height: 1.2;
      margin-top: 4px;
      text-align:right;
    }

    .logo{
      width: 70px;
      height: 36px;
      object-fit: contain;
      opacity: 0.95;
    }

    h2{
      margin: 10px 0 14px;
      text-align:center;
      color: var(--green);
      font-size: 22px;
      font-weight: 900;
    }

    .inputs{
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top: 2px;
    }

    .nameInput{
      width: 100%;
      padding: 14px 14px;
      border: 4px solid var(--green2);
      border-radius: 18px;
      background:#fff;
      font-size: 20px;
      font-weight: 700;
      color:#111;
      outline:none;
      text-align:center;
    }
    .nameInput::placeholder{
      color: var(--muted);
      font-weight: 800;
      font-size: 18px; /* أصغر */
      opacity: 0.75;   /* أبهت */
    }

    /* زر + */
    .plusWrap{
      display:flex;
      justify-content:center;
      margin: 18px 0 6px;
    }
    .plusBtn{
      width: 62px;
      height: 62px;
      border-radius: 14px;
      border: 4px solid #000;
      background: var(--purple);
      display:flex;
      justify-content:center;
      align-items:center;
      box-shadow: var(--shadowSmall);
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .plusBtn span{
      color:#fff;            /* الزائد أبيض */
      font-size: 40px;
      font-weight: 900;
      line-height: 1;
      transform: translateY(-1px);
    }
    .plusBtn:active{ transform: translateY(1px); }

    /* ✅ منطقة الأزرار بأسفل: (منزل يسار) + (ابدأ اللعب بالوسط) */
    .actionArea{
      margin-top: auto; /* يخليه ينزل لتحت تلقائيًا مع زيادة المحتوى */
      padding: 18px 0 calc(18px + env(safe-area-inset-bottom));
      position: relative;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .homeBtn{
      position:absolute;
      left: 0;
      bottom: calc(18px + env(safe-area-inset-bottom));
      width: var(--homeSize);
      height: var(--homeSize);
      border-radius: 18px;
      border: 4px solid #000;
      background: #bfe3ff;
      box-shadow: var(--shadowSmall);
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .homeBtn svg{
      width: 34px;
      height: 34px;
      fill: #111;
    }
    .homeBtn:active{ transform: translateY(1px); }

    .startBtn{
      border: 4px solid #000;
      background: var(--yellow);
      color:#111;              /* النص أسود */
      font-weight: 900;
      font-size: 24px;
      border-radius: 22px;

      /* ✅ تصغير أطراف الزر ليكون ملائم للعبارة */
      padding: 10px 22px;

      /* ✅ عرض أصغر ومناسب لعبارة "ابدأ اللعب" */
      min-width: 200px;
      width: auto;
      max-width: 72%;

      box-shadow: var(--shadow);
      cursor:pointer;

      /* ✅ حماية من تداخل زر المنزل */
      margin-left: calc(var(--homeSize) + var(--homeGap));
      -webkit-tap-highlight-color: transparent;
    }
    .startBtn:active{ transform: translateY(1px); }

    @media (max-width: 360px){
      h2{ font-size: 20px; }
      .nameInput{ font-size: 18px; }
      .startBtn{ font-size: 22px; min-width: 190px; padding: 10px 18px; }
      .plusBtn{ width: 58px; height: 58px; }
      .plusBtn span{ font-size: 38px; }
      .homeBtn{ width: 58px; height: 58px; }
      .homeBtn svg{ width: 30px; height: 30px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="frame">
      <div class="topRow">
        <div class="title">لعبة برا السالفة</div>
        <img class="logo" src="logo.PNG" alt="logo">
      </div>

      <h2>ادخل اسماء اللاعبين :</h2>

      <div class="inputs" id="inputs">
        <input class="nameInput" type="text" placeholder="اللاعب رقم 1" />
        <input class="nameInput" type="text" placeholder="اللاعب رقم 2" />
        <input class="nameInput" type="text" placeholder="اللاعب رقم 3" />
      </div>

      <div class="plusWrap">
        <div class="plusBtn" id="addBtn" aria-label="إضافة لاعب">
          <span>+</span>
        </div>
      </div>

      <div class="actionArea">
        <!-- ✅ زر الرئيسية داخل الأسفل اليسار (بدون تداخل) -->
        <button class="homeBtn" id="homeBtn" title="الرئيسية" aria-label="الرئيسية" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/>
          </svg>
        </button>

        <button class="startBtn" id="startBtn" type="button">ابدأ اللعب</button>
      </div>
    </div>
  </div>

  <script>
    // يخلي النص (placeholder) يختفي فور الضغط على المربع
    document.addEventListener('focusin', (e) => {
      if (e.target.classList && e.target.classList.contains('nameInput')) {
        e.target.dataset.ph = e.target.placeholder;
        e.target.placeholder = '';
      }
    });
    document.addEventListener('focusout', (e) => {
      if (e.target.classList && e.target.classList.contains('nameInput')) {
        if (!e.target.value.trim()) {
          e.target.placeholder = e.target.dataset.ph || '';
        }
      }
    });

    const inputsWrap = document.getElementById('inputs');
    const addBtn = document.getElementById('addBtn');
    const startBtn = document.getElementById('startBtn');
    const homeBtn = document.getElementById('homeBtn');

    function nextIndex(){
      return inputsWrap.querySelectorAll('.nameInput').length + 1;
    }

    // ✅ إضافة مربع جديد بدون حذف الأسماء السابقة
    addBtn.addEventListener('click', () => {
      const i = document.createElement('input');
      i.className = 'nameInput';
      i.type = 'text';
      i.placeholder = `اللاعب رقم ${nextIndex()}`;
      inputsWrap.appendChild(i);
      i.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => i.focus(), 200);
    });

    function clearGameState(){
      // ✅ نمسح كل بيانات اللعبة المهمة
      sessionStorage.removeItem('players');
      sessionStorage.removeItem('bara_players'); // احتياط قديم
      sessionStorage.removeItem('singleState');

      sessionStorage.removeItem('categoryKey');
      sessionStorage.removeItem('categoryLabel');

      sessionStorage.removeItem('bara_category_id');
      sessionStorage.removeItem('bara_category_label');
      sessionStorage.removeItem('bara_step');
    }

    homeBtn.addEventListener('click', () => {
      clearGameState();
      window.location.href = 'index.html';
    });

    startBtn.addEventListener('click', () => {
      const names = Array.from(inputsWrap.querySelectorAll('.nameInput'))
        .map(i => i.value.trim())
        .filter(Boolean);

      if (names.length < 3) {
        alert('لازم تدخل 3 أسماء على الأقل');
        return;
      }

      // ✅ لازم يكون فيه كتاغوري مختار من صفحة categories
      const cat = sessionStorage.getItem('categoryKey') || sessionStorage.getItem('bara_category_id');
      if (!cat) {
        // يرجعه للكتاغوريات إذا ما اختار
        window.location.href = 'categories.html';
        return;
      }

      // ✅ نخزن الأسماء بالمفتاح اللي يحتاجه ملف single_gamev1.html
      sessionStorage.setItem('players', JSON.stringify(names));

      // (اختياري/احتياط) نخزنها بالمفتاح القديم لو كان عندك أجزاء تستخدمه
      sessionStorage.setItem('bara_players', JSON.stringify(names));

      // ✅ نوديه صفحة اللعب
      window.location.href = 'single_gamev1.html';
    });
  </script>
</body>
</html>
