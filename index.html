<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة برا السالفة</title>

<style>
@font-face{
  font-family:'AA';
  src:url('AA-GALAXY.ttf') format('truetype');
}

*{
  box-sizing:border-box;
  font-family:'AA', sans-serif;
}

body{
  margin:0;
  background:#e9e2d2;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.app{
  width:100%;
  max-width:430px;
  min-height:94vh;
  background:#e9e2d2;
  border:6px solid #5f6f2f;
  border-radius:30px;
  padding:22px 18px 26px;
  position:relative;
}

/* الشعار */
.logo{
  position:absolute;
  top:18px;
  left:18px;
}
.logo img{
  width:64px;
}

/* العنوان */
h1{
  margin-top:78px;
  margin-bottom:28px;
  text-align:center;
  font-size:30px;
  color:#000;
}

/* الكرت */
.card{
  background:#7a8a4a;
  border-radius:28px;
  padding:28px 20px;
  box-shadow:0 10px 0 rgba(0,0,0,.18);
}

.btn{
  width:100%;
  background:#f1eee6;
  border:4px solid #000;
  border-radius:30px;
  padding:18px 0;
  font-size:22px;
  margin-bottom:20px;
  cursor:pointer;
  color:#000;
}

.btn.active{
  background:#d9f1ff;
}

.start{
  margin-top:28px;
  background:#ffd400;
  box-shadow:0 8px 0 rgba(0,0,0,.25);
}

.start:disabled{
  background:#ddd;
  box-shadow:none;
  cursor:not-allowed;
}

/* التعليمات */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  width:90%;
  max-width:400px;
  background:#7a8a4a;
  border-radius:30px;
  padding:26px 22px;
}

.modal h2{
  background:#e9e2d2;
  padding:14px;
  border-radius:20px;
  text-align:center;
  margin-bottom:20px;
  color:#000;
}

.modal p{
  color:#fff;
  line-height:1.9;
  font-size:15px;
}

.back{
  margin-top:24px;
  width:100%;
  background:#ffd400;
  border:4px solid #000;
  border-radius:30px;
  padding:16px 0;
  font-size:22px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="app">

  <div class="logo">
    <img src="logo.PNG">
  </div>

  <h1>لعبة برا السالفة</h1>

  <div class="card">
    <button class="btn" id="single">جهاز واحد</button>
    <button class="btn" id="multi">أجهزة متعددة</button>
    <button class="btn" id="rules">تعليمات اللعبة</button>
  </div>

  <button class="btn start" id="start" disabled>ابدأ اللعب</button>
</div>

<!-- التعليمات -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h2>التعليمات</h2>

    <p><strong>طريقة اللعب:</strong><br>
    تعتمد اللعبة على سالفة مخفية، لاعب واحد ما يعرفها والباقين يعرفونها.</p>

    <p><strong>الأدوار:</strong><br>
    كل لاعب يسأل أو يجاوب، واللي يعرف السالفة يجاوب بدون ما يفضحها.</p>

    <p><strong>التصويت:</strong><br>
    بعد انتهاء الجولة يتم التصويت: من برا السالفة؟</p>

    <p><strong>طرق اللعب:</strong><br>
    جهاز واحد أو أجهزة متعددة.</p>

    <button class="back" id="close">رجوع</button>
  </div>
</div>

<script>
let mode=null;
const single=document.getElementById('single');
const multi=document.getElementById('multi');
const start=document.getElementById('start');

single.onclick=()=>{
  mode='single';
  single.classList.add('active');
  multi.classList.remove('active');
  start.disabled=false;
};

multi.onclick=()=>{
  mode='multi';
  multi.classList.add('active');
  single.classList.remove('active');
  start.disabled=false;
};

start.onclick=()=>{
  if(mode==='single') location.href='single.html';
  if(mode==='multi') location.href='multi.html';
};

document.getElementById('rules').onclick=()=>{
  document.getElementById('modal').style.display='flex';
};
document.getElementById('close').onclick=()=>{
  document.getElementById('modal').style.display='none';
};
</script>

</body>
</html>
