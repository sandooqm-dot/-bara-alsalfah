<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لعبة برا السالفة</title>

  <!-- خط مجاني قريب من الشكل -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#e9e4d6;
      --olive:#3f4a1f;
      --panel:#6e7b46;
      --black:#111;
      --yellow:#ffd21a;
      --shadow: 0 10px 0 rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"Baloo Bhaijaan 2",Arial,sans-serif;color:#111}
    .wrap{min-height:100svh;display:flex;justify-content:center;padding:18px 14px 22px}
    .card{width:min(560px,100%);position:relative}

    .top{position:relative;padding:8px 6px 0;min-height:96px}
    .logo{
      position:absolute;left:6px;top:6px;
      width:78px;height:78px;object-fit:contain;
      pointer-events:none;user-select:none;
    }
    h1{
      margin:78px 0 16px;
      text-align:center;
      color:var(--olive);
      font-weight:900;
      font-size:44px;
      padding:0 86px;
    }

    .panel{
      background:var(--panel);
      border-radius:28px;
      padding:22px 16px 24px;
      margin:0 6px 18px;
    }

    .btn{
      width:100%;
      border:5px solid var(--black);
      border-radius:999px;
      padding:16px 14px;
      font-weight:900;
      font-size:34px;
      cursor:pointer;
      box-shadow:var(--shadow);
      transition:transform .08s ease, filter .12s ease, background .12s ease;
      background:var(--bg);
      margin:18px 0;
    }
    .btn:active{transform:translateY(2px)}

    .btnSelected{
      background:#d8f0ff;
      filter:saturate(1.05) brightness(1.02);
    }

    .btnStart{
      background:var(--yellow);
      font-size:40px;
      margin-top:8px;
    }

    .btnDisabled{
      opacity:.55;
      cursor:not-allowed;
      filter:grayscale(.15);
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <div class="top">
        <img class="logo" src="logo.PNG" alt="logo">
        <h1>لعبة برا السالفة</h1>
      </div>

      <div class="panel">
        <!-- أزرار اختيار النمط فقط -->
        <button id="oneBtn" class="btn" type="button">جهاز واحد</button>
        <button id="multiBtn" class="btn" type="button">اجهزة متعددة</button>

        <!-- زر ابدأ اللعب (هو اللي ينقل حسب النمط) -->
        <button id="startBtn" class="btn btnStart" type="button">ابدأ اللعب</button>

        <!-- تعليمات اللعبة -->
        <button id="howBtn" class="btn" type="button">تعليمات اللعبة</button>
      </div>
    </div>
  </div>

  <script>
    const oneBtn = document.getElementById('oneBtn');
    const multiBtn = document.getElementById('multiBtn');
    const startBtn = document.getElementById('startBtn');
    const howBtn = document.getElementById('howBtn');

    // افتراضي: جهاز واحد
    let mode = localStorage.getItem('bara_mode_select') || 'one';

    function paint(){
      if(mode === 'multi'){
        multiBtn.classList.add('btnSelected');
        oneBtn.classList.remove('btnSelected');
      }else{
        oneBtn.classList.add('btnSelected');
        multiBtn.classList.remove('btnSelected');
      }
    }

    oneBtn.addEventListener('click', ()=>{
      mode = 'one';
      localStorage.setItem('bara_mode_select', mode);
      paint();
    });

    multiBtn.addEventListener('click', ()=>{
      mode = 'multi';
      localStorage.setItem('bara_mode_select', mode);
      paint();
    });

    // زر ابدأ اللعب هو اللي يفتح الصفحة حسب النمط
    startBtn.addEventListener('click', ()=>{
      if(mode === 'multi'){
        location.href = 'players.html';
      }else{
        location.href = 'single.html';
      }
    });

    howBtn.addEventListener('click', ()=>{
      location.href = 'how.html';
    });

    paint();
  </script>
</body>
</html>
