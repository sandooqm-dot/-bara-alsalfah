<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة برا السالفة</title>

<!-- خط بديل قريب من Greta Arabic -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap" rel="stylesheet">

<style>
/* لو توفر Greta Arabic عندك محليًا */
@font-face{
  font-family:'GretaArabic';
  src:url('GretaArabicAR-LT-Black.ttf');
}

*{
  box-sizing:border-box;
  font-family:'GretaArabic','Cairo',sans-serif;
}

body{
  margin:0;
  background:#efe7d6;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* الإطار */
.app{
  width:100%;
  max-width:430px;
  min-height:94vh;
  background:#efe7d6;
  border:4px solid #6b7a3a;
  border-radius:28px;
  padding:22px 18px 28px;
  position:relative;
}

/* الشعار */
.logo{
  position:absolute;
  top:16px;
  left:16px;
}
.logo img{
  width:56px;
}

/* العنوان */
h1{
  margin-top:78px;
  margin-bottom:26px;
  text-align:center;
  font-size:28px;
  color:#000;
}

/* بطاقة الخيارات */
.card{
  background:#7b8b4b;
  border-radius:22px;
  padding:22px 18px;
  box-shadow:0 6px 0 rgba(0,0,0,.18);
}

/* الأزرار */
.btn{
  width:100%;
  background:#f3efe5;
  border:2.5px solid #000;
  border-radius:22px;
  padding:14px 0;
  font-size:19px;
  margin-bottom:14px;
  color:#000;
  cursor:pointer;
  transition:.15s;
}

.btn.active{
  background:#dff2ff;
}

.start{
  margin-top:24px;
  background:#ffd400;
  font-size:22px;
  box-shadow:0 6px 0 rgba(0,0,0,.25);
}

.start:disabled{
  background:#e0e0e0;
  box-shadow:none;
  cursor:not-allowed;
}

/* نافذة التعليمات */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:10;
}

.modal-box{
  width:90%;
  max-width:400px;
  background:#7b8b4b;
  border-radius:26px;
  padding:24px 22px;
}

.modal-box h2{
  background:#efe7d6;
  border-radius:18px;
  padding:12px;
  text-align:center;
  margin-bottom:18px;
  font-size:22px;
  color:#000;
}

.modal-box p{
  color:#fff;
  font-size:15px;
  line-height:1.9;
  margin-bottom:12px;
}

.back{
  margin-top:18px;
  width:100%;
  background:#ffd400;
  border:2.5px solid #000;
  border-radius:22px;
  padding:14px 0;
  font-size:22px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="app">

  <div class="logo">
    <img src="logo.PNG" alt="">
  </div>

  <h1>لعبة برا السالفة</h1>

  <div class="card">
    <button class="btn" id="single">جهاز واحد</button>
    <button class="btn" id="multi">أجهزة متعددة</button>
    <button class="btn" id="rules">تعليمات اللعبة</button>
  </div>

  <button class="btn start" id="start" disabled>ابدأ اللعب</button>

</div>

<!-- التعليمات -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h2>التعليمات</h2>

    <p><strong>طريقة اللعب:</strong><br>
    تعتمد اللعبة على سالفة/موضوع مخفي، لاعب واحد لا يعرفه والباقين يعرفونه.</p>

    <p><strong>الأدوار:</strong><br>
    كل لاعب يسأل أو يجاوب، واللي يعرف السالفة يجاوب بدون ما يفضحها.</p>

    <p><strong>التصويت:</strong><br>
    بعد انتهاء الجولة يتم التصويت: من برا السالفة؟</p>

    <button class="back" id="close">رجوع</button>
  </div>
</div>

<script>
let mode=null;
const single=document.getElementById('single');
const multi=document.getElementById('multi');
const start=document.getElementById('start');

single.onclick=()=>{
  mode='single';
  single.classList.add('active');
  multi.classList.remove('active');
  start.disabled=false;
};

multi.onclick=()=>{
  mode='multi';
  multi.classList.add('active');
  single.classList.remove('active');
  start.disabled=false;
};

start.onclick=()=>{
  if(mode==='single') location.href='single.html';
  if(mode==='multi') location.href='multi.html';
};

document.getElementById('rules').onclick=()=>{
  document.getElementById('modal').style.display='flex';
};
document.getElementById('close').onclick=()=>{
  document.getElementById('modal').style.display='none';
};
</script>

</body>
</html>
