<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لعبة برا السالفة</title>

  <!-- خط مجاني قريب من شكل Tufuli -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#e9e4d6;
      --olive:#3f4a1f;
      --panel:#6e7b46;
      --black:#111;
      --yellow:#ffd21a;
      --blue:#bfe4ff;
      --shadow: 0 10px 0 rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"Baloo Bhaijaan 2",Arial,sans-serif;color:#111}
    .wrap{min-height:100svh;display:flex;justify-content:center;padding:18px 14px 22px}
    .card{width:min(560px,100%);position:relative}

    .top{position:relative;padding:8px 6px 0;min-height:96px}
    .logo{
      position:absolute;left:6px;top:6px;
      width:78px;height:78px;object-fit:contain;
      pointer-events:none;user-select:none;
    }
    h1{
      margin:78px 0 16px;
      text-align:center;
      color:var(--olive);
      font-weight:900;
      font-size:44px;
      letter-spacing:.2px;
      padding:0 86px; /* يمنع تداخل مع اللوجو */
    }

    .panel{
      background:var(--panel);
      border-radius:28px;
      padding:22px 16px 22px;
      margin:0 6px 18px;
    }

    .btn{
      width:100%;
      border:5px solid var(--black);
      border-radius:999px;
      padding:16px 14px;
      font-weight:900;
      font-size:34px;
      cursor:pointer;
      box-shadow:var(--shadow);
      transition:transform .08s ease, opacity .12s ease, filter .12s ease;
      background:var(--bg);
      margin:18px 0;
    }
    .btn:active{transform:translateY(2px)}
    .btnSecondary{background:var(--bg)}
    .btnOn{filter:saturate(1.1) brightness(1.02); outline:0}
    .btnHint{color:rgba(0,0,0,.55);font-weight:900;text-align:center;margin-top:10px;font-size:18px}

    .homeSpace{height:36px}
  </style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <div class="top">
        <img class="logo" src="logo.PNG" alt="logo">
        <h1>لعبة برا السالفة</h1>
      </div>

      <div class="panel">
        <button id="oneBtn" class="btn btnSecondary" type="button">جهاز واحد</button>

        <!-- حسب قواعدك: زر أجهزة متعددة يغيّر لونه فقط (ما ينقل) -->
        <button id="multiBtn" class="btn btnSecondary" type="button">اجهزة متعددة</button>
        <div class="btnHint">لتفعيل نمط اجهزة متعددة اضغط عليه ثم اضغط ابدأ اللعب</div>

        <button id="howBtn" class="btn btnSecondary" type="button">تعليمات اللعبة</button>
      </div>

      <div class="homeSpace"></div>
    </div>
  </div>

  <script>
    const oneBtn = document.getElementById('oneBtn');
    const multiBtn = document.getElementById('multiBtn');
    const howBtn = document.getElementById('howBtn');

    let mode = localStorage.getItem('bara_mode_select') || 'one';

    function paint(){
      if(mode === 'multi'){
        multiBtn.classList.add('btnOn');
        oneBtn.classList.remove('btnOn');
        multiBtn.style.background = '#d8f0ff';
        oneBtn.style.background = 'var(--bg)';
      }else{
        oneBtn.classList.add('btnOn');
        multiBtn.classList.remove('btnOn');
        oneBtn.style.background = '#d8f0ff';
        multiBtn.style.background = 'var(--bg)';
      }
    }

    // اختيار جهاز واحد: ينقل مباشرة
    oneBtn.addEventListener('click', ()=>{
      mode = 'one';
      localStorage.setItem('bara_mode_select', mode);
      paint();
      // يروح لصفحة ادخال اللاعبين (جهاز واحد)
      location.href = 'single.html';
    });

    // اختيار أجهزة متعددة: يغير اللون فقط (بدون انتقال)
    multiBtn.addEventListener('click', ()=>{
      mode = 'multi';
      localStorage.setItem('bara_mode_select', mode);
      paint();
    });

    // تعليمات: نفس نظامك (صفحة/نافذة)
    howBtn.addEventListener('click', ()=>{
      location.href = 'how.html';
    });

    paint();
  </script>
</body>
</html>
