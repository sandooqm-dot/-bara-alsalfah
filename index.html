<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لعبة برا السالفة</title>

  <!-- خط مجاني قريب من الشكل -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#e9e4d6;        /* خلفية الصفحة */
      --olive:#3f4a1f;     /* لون العنوان */
      --panel:#6e7b46;     /* اللوحة الخضراء */
      --cream:#ebe6d9;     /* لون أزرار الجهاز/التعليمات */
      --black:#111;
      --yellow:#ffd21a;    /* زر ابدأ اللعب */
      --shadow: 0 12px 0 rgba(0,0,0,.22);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      font-family:"Baloo Bhaijaan 2",Arial,sans-serif;
      color:#111;
    }

    .wrap{
      min-height:100svh;
      display:flex;
      justify-content:center;
      padding:18px 14px 22px;
    }

    .card{
      width:min(560px,100%);
      position:relative;
    }

    .top{
      position:relative;
      padding:8px 6px 0;
      min-height:96px;
    }

    .logo{
      position:absolute;
      left:6px;
      top:6px;
      width:78px;
      height:78px;
      object-fit:contain;
      pointer-events:none;
      user-select:none;
    }

    h1{
      margin:78px 0 16px;
      text-align:center;
      color:var(--olive);
      font-weight:900;
      font-size:44px;
      padding:0 86px;
    }

    .panel{
      background:var(--panel);
      border-radius:28px;
      padding:26px 18px 28px;
      margin:0 6px 18px;
    }

    /* ✅ أزرار مثل الصورة */
    .btn{
      width:100%;
      border:6px solid var(--black);
      border-radius:999px;
      height:88px;
      padding:0 16px;
      font-weight:900;
      font-size:36px;
      cursor:pointer;
      box-shadow:var(--shadow);
      transition:transform .08s ease, filter .12s ease, background .12s ease, box-shadow .12s ease;
      background:var(--cream);
      margin:18px 0;
      display:flex;
      align-items:center;
      justify-content:center;
      letter-spacing:.2px;
    }

    .btn:active{ transform:translateY(2px); }

    /* تحديد النمط (قريب من المطلوب: إطار/تظليل بسيط) */
    .btnSelected{
      box-shadow: 0 12px 0 rgba(0,0,0,.22), 0 0 0 5px rgba(255,255,255,.35) inset;
      filter:saturate(1.02) brightness(1.01);
    }

    /* زر ابدأ اللعب الأصفر مثل الصورة */
    .btnStart{
      background:var(--yellow);
      font-size:44px;
      height:92px;
      margin-top:22px;
    }

    .btnDisabled{
      opacity:.55;
      cursor:not-allowed;
      filter:grayscale(.15);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <img class="logo" src="logo.PNG" alt="logo">
        <h1>لعبة برا السالفة</h1>
      </div>

      <div class="panel">
        <!-- ✅ الترتيب مثل الصورة: جهاز واحد / اجهزة متعددة / تعليمات / ابدأ اللعب -->
        <button id="oneBtn" class="btn" type="button">جهاز واحد</button>
        <button id="multiBtn" class="btn" type="button">اجهزة متعددة</button>
        <button id="howBtn" class="btn" type="button">تعليمات اللعبة</button>
        <button id="startBtn" class="btn btnStart" type="button">ابدأ اللعب</button>
      </div>
    </div>
  </div>

  <script>
    const oneBtn = document.getElementById('oneBtn');
    const multiBtn = document.getElementById('multiBtn');
    const startBtn = document.getElementById('startBtn');
    const howBtn = document.getElementById('howBtn');

    // افتراضي: جهاز واحد
    let mode = localStorage.getItem('bara_mode_select') || 'one';

    function paint(){
      if(mode === 'multi'){
        multiBtn.classList.add('btnSelected');
        oneBtn.classList.remove('btnSelected');
      }else{
        oneBtn.classList.add('btnSelected');
        multiBtn.classList.remove('btnSelected');
      }
    }

    oneBtn.addEventListener('click', ()=>{
      mode = 'one';
      localStorage.setItem('bara_mode_select', mode);
      paint();
    });

    multiBtn.addEventListener('click', ()=>{
      mode = 'multi';
      localStorage.setItem('bara_mode_select', mode);
      paint();
    });

    // زر ابدأ اللعب هو اللي ينقل حسب النمط
    startBtn.addEventListener('click', ()=>{
      if(mode === 'multi'){
        location.href = 'players.html';
      }else{
        location.href = 'single.html';
      }
    });

    howBtn.addEventListener('click', ()=>{
      location.href = 'how.html';
    });

    paint();
  </script>
</body>
</html>
