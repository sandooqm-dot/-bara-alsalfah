<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>انضمام</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{--bg:#e9e4d6;--olive:#4e5a2a;--panel:#6e7b46;--black:#111;--yellow:#ffd21a;--btnShadow:rgba(0,0,0,.22)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"Baloo Bhaijaan 2",Arial,sans-serif;color:var(--black)}
    .page{min-height:100svh;display:flex;justify-content:center;align-items:center;padding:18px}
    .card{
      width:min(520px,100%);
      border:6px solid var(--olive);
      border-radius:26px;
      padding:18px 16px;
      background:transparent;
    }
    h1{text-align:center;color:var(--olive);font-size:44px;margin:6px 0 10px;font-weight:900}
    .panel{background:var(--panel);border-radius:22px;padding:18px;border:0;box-shadow:0 10px 0 rgba(0,0,0,.12)}
    .label{color:#fff;text-align:center;font-size:26px;font-weight:900;margin-bottom:10px}
    input{
      width:100%;
      background:#fff;
      border-radius:999px;
      border:5px solid rgba(0,0,0,.35);
      padding:14px 16px;
      font-size:28px;
      font-weight:900;
      text-align:center;
      outline:none;
    }
    button{
      width:100%;
      background:var(--yellow);
      color:#000;
      border:6px solid var(--black);
      border-radius:999px;
      font-size:40px;
      font-weight:900;
      padding:14px 14px;
      box-shadow:0 12px 0 var(--btnShadow);
      cursor:pointer;
      margin-top:14px;
      transition:opacity .12s ease;
    }
    button:active{transform:translateY(2px)}
    button:disabled{opacity:.6;cursor:not-allowed}
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>انضم للغرفة</h1>
      <div class="panel">
        <div class="label">اكتب اسمك ثم انضم</div>
        <input id="name" placeholder="اسم اللاعب" autocomplete="off" />
        <button id="joinBtn" type="button">انضمام</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import {
      getFirestore, doc, setDoc, updateDoc,
      serverTimestamp, arrayUnion
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    // ✅ بيانات مشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyDQx4gJZMHNWQBeMYsU4fknZHG0WFJ_ckc",
      authDomain: "bara-alsalfah.firebaseapp.com",
      projectId: "bara-alsalfah",
      storageBucket: "bara-alsalfah.firebasestorage.app",
      messagingSenderId: "658748312832",
      appId: "1:658748312832:web:3e0c970ba54bb25c0437e5",
      measurementId: "G-82ZV2RDDDP"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(location.search);
    const room = (params.get('room') || '').trim();

    const nameInput = document.getElementById('name');
    const joinBtn = document.getElementById('joinBtn');

    function safeName(raw){
      // تنظيف بسيط (بدون تغيير الشكل العام)
      return String(raw || '')
        .replace(/\s+/g,' ')
        .trim();
    }

    async function doJoin(){
      const n = safeName(nameInput.value);

      if(!room){
        alert('رمز الغرفة غير موجود.');
        return;
      }
      if(!n){
        nameInput.focus();
        return;
      }

      joinBtn.disabled = true;

      try{
        const roomRef = doc(db, "bara_rooms", room);

        // تأكد أن الوثيقة موجودة (merge)
        await setDoc(roomRef, {
          room,
          status: "lobby",
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        }, { merge: true });

        // إضافة الاسم لقائمة اللاعبين بدون تكرار (arrayUnion)
        await updateDoc(roomRef, {
          players: arrayUnion(n),
          updatedAt: serverTimestamp()
        });

        // ✅ كل لاعب يشوف اسمه في جهازه (متطلبك)
        localStorage.setItem(`bara_room_${room}_myname`, n);

        // انتقال لصفحة الانتظار
        location.href = `waiting.html?room=${encodeURIComponent(room)}`;

      }catch(err){
        console.error(err);
        alert('صار خطأ في الانضمام. حاول مرة ثانية.');
        joinBtn.disabled = false;
      }
    }

    joinBtn.addEventListener('click', doJoin);

    // ✅ Enter = انضمام
    nameInput.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        doJoin();
      }
    });
  </script>
</body>
</html>
