<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>انضم للعبة</title>

  <style>
    :root{
      --bg:#e9e3d6;
      --green:#3f5b2a;
      --green2:#6e8554;
      --yellow:#f2c300;
      --blue:#bfe3ff;
      --text:#1a1a1a;
      --muted:#9a9a9a;

      --shadow: 0 10px 0 rgba(0,0,0,0.18);
      --shadowSmall: 0 8px 0 rgba(0,0,0,0.18);

      --homeSide: 18px;
      --homeBottom: calc(18px + env(safe-area-inset-bottom));
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--text);
    }

    .page{
      min-height: 100vh;
      padding: 14px 12px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .frame{
      width: min(520px, 100%);
      background: var(--bg);
      border: 6px solid var(--green);
      border-radius: 26px;
      padding: 18px 16px 24px;
      position: relative;

      min-height: calc(100vh - 28px);
      display:flex;
      flex-direction:column;
      gap: 18px;
    }

    .topRow{
      position: relative;
      min-height: 100px;
      margin-bottom: 4px;
      padding-left: 118px;
    }

    .logo{
      position:absolute;
      left: 10px;
      top: 2px;
      width: 98px;
      height: 98px;
      object-fit: contain;
      opacity: 0.98;
      pointer-events:none;
    }

    .mainTitle{
      margin: 28px 0 0;
      text-align:center;
      color: var(--green);
      font-size: 42px;
      font-weight: 1000;
      letter-spacing: .2px;
    }

    .nameInput{
      width: 100%;
      padding: 16px 14px;
      border: 5px solid var(--green2);
      border-radius: 18px;
      background:#fff;
      font-size: 22px;
      font-weight: 900;
      color:#111;
      outline:none;
      text-align:center;
    }
    .nameInput::placeholder{
      color: var(--muted);
      font-weight: 900;
      font-size: 18px;
      opacity: 0.75;
    }

    /* زر جاهز */
    .readyBtn{
      border: 5px solid #000;
      background: var(--yellow);
      color:#111;
      font-weight: 1000;
      font-size: 40px;
      border-radius: 26px;
      padding: 12px 26px;
      width: min(320px, 85%);
      margin: 0 auto;
      box-shadow: var(--shadow);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .readyBtn:active{ transform: translateY(1px); box-shadow: 0 9px 0 rgba(0,0,0,0.18); }

    /* زر الشراء */
    .buyBtn{
      border: 5px solid #000;
      background: var(--blue);
      color:#111;
      font-weight: 1000;
      font-size: 28px;
      border-radius: 22px;
      padding: 12px 22px;
      width: min(360px, 92%);
      margin: 0 auto;
      box-shadow: var(--shadowSmall);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .buyBtn:active{ transform: translateY(1px); box-shadow: 0 7px 0 rgba(0,0,0,0.18); }

    /* زر الرئيسية */
    .homeBtn{
      position:absolute;
      left: var(--homeSide);
      bottom: var(--homeBottom);
      width: 70px;
      height: 70px;
      border-radius: 22px;
      border: 5px solid #000;
      background: #bfe3ff;
      box-shadow: var(--shadowSmall);
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      z-index: 30;
      -webkit-tap-highlight-color:transparent;
    }
    .homeBtn svg{ width:38px; height:38px; fill:#111; }

    /* شاشة الانتظار */
    .waitBox{
      width: 100%;
      padding: 20px 14px;
      border: 6px solid var(--green);
      border-radius: 22px;
      background: rgba(63,91,42,0.75);
      color:#fff;
      text-align:center;
      font-weight: 1000;
      font-size: 30px;
      box-shadow: inset 0 0 0 0 rgba(0,0,0,0);
      min-height: 92px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .screen{ display:none; }
    .screen.show{ display:block; }

    @media (max-width: 360px){
      .mainTitle{ font-size: 38px; }
      .readyBtn{ font-size: 36px; }
      .buyBtn{ font-size: 26px; }
      .logo{ width: 90px; height: 90px; }
      .homeBtn{ width: 66px; height: 66px; }
      .homeBtn svg{ width: 36px; height: 36px; }
      .waitBox{ font-size: 26px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="frame">
      <div class="topRow">
        <img class="logo" src="logo.PNG" alt="logo">
        <div class="mainTitle">لعبة برا السالفة</div>
      </div>

      <!-- شاشة الإدخال -->
      <div class="screen show" id="screenJoin">
        <input id="playerName" class="nameInput" type="text" placeholder="اكتب اسمك هنا" />

        <button class="readyBtn" id="readyBtn">جاهز</button>

        <button class="buyBtn" id="buyBtn">للشراء اللعبة اضغط هنا</button>
      </div>

      <!-- شاشة الانتظار -->
      <div class="screen" id="screenWait">
        <div class="waitBox" id="waitText">بانتظار مقدم اللعبة…</div>
      </div>

      <div class="homeBtn" id="homeBtn" title="الرئيسية" aria-label="الرئيسية">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/>
        </svg>
      </div>
    </div>
  </div>

  <script>
    // Placeholder يختفي عند التركيز مثل بقية الصفحات
    const playerName = document.getElementById('playerName');
    document.addEventListener('focusin', (e) => {
      if (e.target === playerName) {
        e.target.dataset.ph = e.target.placeholder;
        e.target.placeholder = '';
      }
    });
    document.addEventListener('focusout', (e) => {
      if (e.target === playerName) {
        if (!e.target.value.trim()) {
          e.target.placeholder = e.target.dataset.ph || '';
        }
      }
    });

    const screenJoin = document.getElementById('screenJoin');
    const screenWait = document.getElementById('screenWait');
    const waitText = document.getElementById('waitText');

    const readyBtn = document.getElementById('readyBtn');
    const buyBtn = document.getElementById('buyBtn');
    const homeBtn = document.getElementById('homeBtn');

    // قراءة رقم الغرفة من الرابط
    const params = new URLSearchParams(location.search);
    const room = (params.get('room') || '').trim();

    if (!room) {
      alert('الرابط غير صحيح: رقم الغرفة غير موجود.');
      location.href = 'index.html';
    }

    // زر شراء يفتح المتجر
    buyBtn.addEventListener('click', () => {
      window.open('https://sandooq-m.com', '_blank');
    });

    // رجوع للرئيسية
    homeBtn.addEventListener('click', () => {
      location.href = 'index.html';
    });

    // حركة الانتظار المطلوبة (كلمات + نقاط ثم إعادة)
    const seq = [
      'بانتظار',
      'بانتظار مقدم',
      'بانتظار مقدم اللعبة',
      'بانتظار مقدم اللعبة.',
      'بانتظار مقدم اللعبة..',
      'بانتظار مقدم اللعبة...',
      ''
    ];
    let seqI = 0;
    let waitTimer = null;

    function startWaitAnimation(){
      if (waitTimer) clearInterval(waitTimer);
      seqI = 0;
      waitTimer = setInterval(() => {
        waitText.textContent = seq[seqI];
        seqI++;
        if (seqI >= seq.length) seqI = 0;
      }, 380);
    }

    // حفظ الاسم محلياً (ويستخدمه لاحقاً عند ربط Firebase)
    function saveLocal(name){
      const key = 'multi_joined_' + room;
      localStorage.setItem(key, name);
    }

    readyBtn.addEventListener('click', () => {
      const name = (playerName.value || '').trim();
      if (!name) {
        alert('اكتب اسمك أولاً');
        return;
      }

      saveLocal(name);

      // الانتقال لشاشة الانتظار
      screenJoin.classList.remove('show');
      screenWait.classList.add('show');
      startWaitAnimation();

      // 🔴 ملاحظة: إرسال الاسم للمقدم لحظيًا يحتاج Firebase
      // إذا عندك ملف Firebase في مجلد data أرسله لي وبأربطه مباشرة.
    });
  </script>
</body>
</html>
