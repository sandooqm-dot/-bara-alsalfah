<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>انضمام</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{--bg:#e9e4d6;--olive:#3f4a1f;--panel:#6e7b46;--black:#111;--yellow:#ffd21a;--blue:#bfe4ff}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"Baloo Bhaijaan 2",Arial,sans-serif;color:#111}
    .wrap{min-height:100svh;display:flex;justify-content:center;padding:18px 14px 22px}
    .card{width:min(560px,100%);position:relative}
    .top{position:relative;padding:8px 6px 0;min-height:96px}
    .logo{position:absolute;left:6px;top:6px;width:78px;height:78px;object-fit:contain;pointer-events:none}
    h1{margin:78px 0 16px;text-align:center;color:var(--olive);font-weight:900;font-size:44px;padding:0 86px}
    .panel{
      background:var(--panel);border-radius:28px;padding:18px 16px 16px;margin:0 6px 18px;
      min-height:62svh;display:flex;flex-direction:column;gap:14px
    }
    .panelTitle{color:#fff;font-weight:900;text-align:center;font-size:34px;margin-top:2px}
    .input{
      width:100%;
      background:var(--bg);
      border:5px solid var(--black);
      border-radius:999px;
      padding:14px 14px;
      font-weight:900;
      font-size:28px;
      text-align:center;
      outline:none;
      box-shadow:0 8px 0 rgba(0,0,0,.18);
    }
    .btn{
      width:100%;
      background:var(--yellow);
      border:5px solid var(--black);
      border-radius:999px;
      padding:16px 14px;
      font-weight:900;
      font-size:34px;
      cursor:pointer;
      box-shadow:0 10px 0 rgba(0,0,0,.18);
    }
    .btn:active{transform:translateY(2px)}
    .hint{color:rgba(255,255,255,.8);font-weight:900;text-align:center;font-size:20px}
    .homeBtn{
      position:fixed;left:14px;bottom:14px;width:64px;height:64px;border-radius:18px;
      border:5px solid var(--black);background:var(--blue);box-shadow:0 10px 0 rgba(0,0,0,.18);
      display:grid;place-items:center;z-index:40;cursor:pointer;
    }
    .homeBtn svg{width:34px;height:34px}
  </style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <div class="top">
        <img class="logo" src="logo.PNG" alt="logo">
        <h1>الانضمام للغرفة</h1>
      </div>

      <div class="panel">
        <div class="panelTitle">اكتب اسمك</div>
        <input id="nameInput" class="input" placeholder="اسم اللاعب" autocomplete="off" />
        <div class="hint" id="roomHint"></div>
        <button id="joinBtn" class="btn" type="button">انضم</button>
      </div>
    </div>
  </div>

  <button class="homeBtn" type="button" onclick="location.href='index.html'" aria-label="الرئيسية">
    <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10.5L12 3l9 7.5"></path>
      <path d="M5 10v10h14V10"></path>
      <path d="M9 20v-7h6v7"></path>
    </svg>
  </button>

  <script>
    const params = new URLSearchParams(location.search);
    const room = params.get('room') || '';
    document.getElementById('roomHint').textContent = room ? ('رمز الغرفة: ' + room) : 'لا يوجد رمز غرفة';

    const KEY = 'bara_room_' + room + '_players';

    function getPlayers(){
      try{ return JSON.parse(localStorage.getItem(KEY) || '[]'); }catch(e){ return []; }
    }
    function setPlayers(arr){
      localStorage.setItem(KEY, JSON.stringify(arr));
    }

    const nameInput = document.getElementById('nameInput');
    const joinBtn = document.getElementById('joinBtn');

    function join(){
      const name = (nameInput.value || '').trim();
      if(!room) return alert('رمز الغرفة غير موجود');
      if(name.length < 2) return alert('اكتب اسم صحيح');

      const list = getPlayers();
      // منع تكرار نفس الاسم
      if(list.some(x => (x||'').trim() === name)) {
        alert('الاسم مستخدم، اختر اسم آخر');
        return;
      }
      list.push(name);
      setPlayers(list);

      // بعد الانضمام: ينتقل لصفحة انتظار/عرض بسيط
      location.href = 'waiting.html?room=' + room + '&name=' + encodeURIComponent(name);
    }

    joinBtn.addEventListener('click', join);
    nameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') join(); });
  </script>
</body>
</html>
