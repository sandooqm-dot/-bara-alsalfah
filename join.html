<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>انضمام</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#e9e4d6;
      --olive:#4e5a2a;
      --panel:#6e7b46;
      --black:#111;
      --yellow:#ffd21a;
      --btnShadow:rgba(0,0,0,.22);
      --purple:#6f3cff;
      --purpleShadow:rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"Baloo Bhaijaan 2",Arial,sans-serif;color:var(--black)}
    .page{min-height:100svh;display:flex;justify-content:center;align-items:center;padding:18px}
    .card{
      width:min(520px,100%);
      border:6px solid var(--olive);
      border-radius:26px;
      padding:18px 16px;
      position:relative;
    }
    h1{text-align:center;color:var(--olive);font-size:44px;margin:6px 0 10px;font-weight:900}
    .panel{background:var(--panel);border-radius:22px;padding:18px;border:0;box-shadow:0 10px 0 rgba(0,0,0,.12)}
    .label{color:#fff;text-align:center;font-size:26px;font-weight:900;margin-bottom:10px}
    input{
      width:100%;
      background:#fff;
      border-radius:999px;
      border:5px solid rgba(0,0,0,.35);
      padding:14px 16px;
      font-size:28px;
      font-weight:900;
      text-align:center;
      outline:none;
    }
    button{
      width:100%;
      background:var(--yellow);
      color:#000;
      border:6px solid var(--black);
      border-radius:999px;
      font-size:40px;
      font-weight:900;
      padding:14px 14px;
      box-shadow:0 12px 0 var(--btnShadow);
      cursor:pointer;
      margin-top:14px;
    }
    button:active{transform:translateY(2px)}
    .msg{color:#fff;text-align:center;font-weight:900;margin-top:10px;display:none}

    /* ✅ زر الشراء البنفسجي (مكان الدائرة الحمراء بالصورة) */
    .buyWrap{
      margin-top:16px;
      display:flex;
      justify-content:center;
    }
    .buyBtn{
      width:92%;
      background:var(--purple);
      color:#fff;
      border:6px solid var(--black);
      border-radius:999px;
      font-size:34px;
      font-weight:900;
      padding:16px 14px;
      box-shadow:0 12px 0 var(--purpleShadow);
      cursor:pointer;
      text-decoration:none;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:transform .05s ease, filter .15s ease;
      user-select:none;
    }
    .buyBtn:active{transform:translateY(2px)}
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>انضم للغرفة</h1>

      <div class="panel">
        <div class="label">اكتب اسمك ثم انضم</div>
        <input id="name" placeholder="اسم اللاعب" />
        <button id="joinBtn">انضمام</button>
        <div id="ok" class="msg">تم الانضمام ✅ ارجع للمضيف</div>
      </div>

      <!-- ✅ زر شراء اللعبة (يفتح في صفحة/تبويب جديد) -->
      <div class="buyWrap">
        <a class="buyBtn" href="https://sandooq-m.com/" target="_blank" rel="noopener noreferrer">
          لشراء اللعبة اضغط هنا
        </a>
      </div>

    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const room = params.get('room') || '';
    const name = document.getElementById('name');
    const ok = document.getElementById('ok');

    document.getElementById('joinBtn').addEventListener('click', ()=>{
      const n = (name.value||'').trim();
      if(!room || !n) return;

      const key = `bara_room_${room}_players`;
      let players = [];
      try{ players = JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){}
      if(!players.includes(n)) players.push(n);
      localStorage.setItem(key, JSON.stringify(players));

      ok.style.display='block';
      setTimeout(()=> ok.style.display='none', 1600);
    });
  </script>
</body>
</html>
