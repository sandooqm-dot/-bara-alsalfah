<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>اختيار الكتاغوري</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{--bg:#e9e4d6;--olive:#4e5a2a;--panel:#6e7b46;--card:#efe9dd;--black:#111;--yellow:#ffd21a;--btnShadow:rgba(0,0,0,.22);--sel:#d8f0ff}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"Baloo Bhaijaan 2",Arial,sans-serif;color:var(--black)}
    .page{min-height:100svh;display:flex;justify-content:center;padding:18px 16px 28px}
    .frame{width:min(560px,100%);border-radius:26px;border:6px solid var(--olive);padding:18px 14px 22px;position:relative}
    .logo{position:absolute;left:14px;top:10px;width:92px;height:auto;pointer-events:none}

    .home{
      position:fixed;left:16px;bottom:16px;width:64px;height:64px;border-radius:50%;
      background:#bfe0ff;border:5px solid var(--black);display:grid;place-items:center;z-index:10;
      box-shadow:0 10px 0 rgba(0,0,0,.14); cursor:pointer;
    }
    .home svg{width:34px;height:34px}

    h1{margin:56px 0 16px;text-align:center;font-size:44px;color:var(--olive);font-weight:900}

    .panel{width:92%;margin:0 auto;background:var(--panel);border-radius:26px;padding:18px 16px 18px;box-shadow:0 10px 0 rgba(0,0,0,.12)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .cat{
      background:var(--card);
      border:6px solid var(--black);
      border-radius:22px;
      box-shadow:0 10px 0 var(--btnShadow);
      padding:12px 10px 10px;
      cursor:pointer;
      min-height:150px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-weight:900;
      font-size:34px;
      text-align:center;
      position:relative;
    }
    .cat.selected{background:var(--sel)}
    .cat img{width:120px;height:78px;object-fit:contain;margin-top:6px}
    /* تكبير car و zoo شوي */
    .cat img.big{width:138px;height:86px}

    .startWrap{width:92%;margin:16px auto 0}
    .btnYellow{
      width:100%;
      background:var(--yellow);
      color:#000;
      border:6px solid var(--black);
      border-radius:999px;
      font-size:44px;
      font-weight:900;
      padding:16px 14px;
      box-shadow:0 12px 0 var(--btnShadow);
      cursor:pointer;
      opacity:.55;
      pointer-events:none;
    }
    .btnYellow.enabled{opacity:1;pointer-events:auto}
    .btnYellow:active{transform:translateY(2px)}

    @media (max-width:430px){
      h1{font-size:40px}
      .cat{font-size:30px}
      .cat img{width:110px}
      .btnYellow{font-size:40px}
    }
  </style>
</head>
<body>

  <button class="home" onclick="location.href='index.html'" aria-label="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10.5L12 3l9 7.5"></path>
      <path d="M5 10v10h14V10"></path>
      <path d="M9 20v-6h6v6"></path>
    </svg>
  </button>

  <div class="page">
    <div class="frame">
      <img class="logo" src="logo.PNG" alt="logo">
      <h1>اختر نوع السالفة</h1>

      <div class="panel">
        <div class="grid" id="grid">
          <div class="cat" data-key="eat">مأكولات<img src="eat.PNG" alt=""></div>
          <div class="cat" data-key="zoo">حيوانات<img class="big" src="zoo.PNG" alt=""></div>

          <div class="cat" data-key="play">لاعبين<img src="play.PNG" alt=""></div>
          <div class="cat" data-key="car">سيارات<img class="big" src="car.PNG" alt=""></div>

          <div class="cat" data-key="frot">فواكة وخضار<img src="frot.PNG" alt=""></div>
          <div class="cat" data-key="cola">مشروبات<img src="cola.PNG" alt=""></div>
        </div>
      </div>

      <div class="startWrap">
        <button id="goBtn" class="btnYellow" type="button">ابدأ اللعب</button>
      </div>

    </div>
  </div>

  <script>
    const cats = Array.from(document.querySelectorAll('.cat'));
    const goBtn = document.getElementById('goBtn');
    let selected = localStorage.getItem('bara_category') || '';

    function apply(){
      cats.forEach(c => c.classList.toggle('selected', c.dataset.key === selected));
      const ok = !!selected;
      goBtn.classList.toggle('enabled', ok);
    }

    cats.forEach(c=>{
      c.addEventListener('click', ()=>{
        selected = c.dataset.key;
        localStorage.setItem('bara_category', selected);
        apply();
      });
    });

    goBtn.addEventListener('click', ()=>{
      if(!selected) return;
      // مؤقتًا تروح لصفحة game.html (عدلها لاحقًا مع منطق اللعب)
      location.href = 'game.html';
    });

    apply();
  </script>

</body>
</html>
