<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>اختيار الكتاغوري</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{--bg:#e9e4d6;--olive:#3f4a1f;--panel:#6e7b46;--black:#111;--yellow:#ffd21a}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"Baloo Bhaijaan 2",Arial,sans-serif;color:#111}
    .wrap{min-height:100svh;display:flex;justify-content:center;padding:18px 14px 30px}
    .card{width:min(560px,100%);position:relative}
    .logo{position:absolute;left:8px;top:10px;width:92px;height:92px;object-fit:contain;pointer-events:none}
    h1{margin:40px 0 10px;text-align:center;color:var(--olive);font-weight:900;font-size:44px}

    .panel{background:var(--panel);border-radius:28px;padding:18px 18px;margin:0 8px 16px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}

    .cat{
      background:var(--bg);
      border:8px solid var(--black);
      border-radius:22px;
      padding:12px 10px 10px;
      box-shadow:0 10px 0 rgba(0,0,0,.18);
      cursor:pointer;
      transition:transform .08s ease;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:150px;
      text-align:center;
    }
    .cat:active{transform:translateY(2px)}
    .cat.active{
      background:#d7ebc8;
      box-shadow:0 10px 0 rgba(0,0,0,.18), 0 0 0 8px rgba(255,210,26,.65) inset;
    }

    .catTitle{font-weight:900;font-size:30px;margin-bottom:8px}

    .imgBox{
      width:180px;
      height:110px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .imgBox img{
      width:100%;
      height:100%;
      object-fit:contain;
      transform:scale(var(--imgScale, 1.15));
      transform-origin:center;
    }

    .cat[data-id="eat"]  { --imgScale:1.18; }
    .cat[data-id="zoo"]  { --imgScale:1.55; }
    .cat[data-id="play"] { --imgScale:0.90; }
    .cat[data-id="car"]  { --imgScale:1.65; }
    .cat[data-id="frot"] { --imgScale:1.22; }
    .cat[data-id="cola"] { --imgScale:1.28; }

    .startWrap{display:flex;justify-content:center;margin-top:18px}
    .btnStart{
      width:min(420px,100%);background:var(--yellow);
      border:5px solid var(--black);
      border-radius:999px;
      padding:16px 16px;
      font-weight:900;font-size:40px;
      box-shadow:0 10px 0 rgba(0,0,0,.18);
      cursor:pointer;
      opacity:.55;
      color:#000;
    }
    .btnStart.enabled{opacity:1}
    .btnStart:active{transform:translateY(2px)}
  </style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <img class="logo" src="logo.PNG">
    <h1>اختر نوع السالفة</h1>

    <div class="panel">
      <div id="grid" class="grid"></div>
      <div class="startWrap">
        <button id="startBtn" class="btnStart">ابدأ اللعب</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDQx4gJZMHNWQBeMYsU4fknZHG0WFJ_ckc",
  authDomain: "bara-alsalfah.firebaseapp.com",
  projectId: "bara-alsalfah",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const room = params.get("room");
const role = params.get("role");

if(role !== "host"){
  location.replace("waiting.html?room=" + room);
}

const cats = [
  { id:"eat", name:"مأكولات", img:"eat.PNG" },
  { id:"zoo", name:"حيوانات", img:"zoo.PNG" },
  { id:"play", name:"لاعبين", img:"play.PNG" },
  { id:"car", name:"سيارات", img:"car.PNG" },
  { id:"frot", name:"فواكة وخضار", img:"frot.PNG" },
  { id:"cola", name:"مشروبات", img:"cola.PNG" }
];

let selected = "";
const grid = document.getElementById("grid");
const startBtn = document.getElementById("startBtn");

cats.forEach(c=>{
  const d=document.createElement("div");
  d.className="cat";
  d.innerHTML=`<div class="catTitle">${c.name}</div><div class="imgBox"><img src="${c.img}"></div>`;
  d.onclick=()=>{
    selected=c.id;
    document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
    d.classList.add("active");
    startBtn.classList.add("enabled");
  };
  grid.appendChild(d);
});

startBtn.onclick=async()=>{
  if(!selected) return;
  const roomRef = doc(db,"bara_rooms",room);
  await updateDoc(roomRef,{
    status:"playing",
    cat:selected,
    startedAt:serverTimestamp()
  });
  location.href="game.html?room="+room+"&role=host";
};
</script>

</body>
</html>
