<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>اختيار نوع السالفة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --beige:#e9e1cf;
      --olive:#6f7a52;
      --olive-dark:#3f4e2c;
      --cream:#efe7d7;
      --yellow:#f3c515;
      --black:#111;
      --active:#d8efff; /* السماوي عند التفعيل */
      --home-blue:#86c9ff;
      --roof:#ff5b6a;

      /* =========================
         ✅ قائمة تعديل أحجام الصور
         عدّل الأرقام فقط
         ========================= */
      /* اسم الملف: eat.PNG */
      --img-eat-w: 100%;
      --img-eat-h: 100px;

      /* اسم الملف: zoo.PNG */
      --img-zoo-w: 100%;
      --img-zoo-h: 125px;

      /* اسم الملف: play.PNG */
      --img-play-w: 100%;
      --img-play-h: 95px;

      /* اسم الملف: car.PNG */
      --img-car-w: 100%;
      --img-car-h: 125px;

      /* اسم الملف: frot.PNG */
      --img-frot-w: 100%;
      --img-frot-h: 80px;

      /* اسم الملف: cola.PNG */
      --img-cola-w: 100%;
      --img-cola-h: 110px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      background:var(--beige);
      font-family:"Baloo Bhaijaan 2", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      display:flex;
      justify-content:center;
      align-items:stretch;
      padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
      color:#111;
    }

    .page{
      width:min(560px, 100%);
      min-height:calc(100vh - (env(safe-area-inset-top) + env(safe-area-inset-bottom)));
      margin:auto;
      border:6px solid var(--olive-dark);
      border-radius:22px;
      background:var(--beige);
      padding:22px 18px 24px;
      position:relative;
      overflow:hidden;
    }

    .logo{
      position:absolute;
      left:18px;
      top:22px;
      width:78px;
      height:auto;
      object-fit:contain;
      pointer-events:none;
      user-select:none;
    }

    h1{
      margin:78px 0 18px;
      text-align:center;
      color:var(--olive-dark);
      font-weight:900;
      font-size:clamp(34px, 6.2vw, 54px);
      line-height:1.05;
    }

    .grid-wrap{
      width:min(500px, 100%);
      margin:0 auto;
      background:var(--olive);
      border-radius:22px;
      padding:16px 16px 18px;
      box-shadow:0 18px 0 rgba(0,0,0,.10);
      position:relative;
    }
    .grid-wrap::after{
      content:"";
      position:absolute;
      left:18px;
      right:18px;
      bottom:-22px;
      height:28px;
      background:rgba(0,0,0,.18);
      border-radius:999px;
      opacity:.22;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }

    .cat{
      border:6px solid #000;
      border-radius:26px;
      background:var(--cream);
      padding:14px 10px 12px;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      box-shadow:0 12px 0 rgba(0,0,0,.18);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      min-height:150px;
      transition:transform .05s ease;
      position:relative;
      outline:none;
    }
    .cat:active{transform:translateY(1px)}

    .cat .title{
      font-weight:900;
      color:#111;
      font-size:clamp(28px, 5.6vw, 40px);
      line-height:1;
      margin-top:2px;
      margin-bottom:10px;
    }

    .cat img{
      object-fit:contain;
      display:block;
      pointer-events:none;
      user-select:none;
    }

    .img-eat  { width:var(--img-eat-w);  height:var(--img-eat-h); }
    .img-zoo  { width:var(--img-zoo-w);  height:var(--img-zoo-h); }
    .img-play { width:var(--img-play-w); height:var(--img-play-h); }
    .img-car  { width:var(--img-car-w);  height:var(--img-car-h); }
    .img-frot { width:var(--img-frot-w); height:var(--img-frot-h); }
    .img-cola { width:var(--img-cola-w); height:var(--img-cola-h); }

    .cat.active{
      background:var(--active);
      border-color:#000;
      box-shadow:0 12px 0 rgba(0,0,0,.18);
    }
    .cat.active::after{
      content:"";
      position:absolute;
      inset:6px;
      border:5px solid #000;
      border-radius:20px;
      opacity:.28;
      pointer-events:none;
    }

    .start-wrap{
      display:flex;
      justify-content:center;
      margin-top:18px;
      position:relative;
    }
    .start{
      width:min(455px, 100%);
      border:4px solid var(--black);
      border-radius:30px;
      padding:18px 16px;
      font-size:clamp(32px, 6.2vw, 50px);
      font-weight:900;
      background:var(--yellow);
      color:#111;
      cursor:pointer;
      box-shadow:0 12px 0 rgba(0,0,0,.22);
      -webkit-tap-highlight-color:transparent;
      transition:transform .05s ease, opacity .2s ease, filter .2s ease;
    }
    .start:active{transform:translateY(1px)}
    .start[disabled]{
      opacity:.55;
      filter:saturate(.6);
      cursor:not-allowed;
      transform:none;
    }

    .home{
      position:absolute;
      left:22px;
      bottom:22px;
      width:88px;
      height:88px;
      border-radius:999px;
      border:6px solid #000;
      background:var(--home-blue);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      box-shadow:0 10px 0 rgba(0,0,0,.18);
    }
    .home:active{transform:translateY(1px)}

    @media (min-width: 900px){
      body{align-items:center}
      .page{min-height:820px}
    }
  </style>
</head>

<body>
  <main class="page">
    <img class="logo" src="logo.PNG" alt="شعار صندوق المسابقات">

    <h1>اختر نوع السالفة</h1>

    <section class="grid-wrap" aria-label="الكتاغوريات">
      <div class="grid">
        <button class="cat" type="button" data-id="eat" data-label="مأكولات" aria-label="مأكولات">
          <div class="title">مأكولات</div>
          <img class="img-eat" src="eat.PNG" alt="">
        </button>

        <button class="cat" type="button" data-id="zoo" data-label="حيوانات" aria-label="حيوانات">
          <div class="title">حيوانات</div>
          <img class="img-zoo" src="zoo.PNG" alt="">
        </button>

        <button class="cat" type="button" data-id="play" data-label="لاعبين" aria-label="لاعبين">
          <div class="title">لاعبين</div>
          <img class="img-play" src="play.PNG" alt="">
        </button>

        <button class="cat" type="button" data-id="car" data-label="سيارات" aria-label="سيارات">
          <div class="title">سيارات</div>
          <img class="img-car" src="car.PNG" alt="">
        </button>

        <button class="cat" type="button" data-id="frot" data-label="فواكه وخضار" aria-label="فواكه وخضار">
          <div class="title">فواكه وخضار</div>
          <img class="img-frot" src="frot.PNG" alt="">
        </button>

        <button class="cat" type="button" data-id="cola" data-label="مشروبات" aria-label="مشروبات">
          <div class="title">مشروبات</div>
          <img class="img-cola" src="cola.PNG" alt="">
        </button>
      </div>
    </section>

    <div class="start-wrap">
      <button id="startBtn" class="start" type="button" disabled>ابدأ اللعب</button>
    </div>

    <button class="home" id="homeBtn" type="button" aria-label="الصفحة الرئيسية">
      <svg width="52" height="52" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M10 30 L32 12 L54 30" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18 28 V54 H46 V28" fill="#fff" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
        <path d="M28 54 V38 H36 V54" fill="#86c9ff" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
        <path d="M21 26 L32 17 L43 26" fill="none" stroke="var(--roof)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </main>

  <script>
    // مفاتيحك القديمة (نخليها شغالة)
    const CAT_KEY_ID    = "bara_category_id";
    const CAT_KEY_LABEL = "bara_category_label";

    // ✅ مفاتيح جديدة يحتاجها ملف single_gamev1.html
    const CATEGORY_KEY  = "categoryKey";
    const CATEGORY_LABEL_KEY = "categoryLabel";

    const cats = Array.from(document.querySelectorAll(".cat"));
    const startBtn = document.getElementById("startBtn");
    const homeBtn  = document.getElementById("homeBtn");

    let selected = null;

    function setActive(btn){
      cats.forEach(c => c.classList.remove("active"));
      btn.classList.add("active");

      selected = {
        id: btn.getAttribute("data-id"),
        label: btn.getAttribute("data-label")
      };

      // تخزين قديم
      sessionStorage.setItem(CAT_KEY_ID, selected.id);
      sessionStorage.setItem(CAT_KEY_LABEL, selected.label);
      sessionStorage.setItem("bara_step", "category");

      // ✅ تخزين جديد للعبة (هذا اللي كان ناقص)
      sessionStorage.setItem(CATEGORY_KEY, selected.id);
      sessionStorage.setItem(CATEGORY_LABEL_KEY, selected.label);

      startBtn.disabled = false;
    }

    cats.forEach(btn => {
      btn.addEventListener("click", () => setActive(btn));
    });

    // ✅ لو رجع اللاعب للصفحة وكانت هناك كتاغوري مختارة سابقاً نفعّلها تلقائياً
    (function restoreSelection(){
      const saved = sessionStorage.getItem(CATEGORY_KEY) || sessionStorage.getItem(CAT_KEY_ID);
      if(!saved) return;
      const found = cats.find(b => b.getAttribute("data-id") === saved);
      if(found) setActive(found);
    })();

    function clearAllGameState(){
      // نحذف bara_ keys
      const ssKeys = [];
      for(let i=0; i<sessionStorage.length; i++){
        const k = sessionStorage.key(i);
        if(k) ssKeys.push(k);
      }
      ssKeys.forEach(k => {
        if(k.startsWith("bara_")) sessionStorage.removeItem(k);
      });

      // ✅ نحذف مفاتيح اللعبة الجديدة أيضاً
      sessionStorage.removeItem(CATEGORY_KEY);
      sessionStorage.removeItem(CATEGORY_LABEL_KEY);
      sessionStorage.removeItem("players");
      sessionStorage.removeItem("singleState");

      // localStorage bara_ (احتياط)
      const lsKeys = [];
      for(let i=0; i<localStorage.length; i++){
        const k = localStorage.key(i);
        if(k) lsKeys.push(k);
      }
      lsKeys.forEach(k => {
        if(k.startsWith("bara_")) localStorage.removeItem(k);
      });
    }

    homeBtn.addEventListener("click", () => {
      clearAllGameState();
      window.location.href = "index.html";
    });

    startBtn.addEventListener("click", () => {
      if(!selected) return;

      // ✅ مهم: ما نروح للعبة مباشرة
      // نروح لصفحة إدخال الأسماء أولاً
      window.location.href = "single.html";
    });
  </script>
</body>
</html>
