<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>اختيار الكتاغوري</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{--bg:#e9e4d6;--olive:#3f4a1f;--panel:#6e7b46;--black:#111;--yellow:#ffd21a}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"Baloo Bhaijaan 2",Arial,sans-serif;color:#111}
    .wrap{min-height:100svh;display:flex;justify-content:center;padding:18px 14px 30px}
    .card{width:min(560px,100%);position:relative}
    .logo{position:absolute;left:8px;top:10px;width:92px;height:92px;object-fit:contain;pointer-events:none}
    h1{margin:40px 0 10px;text-align:center;color:var(--olive);font-weight:900;font-size:44px}

    .panel{background:var(--panel);border-radius:28px;padding:18px 18px;margin:0 8px 16px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}

    .cat{
      background:var(--bg);
      border:8px solid var(--black);
      border-radius:22px;
      padding:12px 10px 10px;
      box-shadow:0 10px 0 rgba(0,0,0,.18);
      cursor:pointer;
      transition:transform .08s ease;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:150px;
      text-align:center;
    }
    .cat:active{transform:translateY(2px)}
    .cat.active{
      background:#d7ebc8;
      box-shadow:0 10px 0 rgba(0,0,0,.18), 0 0 0 8px rgba(255,210,26,.65) inset;
    }

    .catTitle{font-weight:900;font-size:30px;margin-bottom:8px}

    .imgBox{
      width:180px;
      height:110px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .imgBox img{
      width:100%;
      height:100%;
      object-fit:contain;
      transform:scale(var(--imgScale, 1.15));
      transform-origin:center;
    }

    .cat[data-id="eat"]  { --imgScale:1.18; }
    .cat[data-id="zoo"]  { --imgScale:1.55; }
    .cat[data-id="play"] { --imgScale:0.90; }
    .cat[data-id="car"]  { --imgScale:1.65; }
    .cat[data-id="frot"] { --imgScale:1.22; }
    .cat[data-id="cola"] { --imgScale:1.28; }

    .startWrap{display:flex;justify-content:center;margin-top:18px}
    .btnStart{
      width:min(420px,100%);background:var(--yellow);
      border:5px solid var(--black);
      border-radius:999px;
      padding:16px 16px;
      font-weight:900;font-size:40px;
      box-shadow:0 10px 0 rgba(0,0,0,.18);
      cursor:pointer;
      opacity:.55;
      color:#000;
    }
    .btnStart.enabled{opacity:1}
    .btnStart:active{transform:translateY(2px)}

    .homeBtn{
      position:fixed;left:16px;bottom:16px;
      width:64px;height:64px;border-radius:999px;
      border:4px solid var(--black);
      background:#bfe1ff;
      box-shadow:0 8px 0 rgba(0,0,0,.18);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;z-index:20;
    }
    .homeBtn:active{transform:translateY(2px)}
    .homeIcon{width:34px;height:34px}
  </style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <img class="logo" src="logo.PNG" alt="logo">
      <h1>اختر نوع السالفة</h1>

      <div class="panel">
        <div class="grid" id="grid"></div>

        <div class="startWrap">
          <button id="startBtn" class="btnStart" type="button">ابدأ اللعب</button>
        </div>
      </div>
    </div>
  </div>

  <button class="homeBtn" type="button" onclick="location.href='index.html'" aria-label="الصفحة الرئيسية">
    <svg class="homeIcon" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10.5 12 3l9 7.5"></path>
      <path d="M5 10v10h14V10"></path>
      <path d="M9 20v-6h6v6"></path>
    </svg>
  </button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import {
    getFirestore, doc, setDoc, updateDoc, onSnapshot,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

  // ✅ Firebase Config (كما أرسلتها)
  const firebaseConfig = {
    apiKey: "AIzaSyDQx4gJZMHNWQBeMYsU4fknZHG0WFJ_ckc",
    authDomain: "bara-alsalfah.firebaseapp.com",
    projectId: "bara-alsalfah",
    storageBucket: "bara-alsalfah.firebasestorage.app",
    messagingSenderId: "658748312832",
    appId: "1:658748312832:web:3e0c970ba54bb25c0437e5",
    measurementId: "G-82ZV2RDDDP"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ---- Helpers ----
  function getJSON(key, fallback){
    try{ return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
    catch(e){ return fallback; }
  }

  function pickRandom(arr){
    if(!Array.isArray(arr) || arr.length===0) return '';
    return arr[Math.floor(Math.random()*arr.length)];
  }

  function normPlayers(arr){
    const out = [];
    const seen = new Set();
    (arr || []).forEach(x=>{
      const n = String(x || "").trim();
      if(!n) return;
      if(seen.has(n)) return;
      seen.add(n);
      out.push(n);
    });
    return out;
  }

  // ---- Params ----
  const params = new URLSearchParams(location.search);
  const mode = (params.get('mode') || localStorage.getItem('bara_mode') || '').toLowerCase(); // single|multi
  const room = params.get('room') || localStorage.getItem('bara_room') || '';
  const role = (params.get('role') || '').toLowerCase(); // host فقط

  // ✅ قفل صفحة الكتاغوري: للمقدم فقط في الأجهزة المتعددة
  if(mode === 'multi'){
    if(!room){
      location.replace('index.html');
      throw new Error('Missing room');
    }
    if(role !== 'host'){
      location.replace('waiting.html?room=' + encodeURIComponent(room));
      throw new Error('Players blocked from categories');
    }
  }

  // ---- UI Data ----
  const cats = [
    { id:'eat',  name:'مأكولات',      img:'eat.PNG'  },
    { id:'zoo',  name:'حيوانات',      img:'zoo.PNG'  },
    { id:'play', name:'لاعبين',       img:'play.PNG' },
    { id:'car',  name:'سيارات',       img:'car.PNG'  },
    { id:'frot', name:'فواكة وخضار',  img:'frot.PNG' },
    { id:'cola', name:'مشروبات',      img:'cola.PNG' },
  ];

  const grid = document.getElementById('grid');
  const startBtn = document.getElementById('startBtn');
  let selected = localStorage.getItem('bara_cat') || '';

  // ---- Multi: Firestore room listener ----
  let roomRef = null;
  let currentPlayers = [];

  if(mode === 'multi' && room){
    roomRef = doc(db, "bara_rooms", room);

    // تأكد أن وثيقة الغرفة موجودة
    await setDoc(roomRef, {
      room,
      status: "lobby",
      hostSeenAt: serverTimestamp()
    }, { merge: true });

    // استماع لاسماء اللاعبين من Firebase
    onSnapshot(roomRef, (snap)=>{
      const data = snap.data() || {};
      currentPlayers = normPlayers(data.players || []);
    });
  }

  function render(){
    grid.innerHTML = '';
    cats.forEach(c=>{
      const el = document.createElement('div');
      el.className = 'cat' + (selected===c.id ? ' active':'');
      el.setAttribute('data-id', c.id);

      el.innerHTML = `
        <div class="catTitle">${c.name}</div>
        <div class="imgBox">
          <img src="${c.img}" alt="${c.name}">
        </div>
      `;

      el.onclick = () => {
        selected = c.id;
        localStorage.setItem('bara_cat', selected);
        render();
      };
      grid.appendChild(el);
    });

    if(selected){
      startBtn.classList.add('enabled');
      startBtn.style.opacity = '1';
    }else{
      startBtn.classList.remove('enabled');
      startBtn.style.opacity = '.55';
    }
  }

  startBtn.onclick = async () => {
    if(!selected) return;

    // نحفظ الكتاغوري المختار محلياً
    localStorage.setItem('bara_cat', selected);

    // ✅ أجهزة متعددة: نخزن الجولة في Firebase (عشان كل الأجهزة تتزامن)
    if(mode === 'multi' && room && roomRef){
      const wordsKey = 'bara_words_' + selected;   // نفس نظام كلماتك الحالي
      const words = getJSON(wordsKey, []);
      const topic = pickRandom(words) || 'السالفة';

      const players = Array.isArray(currentPlayers) ? currentPlayers : [];
      const outName = (players.length > 0) ? pickRandom(players) : '';

      const roundId = String(Date.now());

      await updateDoc(roomRef, {
        status: "ready",
        cat: selected,
        topic,
        outName,
        roundId,
        updatedAt: serverTimestamp(),
        hostSeenAt: serverTimestamp()
      });

      // ملاحظة: بنغير هذا التحويل للصفحات اللي بالصور بالخطوة القادمة
      location.href = `game.html?mode=multi&room=${encodeURIComponent(room)}&role=host`;
      return;
    }

    // ✅ جهاز واحد
    location.href = `single.html?mode=single&cat=${encodeURIComponent(selected)}`;
  };

  render();
</script>
</body>
</html>
