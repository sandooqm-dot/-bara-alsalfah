<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>لعبة برا السالفة - التصويت (أجهزة متعددة)</title>

  <style>
    :root{
      --bg:#e9e4d6;
      --frame:#3f5a2a;
      --card:#6a8450;
      --card2:#d8cfb1;
      --text:#1b1b1b;
      --white:#ffffff;

      --yellow:#f2c21b;
      --yellowText:#111;

      --vote:#7b1f1f;
      --blue:#bfe3ff;

      --shadow: 0 10px 0 rgba(0,0,0,.25);

      --containerMax: 520px;
      --radiusBig: 26px;
      --radiusMid: 18px;

      --boxPad: 22px;
      --boxMinH: 260px;

      --titleSize: 18px;
      --headerSize: 26px;

      --btnH: 62px;
      --btnRadius: 26px;

      --bottomGap: 34px;
      --homeSize: 60px;
      --homeGap: 12px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      color:var(--text);
    }

    .wrap{
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:18px 14px 180px;
    }
    .frame{
      width:min(var(--containerMax), 100%);
      border:10px solid var(--frame);
      border-radius: var(--radiusBig);
      background:transparent;
      padding:18px 16px 24px;
      position:relative;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
    }
    .brandTitle{
      font-size:var(--titleSize);
      font-weight:700;
      color:#2f3f22;
      opacity:.95;
    }
    .logo{ width:86px;height:86px; object-fit:contain; }

    .badgeTitle{
      margin:14px auto 16px;
      width:fit-content;
      max-width:100%;
      padding:14px 26px;
      border-radius: 22px;
      background: rgba(216,207,177,.9);
      color:#395427;
      font-weight:900;
      font-size: var(--headerSize);
      line-height:1;
      text-align:center;
    }

    .card{
      background:var(--card);
      color:var(--white);
      border-radius: var(--radiusBig);
      padding: var(--boxPad);
      min-height: var(--boxMinH);
      box-shadow: 0 0 0 8px rgba(216,207,177,.75) inset;
    }

    .hint{
      text-align:center;
      font-weight:900;
      font-size:20px;
      line-height:1.6;
      opacity:.95;
    }

    .subhint{
      text-align:center;
      font-weight:900;
      font-size:16px;
      line-height:1.6;
      opacity:.95;
      margin-top:8px;
    }

    .list{
      margin-top: 14px;
      background: rgba(0,0,0,.10);
      border-radius: 18px;
      padding: 12px 10px;
    }

    .rowBtn{
      width:100%;
      border: 4px solid #000;
      border-radius: 18px;
      padding: 14px 14px;
      font-size: 22px;
      font-weight: 1000;
      cursor:pointer;
      text-align:center;
      background:#fff;
      color:#111;
      margin-bottom: 12px;
      -webkit-tap-highlight-color:transparent;
      box-shadow: 0 8px 0 rgba(0,0,0,0.18);
    }
    .rowBtn:active{ transform: translateY(1px); box-shadow: 0 7px 0 rgba(0,0,0,0.18); }
    .rowBtn.selected{ background: var(--blue); }
    .rowBtn[disabled]{
      opacity:.6;
      cursor:not-allowed;
      transform:none;
    }

    .resultRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      width:100%;
      border: 4px solid rgba(0,0,0,0.25);
      border-radius: 18px;
      padding: 12px 14px;
      font-size: 20px;
      font-weight: 1000;
      background: rgba(255,255,255,0.85);
      color:#111;
      margin-bottom: 12px;
    }
    .countBadge{
      min-width: 52px;
      text-align:center;
      border: 4px solid #000;
      border-radius: 16px;
      padding: 6px 10px;
      background: var(--yellow);
      color:#111;
      font-weight: 1000;
    }

    .ctaArea{
      width:100%;
      display:flex;
      justify-content:center;
      margin-top: 14px;
    }

    .cta{
      height: var(--btnH);
      border-radius: var(--btnRadius);
      background: var(--yellow);
      color: var(--yellowText);
      border:4px solid #000;
      box-shadow: var(--shadow);
      font-size: 28px;
      font-weight:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      width: 86%;
      max-width: 420px;
      margin: 0 auto;
      cursor:pointer;
      user-select:none;
      text-align:center;
      padding: 0 14px;
      -webkit-tap-highlight-color:transparent;
    }
    .cta:active{ transform: translateY(1px); box-shadow: 0 9px 0 rgba(0,0,0,0.25); }
    .cta:disabled{
      opacity:.55;
      cursor:not-allowed;
      filter: grayscale(.15);
      transform:none;
    }
    .cta.vote{
      background: var(--vote);
      color:#fff;
      max-width: 360px;
    }

    .err{
      width:100%;
      max-width: 420px;
      margin: 10px auto 0;
      color:#b00020;
      font-weight:900;
      text-align:center;
      display:none;
      line-height:1.4;
    }

    .bottomBar{
      position:fixed;
      left:0; right:0;
      bottom: calc(var(--bottomGap) + env(safe-area-inset-bottom));
      display:flex;
      justify-content:center;
      pointer-events:none;
      z-index:9999;
    }
    .bottomInner{
      width:min(var(--containerMax), calc(100% - 28px));
      position:relative;
      pointer-events:none;
    }
    .homeBtn{
      position:absolute;
      left: var(--homeGap);
      bottom:0;
      width: var(--homeSize);
      height: var(--homeSize);
      border-radius: 50%;
      background: #bfe7ff;
      border:4px solid #000;
      box-shadow: var(--shadow);
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:auto;
      cursor:pointer;
    }
    .homeBtn svg{ width:34px;height:34px; }

    @media (max-width: 360px){
      .logo{ width:80px;height:80px; }
      .homeBtn{ width:56px;height:56px; }
      .homeBtn svg{ width:30px;height:30px; }
      .cta{ font-size: 26px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="frame">
      <div class="topbar">
        <div class="brandTitle">لعبة برا السالفة</div>
        <img class="logo" src="logo.PNG" alt="logo" />
      </div>

      <div class="badgeTitle" id="pageTitle">التصويت</div>

      <div class="card" id="card">
        <div class="hint">جاري التحميل...</div>
      </div>

      <div class="ctaArea" id="ctaArea">
        <button class="cta vote" id="ctaBtn" disabled>تصويت</button>
      </div>

      <div class="err" id="err"></div>
    </div>
  </div>

  <div class="bottomBar">
    <div class="bottomInner">
      <button class="homeBtn" id="homeBtn" aria-label="الرئيسية" title="الرئيسية">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 11.5L12 4l9 7.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6.5 10.5V20h11V10.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <script type="module">
    import { ensureRoom, listenRoom, roomRef } from "./data/firebase.js";
    import { db } from "./data/firebase.js";
    import {
      getDocFromServer,
      runTransaction,
      updateDoc,
      serverTimestamp,
      increment
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    const pageTitle = document.getElementById("pageTitle");
    const cardEl    = document.getElementById("card");
    const ctaBtn    = document.getElementById("ctaBtn");
    const homeBtn   = document.getElementById("homeBtn");
    const errBox    = document.getElementById("err");

    function showErr(msg){
      errBox.textContent = msg;
      errBox.style.display = "block";
    }
    function hideErr(){
      errBox.textContent = "";
      errBox.style.display = "none";
    }
    function clean(x){ return String(x || "").trim(); }
    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    const params = new URLSearchParams(location.search);
    const roomId = clean(params.get("room"));

    // host detect (نفس ملفاتك)
    const HOST_ROOM_KEY = "bara_roomId_multi_v4";
    const hostRoomId = clean(sessionStorage.getItem(HOST_ROOM_KEY));
    const isHost = !!hostRoomId && hostRoomId === roomId;

    // my name
    const POSSIBLE_PLAYER_KEYS = [
      "bara_playerName_multi_v4",
      "bara_playerName_multi_v3",
      "bara_playerName_multi_v2",
      "bara_playerName_multi_v1",
      "bara_playerName_multi"
    ];
    const POSSIBLE_HOST_KEYS = [
      "bara_hostName_multi_v4",
      "bara_hostName_multi_v3",
      "bara_hostName_multi_v2",
      "bara_hostName_multi_v1"
    ];
    function getMyName(){
      for(const k of POSSIBLE_PLAYER_KEYS){
        const v = clean(sessionStorage.getItem(k));
        if(v) return v;
      }
      for(const k of POSSIBLE_HOST_KEYS){
        const v = clean(localStorage.getItem(k));
        if(v) return v;
      }
      return "";
    }
    const myName = getMyName();

    // زر الصفحة:
    // - اللاعب: "تصويت"
    // - المقدم: "التالي"
    ctaBtn.textContent = isHost ? "التالي" : "تصويت";
    ctaBtn.disabled = true;

    function clearMultiState(){
      sessionStorage.removeItem("bara_roomId_multi_v4");
      sessionStorage.removeItem("bara_roomTs_multi_v4");
      sessionStorage.removeItem("bara_hostAdded_multi_v4");
      localStorage.removeItem("bara_hostName_multi_v4");
    }
    homeBtn.addEventListener("click", () => {
      if(isHost) clearMultiState();
      window.location.href = "index.html";
    });

    // ---------- Navigation ----------
    let lastNavTs = 0;
    function handleNav(data){
      const navTo = clean(data?.navTo);
      const navTs = Number(data?.navTs || 0);

      if(navTo && navTs && navTs > lastNavTs){
        lastNavTs = navTs;
        const qs = "?room=" + encodeURIComponent(roomId) + "&v=" + Date.now();
        window.location.replace(navTo + qs);
        return true;
      }

      const phase = clean(data?.phase);
      if(phase === "reveal"){
        const qs = "?room=" + encodeURIComponent(roomId) + "&v=" + Date.now();
        window.location.replace("reveal.html" + qs);
        return true;
      }
      return false;
    }

    // ---------- Voting helpers ----------
    function getPlayersNames(data){
      const players = Array.isArray(data?.players) ? data.players : [];
      const names = players.map(p => clean(p?.name)).filter(Boolean);
      const seen = new Set();
      const unique = [];
      for(const n of names){
        if(!seen.has(n)){
          seen.add(n);
          unique.push(n);
        }
      }
      return unique;
    }

    function countVotes(votesBy){
      const obj = (votesBy && typeof votesBy === "object") ? votesBy : {};
      const counts = {};
      for(const voter of Object.keys(obj)){
        const target = clean(obj[voter]);
        if(!target) continue;
        counts[target] = (counts[target] || 0) + 1;
      }
      return counts;
    }

    function allVoted(names, votesBy){
      if(!Array.isArray(names) || names.length < 3) return false;
      const obj = (votesBy && typeof votesBy === "object") ? votesBy : {};
      for(const n of names){
        const v = clean(obj?.[n]);
        if(!v) return false;
      }
      return true;
    }

    // ---------- Local selection (الزر صار ضروري) ----------
    let localSelected = "";
    let lastServerSelected = "";

    async function submitVote(){
      if(!roomId) return;
      if(!myName){
        showErr("اسمك غير معروف في هذا الجهاز.");
        return;
      }
      if(!localSelected){
        return;
      }

      hideErr();
      const ref = roomRef(roomId);

      try{
        await runTransaction(db, async (tx) => {
          const snap = await tx.get(ref);
          if(!snap.exists()) return;
          const d = snap.data() || {};
          const phase = clean(d?.phase) || "vote";
          if(phase !== "vote") return;

          const votesBy = (d.votesBy && typeof d.votesBy === "object") ? d.votesBy : {};
          votesBy[myName] = localSelected;

          tx.update(ref, {
            updatedAt: serverTimestamp(),
            tick: increment(1),
            votesBy
          });
        });
      } catch(e){
        console.warn(e);
        showErr("صار خطأ في الاتصال. حدّث الصفحة وجرب مرة ثانية.");
      }
    }

    function renderVote(names, serverSelected, canInteract){
      pageTitle.textContent = "التصويت";

      const selected = localSelected || serverSelected || "";
      const list = names.map(n => {
        const sel = (selected === n) ? " selected" : "";
        const dis = canInteract ? "" : " disabled";
        return `<button class="rowBtn${sel}" data-name="${escapeHtml(n)}"${dis}>${escapeHtml(n)}</button>`;
      }).join("");

      cardEl.innerHTML = `
        <div class="hint">اختر الشخص اللي تشك إنه برا السالفة</div>
        <div class="subhint">${isHost ? "المقدم يقدر يصوّت مثل الباقين" : "بعد الاختيار اضغط (تصويت)"}</div>
        <div class="list" id="list">${list}</div>
      `;

      const listEl = document.getElementById("list");
      if(listEl){
        listEl.addEventListener("click", (e) => {
          const btn = e.target.closest("button.rowBtn");
          if(!btn) return;
          if(btn.disabled) return;
          const n = clean(btn.getAttribute("data-name"));
          if(!n) return;
          localSelected = n;
          // أعد رسم التحديد فقط
          renderVote(names, serverSelected, canInteract);
        });
      }
    }

    function renderResults(names, votesBy){
      pageTitle.textContent = "عرض الأصوات";
      const counts = countVotes(votesBy);

      const rows = names.slice().sort((a,b)=>(counts[b]||0)-(counts[a]||0)).map(n => {
        return `
          <div class="resultRow">
            <div>${escapeHtml(n)}</div>
            <div class="countBadge">${counts[n] || 0}</div>
          </div>
        `;
      }).join("");

      cardEl.innerHTML = `
        <div class="hint">هذه نتيجة التصويت</div>
        <div class="list">${rows || ""}</div>
      `;
    }

    async function hostNextToReveal(){
      if(!isHost) return;
      if(!roomId) return;

      hideErr();
      try{
        await updateDoc(roomRef(roomId), {
          updatedAt: serverTimestamp(),
          tick: increment(1),
          phase: "reveal",
          navTo: "reveal.html",
          navTs: Date.now()
        });

        window.location.replace("reveal.html?room=" + encodeURIComponent(roomId) + "&v=" + Date.now());
      }catch(e){
        console.warn(e);
        showErr("صار خطأ في الاتصال. حدّث الصفحة وجرب مرة ثانية.");
      }
    }

    ctaBtn.addEventListener("click", async () => {
      if(isHost){
        await hostNextToReveal();
      }else{
        await submitVote();
      }
    });

    function renderByRoom(data){
      if(!data) return;

      if(handleNav(data)) return;

      const phase = clean(data?.phase) || "vote";
      const names = getPlayersNames(data);
      const votesBy = (data?.votesBy && typeof data.votesBy === "object") ? data.votesBy : {};

      const serverSelected = myName ? clean(votesBy?.[myName]) : "";
      lastServerSelected = serverSelected;

      // لو سبق وصوّت: نقفل التفاعل
      const alreadyVoted = !!serverSelected;

      if(phase === "vote"){
        // المقدم واللاعب يقدرون يختارون (إزالة شرط !isHost)
        const canInteract = !alreadyVoted;

        // ثبت localSelected لو السيرفر عنده اختيار
        if(serverSelected && !localSelected) localSelected = serverSelected;

        renderVote(names, serverSelected, canInteract);

        if(isHost){
          // زر التالي للمقدم: يتفعل بعد ما الجميع يصوّت
          ctaBtn.textContent = "التالي";
          ctaBtn.disabled = !allVoted(names, votesBy);
        }else{
          // زر التصويت للاعب: يتفعل بعد اختيار اسم + إذا ما صوّت قبل
          ctaBtn.textContent = alreadyVoted ? "تم التصويت" : "تصويت";
          ctaBtn.disabled = alreadyVoted ? true : !localSelected;
        }
        return;
      }

      // بعد التصويت: عرض أصوات (والمقدم فقط معه التالي)
      renderResults(names, votesBy);
      if(isHost){
        ctaBtn.textContent = "التالي";
        ctaBtn.disabled = false;
      }else{
        ctaBtn.textContent = "بانتظار المقدم…";
        ctaBtn.disabled = true;
      }
    }

    (async () => {
      if(!roomId){
        showErr("الرابط غير صحيح: رمز الغرفة غير موجود.");
        return;
      }

      try{
        await ensureRoom(roomId);

        listenRoom(roomId, (data) => renderByRoom(data));

        // Polling احتياط (iOS)
        setInterval(async () => {
          try{
            const snap = await getDocFromServer(roomRef(roomId));
            if(snap.exists()){
              renderByRoom(snap.data());
            }
          }catch(e){}
        }, 700);

      }catch(e){
        console.warn(e);
        showErr("تعذر الاتصال. حدّث الصفحة وجرب مرة ثانية.");
      }
    })();
  </script>
</body>
</html>

<!-- vote.html برا السالفة – إصدار 2 (تصحيح زر التصويت + تصويت المقدم) -->
