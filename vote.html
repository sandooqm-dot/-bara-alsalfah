<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>لعبة برا السالفة - التصويت (أجهزة متعددة)</title>

  <style>
    :root{
      --bg:#e9e4d6;
      --frame:#3f5a2a;
      --card:#6a8450;
      --card2:#d8cfb1;
      --text:#1b1b1b;
      --white:#ffffff;

      --yellow:#f2c21b;
      --yellowText:#111;

      --vote:#7b1f1f;   /* أحمر داكن */
      --shadow: 0 10px 0 rgba(0,0,0,.25);

      --containerMax: 520px;
      --radiusBig: 26px;
      --radiusMid: 18px;

      --boxPad: 22px;
      --boxMinH: 260px;

      --titleSize: 18px;
      --headerSize: 26px;

      --btnH: 62px;
      --btnRadius: 26px;

      --homeSize: 60px;
      --homeGap: 12px;

      --bottomGap: 34px;

      --blue:#bfe3ff;
      --select:#8fd0ff; /* لون التحديد */
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      color:var(--text);
    }

    .wrap{
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:18px 14px 180px;
    }
    .frame{
      width:min(var(--containerMax), 100%);
      border:10px solid var(--frame);
      border-radius: var(--radiusBig);
      background:transparent;
      padding:18px 16px 24px;
      position:relative;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
    }
    .brandTitle{
      font-size:var(--titleSize);
      font-weight:700;
      color:#2f3f22;
      opacity:.95;
    }
    .logo{
      width:86px;height:86px;
      object-fit:contain;
    }

    .badgeTitle{
      margin:14px auto 16px;
      width:fit-content;
      max-width:100%;
      padding:14px 26px;
      border-radius: 22px;
      background: rgba(216,207,177,.9);
      color:#395427;
      font-weight:900;
      font-size: var(--headerSize);
      line-height:1;
      text-align:center;
      display:block;
    }

    .bigCard{
      background:var(--card);
      color:var(--white);
      border-radius: var(--radiusBig);
      padding: var(--boxPad);
      min-height: var(--boxMinH);
      box-shadow: 0 0 0 8px rgba(216,207,177,.75) inset;
      text-align:center;
    }

    .myNamePill{
      margin: 6px auto 14px;
      width: fit-content;
      max-width: 100%;
      padding: 14px 26px;
      border-radius: 26px;
      background: rgba(216,207,177,.95);
      color:#355026;
      font-weight:1000;
      font-size: 44px;
      line-height:1;
      letter-spacing:.2px;
    }

    .hint{
      font-size: 20px;
      font-weight:900;
      line-height:1.5;
      margin: 0 0 8px;
    }
    .count{
      margin: 6px 0 14px;
      font-weight:1000;
      font-size: 22px;
      color: var(--yellow);
    }

    .list{
      display:flex;
      flex-direction:column;
      gap: 12px;
      margin: 10px auto 0;
      max-width: 420px;
    }

    .nameBtn{
      width:100%;
      height: 62px;
      border-radius: 18px;
      border: 4px solid #000;
      background:#fff;
      color:#111;
      font-size: 30px;
      font-weight: 1000;
      box-shadow: 0 8px 0 rgba(0,0,0,0.18);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 0 14px;
      user-select:none;
    }
    .nameBtn:active{
      transform: translateY(1px);
      box-shadow: 0 7px 0 rgba(0,0,0,0.18);
    }
    .nameBtn.selected{
      background: var(--select);
    }
    .nameBtn.disabled{
      opacity:.55;
      cursor:not-allowed;
      filter: grayscale(.2);
    }

    .voteBtn{
      margin: 16px auto 0;
      width: min(360px, 82%);
      height: 66px;
      border-radius: 26px;
      border: 4px solid #000;
      background: var(--vote);
      color:#fff;
      font-size: 32px;
      font-weight: 1000;
      box-shadow: var(--shadow);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      user-select:none;
    }
    .voteBtn:disabled{
      opacity:.55;
      cursor:not-allowed;
      filter: grayscale(.15);
    }

    /* زر التالي للمقدم فقط في صفحة الانتظار */
    .nextBtn{
      margin: 18px auto 0;
      width: min(360px, 82%);
      height: 66px;
      border-radius: 26px;
      border: 4px solid #000;
      background: var(--yellow);
      color: var(--yellowText);
      font-size: 34px;
      font-weight: 1000;
      box-shadow: var(--shadow);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      user-select:none;
    }
    .nextBtn:disabled{
      opacity:.55;
      cursor:not-allowed;
      filter: grayscale(.15);
    }

    /* زر شراء للاعبين فقط */
    .buyArea{
      width:100%;
      display:flex;
      justify-content:center;
      margin-top: 14px;
    }
    .buyArea.hidden{ display:none; }
    .buyBtn{
      width: min(360px, 82%);
      border: 4px solid #000;
      border-radius: 22px;
      padding: 14px 18px;
      font-size: 28px;
      font-weight: 1000;
      box-shadow: 0 8px 0 rgba(0,0,0,0.18);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      text-align:center;
      background: var(--blue);
      color:#111;
    }
    .buyBtn:active{ transform: translateY(1px); box-shadow: 0 7px 0 rgba(0,0,0,0.18); }

    .err{
      width:100%;
      max-width: 420px;
      margin: 10px auto 0;
      color:#b00020;
      font-weight:900;
      text-align:center;
      display:none;
      line-height:1.4;
    }

    /* أسطر عرض التصويتات */
    .voteLine{
      width:100%;
      border-radius: 22px;
      background: rgba(0,0,0,.18);
      padding: 14px 16px;
      font-size: 28px;
      font-weight: 1000;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
      flex-wrap:wrap;
    }
    .voteLine .who{ color:#fff; }
    .voteLine .verb{ color: var(--yellow); }
    .voteLine .to{ color:#fff; }

    .spacerBottom{ height: 18px; }

    .bottomBar{
      position:fixed;
      left:0; right:0;
      bottom: calc(var(--bottomGap) + env(safe-area-inset-bottom));
      display:flex;
      justify-content:center;
      pointer-events:none;
      z-index:9999;
    }
    .bottomInner{
      width:min(var(--containerMax), calc(100% - 28px));
      position:relative;
      pointer-events:none;
    }
    .homeBtn{
      position:absolute;
      left: var(--homeGap);
      bottom:0;
      width: var(--homeSize);
      height: var(--homeSize);
      border-radius: 50%;
      background: #bfe7ff;
      border:4px solid #000;
      box-shadow: var(--shadow);
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:auto;
      cursor:pointer;
    }
    .homeBtn svg{ width:34px;height:34px; }

    @media (max-width: 360px){
      .logo{ width:80px;height:80px; }
      .homeBtn{ width:56px;height:56px; }
      .homeBtn svg{ width:30px;height:30px; }
      .myNamePill{ font-size: 40px; }
      .nameBtn{ font-size: 28px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="frame">
      <div class="topbar">
        <div class="brandTitle">لعبة برا السالفة</div>
        <img class="logo" src="logo.PNG" alt="logo" />
      </div>

      <div class="badgeTitle" id="pageTitle">التصويت</div>

      <div id="content"></div>

      <!-- زر شراء للاعبين فقط (يختفي تلقائيًا بعد التصويت) -->
      <div class="buyArea" id="buyArea">
        <button class="buyBtn" id="buyBtn">لشراء اللعبة اضغط هنا</button>
      </div>

      <div class="err" id="err"></div>
      <div class="spacerBottom"></div>
    </div>
  </div>

  <div class="bottomBar">
    <div class="bottomInner">
      <button class="homeBtn" id="homeBtn" aria-label="الرئيسية" title="الرئيسية">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 11.5L12 4l9 7.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6.5 10.5V20h11V10.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <script type="module">
    import { ensureRoom, listenRoom, roomRef } from "./data/firebase.js";
    import { db } from "./data/firebase.js";
    import {
      runTransaction,
      updateDoc,
      serverTimestamp,
      increment
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    const pageTitle = document.getElementById("pageTitle");
    const content   = document.getElementById("content");
    const buyArea   = document.getElementById("buyArea");
    const buyBtn    = document.getElementById("buyBtn");
    const homeBtn   = document.getElementById("homeBtn");
    const errBox    = document.getElementById("err");

    function showErr(msg){
      errBox.textContent = msg;
      errBox.style.display = "block";
    }
    function hideErr(){
      errBox.textContent = "";
      errBox.style.display = "none";
    }
    function cleanName(x){ return String(x || "").trim(); }
    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    // room from URL
    const params = new URLSearchParams(location.search);
    const roomId = cleanName(params.get("room"));

    // ✅ تحديد المقدم (مثل آخر منطق عندكم)
    const HOST_ROOM_KEY = "bara_roomId_multi_v4";
    const hostRoomId = cleanName(sessionStorage.getItem(HOST_ROOM_KEY));
    const isHost = !!hostRoomId && hostRoomId === roomId;

    // استخراج اسم اللاعب/المقدم من التخزين (أكثر من مفتاح عشان ما نتعطل)
    const PLAYER_KEYS = [
      "bara_playerName_multi_v4",
      "bara_playerName_multi_v3",
      "bara_playerName_multi_v2",
      "bara_playerName_multi_v1"
    ];
    const HOST_KEYS = [
      "bara_hostName_multi_v4",
      "bara_hostName_multi_v3",
      "bara_hostName_multi_v2",
      "bara_hostName_multi_v1"
    ];
    function getStoredAny(keys){
      for(const k of keys){
        const a = cleanName(localStorage.getItem(k));
        if(a) return a;
        const b = cleanName(sessionStorage.getItem(k));
        if(b) return b;
      }
      return "";
    }
    function getMyName(){
      // المقدم غالبًا اسمه في HOST_KEYS، اللاعب في PLAYER_KEYS
      const hostName = getStoredAny(HOST_KEYS);
      const playerName = getStoredAny(PLAYER_KEYS);

      if(isHost) return hostName || playerName || "المقدم";
      return playerName || hostName || "لاعب";
    }
    const myName = getMyName();

    // زر شراء للاعبين فقط (قد يختفي بعد التصويت)
    buyArea.classList.toggle("hidden", isHost);
    buyBtn.addEventListener("click", () => {
      window.open("https://sandooq-m.com", "_blank", "noopener,noreferrer");
    });

    // الرئيسية: تنظيف للمقدم فقط
    function clearMultiState(){
      sessionStorage.removeItem("bara_roomId_multi_v4");
      sessionStorage.removeItem("bara_roomTs_multi_v4");
      sessionStorage.removeItem("bara_hostAdded_multi_v4");
      localStorage.removeItem("bara_hostName_multi_v4");
    }
    homeBtn.addEventListener("click", () => {
      if(isHost) clearMultiState();
      window.location.href = "index.html";
    });

    let selected = "";
    function renderVoting(names, arrived, total, alreadyVoted){
      pageTitle.textContent = "التصويت";
      const options = names.filter(n => cleanName(n) && cleanName(n) !== cleanName(myName));

      content.innerHTML = `
        <div class="bigCard">
          <div class="myNamePill">${escapeHtml(myName)}</div>

          <div class="hint">اختر الشخص الي تشك انه برا السالفة!</div>
          <div class="count">الواصل: ${arrived} من ${total}</div>

          <div class="list" id="list"></div>

          <button class="voteBtn" id="voteBtn" ${selected ? "" : "disabled"}>تصويت</button>
        </div>
      `;

      // في صفحة التصويت نخلي زر الشراء ظاهر للاعبين
      buyArea.classList.toggle("hidden", isHost);

      const list = document.getElementById("list");
      const voteBtn = document.getElementById("voteBtn");

      // لو كان مصوّت مسبقًا ما نعرض التصويت أساسًا (احتياط)
      if(alreadyVoted){
        renderWaiting(window.__lastRoomData || {}, names);
        return;
      }

      // بناء الأزرار
      if(!options.length){
        list.innerHTML = `<div class="msgText" style="font-size:20px;font-weight:900;">بانتظار أسماء اللاعبين…</div>`;
        voteBtn.disabled = true;
        return;
      }

      list.innerHTML = options.map(n => `
        <button class="nameBtn ${cleanName(selected)===cleanName(n) ? "selected" : ""}" data-name="${escapeHtml(n)}">
          ${escapeHtml(n)}
        </button>
      `).join("");

      list.querySelectorAll(".nameBtn").forEach(btn => {
        btn.addEventListener("click", () => {
          selected = btn.getAttribute("data-name") || "";
          // تحديث التحديد
          list.querySelectorAll(".nameBtn").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          voteBtn.disabled = !selected;
        });
      });

      voteBtn.addEventListener("click", async () => {
        hideErr();
        if(!selected) return;

        try{
          const ref = roomRef(roomId);

          await runTransaction(db, async (tx) => {
            const snap = await tx.get(ref);
            if(!snap.exists()) return;

            const d = snap.data() || {};
            const players = Array.isArray(d.players) ? d.players : [];
            const roomNames = players.map(p => cleanName(p?.name)).filter(Boolean);

            // لو اسمنا مو موجود بالوثيقة (نادر)، نسمح بالتصويت برضو بس ما نكسر
            const votes = (d.votes && typeof d.votes === "object") ? d.votes : {};

            // منع التصويت مرتين لنفس الاسم
            if(votes[myName]) return;

            votes[myName] = cleanName(selected);

            tx.update(ref, {
              votes,
              updatedAt: serverTimestamp(),
              tick: increment(1)
            });
          });

          // بعد التصويت مباشرة نعرض صفحة الانتظار + نتيجة التصويت
          // (بتتحدث تلقائيًا من listenRoom)

        }catch(e){
          console.warn(e);
          showErr("صار خطأ في الاتصال. حدّث الصفحة وجرب مرة ثانية.");
        }
      });
    }

    function renderWaiting(data, names){
      // نفس الصورة: "نتيجة التصويت 👀" + أسطر التصويتات + زر التالي للمقدم
      pageTitle.textContent = "نتيجة التصويت 👀";

      const votes = (data?.votes && typeof data.votes === "object") ? data.votes : {};
      const normalizedNames = names.map(cleanName).filter(Boolean);

      // نحسب الواصل من نفس قائمة الأسماء
      const arrived = Object.keys(votes).filter(v => normalizedNames.includes(cleanName(v))).length;
      const total = normalizedNames.length || Object.keys(votes).length;

      // نخفي زر الشراء في صفحة الانتظار (عشان تطابق الصورة)
      buyArea.classList.add("hidden");

      const lines = Object.keys(votes)
        .filter(voter => normalizedNames.includes(cleanName(voter)))
        .map(voter => {
          const to = votes[voter];
          return `
            <div class="voteLine">
              <span class="who">${escapeHtml(voter)}</span>
              <span class="verb">صوّت على</span>
              <span class="to">${escapeHtml(to)}</span>
            </div>
          `;
        });

      content.innerHTML = `
        <div class="bigCard" style="min-height:320px;">
          <div class="count" style="margin-top:0;">الواصل: ${arrived} من ${total}</div>
          <div class="list" style="margin-top:6px;">
            ${lines.length ? lines.join("") : `<div class="msgText" style="font-size:22px;font-weight:900;">بانتظار التصويت…</div>`}
          </div>

          ${
            isHost
              ? `<button class="nextBtn" id="nextBtn" ${arrived >= total && total > 0 ? "" : "disabled"}>التالي</button>`
              : ``
          }
        </div>
      `;

      if(isHost){
        const nextBtn = document.getElementById("nextBtn");
        nextBtn?.addEventListener("click", async () => {
          hideErr();
          if(nextBtn.disabled) return;

          try{
            // نثبت إن التصويت انتهى (بدون نقل لصفحة غير موجودة الآن)
            await updateDoc(roomRef(roomId), {
              phase: "after_vote",
              updatedAt: serverTimestamp(),
              tick: increment(1)
            });
          }catch(e){
            console.warn(e);
            showErr("صار خطأ في الاتصال. حدّث الصفحة وجرب مرة ثانية.");
          }
        });
      }
    }

    function renderByRoom(data){
      window.__lastRoomData = data || {};

      const phase = cleanName(data?.phase);
      const players = Array.isArray(data?.players) ? data.players : [];
      let names = players.map(p => cleanName(p?.name)).filter(Boolean);

      // احتياط: لو المقدم اسمه مو موجود بالقائمة، نضيفه مؤقتًا للعرض
      const hn = getStoredAny(HOST_KEYS);
      if(hn && !names.includes(cleanName(hn))) names = [...names, cleanName(hn)];

      const votes = (data?.votes && typeof data.votes === "object") ? data.votes : {};
      const arrived = Object.keys(votes).filter(v => names.includes(cleanName(v))).length;
      const total = names.length;

      const hasVoted = !!votes[myName];

      // لو ما حان وقت التصويت، نخليها شاشة انتظار
      if(phase && phase !== "vote" && phase !== "after_vote"){
        content.innerHTML = `
          <div class="bigCard" style="min-height:280px;">
            <div class="msgText" style="font-size:22px;font-weight:900;">
              بانتظار المقدم…
            </div>
          </div>
        `;
        // زر شراء للاعبين فقط
        buyArea.classList.toggle("hidden", isHost);
        return;
      }

      // بعد انتهاء التصويت (phase=after_vote) نخلي الجميع على صفحة الانتظار نفسها
      if(phase === "after_vote"){
        renderWaiting(data, names);
        return;
      }

      // phase === vote
      if(hasVoted){
        renderWaiting(data, names);
      }else{
        renderVoting(names, arrived, total, false);
      }
    }

    (async () => {
      if(!roomId){
        showErr("الرابط غير صحيح: رمز الغرفة غير موجود.");
        return;
      }

      try{
        await ensureRoom(roomId);

        // عرض مبدئي
        content.innerHTML = `
          <div class="bigCard" style="min-height:280px;">
            <div class="msgText" style="font-size:22px;font-weight:900;">جاري التحميل…</div>
          </div>
        `;

        listenRoom(roomId, (data) => {
          if(!data) return;
          renderByRoom(data);
        });

      }catch(e){
        console.warn(e);
        showErr("تعذر الاتصال. حدّث الصفحة وجرب مرة ثانية.");
      }
    })();
  </script>
</body>
</html>
