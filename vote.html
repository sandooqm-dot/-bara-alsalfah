<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>لعبة برا السالفة - التصويت (أجهزة متعددة)</title>

  <style>
    :root{
      --bg:#e9e4d6;
      --frame:#3f5a2a;
      --card:#6a8450;
      --card2:#d8cfb1;
      --text:#1b1b1b;
      --white:#ffffff;

      --yellow:#f2c21b;
      --yellowText:#111;

      --shadow: 0 10px 0 rgba(0,0,0,.25);

      --containerMax: 520px;
      --radiusBig: 26px;

      --boxPad: 22px;
      --boxMinH: 260px;

      --titleSize: 18px;
      --headerSize: 30px;

      --btnH: 62px;
      --btnRadius: 26px;

      --homeSize: 60px;
      --homeGap: 12px;

      --bottomGap: 34px;

      --blue:#8fcaff;
      --blue2:#bfe3ff;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      color:var(--text);
    }

    .wrap{
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:18px 14px 180px;
    }
    .frame{
      width:min(var(--containerMax), 100%);
      border:10px solid var(--frame);
      border-radius: var(--radiusBig);
      background:transparent;
      padding:18px 16px 24px;
      position:relative;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
    }
    .brandTitle{
      font-size:var(--titleSize);
      font-weight:700;
      color:#2f3f22;
      opacity:.95;
    }
    .logo{
      width:86px;height:86px;
      object-fit:contain;
    }

    .badgeTitle{
      margin:14px auto 16px;
      width:fit-content;
      max-width:100%;
      padding:14px 26px;
      border-radius: 22px;
      background: rgba(216,207,177,.9);
      color:#395427;
      font-weight:900;
      font-size: var(--headerSize);
      line-height:1;
      text-align:center;
    }

    .bigCard{
      background:var(--card);
      color:var(--white);
      border-radius: var(--radiusBig);
      padding: var(--boxPad);
      min-height: var(--boxMinH);
      box-shadow: 0 0 0 8px rgba(216,207,177,.75) inset;
      text-align:center;
      position:relative;
    }

    .subTitle{
      font-size: 22px;
      font-weight: 900;
      margin: 2px 0 8px;
      opacity: .95;
      line-height: 1.4;
    }
    .countLine{
      font-size: 22px;
      font-weight: 1000;
      color: var(--yellow);
      margin: 0 0 14px;
    }

    .list{
      display:flex;
      flex-direction:column;
      gap: 12px;
      margin-top: 10px;
    }
    .nameBtn{
      width: 92%;
      max-width: 420px;
      margin: 0 auto;
      height: 62px;
      border-radius: 20px;
      border: 4px solid #000;
      background:#fff;
      color:#000;
      font-size: 30px;
      font-weight: 1000;
      box-shadow: 0 8px 0 rgba(0,0,0,0.18);
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }
    .nameBtn:active{ transform: translateY(1px); box-shadow: 0 7px 0 rgba(0,0,0,0.18); }
    .nameBtn.selected{
      background: var(--blue2);
    }
    .nameBtn.voted{
      background: var(--blue);
    }
    .nameBtn.disabled{
      opacity:.55;
      cursor:not-allowed;
      filter: grayscale(.15);
    }

    .ctaArea{
      width:100%;
      display:flex;
      justify-content:center;
      margin-top: 16px;
    }
    .cta{
      height: var(--btnH);
      border-radius: var(--btnRadius);
      background: var(--yellow);
      color: var(--yellowText);
      border:4px solid #000;
      box-shadow: var(--shadow);
      font-size: 30px;
      font-weight:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      width: 86%;
      max-width: 420px;
      cursor:pointer;
      user-select:none;
      text-align:center;
      padding: 0 14px;
    }
    .cta:disabled{
      opacity:.55;
      cursor:not-allowed;
      filter: grayscale(.15);
    }
    .cta.compact{
      height: 62px;
      border-radius: 26px;
    }

    /* زر شراء للاعبين فقط */
    .buyArea{
      width:100%;
      display:flex;
      justify-content:center;
      margin-top: 14px;
    }
    .buyArea.hidden{ display:none; }
    .buyBtn{
      width: min(360px, 82%);
      border: 4px solid #000;
      border-radius: 22px;
      padding: 14px 18px;
      font-size: 28px;
      font-weight: 1000;
      box-shadow: 0 8px 0 rgba(0,0,0,0.18);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      text-align:center;
      background: var(--blue2);
      color:#111;
    }

    .err{
      width:100%;
      max-width: 420px;
      margin: 10px auto 0;
      color:#b00020;
      font-weight:900;
      text-align:center;
      display:none;
      line-height:1.4;
    }

    .bottomBar{
      position:fixed;
      left:0; right:0;
      bottom: calc(var(--bottomGap) + env(safe-area-inset-bottom));
      display:flex;
      justify-content:center;
      pointer-events:none;
      z-index:9999;
    }
    .bottomInner{
      width:min(var(--containerMax), calc(100% - 28px));
      position:relative;
      pointer-events:none;
    }
    .homeBtn{
      position:absolute;
      left: var(--homeGap);
      bottom:0;
      width: var(--homeSize);
      height: var(--homeSize);
      border-radius: 50%;
      background: #bfe7ff;
      border:4px solid #000;
      box-shadow: var(--shadow);
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:auto;
      cursor:pointer;
    }
    .homeBtn svg{ width:34px;height:34px; }

    @media (max-width: 360px){
      .logo{ width:80px;height:80px; }
      .homeBtn{ width:56px;height:56px; }
      .homeBtn svg{ width:30px;height:30px; }
      .nameBtn{ font-size: 28px; }
    }
  </style>
</head>

<body>

  <div class="wrap">
    <div class="frame">
      <div class="topbar">
        <div class="brandTitle">لعبة برا السالفة</div>
        <img class="logo" src="logo.PNG" alt="logo" />
      </div>

      <div class="badgeTitle" id="pageTitle">التصويت</div>

      <div class="bigCard" id="card">
        <!-- ديناميكي -->
      </div>

      <!-- زر شراء للاعبين فقط -->
      <div class="buyArea" id="buyArea">
        <button class="buyBtn" id="buyBtn">لشراء اللعبة اضغط هنا</button>
      </div>

      <div class="err" id="err"></div>
    </div>
  </div>

  <div class="bottomBar">
    <div class="bottomInner">
      <button class="homeBtn" id="homeBtn" aria-label="الرئيسية" title="الرئيسية">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 11.5L12 4l9 7.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6.5 10.5V20h11V10.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <script type="module">
    import { ensureRoom, listenRoom, roomRef } from "./data/firebase.js";
    import { db } from "./data/firebase.js";
    import {
      runTransaction,
      serverTimestamp,
      increment
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    const pageTitle = document.getElementById("pageTitle");
    const card      = document.getElementById("card");
    const buyArea   = document.getElementById("buyArea");
    const buyBtn    = document.getElementById("buyBtn");
    const homeBtn   = document.getElementById("homeBtn");
    const errBox    = document.getElementById("err");

    function showErr(msg){
      errBox.textContent = msg;
      errBox.style.display = "block";
    }
    function hideErr(){
      errBox.textContent = "";
      errBox.style.display = "none";
    }
    function cleanName(x){ return String(x || "").trim(); }
    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    const params = new URLSearchParams(location.search);
    const roomId = cleanName(params.get("room"));

    // ✅ تحديد المقدم (نفس اللي اعتمدناه)
    const HOST_ROOM_KEY = "bara_roomId_multi_v4";
    const hostRoomId = cleanName(sessionStorage.getItem(HOST_ROOM_KEY));
    const isHost = !!hostRoomId && hostRoomId === roomId;

    // اسم المقدم (لإضافة/مطابقة التصويت لو المقدم ضمن القائمة أو لا)
    const HOST_NAME_KEYS = ["bara_hostName_multi_v4","bara_hostName_multi_v3","bara_hostName_multi_v2","bara_hostName_multi_v1"];
    function getHostName(){
      for(const k of HOST_NAME_KEYS){
        const v = cleanName(localStorage.getItem(k));
        if(v) return v;
      }
      return "";
    }
    const hostName = getHostName();

    // اسم اللاعب
    const PLAYER_NAME_KEYS = [
      "bara_playerName_multi_v4","bara_playerName_multi_v3","bara_playerName_multi_v2","bara_playerName_multi_v1",
      "bara_name_multi_v4","bara_name_multi_v3"
    ];
    function getMyName(){
      if(isHost && hostName) return hostName;

      for(const k of PLAYER_NAME_KEYS){
        const v1 = cleanName(sessionStorage.getItem(k));
        if(v1) return v1;
        const v2 = cleanName(localStorage.getItem(k));
        if(v2) return v2;
      }
      return "";
    }
    const myName = getMyName();

    // زر شراء للاعبين فقط
    buyArea.classList.toggle("hidden", isHost);
    buyBtn.addEventListener("click", () => {
      window.open("https://sandooq-m.com", "_blank", "noopener,noreferrer");
    });

    function clearMultiState(){
      sessionStorage.removeItem("bara_roomId_multi_v4");
      sessionStorage.removeItem("bara_roomTs_multi_v4");
      sessionStorage.removeItem("bara_hostAdded_multi_v4");
      localStorage.removeItem("bara_hostName_multi_v4");
    }
    homeBtn.addEventListener("click", () => {
      if(isHost) clearMultiState();
      window.location.href = "index.html";
    });

    let selected = "";
    let lastRoom = null;

    function getAllNamesFromRoom(data){
      const players = Array.isArray(data?.players) ? data.players : [];
      const names = players.map(p => cleanName(p?.name)).filter(Boolean);

      // لو المقدم مو موجود ضمن اللاعبين، نضيفه (عشان المقدم يقدر يصوت وينحسب)
      if(hostName && !names.includes(hostName)){
        names.unshift(hostName);
      }
      // إزالة التكرارات
      const unique = [];
      for(const n of names){
        if(n && !unique.includes(n)) unique.push(n);
      }
      return unique;
    }

    function getVotesObj(data){
      const v = data?.votes;
      if(v && typeof v === "object") return v;
      return {};
    }

    function hasVoted(data){
      const votes = getVotesObj(data);
      return !!(myName && votes[myName]);
    }

    function renderVoting(data){
      pageTitle.textContent = "التصويت";

      const names = getAllNamesFromRoom(data);
      const votes = getVotesObj(data);
      const total = names.length;
      const arrived = Object.keys(votes).length;

      card.innerHTML = `
        <div class="subTitle">اختر الشخص اللي تشك انه برا السالفة!</div>
        <div class="countLine">الواصل: <span>${arrived}</span> من <span>${total}</span></div>
        <div class="list" id="list"></div>
        <div class="ctaArea">
          <button class="cta compact" id="voteBtn" disabled>تصويت</button>
        </div>
      `;

      const list = document.getElementById("list");
      const voteBtn = document.getElementById("voteBtn");

      // لو ما عنده اسم محفوظ
      if(!myName){
        showErr("اسم اللاعب غير محفوظ في هذا الجهاز. ارجع وادخل الاسم من جديد.");
        voteBtn.disabled = true;
      }

      // بناء الأزرار
      names.forEach(n => {
        const btn = document.createElement("button");
        btn.className = "nameBtn";
        btn.type = "button";
        btn.textContent = n;

        // تلوين إذا الشخص صوّت (دلالة وصول)
        if(Object.prototype.hasOwnProperty.call(votes, n)){
          btn.classList.add("voted");
        }

        if(selected === n) btn.classList.add("selected");

        btn.addEventListener("click", () => {
          hideErr();
          if(!myName) return;
          selected = n;

          // تحديث تمييز الاختيار
          [...list.querySelectorAll(".nameBtn")].forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");

          voteBtn.disabled = !selected;
        });

        list.appendChild(btn);
      });

      voteBtn.disabled = !selected || !myName;

      voteBtn.addEventListener("click", async () => {
        hideErr();
        if(!myName || !selected) return;

        const ref = roomRef(roomId);

        try{
          voteBtn.disabled = true;

          await runTransaction(db, async (tx) => {
            const snap = await tx.get(ref);
            if(!snap.exists()) return;

            const d = snap.data() || {};
            const votesNow = (d.votes && typeof d.votes === "object") ? d.votes : {};

            // لو صوّت قبل لا نغير
            if(votesNow[myName]) return;

            const nextVotes = { ...votesNow, [myName]: selected };

            tx.update(ref, {
              updatedAt: serverTimestamp(),
              tick: increment(1),
              votes: nextVotes
            });
          });

          // بعد التصويت نعرض الانتظار فوراً على نفس الصفحة
          renderWaiting(lastRoom || data, true);

        }catch(e){
          console.warn(e);
          showErr("صار خطأ في الاتصال. حدّث الصفحة وجرب مرة ثانية.");
          voteBtn.disabled = false;
        }
      });
    }

    function renderWaiting(data, forceVoted = false){
      pageTitle.textContent = "ما تأكدت صح ؟";

      const names = getAllNamesFromRoom(data);
      const votes = getVotesObj(data);
      const total = names.length;
      const arrived = Object.keys(votes).length;

      const iVoted = forceVoted ? true : hasVoted(data);

      card.innerHTML = `
        <div class="subTitle">بانتظار اللاعبين...</div>
        <div class="countLine">الواصل: <span>${arrived}</span> من <span>${total}</span></div>

        <div class="list" id="waitList"></div>

        ${isHost ? `
          <div class="ctaArea">
            <button class="cta compact" id="nextBtn" ${arrived >= total ? "" : "disabled"}>التالي</button>
          </div>
        ` : `
          <div class="ctaArea">
            <button class="cta compact" disabled>بانتظار المقدم…</button>
          </div>
        `}
      `;

      const waitList = document.getElementById("waitList");

      names.forEach(n => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "nameBtn disabled";

        // إذا هذا اللاعب صوّت (وصل) نخليه سماوي مثل الصورة
        const voted = Object.prototype.hasOwnProperty.call(votes, n);
        btn.classList.toggle("voted", voted);

        btn.textContent = n;
        waitList.appendChild(btn);
      });

      // لو ما صوّت وهو لاعب، نرجعه لصفحة التصويت
      if(!iVoted && !isHost){
        // اللاعب ما صوّت: نعرض التصويت بدل الانتظار
        renderVoting(data);
        return;
      }

      if(isHost){
        const nextBtn = document.getElementById("nextBtn");
        nextBtn?.addEventListener("click", () => {
          // الصفحة الجاية بنسويها بالخطوة القادمة
          // حالياً نخليها ثابتة عشان ما يصير 404
          showErr("تمام. الخطوة الجاية (نتيجة التصويت) بنضيفها بالملف القادم.");
        });
      }
    }

    function renderByRoom(data){
      lastRoom = data || lastRoom;

      // إذا اللاعب/المقدم صوّت -> يظل على الانتظار
      if(hasVoted(data)){
        renderWaiting(data);
        return;
      }

      // غير مصوّت -> يطلع له التصويت
      renderVoting(data);
    }

    (async () => {
      if(!roomId){
        showErr("الرابط غير صحيح: رمز الغرفة غير موجود.");
        return;
      }

      try{
        await ensureRoom(roomId);

        // عرض مبدئي
        card.innerHTML = `<div class="subTitle">جاري التحميل…</div>`;

        listenRoom(roomId, (data) => {
          if(!data) return;
          hideErr();
          renderByRoom(data);
        });

      }catch(e){
        console.warn(e);
        showErr("تعذر الاتصال. حدّث الصفحة وجرب مرة ثانية.");
      }
    })();
  </script>
</body>
</html>

<!-- vote.html برا السالفة – إصدار 1 -->
