<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>لعبة برا السالفة - التصويت</title>

  <style>
    :root{
      --bg:#e9e4d6;
      --frame:#3f5a2a;
      --card:#6a8450;
      --card2:#d8cfb1;
      --text:#1b1b1b;
      --white:#ffffff;

      --yellow:#f2c21b;
      --yellowText:#111;

      --shadow: 0 10px 0 rgba(0,0,0,.25);

      --containerMax: 520px;
      --radiusBig: 26px;
      --radiusMid: 18px;

      --boxPad: 22px;
      --boxMinH: 420px;

      --titleSize: 18px;
      --headerSize: 28px;
      --subTextSize: 20px;

      --btnH: 64px;
      --btnRadius: 26px;

      --homeSize: 60px;
      --homeGap: 12px;

      --bottomGap: 34px;

      --blue:#8fc7ff;
      --blue2:#bfe3ff;

      --itemH: 64px;
      --itemRadius: 26px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      color:var(--text);
    }

    .wrap{
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:18px 14px 180px;
    }
    .frame{
      width:min(var(--containerMax), 100%);
      border:10px solid var(--frame);
      border-radius: var(--radiusBig);
      background:transparent;
      padding:18px 16px 24px;
      position:relative;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
    }
    .brandTitle{
      font-size:var(--titleSize);
      font-weight:700;
      color:#2f3f22;
      opacity:.95;
    }
    .logo{
      width:86px;height:86px;
      object-fit:contain;
    }

    .badgeTitle{
      margin:14px auto 16px;
      width:fit-content;
      max-width:100%;
      padding:14px 28px;
      border-radius: 22px;
      background: rgba(216,207,177,.9);
      color:#395427;
      font-weight:1000;
      font-size: var(--headerSize);
      line-height:1;
      text-align:center;
    }

    .bigCard{
      background:var(--card);
      color:var(--white);
      border-radius: var(--radiusBig);
      padding: var(--boxPad);
      min-height: var(--boxMinH);
      box-shadow: 0 0 0 8px rgba(216,207,177,.75) inset;
      text-align:center;
    }

    .hint{
      font-size: var(--subTextSize);
      font-weight:900;
      line-height:1.5;
      margin: 6px 0 10px;
    }
    .arrived{
      font-size: 22px;
      font-weight:1000;
      margin: 0 0 14px;
      color: var(--yellow);
    }

    .list{
      width:100%;
      max-width: 420px;
      margin: 0 auto;
      display:flex;
      flex-direction:column;
      gap: 12px;
    }
    .nameBtn{
      height: var(--itemH);
      border-radius: var(--itemRadius);
      border: 4px solid #000;
      background:#fff;
      color:#111;
      font-size: 30px;
      font-weight:1000;
      box-shadow: 0 8px 0 rgba(0,0,0,0.18);
      cursor:pointer;
      text-align:center;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }
    .nameBtn.selected{
      background: var(--blue);
    }
    .nameBtn:active{ transform: translateY(1px); box-shadow: 0 7px 0 rgba(0,0,0,0.18); }
    .nameBtn.disabled{
      opacity:.6;
      cursor:not-allowed;
      filter: grayscale(.08);
    }

    .ctaArea{
      width:100%;
      display:flex;
      justify-content:center;
      margin-top: 16px;
    }
    .ctaArea.hidden{ display:none; }

    .cta{
      height: var(--btnH);
      border-radius: var(--btnRadius);
      background: var(--yellow);
      color: var(--yellowText);
      border:4px solid #000;
      box-shadow: var(--shadow);
      font-size: 30px;
      font-weight:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      width: 86%;
      max-width: 420px;
      margin: 0 auto;
      cursor:pointer;
      user-select:none;
      text-align:center;
      padding: 0 14px;
    }
    .cta:disabled{
      opacity:.55;
      cursor:not-allowed;
      filter: grayscale(.15);
    }

    .resultsWrap{
      width:100%;
      max-width: 420px;
      margin: 12px auto 0;
      display:flex;
      flex-direction:column;
      gap: 14px;
    }
    .resultLine{
      border-radius: 18px;
      background: rgba(0,0,0,0.22);
      padding: 16px 16px;
      font-size: 30px;
      font-weight:1000;
      line-height:1.2;
      display:flex;
      justify-content:center;
      gap: 10px;
      flex-wrap:wrap;
    }
    .resultLine .who{ color:#fff; }
    .resultLine .did{ color: var(--yellow); }
    .resultLine .to { color:#fff; }

    .hostNextArea{
      width:100%;
      display:flex;
      justify-content:center;
      margin-top: 18px;
    }
    .hostNextArea.hidden{ display:none; }

    .buyArea{
      width:100%;
      display:flex;
      justify-content:center;
      margin-top: 14px;
    }
    .buyArea.hidden{ display:none; }
    .buyBtn{
      width: min(360px, 82%);
      border: 4px solid #000;
      border-radius: 22px;
      padding: 14px 18px;
      font-size: 28px;
      font-weight: 1000;
      box-shadow: 0 8px 0 rgba(0,0,0,0.18);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      text-align:center;
      background: var(--blue2);
      color:#111;
    }
    .buyBtn:active{ transform: translateY(1px); box-shadow: 0 7px 0 rgba(0,0,0,0.18); }

    .err{
      width:100%;
      max-width: 420px;
      margin: 12px auto 0;
      color:#b00020;
      font-weight:900;
      text-align:center;
      display:none;
      line-height:1.4;
    }

    .spacerBottom{ height: 18px; }

    .bottomBar{
      position:fixed;
      left:0; right:0;
      bottom: calc(var(--bottomGap) + env(safe-area-inset-bottom));
      display:flex;
      justify-content:center;
      pointer-events:none;
      z-index:9999;
    }
    .bottomInner{
      width:min(var(--containerMax), calc(100% - 28px));
      position:relative;
      pointer-events:none;
    }
    .homeBtn{
      position:absolute;
      left: var(--homeGap);
      bottom:0;
      width: var(--homeSize);
      height: var(--homeSize);
      border-radius: 50%;
      background: #bfe7ff;
      border:4px solid #000;
      box-shadow: var(--shadow);
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:auto;
      cursor:pointer;
    }
    .homeBtn svg{ width:34px;height:34px; }

    @media (max-width: 360px){
      .logo{ width:80px;height:80px; }
      .homeBtn{ width:56px;height:56px; }
      .homeBtn svg{ width:30px;height:30px; }
      .nameBtn{ font-size: 28px; }
      .resultLine{ font-size: 28px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="frame">
      <div class="topbar">
        <div class="brandTitle">لعبة برا السالفة</div>
        <img class="logo" src="logo.PNG" alt="logo" />
      </div>

      <div class="badgeTitle" id="badgeTitle">التصويت</div>

      <div id="main"></div>

      <!-- زر شراء للاعبين فقط -->
      <div class="buyArea" id="buyArea">
        <button class="buyBtn" id="buyBtn">لشراء اللعبة اضغط هنا</button>
      </div>

      <div class="err" id="err"></div>
      <div class="spacerBottom"></div>
    </div>
  </div>

  <div class="bottomBar">
    <div class="bottomInner">
      <button class="homeBtn" id="homeBtn" aria-label="الرئيسية" title="الرئيسية">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 11.5L12 4l9 7.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6.5 10.5V20h11V10.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <script type="module">
    import { ensureRoom, listenRoom, roomRef } from "./data/firebase.js";
    import { db } from "./data/firebase.js";
    import {
      runTransaction,
      updateDoc,
      serverTimestamp,
      increment
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    const main     = document.getElementById("main");
    const buyArea  = document.getElementById("buyArea");
    const buyBtn   = document.getElementById("buyBtn");
    const homeBtn  = document.getElementById("homeBtn");
    const errBox   = document.getElementById("err");

    function showErr(msg){
      errBox.textContent = msg;
      errBox.style.display = "block";
    }
    function hideErr(){
      errBox.textContent = "";
      errBox.style.display = "none";
    }
    function clean(x){ return String(x || "").trim(); }
    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    const params = new URLSearchParams(location.search);
    const roomId = clean(params.get("room"));

    // ✅ تحديد المقدم (نفس الطريقة اللي اعتمدناها)
    const HOST_ROOM_KEY = "bara_roomId_multi_v4";
    const hostRoomId = clean(sessionStorage.getItem(HOST_ROOM_KEY));
    const isHost = !!hostRoomId && hostRoomId === roomId;

    // زر شراء للاعبين فقط
    buyArea.classList.toggle("hidden", isHost);

    buyBtn.addEventListener("click", () => {
      window.open("https://sandooq-m.com", "_blank", "noopener,noreferrer");
    });

    function clearMultiState(){
      sessionStorage.removeItem("bara_roomId_multi_v4");
      sessionStorage.removeItem("bara_roomTs_multi_v4");
      sessionStorage.removeItem("bara_hostAdded_multi_v4");
      localStorage.removeItem("bara_hostName_multi_v4");
    }
    homeBtn.addEventListener("click", () => {
      if(isHost) clearMultiState();
      window.location.href = "index.html";
    });

    function getMyName(){
      // 1) لو مقدم: جرّب مفاتيح اسم المقدم
      const hostKeys = [
        "bara_hostName_multi_v4",
        "bara_hostName_multi_v3",
        "bara_hostName_multi_v2",
        "bara_hostName_multi_v1"
      ];
      if(isHost){
        for(const k of hostKeys){
          const v = clean(localStorage.getItem(k));
          if(v) return v;
        }
      }

      // 2) لاعب: جرّب مفاتيح اسم اللاعب الشائعة
      const keys = [
        "bara_playerName_multi_v4",
        "bara_playerName_multi_v3",
        "bara_playerName_multi_v2",
        "bara_playerName_multi_v1",
        "bara_playerName_multi",
        "bara_playerName",
        "playerName",
        "name"
      ];

      for(const k of keys){
        const v1 = clean(sessionStorage.getItem(k));
        if(v1) return v1;
        const v2 = clean(localStorage.getItem(k));
        if(v2) return v2;
      }

      // 3) آخر حل: لو خزنت الاسم باسم عام
      const guess = clean(sessionStorage.getItem("bara_name")) || clean(localStorage.getItem("bara_name"));
      return guess || "";
    }

    const myName = getMyName();

    async function setRoom(fields){
      await updateDoc(roomRef(roomId), {
        ...fields,
        updatedAt: serverTimestamp(),
        tick: increment(1)
      });
    }

    function renderVoteUI(data){
      const players = Array.isArray(data?.players) ? data.players : [];
      const names = players.map(p => clean(p?.name)).filter(Boolean);

      const votes = data?.votes && typeof data.votes === "object" ? data.votes : {};
      const votedCount = Object.keys(votes).length;
      const total = names.length || 0;

      const myVote = clean(votes?.[myName]);
      letlet selected = myVote || "";

      // حفظ اختيار مؤقت لو ما صوت
      if(!myVote && window.__selectedVote){
        selected = window.__selectedVote;
      }

      main.innerHTML = `
        <div class="bigCard">
          <div class="hint">اختر الشخص الي تشك انه برا السالفة!</div>
          <div class="arrived">الواصل: ${votedCount} من ${total}</div>

          <div class="list" id="list"></div>

          <div class="ctaArea" style="margin-top:16px;">
            <button class="cta" id="voteBtn" ${myVote ? "disabled" : ""}>تصويت</button>
          </div>
        </div>
      `;

      const list = document.getElementById("list");
      const voteBtn = document.getElementById("voteBtn");

      // لو ما عندنا أسماء
      if(total < 2){
        voteBtn.disabled = true;
        showErr("عدد اللاعبين غير كافي للتصويت.");
        return;
      }

      // لو اسمي غير معروف
      if(!myName){
        voteBtn.disabled = true;
        showErr("اسمك غير موجود بالجهاز. ارجع لصفحة الانتظار وسجّل اسمك.");
        return;
      }

      // بناء الأزرار
      names.forEach(n => {
        const btn = document.createElement("button");
        btn.className = "nameBtn" + (selected === n ? " selected" : "") + (myVote ? " disabled" : "");
        btn.type = "button";
        btn.textContent = n;

        btn.addEventListener("click", () => {
          if(myVote) return;
          selected = n;
          window.__selectedVote = n;

          // تحديث الشكل
          [...list.querySelectorAll(".nameBtn")].forEach(x => x.classList.remove("selected"));
          btn.classList.add("selected");
        });

        list.appendChild(btn);
      });

      voteBtn.addEventListener("click", async () => {
        if(myVote) return;
        hideErr();

        const pick = clean(selected);
        if(!pick){
          showErr("اختر اسم قبل التصويت.");
          return;
        }

        // (اختياري) منع التصويت لنفسك:
        // if(pick === myName){ showErr("ما تقدر تصوّت لنفسك."); return; }

        voteBtn.disabled = true;

        try{
          const ref = roomRef(roomId);

          await runTransaction(db, async (tx) => {
            const snap = await tx.get(ref);
            if(!snap.exists()) return;

            const d = snap.data() || {};
            const players2 = Array.isArray(d?.players) ? d.players : [];
            const names2 = players2.map(p => clean(p?.name)).filter(Boolean);

            const votes2 = (d?.votes && typeof d.votes === "object") ? { ...d.votes } : {};

            // حماية: إذا كان صوت قبل لا نعيد
            const already = clean(votes2?.[myName]);
            if(already) return;

            // تحقق أن الاسم المختار موجود
            if(!names2.includes(pick)) return;

            votes2[myName] = pick;

            tx.update(ref, {
              updatedAt: serverTimestamp(),
              tick: increment(1),
              votes: votes2
            });
          });

          // بعد التصويت: يتحول لنفس صفحة الانتظار/عرض التصويتات
          window.__afterVote = true;

        }catch(e){
          console.warn(e);
          voteBtn.disabled = false;
          showErr("صار خطأ في الاتصال. حدّث الصفحة وجرب مرة ثانية.");
        }
      });
    }

    function renderResultsWait(data){
      const players = Array.isArray(data?.players) ? data.players : [];
      const names = players.map(p => clean(p?.name)).filter(Boolean);

      const votes = data?.votes && typeof data.votes === "object" ? data.votes : {};
      const votedCount = Object.keys(votes).length;
      const total = names.length || 0;

      // بناء سطور "فلان صوت على فلان"
      const lines = Object.entries(votes).map(([voter, target]) => {
        return `
          <div class="resultLine">
            <span class="who">${escapeHtml(voter)}</span>
            <span class="did">صوّت على</span>
            <span class="to">${escapeHtml(target)}</span>
          </div>
        `;
      });

      // زر التالي للمقدم فقط، وما يشتغل إلا إذا الكل صوّت
      const canNext = total > 0 && votedCount >= total;

      main.innerHTML = `
        <div class="bigCard">
          <div class="hint">بانتظار اللاعبين...</div>
          <div class="arrived">الواصل: ${votedCount} من ${total}</div>

          <div class="resultsWrap">
            ${lines.join("") || `
              <div class="resultLine">
                <span class="who">بانتظار أول تصويت…</span>
              </div>
            `}
          </div>

          <div class="hostNextArea ${isHost ? "" : "hidden"}">
            <button class="cta" id="nextBtn" ${canNext ? "" : "disabled"}>التالي</button>
          </div>
        </div>
      `;

      if(isHost){
        const nextBtn = document.getElementById("nextBtn");
        nextBtn.addEventListener("click", async () => {
          if(!canNext) return;
          hideErr();

          try{
            // نجهز للمرحلة التالية (بننشئ صفحتها بالخطوة القادمة)
            await setRoom({ phase: "reveal" });
            window.location.href = "reveal.html?room=" + encodeURIComponent(roomId);
          }catch(e){
            console.warn(e);
            showErr("صار خطأ في الاتصال. حدّث الصفحة وجرب مرة ثانية.");
          }
        });
      }
    }

    function renderByRoom(data){
      const phase = clean(data?.phase) || "vote";
      const votes = data?.votes && typeof data.votes === "object" ? data.votes : {};
      const myVote = clean(votes?.[myName]);

      // إذا الصفحة مو مرحلة التصويت
      if(phase !== "vote" && phase !== "vote_wait" && phase !== "vote_result" && phase !== "reveal"){
        // خلك هنا وانتظر
        main.innerHTML = `
          <div class="bigCard" style="min-height:380px; display:flex; align-items:center; justify-content:center;">
            <div class="hint">بانتظار المقدم…</div>
          </div>
        `;
        return;
      }

      // لو وصلنا للمرحلة التالية
      if(phase === "reveal"){
        window.location.href = "reveal.html?room=" + encodeURIComponent(roomId);
        return;
      }

      // إذا صوتت (أو كان عندي فلاغ بعد التصويت) → عرض التصويتات والانتظار
      if(myVote || window.__afterVote){
        renderResultsWait(data);
        return;
      }

      // غير كذا: واجهة التصويت
      renderVoteUI(data);
    }

    (async () => {
      if(!roomId){
        showErr("الرابط غير صحيح: رمز الغرفة غير موجود.");
        return;
      }

      try{
        await ensureRoom(roomId);

        // واجهة مؤقتة
        main.innerHTML = `
          <div class="bigCard" style="min-height:380px; display:flex; align-items:center; justify-content:center;">
            <div class="hint">جاري التحميل…</div>
          </div>
        `;

        listenRoom(roomId, (data) => {
          if(!data) return;
          renderByRoom(data);
        });

      }catch(e){
        console.warn(e);
        showErr("تعذر الاتصال. حدّث الصفحة وجرب مرة ثانية.");
      }
    })();
  </script>
</body>
</html>

<!-- vote.html برا السالفة – إصدار 1 -->
