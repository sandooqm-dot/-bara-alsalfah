<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>لعبة برا السالفة - التصويت (أجهزة متعددة)</title>

  <style>
    :root{
      --bg:#e9e4d6;
      --frame:#3f5a2a;
      --card:#6a8450;
      --card2:#d8cfb1;
      --text:#1b1b1b;
      --white:#ffffff;

      --yellow:#f2c21b;
      --yellowText:#111;

      --vote:#7b1f1f;   /* أحمر داكن */
      --shadow: 0 10px 0 rgba(0,0,0,.25);

      --containerMax: 520px;
      --radiusBig: 26px;
      --radiusMid: 18px;

      --boxPad: 22px;
      --boxMinH: 260px;

      --titleSize: 18px;
      --headerSize: 26px;
      --subTextSize: 20px;
      --nameBadgeSize: 46px;

      --btnH: 62px;
      --btnRadius: 26px;

      --homeSize: 60px;
      --homeGap: 12px;

      --bottomGap: 34px;

      --blue:#bfe3ff;
      --selected:#8fc6ff;

      --lineBg:#4f662f;
      --lineText:#fff;
      --lineAccent:#f2c21b;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      color:var(--text);
    }

    .wrap{
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:18px 14px 180px;
    }
    .frame{
      width:min(var(--containerMax), 100%);
      border:10px solid var(--frame);
      border-radius: var(--radiusBig);
      background:transparent;
      padding:18px 16px 24px;
      position:relative;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
    }
    .brandTitle{
      font-size:var(--titleSize);
      font-weight:700;
      color:#2f3f22;
      opacity:.95;
    }
    .logo{
      width:86px;height:86px;
      object-fit:contain;
    }

    .badgeTitle{
      margin:14px auto 16px;
      width:fit-content;
      max-width:100%;
      padding:14px 26px;
      border-radius: 22px;
      background: rgba(216,207,177,.9);
      color:#395427;
      font-weight:900;
      font-size: var(--headerSize);
      line-height:1;
      text-align:center;
    }

    .bigCard{
      background:var(--card);
      color:var(--white);
      border-radius: var(--radiusBig);
      padding: var(--boxPad);
      min-height: var(--boxMinH);
      box-shadow: 0 0 0 8px rgba(216,207,177,.75) inset;
      text-align:center;
      position:relative;
    }

    .nameBadge{
      margin: 6px auto 12px;
      width:fit-content;
      max-width:100%;
      padding: 12px 26px;
      border-radius: 22px;
      background: rgba(216,207,177,.95);
      color:#395427;
      font-weight:1000;
      font-size: var(--nameBadgeSize);
      line-height:1;
    }

    .hint{
      font-size: var(--subTextSize);
      font-weight:900;
      line-height:1.4;
      margin: 10px 0 6px;
      color:#fff;
    }

    .options{
      margin-top: 12px;
      display:flex;
      flex-direction:column;
      gap: 12px;
      align-items:center;
    }
    .pickBtn{
      width: min(420px, 92%);
      height: 64px;
      border-radius: 22px;
      border:4px solid #000;
      background:#fff;
      color:#111;
      font-size: 32px;
      font-weight:1000;
      box-shadow: var(--shadow);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .pickBtn.selected{
      background: var(--selected);
    }
    .pickBtn:disabled{
      opacity:.55;
      cursor:not-allowed;
      filter: grayscale(.1);
    }

    .voteBtn{
      margin: 16px auto 0;
      width: min(420px, 92%);
      height: 66px;
      border-radius: 26px;
      border:4px solid #000;
      background: var(--vote);
      color:#fff;
      font-size: 34px;
      font-weight:1000;
      box-shadow: var(--shadow);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .voteBtn:disabled{
      opacity:.55;
      cursor:not-allowed;
      filter: grayscale(.15);
    }

    .buyArea{
      width:100%;
      display:flex;
      justify-content:center;
      margin-top: 14px;
    }
    .buyArea.hidden{ display:none; }
    .buyBtn{
      width: min(360px, 82%);
      border: 4px solid #000;
      border-radius: 22px;
      padding: 14px 18px;
      font-size: 28px;
      font-weight: 1000;
      box-shadow: 0 8px 0 rgba(0,0,0,0.18);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      text-align:center;
      background: var(--blue);
      color:#111;
    }
    .buyBtn:active{ transform: translateY(1px); box-shadow: 0 7px 0 rgba(0,0,0,0.18); }

    .resultTitle{
      font-size: 30px;
      font-weight:1000;
      margin: 6px 0 12px;
      color:#fff;
      min-height: 36px;
    }

    .lines{
      display:flex;
      flex-direction:column;
      gap: 10px;
      margin-top: 8px;
      align-items:center;
    }
    .line{
      width: min(440px, 95%);
      padding: 14px 16px;
      border-radius: 22px;
      background: var(--lineBg);
      color: var(--lineText);
      font-size: 28px;
      font-weight:1000;
      text-align:center;
      border: 0;
    }
    .line .accent{ color: var(--lineAccent); }

    .hostNextArea{
      width:100%;
      display:flex;
      justify-content:center;
      margin-top: 16px;
    }
    .hostNextArea.hidden{ display:none; }
    .hostNext{
      width: min(420px, 92%);
      height: 66px;
      border-radius: 26px;
      border:4px solid #000;
      background: var(--yellow);
      color: var(--yellowText);
      font-size: 34px;
      font-weight:1000;
      box-shadow: var(--shadow);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .hostNext:disabled{
      opacity:.55;
      cursor:not-allowed;
      filter: grayscale(.15);
    }

    .err{
      width:100%;
      max-width: 420px;
      margin: 10px auto 0;
      color:#b00020;
      font-weight:900;
      text-align:center;
      display:none;
      line-height:1.4;
    }

    .spacerBottom{ height: 18px; }

    .bottomBar{
      position:fixed;
      left:0; right:0;
      bottom: calc(var(--bottomGap) + env(safe-area-inset-bottom));
      display:flex;
      justify-content:center;
      pointer-events:none;
      z-index:9999;
    }
    .bottomInner{
      width:min(var(--containerMax), calc(100% - 28px));
      position:relative;
      pointer-events:none;
    }
    .homeBtn{
      position:absolute;
      left: var(--homeGap);
      bottom:0;
      width: var(--homeSize);
      height: var(--homeSize);
      border-radius: 50%;
      background: #bfe7ff;
      border:4px solid #000;
      box-shadow: var(--shadow);
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:auto;
      cursor:pointer;
    }
    .homeBtn svg{ width:34px;height:34px; }

    @media (max-width: 360px){
      .logo{ width:80px;height:80px; }
      .homeBtn{ width:56px;height:56px; }
      .homeBtn svg{ width:30px;height:30px; }
      .nameBadge{ font-size: 40px; }
      .pickBtn{ font-size: 28px; }
      .voteBtn, .hostNext{ font-size: 30px; }
      .line{ font-size: 24px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="frame">
      <div class="topbar">
        <div class="brandTitle">لعبة برا السالفة</div>
        <img class="logo" src="logo.PNG" alt="logo" />
      </div>

      <div class="badgeTitle">التصويت</div>

      <div class="bigCard" id="card"></div>

      <div class="buyArea" id="buyArea">
        <button class="buyBtn" id="buyBtn">لشراء اللعبة اضغط هنا</button>
      </div>

      <div class="err" id="err"></div>
      <div class="spacerBottom"></div>
    </div>
  </div>

  <div class="bottomBar">
    <div class="bottomInner">
      <button class="homeBtn" id="homeBtn" aria-label="الرئيسية" title="الرئيسية">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 11.5L12 4l9 7.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6.5 10.5V20h11V10.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <script type="module">
    import { ensureRoom, listenRoom, roomRef } from "./data/firebase.js";
    import { db } from "./data/firebase.js";
    import {
      runTransaction,
      updateDoc,
      getDoc,
      serverTimestamp,
      increment
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    const card    = document.getElementById("card");
    const errBox  = document.getElementById("err");
    const buyArea = document.getElementById("buyArea");
    const buyBtn  = document.getElementById("buyBtn");
    const homeBtn = document.getElementById("homeBtn");

    function showErr(msg){
      errBox.textContent = msg;
      errBox.style.display = "block";
    }
    function hideErr(){
      errBox.textContent = "";
      errBox.style.display = "none";
    }
    function clean(x){ return String(x || "").trim(); }
    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    const params = new URLSearchParams(location.search);
    const roomId = clean(params.get("room"));

    const HOST_ROOM_KEY = "bara_roomId_multi_v4";
    const hostRoomId = clean(sessionStorage.getItem(HOST_ROOM_KEY));
    const isHost = !!hostRoomId && hostRoomId === roomId;

    buyArea.classList.toggle("hidden", isHost);
    buyBtn.addEventListener("click", () => {
      window.open("https://sandooq-m.com", "_blank", "noopener,noreferrer");
    });

    function clearMultiState(){
      sessionStorage.removeItem("bara_roomId_multi_v4");
      sessionStorage.removeItem("bara_roomTs_multi_v4");
      sessionStorage.removeItem("bara_hostAdded_multi_v4");
      localStorage.removeItem("bara_hostName_multi_v4");
    }
    homeBtn.addEventListener("click", () => {
      if(isHost) clearMultiState();
      window.location.href = "index.html";
    });

    const MY_NAME_KEYS = [
      "bara_myName_multi_v4","bara_playerName_multi_v4","bara_name_multi_v4",
      "bara_myName_multi_v3","bara_playerName_multi_v3",
      "bara_myName_multi_v2","bara_playerName_multi_v2",
      "bara_myName_multi_v1","bara_playerName_multi_v1",
      "bara_myName_multi","bara_playerName_multi",
      "bara_myName","bara_playerName"
    ];
    const HOST_NAME_KEYS = [
      "bara_hostName_multi_v4","bara_hostName_multi_v3","bara_hostName_multi_v2","bara_hostName_multi_v1"
    ];

    function getMyName(){
      const qn = clean(params.get("name"));
      if(qn) return qn;

      for(const k of MY_NAME_KEYS){
        const v1 = clean(sessionStorage.getItem(k));
        if(v1) return v1;
        const v2 = clean(localStorage.getItem(k));
        if(v2) return v2;
      }

      if(isHost){
        for(const k of HOST_NAME_KEYS){
          const v = clean(localStorage.getItem(k));
          if(v) return v;
        }
      }
      return "";
    }

    let myName = getMyName();
    let selectedTarget = "";
    let hasVotedLocal  = false;

    function getPlayersNames(data){
      const players = Array.isArray(data?.players) ? data.players : [];
      const names = players.map(p => clean(p?.name)).filter(Boolean);

      const seen = new Set();
      const unique = [];
      for(const n of names){
        if(!seen.has(n)){
          seen.add(n);
          unique.push(n);
        }
      }
      return unique;
    }

    function getVotesBy(data){
      return (data?.votesBy && typeof data.votesBy === "object") ? data.votesBy : {};
    }
    function countVotes(votesBy){
      return Object.keys(votesBy || {}).length;
    }

    function getVoteArrived(data){
      return (data?.voteArrived && typeof data.voteArrived === "object") ? data.voteArrived : {};
    }
    function countArrived(arrObj){
      return Object.keys(arrObj || {}).length;
    }

    async function ensureVoteSetupIfHost(data){
      if(!isHost) return;
      const roundId = clean(data?.roundId);
      if(!roundId) return;

      const voteRoundId = clean(data?.voteRoundId);
      if(voteRoundId === roundId) return;

      const ref = roomRef(roomId);
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(ref);
        if(!snap.exists()) return;
        const d = snap.data() || {};

        const r = clean(d?.roundId);
        if(!r) return;

        const vr = clean(d?.voteRoundId);
        if(vr === r) return;

        tx.update(ref, {
          voteRoundId: r,
          votesBy: {},
          voteArrived: {},
          updatedAt: serverTimestamp(),
          tick: increment(1)
        });
      });
    }

    let markedArrive = false;
    async function markArrivedIfNeeded(data){
      if(markedArrive) return;
      if(!myName) return;

      const names = getPlayersNames(data);
      if(!names.includes(myName)) return;

      const voteArrived = getVoteArrived(data);
      if(voteArrived?.[myName]){ markedArrive = true; return; }

      const ref = roomRef(roomId);
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(ref);
        if(!snap.exists()) return;
        const d = snap.data() || {};

        const players = Array.isArray(d.players) ? d.players : [];
        const ns = players.map(p => clean(p?.name)).filter(Boolean);
        if(!ns.includes(myName)) return;

        const va = (d?.voteArrived && typeof d.voteArrived === "object") ? {...d.voteArrived} : {};
        if(va[myName]) return;

        va[myName] = true;

        tx.update(ref, {
          voteArrived: va,
          updatedAt: serverTimestamp(),
          tick: increment(1)
        });
      });

      markedArrive = true;
    }

    function renderVoteUI(data){
      const names = getPlayersNames(data);

      if(!myName){
        card.innerHTML = `
          <div class="nameBadge">التصويت</div>
          <div class="hint" style="margin-top:10px;">
            ما قدرنا نحدد اسمك على هذا الجهاز.<br/>
            ارجع للصفحة السابقة ثم ادخل التصويت من جديد.
          </div>
        `;
        return;
      }

      const options = names.filter(n => n !== myName);

      card.innerHTML = `
        <div class="nameBadge">${escapeHtml(myName)}</div>
        <div class="hint">اختر الشخص الي تشك انه برا السالفة!</div>
        <div class="options" id="options"></div>
        <button class="voteBtn" id="voteBtn" disabled>تصويت</button>
      `;

      const optionsEl = document.getElementById("options");
      const voteBtn   = document.getElementById("voteBtn");

      for(const n of options){
        const b = document.createElement("button");
        b.className = "pickBtn" + (selectedTarget === n ? " selected" : "");
        b.textContent = n;

        b.addEventListener("click", () => {
          selectedTarget = (selectedTarget === n) ? "" : n;

          [...optionsEl.querySelectorAll(".pickBtn")].forEach(btn => btn.classList.remove("selected"));
          if(selectedTarget){
            b.classList.add("selected");
          }
          voteBtn.disabled = !selectedTarget;
        });

        optionsEl.appendChild(b);
      }

      voteBtn.disabled = !selectedTarget;

      voteBtn.addEventListener("click", async () => {
        hideErr();
        if(!selectedTarget) return;

        try{
          await submitVote(selectedTarget);
          hasVotedLocal = true;
        }catch(e){
          console.warn(e);
          showErr("صار خطأ في الاتصال. حدّث الصفحة وجرب مرة ثانية.");
        }
      });
    }

    function renderWaitAndResults(data){
      const votesBy = getVotesBy(data);
      const names   = getPlayersNames(data);
      const total   = Math.max(names.length, 1);

      const arrivedObj = getVoteArrived(data);
      const arrived    = countArrived(arrivedObj);

      const waitingText = (arrived < total) ? "بانتظار اللاعبين..." : "";

      const lines = Object.entries(votesBy || {}).map(([voter, target]) => {
        const v = clean(voter);
        const t = clean(target);
        if(!v || !t) return "";
        return `
          <div class="line">
            <span>${escapeHtml(v)}</span>
            <span class="accent"> صوّت على </span>
            <span>${escapeHtml(t)}</span>
          </div>
        `;
      }).filter(Boolean).join("");

      card.innerHTML = `
        <div class="nameBadge">نتائج التصويت</div>
        <div class="resultTitle">${waitingText}</div>

        <div class="lines">
          ${lines || `<div class="line"><span class="accent">بانتظار أول تصويت...</span></div>`}
        </div>

        <div class="hostNextArea ${isHost ? "" : "hidden"}" id="hostNextArea" style="margin-top:18px;">
          <button class="hostNext" id="hostNext" disabled>التالي</button>
        </div>
      `;

      if(isHost){
        const hostNext = document.getElementById("hostNext");
        const allVoted = countVotes(votesBy) >= total;
        const allArrived = arrived >= total;
        hostNext.disabled = !(allVoted && allArrived);

        hostNext.addEventListener("click", async () => {
          const allVotedNow = countVotes(getVotesBy(window.__lastData || data)) >= total;
          const allArrivedNow = countArrived(getVoteArrived(window.__lastData || data)) >= total;
          if(!(allVotedNow && allArrivedNow)) return;

          hideErr();
          try{
            await updateDoc(roomRef(roomId), {
              phase: "reveal",
              updatedAt: serverTimestamp(),
              tick: increment(1)
            });
          }catch(e){
            console.warn(e);
            showErr("صار خطأ في الاتصال. حدّث الصفحة وجرب مرة ثانية.");
          }
        });
      }
    }

    async function submitVote(targetName){
      if(!roomId) throw new Error("no room");
      if(!myName) throw new Error("no name");

      const ref = roomRef(roomId);

      await runTransaction(db, async (tx) => {
        const snap = await tx.get(ref);
        if(!snap.exists()) throw new Error("room missing");
        const d = snap.data() || {};

        const players = Array.isArray(d.players) ? d.players : [];
        const names = players.map(p => clean(p?.name)).filter(Boolean);

        if(!names.includes(myName)) throw new Error("name not in players");
        if(!names.includes(targetName)) throw new Error("target not in players");
        if(targetName === myName) throw new Error("self vote");

        const votesBy = (d.votesBy && typeof d.votesBy === "object") ? {...d.votesBy} : {};
        votesBy[myName] = targetName;

        tx.update(ref, {
          votesBy,
          updatedAt: serverTimestamp(),
          tick: increment(1)
        });
      });
    }

    function renderLoading(){
      card.innerHTML = `
        <div class="nameBadge">التصويت</div>
        <div class="hint">جاري التحميل...</div>
      `;
    }

    function renderWaitForHost(){
      card.innerHTML = `
        <div class="nameBadge">التصويت</div>
        <div class="hint">بانتظار المقدم...</div>
      `;
    }

    function decideAndRender(data){
      window.__lastData = data || {};

      myName = getMyName();
      const votesBy = getVotesBy(data);

      const iVoted = !!myName && !!votesBy && (votesBy[myName] != null);

      if(iVoted || hasVotedLocal){
        renderWaitAndResults(data);
      }else{
        renderVoteUI(data);
      }
    }

    // ✅ (جديد) حارس انتقال احتياطي: لو onSnapshot علّق عند اللاعبين، نفحص phase بـ getDoc كل ثانية
    let __redirected = false;
    let __phaseGuardTimer = null;

    function goReveal(){
      if(__redirected) return;
      __redirected = true;
      if(__phaseGuardTimer) clearInterval(__phaseGuardTimer);
      __phaseGuardTimer = null;
      window.location.replace("reveal.html?room=" + encodeURIComponent(roomId));
    }

    async function checkPhaseOnce(){
      if(__redirected) return;
      try{
        const snap = await getDoc(roomRef(roomId));
        if(!snap.exists()) return;
        const d = snap.data() || {};
        const phase = clean(d?.phase);
        if(phase === "reveal" || phase === "reveal_done"){
          goReveal();
        }
      }catch(e){
        // نتجاهل أي خطأ مؤقت
      }
    }

    function startPhaseGuard(){
      if(__phaseGuardTimer) return;
      __phaseGuardTimer = setInterval(checkPhaseOnce, 1000);
      document.addEventListener("visibilitychange", () => {
        if(document.visibilityState === "visible"){
          checkPhaseOnce();
        }
      });
    }

    (async () => {
      if(!roomId){
        showErr("الرابط غير صحيح: رمز الغرفة غير موجود.");
        renderWaitForHost();
        return;
      }

      try{
        await ensureRoom(roomId);
        renderLoading();

        // ✅ تشغيل الحارس الاحتياطي
        startPhaseGuard();
        // فحص فوري
        checkPhaseOnce();

        listenRoom(roomId, async (data) => {
          if(!data) return;

          const phase = clean(data?.phase);

          // ✅ إذا انتقلنا للكشف: نروح reveal.html للجميع
          if(phase === "reveal" || phase === "reveal_done"){
            goReveal();
            return;
          }

          try{ await ensureVoteSetupIfHost(data); }catch(e){}

          const votesBy = getVotesBy(data);
          const iVotedNow = !!getMyName() && (votesBy[getMyName()] != null);
          if(iVotedNow || hasVotedLocal){
            try{ await markArrivedIfNeeded(data); }catch(e){}
          }

          decideAndRender(data);
        });

      }catch(e){
        console.warn(e);
        showErr("تعذر الاتصال. حدّث الصفحة وجرب مرة ثانية.");
        renderWaitForHost();
      }
    })();
  </script>
</body>
</html>
