<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>لعبة برا السالفة - التصويت</title>

  <style>
    :root{
      --bg:#e9e4d6;
      --frame:#3f5a2a;
      --card:#6a8450;
      --cardInset:#d8cfb1;
      --text:#1b1b1b;
      --white:#ffffff;

      --yellow:#f2c21b;
      --yellowText:#111;

      --blue:#bfe3ff;

      --shadow: 0 10px 0 rgba(0,0,0,.25);

      --containerMax: 520px;
      --radiusBig: 26px;
      --radiusMid: 18px;

      --btnH: 62px;
      --btnRadius: 26px;

      --homeSize: 60px;
      --homeGap: 12px;
      --bottomGap: 34px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      color:var(--text);
    }

    .wrap{
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:18px 14px 180px;
    }
    .frame{
      width:min(var(--containerMax), 100%);
      border:10px solid var(--frame);
      border-radius: var(--radiusBig);
      background:transparent;
      padding:18px 16px 24px;
      position:relative;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
    }
    .brandTitle{
      font-size:18px;
      font-weight:700;
      color:#2f3f22;
      opacity:.95;
    }
    .logo{
      width:86px;height:86px;
      object-fit:contain;
    }

    .badgeTitle{
      margin:14px auto 16px;
      width:fit-content;
      max-width:100%;
      padding:14px 26px;
      border-radius: 22px;
      background: rgba(216,207,177,.9);
      color:#395427;
      font-weight:1000;
      font-size: 28px;
      line-height:1;
      text-align:center;
    }

    .bigCard{
      background:var(--card);
      color:var(--white);
      border-radius: var(--radiusBig);
      padding: 18px 18px 18px;
      box-shadow: 0 0 0 8px rgba(216,207,177,.75) inset;
      text-align:center;
    }

    .titleLine{
      font-size: 26px;
      font-weight: 1000;
      line-height:1.25;
      margin: 2px 0 10px;
    }
    .countLine{
      font-size: 20px;
      font-weight: 1000;
      color: var(--yellow);
      margin: 0 0 14px;
    }

    .list{
      width:100%;
      max-width: 420px;
      margin: 0 auto;
      display:flex;
      flex-direction:column;
      gap: 12px;
      padding: 6px 0 0;
    }

    .nameBtn{
      width:100%;
      height: 64px;
      border-radius: 18px;
      border: 4px solid #000;
      background:#fff;
      color:#111;
      font-size: 28px;
      font-weight: 1000;
      cursor:pointer;
      box-shadow: 0 8px 0 rgba(0,0,0,0.18);
      -webkit-tap-highlight-color:transparent;
    }
    .nameBtn:active{ transform: translateY(1px); box-shadow: 0 7px 0 rgba(0,0,0,0.18); }
    .nameBtn.selected{
      background: var(--blue);
    }
    .nameBtn:disabled{
      opacity:.6;
      cursor:not-allowed;
      filter: grayscale(.1);
    }

    .ctaArea{
      width:100%;
      display:flex;
      justify-content:center;
      margin-top: 14px;
    }
    .cta{
      height: var(--btnH);
      border-radius: var(--btnRadius);
      background: var(--yellow);
      color: var(--yellowText);
      border:4px solid #000;
      box-shadow: var(--shadow);
      font-size: 28px;
      font-weight:1000;
      display:flex;
      align-items:center;
      justify-content:center;
      width: 86%;
      max-width: 420px;
      margin: 0 auto;
      cursor:pointer;
      user-select:none;
      text-align:center;
      padding: 0 14px;
    }
    .cta:disabled{
      opacity:.55;
      cursor:not-allowed;
      filter: grayscale(.15);
    }

    /* زر شراء للاعبين فقط (يظهر بعد التصويت) */
    .buyArea{
      width:100%;
      display:flex;
      justify-content:center;
      margin-top: 14px;
    }
    .buyArea.hidden{ display:none; }
    .buyBtn{
      width: min(360px, 82%);
      border: 4px solid #000;
      border-radius: 22px;
      padding: 14px 18px;
      font-size: 28px;
      font-weight: 1000;
      box-shadow: 0 8px 0 rgba(0,0,0,0.18);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      text-align:center;
      background: var(--blue);
      color:#111;
    }
    .buyBtn:active{ transform: translateY(1px); box-shadow: 0 7px 0 rgba(0,0,0,0.18); }

    .err{
      width:100%;
      max-width: 420px;
      margin: 10px auto 0;
      color:#b00020;
      font-weight:900;
      text-align:center;
      display:none;
      line-height:1.4;
    }

    .bottomBar{
      position:fixed;
      left:0; right:0;
      bottom: calc(var(--bottomGap) + env(safe-area-inset-bottom));
      display:flex;
      justify-content:center;
      pointer-events:none;
      z-index:9999;
    }
    .bottomInner{
      width:min(var(--containerMax), calc(100% - 28px));
      position:relative;
      pointer-events:none;
    }
    .homeBtn{
      position:absolute;
      left: var(--homeGap);
      bottom:0;
      width: var(--homeSize);
      height: var(--homeSize);
      border-radius: 50%;
      background: #bfe7ff;
      border:4px solid #000;
      box-shadow: var(--shadow);
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:auto;
      cursor:pointer;
    }
    .homeBtn svg{ width:34px;height:34px; }

    @media (max-width: 360px){
      .logo{ width:80px;height:80px; }
      .homeBtn{ width:56px;height:56px; }
      .homeBtn svg{ width:30px;height:30px; }
      .nameBtn{ font-size: 26px; height: 62px; }
    }
  </style>
</head>

<body>

  <div class="wrap">
    <div class="frame">
      <div class="topbar">
        <div class="brandTitle">لعبة برا السالفة</div>
        <img class="logo" src="logo.PNG" alt="logo" />
      </div>

      <div class="badgeTitle" id="pageTitle">التصويت</div>

      <div id="content"></div>

      <!-- زر المقدم فقط -->
      <div class="ctaArea" id="ctaArea">
        <button class="cta" id="ctaBtn" disabled>التالي</button>
      </div>

      <!-- زر الشراء للاعبين فقط (بعد التصويت) -->
      <div class="buyArea hidden" id="buyArea">
        <button class="buyBtn" id="buyBtn">لشراء اللعبة اضغط هنا</button>
      </div>

      <div class="err" id="err"></div>
    </div>
  </div>

  <div class="bottomBar">
    <div class="bottomInner">
      <button class="homeBtn" id="homeBtn" aria-label="الرئيسية" title="الرئيسية">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 11.5L12 4l9 7.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6.5 10.5V20h11V10.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <script type="module">
    import { ensureRoom, listenRoom, roomRef } from "./data/firebase.js";
    import { db } from "./data/firebase.js";
    import {
      runTransaction,
      serverTimestamp,
      increment
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    const pageTitle = document.getElementById("pageTitle");
    const content   = document.getElementById("content");
    const ctaArea   = document.getElementById("ctaArea");
    const ctaBtn    = document.getElementById("ctaBtn");
    const buyArea   = document.getElementById("buyArea");
    const buyBtn    = document.getElementById("buyBtn");
    const homeBtn   = document.getElementById("homeBtn");
    const errBox    = document.getElementById("err");

    const KEY_PLAYER_NAME = "bara_playerName_multi"; // نفس wait.html
    const KEY_VOTED_ROOM  = "bara_votedRoom_multi";

    function showErr(msg){
      errBox.textContent = msg;
      errBox.style.display = "block";
    }
    function hideErr(){
      errBox.textContent = "";
      errBox.style.display = "none";
    }
    function cleanName(x){ return String(x || "").trim(); }

    // room from URL
    const params = new URLSearchParams(location.search);
    const roomId = cleanName(params.get("room"));

    // تحديد هل هذا الجهاز مقدم
    const HOST_KEYS = [
      "bara_hostName_multi_v4",
      "bara_hostName_multi_v3",
      "bara_hostName_multi_v2",
      "bara_hostName_multi_v1"
    ];
    function getHostName(){
      for(const k of HOST_KEYS){
        const v = cleanName(localStorage.getItem(k));
        if(v) return v;
      }
      return "";
    }
    const hostNameLocal = getHostName();
    const isHost = !!hostNameLocal;

    // اسم المصوّت (لاعب أو مقدم)
    const voterName = cleanName(isHost ? hostNameLocal : sessionStorage.getItem(KEY_PLAYER_NAME));

    // زر المقدم فقط
    ctaArea.style.display = isHost ? "flex" : "none";

    buyBtn.addEventListener("click", () => {
      window.open("https://sandooq-m.com", "_blank", "noopener,noreferrer");
    });

    function clearMultiState(){
      sessionStorage.removeItem("bara_roomId_multi_v4");
      sessionStorage.removeItem("bara_roomTs_multi_v4");
      sessionStorage.removeItem("bara_hostAdded_multi_v4");
      localStorage.removeItem("bara_hostName_multi_v4");
    }
    homeBtn.addEventListener("click", () => {
      clearMultiState();
      window.location.href = "index.html";
    });

    function uniqKeepOrder(arr){
      const s = new Set();
      const out = [];
      for(const x of (arr || [])){
        const v = cleanName(x);
        if(!v) continue;
        if(s.has(v)) continue;
        s.add(v);
        out.push(v);
      }
      return out;
    }

    function sortPlayers(list){
      return (list || []).slice().sort((a,b)=>{
        const aa = Number(a?.joinedAt || 0);
        const bb = Number(b?.joinedAt || 0);
        return aa - bb;
      });
    }

    function renderVoteUI(names, votesCount, totalCount, selected){
      pageTitle.textContent = "التصويت";
      const listHtml = names.map(n => {
        const sel = (selected === n) ? "selected" : "";
        return `<button class="nameBtn ${sel}" data-name="${encodeURIComponent(n)}">${n}</button>`;
      }).join("");

      content.innerHTML = `
        <div class="bigCard">
          <div class="titleLine">بانتظار تصويت اللاعبين...</div>
          <div class="countLine">الواصل: ${votesCount} من ${totalCount}</div>
          <div class="list">${listHtml}</div>
        </div>
      `;

      // لا نظهر زر الشراء أثناء التصويت
      buyArea.classList.add("hidden");

      // ربط أزرار الأسماء
      const btns = Array.from(content.querySelectorAll(".nameBtn"));
      for(const b of btns){
        b.addEventListener("click", async () => {
          if(!voterName){
            showErr("اسمك غير موجود. ارجع صفحة الدخول ثم ادخل اسمك.");
            return;
          }

          const already = cleanName(sessionStorage.getItem(KEY_VOTED_ROOM));
          if(already === roomId) return;

          const chosen = decodeURIComponent(b.getAttribute("data-name") || "");
          if(!chosen) return;

          hideErr();

          // تحديث اختيار شكليًا فورًا
          btns.forEach(x => x.classList.toggle("selected", x === b));

          // منع الضغط المتكرر أثناء الإرسال
          btns.forEach(x => x.disabled = true);

          try{
            const ref = roomRef(roomId);

            await runTransaction(db, async (tx) => {
              const snap = await tx.get(ref);
              if(!snap.exists()) return;

              const d = snap.data() || {};
              const votes = (d.votes && typeof d.votes === "object") ? d.votes : {};

              // إذا صوّت من قبل، لا نغير
              const prev = cleanName(votes[voterName]);
              if(prev) return;

              votes[voterName] = chosen;

              tx.update(ref, {
                updatedAt: serverTimestamp(),
                tick: increment(1),
                votes
              });
            });

            sessionStorage.setItem(KEY_VOTED_ROOM, roomId);

          }catch(e){
            console.warn(e);
            btns.forEach(x => x.disabled = false);
            showErr("صار خطأ في الاتصال. حدّث الصفحة وجرب مرة ثانية.");
          }
        });
      }
    }

    function renderWaitingAfterVote(votesCount, totalCount){
      // نفس فكرة الصورة الثانية (بانتظار المقدم)
      pageTitle.textContent = "ما تأكدت صح ؟";
      content.innerHTML = `
        <div class="bigCard" style="min-height:320px;">
          <div style="font-size:24px;font-weight:1000;line-height:1.7;">
            بانتظار المقدم...
            <div style="margin-top:14px;font-size:20px;color:var(--yellow);">
              الواصل: ${votesCount} من ${totalCount}
            </div>
          </div>
        </div>
      `;

      // بعد التصويت: يظهر زر الشراء للاعبين فقط
      if(!isHost){
        buyArea.classList.remove("hidden");
      }else{
        buyArea.classList.add("hidden");
      }

      // زر التالي للمقدم (ينتقل للمرحلة التالية لاحقًا)
      if(isHost){
        ctaBtn.textContent = "التالي";
      }
    }

    async function setPhase(newPhase){
      const ref = roomRef(roomId);
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(ref);
        if(!snap.exists()) return;
        tx.update(ref, {
          updatedAt: serverTimestamp(),
          tick: increment(1),
          phase: newPhase
        });
      });
    }

    ctaBtn.addEventListener("click", async () => {
      if(!isHost) return;
      hideErr();

      try{
        const d = window.__lastRoomData || {};
        const phase = cleanName(d?.phase);

        // بعد اكتمال التصويت، نحول الجميع لصفحة "انتظار بعد التصويت" داخل نفس vote.html
        if(phase === "vote"){
          await setPhase("vote_wait");
          return;
        }

        // المرحلة التالية بنسويها بعدين (النتيجة/الكشف)
        if(phase === "vote_wait"){
          // مؤقتًا: لا شيء
          return;
        }

      }catch(e){
        console.warn(e);
        showErr("صار خطأ في الاتصال. حدّث الصفحة وجرب مرة ثانية.");
      }
    });

    function getAllNamesFromRoom(data){
      const players = Array.isArray(data?.players) ? data.players : [];
      const ordered = sortPlayers(players);
      const firestoreNames = ordered.map(p => cleanName(p?.name)).filter(Boolean);

      const hostName =
        cleanName(data?.hostName) ||
        cleanName(data?.host?.name) ||
        cleanName(data?.host) ||
        "";

      let all = [];
      if(hostName) all.push(hostName);
      all = all.concat(firestoreNames);

      return uniqKeepOrder(all);
    }

    function renderByRoom(data){
      window.__lastRoomData = data || {};

      const phase = cleanName(data?.phase);

      // الأصوات
      const votesObj = (data?.votes && typeof data.votes === "object") ? data.votes : {};
      const votesCount = Object.keys(votesObj).length;

      // إجمالي المصوتين (نحسبها من الأسماء الموجودة)
      const allNames = getAllNamesFromRoom(data);
      const totalCount = allNames.length || 0;

      // إذا ما وصل للـ vote لسه، نخليه ينتظر
      if(phase !== "vote" && phase !== "vote_wait"){
        pageTitle.textContent = "التصويت";
        content.innerHTML = `
          <div class="bigCard" style="min-height:280px;">
            <div style="font-size:24px;font-weight:1000;line-height:1.7;">
              بانتظار المقدم...
            </div>
          </div>
        `;
        if(!isHost){
          buyArea.classList.remove("hidden");
        }else{
          buyArea.classList.add("hidden");
        }
        return;
      }

      // قائمة التصويت: كل الأسماء ما عدا المصوّت نفسه
      const options = allNames.filter(n => n && n !== voterName);

      // إذا المصوّت صوّت من قبل (على نفس الغرفة)
      const already = cleanName(sessionStorage.getItem(KEY_VOTED_ROOM)) === roomId;
      const votedChoice = cleanName(votesObj[voterName]);

      if(phase === "vote"){
        // المقدم: زر التالي لا يفتح إلا بعد اكتمال التصويت من الكل
        if(isHost){
          ctaBtn.disabled = !(totalCount > 0 && votesCount >= totalCount);
        }

        // اللاعب بعد التصويت نعرض له انتظار مباشرة (بدون يقدر يصوت مرة ثانية)
        if(already || votedChoice){
          renderWaitingAfterVote(votesCount, totalCount);
          return;
        }

        renderVoteUI(options, votesCount, totalCount, "");
        return;
      }

      if(phase === "vote_wait"){
        if(isHost){
          // هنا نقدر نفتح التالي لاحقًا لصفحة النتائج
          ctaBtn.disabled = false;
        }
        renderWaitingAfterVote(votesCount, totalCount);
        return;
      }
    }

    (async () => {
      if(!roomId){
        showErr("الرابط غير صحيح: رمز الغرفة غير موجود.");
        ctaBtn.disabled = true;
        return;
      }

      if(!voterName){
        // نتركه يفتح الصفحة لكن نوضح المشكلة عند محاولة التصويت
      }

      try{
        await ensureRoom(roomId);

        // عرض مبدئي
        pageTitle.textContent = "التصويت";
        content.innerHTML = `
          <div class="bigCard" style="min-height:280px;">
            <div style="font-size:24px;font-weight:1000;line-height:1.7;">
              بانتظار المقدم...
            </div>
          </div>
        `;

        listenRoom(roomId, (data) => {
          if(!data) return;
          renderByRoom(data);
        });

      }catch(e){
        console.warn(e);
        showErr("تعذر الاتصال. حدّث الصفحة وجرب مرة ثانية.");
      }
    })();
  </script>
</body>
</html>

<!-- vote.html برا السالفة – إصدار 1 -->
