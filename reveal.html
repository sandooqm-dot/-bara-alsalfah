<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>لعبة برا السالفة - كشف برا السالفة (أجهزة متعددة)</title>

  <style>
    :root{
      --bg:#e9e4d6;
      --frame:#3f5a2a;
      --card:#6a8450;
      --card2:#d8cfb1;
      --text:#1b1b1b;
      --white:#ffffff;

      --yellow:#f2c21b;
      --yellowText:#111;

      --shadow: 0 10px 0 rgba(0,0,0,.25);

      --containerMax: 520px;
      --radiusBig: 26px;

      --boxPad: 22px;
      --boxMinH: 360px;

      --titleSize: 18px;
      --headerSize: 26px;

      --revealTitle: 34px;
      --revealName: 68px;

      --btnH: 66px;
      --btnRadius: 26px;

      --homeSize: 60px;
      --homeGap: 12px;

      --bottomGap: 34px;

      --innerBg:#5f7a46; /* نفس روح الصورة */
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      color:var(--text);
    }

    .wrap{
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:18px 14px 180px;
    }
    .frame{
      width:min(var(--containerMax), 100%);
      border:10px solid var(--frame);
      border-radius: var(--radiusBig);
      background:transparent;
      padding:18px 16px 24px;
      position:relative;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
    }
    .brandTitle{
      font-size:var(--titleSize);
      font-weight:700;
      color:#2f3f22;
      opacity:.95;
    }
    .logo{
      width:86px;height:86px;
      object-fit:contain;
    }

    .bigCard{
      background:transparent;
      border-radius: var(--radiusBig);
      padding: 0;
      min-height: var(--boxMinH);
      position:relative;
    }

    /* نفس الشكل بالصورة: مربع أخضر كبير داخلي */
    .innerCard{
      background: var(--card);
      border-radius: var(--radiusBig);
      padding: var(--boxPad);
      min-height: var(--boxMinH);
      box-shadow: 0 0 0 8px rgba(216,207,177,.75) inset;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      position:relative;
      color:#fff;
    }
    .innerPanel{
      width: 100%;
      max-width: 460px;
      border-radius: 26px;
      background: rgba(0,0,0,.08);
      padding: 22px 18px;
    }

    .revealTitle{
      font-size: var(--revealTitle);
      font-weight: 1000;
      line-height: 1.25;
      margin-bottom: 26px;
      color:#fff;
    }
    .revealName{
      font-size: var(--revealName);
      font-weight: 1000;
      line-height: 1.1;
      color:#fff;
      margin: 0;
      padding: 0 8px;
    }

    .hostNextArea{
      width:100%;
      display:flex;
      justify-content:center;
      margin-top: 18px;
    }
    .hostNextArea.hidden{ display:none; }

    .hostNext{
      width: min(420px, 92%);
      height: var(--btnH);
      border-radius: var(--btnRadius);
      border:4px solid #000;
      background: var(--yellow);
      color: var(--yellowText);
      font-size: 34px;
      font-weight:1000;
      box-shadow: var(--shadow);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .hostNext:disabled{
      opacity:.55;
      cursor:not-allowed;
      filter: grayscale(.15);
    }

    .hint{
      font-size: 22px;
      font-weight: 900;
      line-height:1.5;
      color:#fff;
      opacity:.95;
    }

    .err{
      width:100%;
      max-width: 420px;
      margin: 10px auto 0;
      color:#b00020;
      font-weight:900;
      text-align:center;
      display:none;
      line-height:1.4;
    }

    .spacerBottom{ height: 18px; }

    .bottomBar{
      position:fixed;
      left:0; right:0;
      bottom: calc(var(--bottomGap) + env(safe-area-inset-bottom));
      display:flex;
      justify-content:center;
      pointer-events:none;
      z-index:9999;
    }
    .bottomInner{
      width:min(var(--containerMax), calc(100% - 28px));
      position:relative;
      pointer-events:none;
    }
    .homeBtn{
      position:absolute;
      left: var(--homeGap);
      bottom:0;
      width: var(--homeSize);
      height: var(--homeSize);
      border-radius: 50%;
      background: #bfe7ff;
      border:4px solid #000;
      box-shadow: var(--shadow);
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:auto;
      cursor:pointer;
    }
    .homeBtn svg{ width:34px;height:34px; }

    @media (max-width: 360px){
      .logo{ width:80px;height:80px; }
      .homeBtn{ width:56px;height:56px; }
      .homeBtn svg{ width:30px;height:30px; }
      .revealTitle{ font-size: 28px; }
      .revealName{ font-size: 54px; }
      .hostNext{ font-size: 30px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="frame">
      <div class="topbar">
        <div class="brandTitle">لعبة برا السالفة</div>
        <img class="logo" src="logo.PNG" alt="logo" />
      </div>

      <div class="bigCard" id="card">
        <div class="innerCard">
          <div class="innerPanel">
            <div class="hint">جاري التحميل...</div>
          </div>
        </div>
      </div>

      <div class="hostNextArea hidden" id="hostNextArea">
        <button class="hostNext" id="hostNext" disabled>التالي</button>
      </div>

      <div class="err" id="err"></div>
      <div class="spacerBottom"></div>
    </div>
  </div>

  <div class="bottomBar">
    <div class="bottomInner">
      <button class="homeBtn" id="homeBtn" aria-label="الرئيسية" title="الرئيسية">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 11.5L12 4l9 7.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6.5 10.5V20h11V10.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <script type="module">
    import { ensureRoom, listenRoom, roomRef } from "./data/firebase.js";
    import { db } from "./data/firebase.js";
    import {
      updateDoc,
      serverTimestamp,
      increment
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    const cardEl = document.getElementById("card");
    const errBox = document.getElementById("err");
    const homeBtn = document.getElementById("homeBtn");

    const hostNextArea = document.getElementById("hostNextArea");
    const hostNext = document.getElementById("hostNext");

    function showErr(msg){
      errBox.textContent = msg;
      errBox.style.display = "block";
    }
    function hideErr(){
      errBox.textContent = "";
      errBox.style.display = "none";
    }
    function clean(x){ return String(x || "").trim(); }
    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    const params = new URLSearchParams(location.search);
    const roomId = clean(params.get("room"));

    // ✅ تحديد المقدم (نفس الصفحات السابقة)
    const HOST_ROOM_KEY = "bara_roomId_multi_v4";
    const hostRoomId = clean(sessionStorage.getItem(HOST_ROOM_KEY));
    const isHost = !!hostRoomId && hostRoomId === roomId;

    function clearMultiState(){
      sessionStorage.removeItem("bara_roomId_multi_v4");
      sessionStorage.removeItem("bara_roomTs_multi_v4");
      sessionStorage.removeItem("bara_hostAdded_multi_v4");
      localStorage.removeItem("bara_hostName_multi_v4");
    }
    homeBtn.addEventListener("click", () => {
      if(isHost) clearMultiState();
      window.location.href = "index.html";
    });

    // ✅ استخراج أسماء اللاعبين
    function getPlayersNames(data){
      const players = Array.isArray(data?.players) ? data.players : [];
      const names = players.map(p => clean(p?.name)).filter(Boolean);
      const seen = new Set();
      const unique = [];
      for(const n of names){
        if(!seen.has(n)){
          seen.add(n);
          unique.push(n);
        }
      }
      return unique;
    }

    // ✅ محاولة ذكية لمعرفة اسم "برا السالفة" من أكثر من مكان
    function findBaraName(data){
      // 1) حقول محتملة في الدوك
      const directKeys = [
        "baraName","baraPlayer","baraPlayerName",
        "impostorName","impostor","spyName","spy",
        "outsiderName","outName","outPlayer","outPlayerName"
      ];
      for(const k of directKeys){
        const v = clean(data?.[k]);
        if(v) return v;
      }

      // 2) داخل players: أعلام/خصائص محتملة
      const players = Array.isArray(data?.players) ? data.players : [];
      for(const p of players){
        const name = clean(p?.name);
        if(!name) continue;
        if(p?.isBara === true || p?.isImpostor === true || p?.isSpy === true || p?.outsider === true || p?.isOut === true){
          return name;
        }
        const role = clean(p?.role);
        if(role && (role === "bara" || role === "impostor" || role === "spy" || role === "out")){
          return name;
        }
      }

      return "";
    }

    // ✅ أنيميشن 3 ثواني ثم تثبيت الاسم
    let started = false;
    let done = false;
    let timerId = null;
    let intervalId = null;

    function renderRevealUI(displayName){
      cardEl.innerHTML = `
        <div class="innerCard">
          <div class="innerPanel">
            <div class="revealTitle">الي برا السالفة هو :</div>
            <div class="revealName" id="revealName">${escapeHtml(displayName || "…")}</div>
          </div>
        </div>
      `;
    }

    function startReveal(names, finalName){
      if(started) return;
      started = true;

      // زر التالي للمقدم فقط (يُفعّل بعد التثبيت)
      hostNextArea.classList.toggle("hidden", !isHost);
      hostNext.disabled = true;

      // لو ما عندنا أسماء كفاية
      const pool = (Array.isArray(names) ? names.filter(Boolean) : []).slice();
      if(pool.length === 0){
        renderRevealUI(finalName || "…");
        done = true;
        hostNext.disabled = false;
        return;
      }

      // أثناء الأنيميشن: نبدّل أسماء عشوائية
      renderRevealUI(pool[Math.floor(Math.random() * pool.length)]);

      const nameEl = () => document.getElementById("revealName");

      intervalId = setInterval(() => {
        const el = nameEl();
        if(!el) return;
        const rnd = pool[Math.floor(Math.random() * pool.length)];
        el.textContent = rnd;
      }, 120);

      timerId = setTimeout(() => {
        if(intervalId) clearInterval(intervalId);
        intervalId = null;

        const el = nameEl();
        if(el){
          el.textContent = finalName ? finalName : pool[Math.floor(Math.random() * pool.length)];
        }
        done = true;
        hostNext.disabled = false;
      }, 3000);
    }

    // زر التالي للمقدم فقط (حالياً يغيّر phase لمرحلة لاحقة — نكملها بعدين)
    hostNext.addEventListener("click", async () => {
      if(!isHost) return;
      if(!done) return;

      hideErr();
      try{
        await updateDoc(roomRef(roomId), {
          phase: "reveal_done",
          updatedAt: serverTimestamp(),
          tick: increment(1)
        });
      }catch(e){
        console.warn(e);
        showErr("صار خطأ في الاتصال. حدّث الصفحة وجرب مرة ثانية.");
      }
    });

    function renderLoading(){
      cardEl.innerHTML = `
        <div class="innerCard">
          <div class="innerPanel">
            <div class="hint">جاري التحميل...</div>
          </div>
        </div>
      `;
    }

    (async () => {
      if(!roomId){
        showErr("الرابط غير صحيح: رمز الغرفة غير موجود.");
        renderLoading();
        return;
      }

      try{
        await ensureRoom(roomId);
        renderLoading();

        listenRoom(roomId, (data) => {
          if(!data) return;

          // ملاحظة: التزامن الكامل يعتمد على تغيير phase من صفحة التصويت (بنعدّله بعد ما ترفع هذا الملف)
          const names = getPlayersNames(data);
          const baraName = findBaraName(data);

          // نبدأ الأنيميشن مرة وحدة فقط
          startReveal(names, baraName);
        });

      }catch(e){
        console.warn(e);
        showErr("تعذر الاتصال. حدّث الصفحة وجرب مرة ثانية.");
      }
    })();
  </script>
</body>
</html>
