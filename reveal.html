<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>لعبة برا السالفة - كشف برا السالفة (أجهزة متعددة)</title>

  <style>
    :root{
      --bg:#e9e4d6;
      --frame:#3f5a2a;
      --card:#6a8450;
      --card2:#d8cfb1;
      --text:#1b1b1b;
      --white:#ffffff;

      --yellow:#f2c21b;
      --yellowText:#111;

      --shadow: 0 10px 0 rgba(0,0,0,.25);

      --containerMax: 520px;
      --radiusBig: 26px;
      --radiusMid: 18px;

      --boxPad: 22px;
      --boxMinH: 320px;

      --titleSize: 18px;
      --headerSize: 30px;
      --nameBadgeSize: 56px;

      --btnH: 66px;
      --btnRadius: 26px;

      --homeSize: 60px;
      --homeGap: 12px;

      --bottomGap: 34px;

      --blue:#bfe3ff;

      --lineBg:#4f662f;
      --lineText:#fff;
      --lineAccent:#f2c21b;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      color:var(--text);
    }

    .wrap{
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:18px 14px 180px;
    }
    .frame{
      width:min(var(--containerMax), 100%);
      border:10px solid var(--frame);
      border-radius: var(--radiusBig);
      background:transparent;
      padding:18px 16px 24px;
      position:relative;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
    }
    .brandTitle{
      font-size:var(--titleSize);
      font-weight:700;
      color:#2f3f22;
      opacity:.95;
    }
    .logo{
      width:86px;height:86px;
      object-fit:contain;
    }

    .badgeTitle{
      margin:14px auto 16px;
      width:fit-content;
      max-width:100%;
      padding:14px 26px;
      border-radius: 22px;
      background: rgba(216,207,177,.9);
      color:#395427;
      font-weight:900;
      font-size: var(--headerSize);
      line-height:1;
      text-align:center;
    }

    .bigCard{
      background:var(--card);
      color:var(--white);
      border-radius: var(--radiusBig);
      padding: var(--boxPad);
      min-height: var(--boxMinH);
      box-shadow: 0 0 0 8px rgba(216,207,177,.75) inset;
      text-align:center;
      position:relative;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      align-items:center;
    }

    .hintTop{
      font-size: 22px;
      font-weight:1000;
      line-height:1.4;
      margin: 4px 0 14px;
      color:#fff;
    }

    .nameBadge{
      margin: 4px auto 10px;
      width:fit-content;
      max-width:100%;
      padding: 14px 28px;
      border-radius: 22px;
      background: rgba(216,207,177,.95);
      color:#395427;
      font-weight:1000;
      font-size: var(--nameBadgeSize);
      line-height:1;
      min-width: 220px;
    }

    .animName{
      margin-top: 10px;
      width: min(440px, 96%);
      padding: 16px 18px;
      border-radius: 22px;
      background: rgba(0,0,0,.10);
      color:#fff;
      font-size: 44px;
      font-weight:1000;
      line-height:1.1;
      min-height: 84px;
      display:flex;
      align-items:center;
      justify-content:center;
      letter-spacing: .5px;
    }

    .waiting{
      margin-top: 14px;
      font-size: 22px;
      font-weight:1000;
      color:#fff;
      opacity:.95;
    }
    .arrived{
      margin-top: 8px;
      font-size: 22px;
      font-weight:1000;
      color: var(--lineAccent);
    }

    .hostNextArea{
      width:100%;
      display:flex;
      justify-content:center;
      margin-top: 18px;
    }
    .hostNextArea.hidden{ display:none; }
    .hostNext{
      width: min(420px, 92%);
      height: var(--btnH);
      border-radius: var(--btnRadius);
      border:4px solid #000;
      background: var(--yellow);
      color: var(--yellowText);
      font-size: 34px;
      font-weight:1000;
      box-shadow: var(--shadow);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .hostNext:disabled{
      opacity:.55;
      cursor:not-allowed;
      filter: grayscale(.15);
    }

    .buyArea{
      width:100%;
      display:flex;
      justify-content:center;
      margin-top: 14px;
    }
    .buyArea.hidden{ display:none; }
    .buyBtn{
      width: min(360px, 82%);
      border: 4px solid #000;
      border-radius: 22px;
      padding: 14px 18px;
      font-size: 28px;
      font-weight: 1000;
      box-shadow: 0 8px 0 rgba(0,0,0,0.18);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      text-align:center;
      background: var(--blue);
      color:#111;
    }
    .buyBtn:active{ transform: translateY(1px); box-shadow: 0 7px 0 rgba(0,0,0,0.18); }

    .err{
      width:100%;
      max-width: 420px;
      margin: 10px auto 0;
      color:#b00020;
      font-weight:900;
      text-align:center;
      display:none;
      line-height:1.4;
    }
    .spacerBottom{ height: 18px; }

    .bottomBar{
      position:fixed;
      left:0; right:0;
      bottom: calc(var(--bottomGap) + env(safe-area-inset-bottom));
      display:flex;
      justify-content:center;
      pointer-events:none;
      z-index:9999;
    }
    .bottomInner{
      width:min(var(--containerMax), calc(100% - 28px));
      position:relative;
      pointer-events:none;
    }
    .homeBtn{
      position:absolute;
      left: var(--homeGap);
      bottom:0;
      width: var(--homeSize);
      height: var(--homeSize);
      border-radius: 50%;
      background: #bfe7ff;
      border:4px solid #000;
      box-shadow: var(--shadow);
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:auto;
      cursor:pointer;
    }
    .homeBtn svg{ width:34px;height:34px; }

    @media (max-width: 360px){
      .logo{ width:80px;height:80px; }
      .homeBtn{ width:56px;height:56px; }
      .homeBtn svg{ width:30px;height:30px; }
      .nameBadge{ font-size: 46px; min-width: 200px; }
      .animName{ font-size: 40px; min-height: 78px; }
      .hostNext{ font-size: 30px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="frame">
      <div class="topbar">
        <div class="brandTitle">لعبة برا السالفة</div>
        <img class="logo" src="logo.PNG" alt="logo" />
      </div>

      <div class="badgeTitle">كشف برا السالفة</div>

      <div class="bigCard" id="card"></div>

      <!-- زر الشراء للاعبين فقط -->
      <div class="buyArea" id="buyArea">
        <button class="buyBtn" id="buyBtn">لشراء اللعبة اضغط هنا</button>
      </div>

      <div class="err" id="err"></div>
      <div class="spacerBottom"></div>
    </div>
  </div>

  <div class="bottomBar">
    <div class="bottomInner">
      <button class="homeBtn" id="homeBtn" aria-label="الرئيسية" title="الرئيسية">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 11.5L12 4l9 7.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6.5 10.5V20h11V10.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <script type="module">
    import { ensureRoom, listenRoom, roomRef } from "./data/firebase.js";
    import { db } from "./data/firebase.js";
    import {
      runTransaction,
      updateDoc,
      serverTimestamp,
      increment
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    const card    = document.getElementById("card");
    const errBox  = document.getElementById("err");
    const buyArea = document.getElementById("buyArea");
    const buyBtn  = document.getElementById("buyBtn");
    const homeBtn = document.getElementById("homeBtn");

    function showErr(msg){
      errBox.textContent = msg;
      errBox.style.display = "block";
    }
    function hideErr(){
      errBox.textContent = "";
      errBox.style.display = "none";
    }
    function clean(x){ return String(x || "").trim(); }
    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    const params = new URLSearchParams(location.search);
    const roomId = clean(params.get("room"));

    // ✅ تحديد المقدم (نفس الملفات السابقة)
    const HOST_ROOM_KEY = "bara_roomId_multi_v4";
    const hostRoomId = clean(sessionStorage.getItem(HOST_ROOM_KEY));
    const isHost = !!hostRoomId && hostRoomId === roomId;

    // زر شراء للاعبين فقط
    buyArea.classList.toggle("hidden", isHost);
    buyBtn.addEventListener("click", () => {
      window.open("https://sandooq-m.com", "_blank", "noopener,noreferrer");
    });

    function clearMultiState(){
      sessionStorage.removeItem("bara_roomId_multi_v4");
      sessionStorage.removeItem("bara_roomTs_multi_v4");
      sessionStorage.removeItem("bara_hostAdded_multi_v4");
      localStorage.removeItem("bara_hostName_multi_v4");
    }
    homeBtn.addEventListener("click", () => {
      if(isHost) clearMultiState();
      window.location.href = "index.html";
    });

    // ✅ اسم اللاعب لكل جهاز (نفس vote.html)
    const MY_NAME_KEYS = [
      "bara_myName_multi_v4","bara_playerName_multi_v4","bara_name_multi_v4",
      "bara_myName_multi_v3","bara_playerName_multi_v3",
      "bara_myName_multi_v2","bara_playerName_multi_v2",
      "bara_myName_multi_v1","bara_playerName_multi_v1",
      "bara_myName_multi","bara_playerName_multi",
      "bara_myName","bara_playerName"
    ];
    const HOST_NAME_KEYS = [
      "bara_hostName_multi_v4","bara_hostName_multi_v3","bara_hostName_multi_v2","bara_hostName_multi_v1"
    ];

    function getMyName(){
      const qn = clean(params.get("name"));
      if(qn) return qn;

      for(const k of MY_NAME_KEYS){
        const v1 = clean(sessionStorage.getItem(k));
        if(v1) return v1;
        const v2 = clean(localStorage.getItem(k));
        if(v2) return v2;
      }

      if(isHost){
        for(const k of HOST_NAME_KEYS){
          const v = clean(localStorage.getItem(k));
          if(v) return v;
        }
      }
      return "";
    }

    let myName = getMyName();

    function getPlayersNames(data){
      const players = Array.isArray(data?.players) ? data.players : [];
      const names = players.map(p => clean(p?.name)).filter(Boolean);
      const seen = new Set();
      const unique = [];
      for(const n of names){
        if(!seen.has(n)){
          seen.add(n);
          unique.push(n);
        }
      }
      return unique;
    }

    function computeSuspectName(names, votesBy){
      // votesBy: { voterName: targetName }
      const tally = new Map();
      for(const n of names) tally.set(n, 0);

      for(const [voter, target] of Object.entries(votesBy || {})){
        const t = clean(target);
        if(t && tally.has(t)){
          tally.set(t, (tally.get(t) || 0) + 1);
        }
      }

      let bestName = "";
      let bestCount = -1;

      // tie-break: حسب ترتيب names
      for(const n of names){
        const c = tally.get(n) || 0;
        if(c > bestCount){
          bestCount = c;
          bestName = n;
        }
      }
      return bestName || (names[0] || "");
    }

    // ✅ تجهيز كشف الاسم مرة واحدة (يخزن في الغرفة)
    async function ensureRevealSetupIfHost(data){
      if(!isHost) return;
      if(!data) return;

      const names = getPlayersNames(data);
      if(names.length < 3) return;

      const currentRoundId = clean(data?.roundId);
      if(!currentRoundId) return;

      const revealRoundId = clean(data?.revealRoundId);
      const revealName = clean(data?.revealName);

      if(revealRoundId === currentRoundId && revealName) return;

      const votesBy = (data?.votesBy && typeof data.votesBy === "object") ? data.votesBy : {};
      const suspect = computeSuspectName(names, votesBy);
      if(!suspect) return;

      const ref = roomRef(roomId);
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(ref);
        if(!snap.exists()) return;
        const d = snap.data() || {};

        const rId = clean(d?.roundId);
        if(!rId) return;

        const rr = clean(d?.revealRoundId);
        const rn = clean(d?.revealName);
        if(rr === rId && rn) return;

        const players = Array.isArray(d.players) ? d.players : [];
        const ns = players.map(p => clean(p?.name)).filter(Boolean);
        if(ns.length < 3) return;

        const vBy = (d?.votesBy && typeof d.votesBy === "object") ? d.votesBy : {};
        const sus = computeSuspectName(ns, vBy);
        if(!sus) return;

        tx.update(ref, {
          revealRoundId: rId,
          revealName: sus,
          revealStartedAt: serverTimestamp(),
          revealArrived: {},               // نبدأها فاضية للجولة
          updatedAt: serverTimestamp(),
          tick: increment(1)
        });
      });
    }

    // ✅ تسجيل وصول كل لاعب لهذه الصفحة
    let markedArrive = false;
    async function markArrivedIfNeeded(data){
      if(markedArrive) return;
      if(!myName) return;
      const names = getPlayersNames(data);
      if(!names.includes(myName)) return;

      const arrivedObj = (data?.revealArrived && typeof data.revealArrived === "object") ? data.revealArrived : {};
      if(arrivedObj[myName]){ markedArrive = true; return; }

      const ref = roomRef(roomId);
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(ref);
        if(!snap.exists()) return;
        const d = snap.data() || {};
        const players = Array.isArray(d.players) ? d.players : [];
        const ns = players.map(p => clean(p?.name)).filter(Boolean);
        if(!ns.includes(myName)) return;

        const ra = (d?.revealArrived && typeof d.revealArrived === "object") ? {...d.revealArrived} : {};
        if(ra[myName]) return;

        ra[myName] = true;

        tx.update(ref, {
          revealArrived: ra,
          updatedAt: serverTimestamp(),
          tick: increment(1)
        });
      });

      markedArrive = true;
    }

    // --- أنيميشن الأسماء ---
    let animTimer = null;
    let animDone = false;

    function stopAnim(){
      if(animTimer){
        clearInterval(animTimer);
        animTimer = null;
      }
    }

    function startAnim(names, finalName){
      stopAnim();
      animDone = false;

      const animEl = document.getElementById("animName");
      if(!animEl) return;

      let i = 0;
      animTimer = setInterval(() => {
        if(!names.length) return;
        animEl.textContent = names[i % names.length];
        i++;
      }, 120);

      setTimeout(() => {
        stopAnim();
        animEl.textContent = finalName || "";
        animDone = true;
        updateHostNextState();
      }, 2000);
    }

    let lastRenderKey = "";
    let lastArrived = 0;
    let lastTotal = 0;

    function updateHostNextState(){
      const btn = document.getElementById("hostNext");
      if(!btn) return;
      btn.disabled = !(animDone && lastArrived >= lastTotal);
    }

    function renderReveal(data){
      const names = getPlayersNames(data);
      const total = Math.max(names.length, 1);

      const revealName = clean(data?.revealName);
      const arrivedObj = (data?.revealArrived && typeof data.revealArrived === "object") ? data.revealArrived : {};
      const arrived = Object.keys(arrivedObj || {}).length;

      lastArrived = arrived;
      lastTotal = total;

      const waitingText = (arrived >= total) ? "" : "بانتظار اللاعبين...";
      const arrivedText = (arrived >= total) ? "" : `الواصل: ${arrived} من ${total}`;

      card.innerHTML = `
        <div class="hintTop">الآن راح نكشف مين هو برا السالفة</div>
        <div class="nameBadge" id="finalBadge">برا السالفة هو</div>

        <div class="animName" id="animName">${escapeHtml(revealName || "")}</div>

        ${waitingText ? `<div class="waiting" id="waitingText">${waitingText}</div>` : ``}
        ${arrivedText ? `<div class="arrived" id="arrivedText">${arrivedText}</div>` : ``}

        <div class="hostNextArea ${isHost ? "" : "hidden"}" id="hostNextArea">
          <button class="hostNext" id="hostNext" disabled>التالي</button>
        </div>
      `;

      // تشغيل الأنيميشن مرة واحدة لكل حالة
      const key = (revealName || "") + "|" + names.join(",");
      if(key && key !== lastRenderKey && revealName){
        lastRenderKey = key;
        startAnim(names, revealName);
      }else{
        // لو ما في أنيميشن جديد: حدّث حالة الزر حسب الوصول
        updateHostNextState();
      }

      // زر التالي للمقدم فقط (لا يعمل إلا إذا الكل وصل + الأنيميشن خلص)
      if(isHost){
        const hostNext = document.getElementById("hostNext");
        hostNext.addEventListener("click", async () => {
          if(hostNext.disabled) return;
          hideErr();
          try{
            // المرحلة التالية (بننشئ صفحتها بعدين)
            await updateDoc(roomRef(roomId), {
              phase: "final_pick",
              updatedAt: serverTimestamp(),
              tick: increment(1)
            });
            // توجيه الجميع لصفحة الاختيار النهائي (بنضيفها بالخطوة الجاية)
            window.location.href = "final_pick.html?room=" + encodeURIComponent(roomId);
          }catch(e){
            console.warn(e);
            showErr("صار خطأ في الاتصال. حدّث الصفحة وجرب مرة ثانية.");
          }
        });
      }
    }

    function renderLoading(){
      card.innerHTML = `
        <div class="hintTop">جاري التحميل...</div>
        <div class="animName" style="opacity:.9;">...</div>
      `;
    }

    (async () => {
      if(!roomId){
        showErr("الرابط غير صحيح: رمز الغرفة غير موجود.");
        renderLoading();
        return;
      }

      try{
        await ensureRoom(roomId);
        renderLoading();

        listenRoom(roomId, async (data) => {
          if(!data) return;

          myName = getMyName();

          // لو انتقلنا للمرحلة التالية، نروح لصفحتها
          const phase = clean(data?.phase);
          if(phase === "final_pick"){
            window.location.href = "final_pick.html?room=" + encodeURIComponent(roomId);
            return;
          }

          try{ await ensureRevealSetupIfHost(data); }catch(e){}
          try{ await markArrivedIfNeeded(data); }catch(e){}

          // بعد التأكد من التخزين، ارسم
          renderReveal(data);
        });

      }catch(e){
        console.warn(e);
        showErr("تعذر الاتصال. حدّث الصفحة وجرب مرة ثانية.");
        renderLoading();
      }
    })();
  </script>
</body>
</html>
