<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>اللعب من جهاز واحد</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{--bg:#e9e4d6;--olive:#3f4a1f;--panel:#6e7b46;--black:#111;--yellow:#ffd21a}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"Baloo Bhaijaan 2",Arial,sans-serif;color:#111}
    .wrap{min-height:100svh;display:flex;justify-content:center;padding:18px 14px 30px}
    .card{width:min(560px,100%);position:relative}
    .logo{position:absolute;left:8px;top:10px;width:92px;height:92px;object-fit:contain;pointer-events:none}
    h1{margin:40px 0 8px;text-align:center;color:var(--olive);font-weight:900;font-size:44px}
    .panel{background:var(--panel);border-radius:28px;padding:18px 18px;margin:0 8px 16px}
    .bigBox{
      background:var(--bg);
      border-radius:26px;
      border:8px solid var(--black);
      padding:16px 14px 18px;
      box-shadow:0 10px 0 rgba(0,0,0,.18);
    }
    .titleInside{color:#fff;font-weight:900;font-size:34px;text-align:center;margin:0 0 12px}
    .inputs{display:flex;flex-direction:column;gap:16px}
    .inp{
      width:100%;
      background:#fff;
      border-radius:999px;
      border:4px solid var(--olive);
      padding:14px 16px;
      font-size:28px;
      font-weight:900;
      outline:none;
      text-align:center;
    }
    .plusWrap{display:flex;justify-content:center;margin:16px 0 6px}
    .plusBtn{
      width:64px;height:64px;border-radius:18px;
      border:0;
      background:#b56bb6;
      color:#111;
      font-size:44px;
      font-weight:900;
      box-shadow:0 8px 0 rgba(0,0,0,.18);
      cursor:pointer;
    }
    .plusBtn:active{transform:translateY(2px)}
    .startWrap{display:flex;justify-content:center;margin-top:12px}
    .btnStart{
      width:min(420px,100%);background:var(--yellow);
      border:5px solid var(--black);
      border-radius:999px;
      padding:16px 16px;
      font-weight:900;font-size:40px;
      box-shadow:0 10px 0 rgba(0,0,0,.18);
      cursor:pointer;
    }
    .btnStart:active{transform:translateY(2px)}

    .homeBtn{
      position:fixed;left:16px;bottom:16px;
      width:64px;height:64px;border-radius:999px;
      border:4px solid var(--black);
      background:#bfe1ff;
      box-shadow:0 8px 0 rgba(0,0,0,.18);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;z-index:20;
    }
    .homeBtn:active{transform:translateY(2px)}
    .homeIcon{width:34px;height:34px}
  </style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <img class="logo" src="logo.PNG" alt="logo">
      <h1>اللعب من جهاز واحد</h1>

      <div class="panel">
        <div class="titleInside">ادخل اسماء اللاعبين :</div>

        <div class="bigBox">
          <div id="inputs" class="inputs"></div>

          <div class="plusWrap">
            <button id="plusBtn" class="plusBtn" type="button">+</button>
          </div>
        </div>

        <div class="startWrap">
          <button id="startBtn" class="btnStart" type="button">ابدأ اللعب</button>
        </div>
      </div>
    </div>
  </div>

  <button class="homeBtn" type="button" onclick="location.href='index.html'" aria-label="الصفحة الرئيسية">
    <svg class="homeIcon" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10.5 12 3l9 7.5"></path>
      <path d="M5 10v10h14V10"></path>
      <path d="M9 20v-6h6v6"></path>
    </svg>
  </button>

<script>
  localStorage.setItem('bara_mode','one');

  const inputsEl = document.getElementById('inputs');
  const plusBtn = document.getElementById('plusBtn');
  const startBtn = document.getElementById('startBtn');

  let count = 3;

  function makeInput(i){
    const inp = document.createElement('input');
    inp.className = 'inp';
    inp.type = 'text';
    inp.maxLength = 18;
    inp.placeholder = 'اللاعب ' + i;
    inp.autocomplete = 'off';
    inp.inputMode = 'text';
    return inp;
  }

  function render(){
    inputsEl.innerHTML = '';
    for(let i=1;i<=count;i++){
      inputsEl.appendChild(makeInput(i));
    }
  }

  plusBtn.onclick = () => {
    if(count >= 10) return;
    count++;
    render();
  };

  startBtn.onclick = () => {
    const names = [...document.querySelectorAll('.inp')]
      .map(x => x.value.trim())
      .filter(Boolean);

    // تخزين الأسماء (للاستخدام لاحقًا)
    localStorage.setItem('bara_players_one', JSON.stringify(names));
    location.href = 'categories.html';
  };

  render();
</script>
</body>
</html>
