<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>لعبة برا السالفة - انتظار اللاعب</title>

  <style>
    :root{
      --bg:#e9e3d6;
      --green:#3f5b2a;
      --green2:#6e8554;
      --yellow:#f2c300;
      --blue:#bfe3ff;
      --text:#1a1a1a;
      --muted:#9a9a9a;

      --shadow: 0 10px 0 rgba(0,0,0,0.18);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--text);
    }

    .page{
      min-height: 100vh;
      padding: 14px 12px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .frame{
      width: min(520px, 100%);
      background: var(--bg);
      border: 6px solid var(--green);
      border-radius: 26px;
      padding: 18px 16px 22px;
      position: relative;

      min-height: calc(100vh - 28px);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .topRow{
      position: relative;
      min-height: 86px;
      margin-bottom: 10px;
    }
    .logo{
      position:absolute;
      left: 10px;
      top: 2px;
      width: 98px;
      height: 98px;
      object-fit: contain;
      opacity: 0.98;
      pointer-events:none;
    }
    .h1{
      margin: 22px 0 0;
      text-align:center;
      color: var(--green);
      font-weight: 1000;
      font-size: 44px;
      letter-spacing: .2px;
      line-height: 1.15;
    }

    .centerBlock{
      flex: 1;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding-top: clamp(8px, 5vh, 34px);
      gap: 14px;
    }

    .status{
      width: min(460px, 92%);
      background: rgba(63,91,42,0.12);
      border: 4px solid var(--green2);
      border-radius: 18px;
      padding: 14px 14px;
      text-align:center;
      font-weight: 1000;
      font-size: 20px;
      color:#111;
    }

    .status.started{
      background: rgba(26,163,84,0.16);
      border-color: rgba(26,163,84,0.65);
    }

    .namesCard{
      width: min(460px, 92%);
      background: rgba(63,91,42,0.75);
      border-radius: 22px;
      padding: 14px 14px 14px;
    }
    .namesTitle{
      margin: 2px 0 10px;
      text-align:center;
      color:#fff;
      font-size: 30px;
      font-weight: 1000;
    }

    .list{
      background: rgba(0,0,0,0.10);
      border-radius: 18px;
      padding: 12px 10px;
      min-height: 150px;
    }

    .playerItem{
      width: 100%;
      padding: 14px 14px;
      border: 4px solid var(--green2);
      border-radius: 18px;
      background:#fff;
      font-size: 20px;
      font-weight: 900;
      color:#111;
      text-align:center;
      margin-bottom: 12px;
      user-select:none;
    }
    .emptyHint{
      text-align:center;
      color: rgba(255,255,255,0.85);
      font-weight: 900;
      font-size: 16px;
      padding: 10px 8px 6px;
    }

    .btn{
      width: min(420px, 92%);
      border: 4px solid #000;
      border-radius: 22px;
      padding: 14px 18px;
      font-size: 28px;
      font-weight: 1000;
      box-shadow: var(--shadow);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      text-align:center;
      background: var(--blue);
      color:#111;
    }
    .btn:active{ transform: translateY(1px); box-shadow: 0 9px 0 rgba(0,0,0,0.18); }

    .err{
      width: min(460px, 92%);
      text-align:center;
      color:#b00020;
      font-weight: 900;
      font-size: 16px;
      display:none;
      line-height: 1.4;
    }

    .bottomSpacer{
      height: clamp(120px, 18vh, 220px);
    }

    @media (max-width: 360px){
      .h1{ font-size: 38px; }
      .logo{ width: 90px; height: 90px; }
      .btn{ font-size: 26px; }
      .namesTitle{ font-size: 28px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="frame">

      <div class="topRow">
        <img class="logo" src="logo.PNG" alt="logo">
        <div class="h1">لعبة برا السالفة</div>
      </div>

      <div class="centerBlock">
        <div id="statusBox" class="status">بانتظار المقدم يبدأ اللعب…</div>

        <div class="namesCard">
          <div class="namesTitle">اسماء اللاعبين</div>
          <div class="list" id="list">
            <div class="emptyHint" id="emptyHint">إذا ما ظهرت الأسماء، انتظر ثواني…</div>
            <div id="playersWrap"></div>
          </div>
        </div>

        <button id="buyBtn" class="btn">لشراء اللعبة اضغط هنا</button>

        <div id="err" class="err"></div>
      </div>

      <div class="bottomSpacer"></div>
    </div>
  </div>

  <script type="module">
    import { ensureRoom, listenRoom } from "./data/firebase.js";

    const statusBox   = document.getElementById("statusBox");
    const playersWrap = document.getElementById("playersWrap");
    const emptyHint   = document.getElementById("emptyHint");
    const buyBtn      = document.getElementById("buyBtn");
    const errBox      = document.getElementById("err");

    function showErr(msg){
      errBox.textContent = msg;
      errBox.style.display = "block";
    }
    function hideErr(){
      errBox.textContent = "";
      errBox.style.display = "none";
    }
    function cleanName(x){
      return String(x || "").trim();
    }

    buyBtn.addEventListener("click", () => {
      window.open("https://sandooq-m.com", "_blank", "noopener,noreferrer");
    });

    // room from URL
    const params = new URLSearchParams(location.search);
    const roomId = (params.get("room") || "").trim();

    if(!roomId){
      showErr("الرابط غير صحيح: رمز الغرفة غير موجود.");
      statusBox.textContent = "خطأ في الرابط";
    }else{
      hideErr();

      try{
        await ensureRoom(roomId);

        listenRoom(roomId, (data) => {
          const players = Array.isArray(data?.players) ? data.players : [];
          const status  = String(data?.status || "lobby");

          // حالة اللعب
          if(status === "playing"){
            statusBox.classList.add("started");
            statusBox.textContent = "بدأ اللعب ✅ تابع المقدم على الشاشة.";
          }else{
            statusBox.classList.remove("started");
            statusBox.textContent = "بانتظار المقدم يبدأ اللعب…";
          }

          // الأسماء
          playersWrap.innerHTML = "";
          const names = players.map(p => cleanName(p?.name)).filter(Boolean);

          if(names.length === 0){
            emptyHint.style.display = "block";
          }else{
            emptyHint.style.display = "none";
          }

          for(const n of names){
            const div = document.createElement("div");
            div.className = "playerItem";
            div.textContent = n;
            playersWrap.appendChild(div);
          }
        });

      }catch(e){
        console.error(e);
        showErr("صار خطأ في الاتصال. حدّث الصفحة وجرب مرة ثانية.");
      }
    }
  </script>
</body>
</html>
