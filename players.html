<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مشاركة اللاعبين</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#e9e4d6;
      --olive:#3f4a1f;
      --panel:#6e7b46;
      --yellow:#ffd21a;
      --black:#111;
      --blue:#bfe4ff;
      --shadow:0 10px 0 rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"Baloo Bhaijaan 2",Arial,sans-serif}
    .wrap{min-height:100svh;display:flex;justify-content:center;padding:18px}
    .card{width:min(560px,100%)}

    h1{text-align:center;color:var(--olive);font-size:44px;font-weight:900;margin-bottom:14px}

    .panel{
      background:var(--panel);
      border-radius:26px;
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .hostBox{
      background:rgba(0,0,0,.1);
      border-radius:20px;
      padding:12px;
    }
    .hostBox label{
      display:block;
      color:#fff;
      font-size:22px;
      font-weight:900;
      text-align:center;
      margin-bottom:8px;
    }
    .hostBox input{
      width:100%;
      border-radius:999px;
      border:5px solid var(--black);
      padding:12px;
      font-size:24px;
      font-weight:900;
      text-align:center;
    }

    .playersTitle{
      text-align:center;
      color:#fff;
      font-size:30px;
      font-weight:900;
    }

    .list{
      background:rgba(0,0,0,.1);
      border-radius:20px;
      padding:12px;
      min-height:160px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .player{
      background:var(--bg);
      border:4px solid var(--black);
      border-radius:999px;
      padding:10px;
      text-align:center;
      font-size:24px;
      font-weight:900;
    }

    .empty{
      text-align:center;
      color:#fff;
      font-weight:900;
      font-size:20px;
      margin:auto;
    }

    button{
      width:100%;
      border-radius:999px;
      border:5px solid var(--black);
      padding:14px;
      font-size:32px;
      font-weight:900;
      cursor:pointer;
      box-shadow:var(--shadow);
    }

    .share{background:var(--blue)}
    .start{background:var(--yellow)}
    button:disabled{opacity:.5;cursor:not-allowed}
  </style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <h1>مشاركة اللاعبين</h1>

    <div class="panel">

      <div class="hostBox">
        <label>اسم المقدم</label>
        <input id="hostName" placeholder="اكتب اسمك">
      </div>

      <div class="playersTitle">اللاعبون</div>

      <div id="playersList" class="list">
        <div id="empty" class="empty">بانتظار اللاعبين...</div>
      </div>

      <button id="shareBtn" class="share">مشاركة الرابط</button>
      <button id="startBtn" class="start" disabled>ابدأ اللعب</button>

    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, updateDoc, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDQx4gJZMHNWQBeMYsU4fknZHG0WFJ_ckc",
  authDomain: "bara-alsalfah.firebaseapp.com",
  projectId: "bara-alsalfah",
  storageBucket: "bara-alsalfah.firebasestorage.app",
  messagingSenderId: "658748312832",
  appId: "1:658748312832:web:3e0c970ba54bb25c0437e5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function genRoom(){
  return String(Math.floor(100000 + Math.random()*900000));
}

let room = new URLSearchParams(location.search).get("room");
if(!room){
  room = genRoom();
  location.replace("players.html?room=" + room);
}

const roomRef = doc(db,"bara_rooms",room);

await setDoc(roomRef,{
  room,
  players:[],
  hostName:"",
  status:"lobby",
  createdAt:serverTimestamp()
},{merge:true});

const hostInput = document.getElementById("hostName");
const list = document.getElementById("playersList");
const empty = document.getElementById("empty");
const startBtn = document.getElementById("startBtn");

function render(players){
  list.innerHTML="";
  if(players.length===0){
    list.appendChild(empty);
    empty.style.display="block";
  }else{
    empty.style.display="none";
    players.forEach(p=>{
      const d=document.createElement("div");
      d.className="player";
      d.textContent=p;
      list.appendChild(d);
    });
  }
  startBtn.disabled = !(hostInput.value.trim() && players.length >= 1);
}

hostInput.addEventListener("input",()=>{
  updateDoc(roomRef,{ hostName: hostInput.value.trim() });
});

onSnapshot(roomRef,(snap)=>{
  const data=snap.data()||{};
  render(data.players||[]);
  if(!hostInput.value && data.hostName){
    hostInput.value=data.hostName;
  }
});

document.getElementById("startBtn").onclick=async()=>{
  // ❗ لا نغيّر إلى playing
  await updateDoc(roomRef,{
    status:"categories",
    hostEnteredCategoriesAt:serverTimestamp()
  });

  location.href="categories.html?mode=multi&room="+room;
};

document.getElementById("shareBtn").onclick=()=>{
  const url = location.origin + location.pathname.replace(
    "players.html",
    "join.html?room="+room
  );
  navigator.clipboard.writeText(url);
  alert("تم نسخ الرابط");
};
</script>

</body>
</html>
