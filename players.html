<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>اللعب من أجهزة متعددة</title>

  <style>
    :root{
      --bg:#e9e3d6;
      --green:#3f5b2a;
      --green2:#6e8554;
      --yellow:#f2c300;
      --blue:#bfe3ff;
      --orange:#f3a11b;
      --text:#1a1a1a;
      --muted:#9a9a9a;

      --shadow: 0 10px 0 rgba(0,0,0,0.18);
      --shadowSmall: 0 8px 0 rgba(0,0,0,0.18);

      --homeSide: 18px;
      --homeBottom: calc(18px + env(safe-area-inset-bottom));
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--text);
    }

    .page{
      min-height: 100vh;
      padding: 14px 12px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .frame{
      width: min(520px, 100%);
      background: var(--bg);
      border: 6px solid var(--green);
      border-radius: 26px;

      /* ✅ زيادة padding-bottom لتفادي تداخل زر المنزل */
      padding: 18px 16px 120px;

      position: relative;
      min-height: calc(100vh - 28px);
    }

    /* ✅ Top area */
    .topRow{
      position: relative;
      min-height: 86px;
      margin-bottom: 8px;
    }

    /* ✅ عنوان أصغر داخل “دائرة/بادج” حتى لا يتداخل مع اللوقو */
    .titleBadge{
      position:absolute;
      right: 14px;
      top: 12px;

      display:inline-flex;
      align-items:center;
      justify-content:center;

      padding: 10px 14px;
      border-radius: 22px;
      border: 4px solid rgba(0,0,0,0.25);

      color: var(--green);
      font-weight: 1000;
      font-size: 22px;
      line-height: 1;

      background: rgba(233,227,214,0.85);
      backdrop-filter: blur(2px);
      max-width: calc(100% - 130px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .logo{
      position:absolute;
      left: 10px;
      top: 2px;
      width: 92px;
      height: 92px;
      object-fit: contain;
      opacity: 0.98;
      pointer-events:none;
    }

    /* شاشة */
    .screen{ display:none; }
    .screen.show{ display:block; }

    /* ====== عناصر مشتركة ====== */
    .nameInput{
      width: 100%;
      padding: 14px 14px;
      border: 4px solid var(--green2);
      border-radius: 18px;
      background:#fff;
      font-size: 22px;
      font-weight: 900;
      color:#111;
      outline:none;
      text-align:center;
    }
    .nameInput::placeholder{
      color: var(--muted);
      font-weight: 900;
      font-size: 18px;
      opacity: 0.75;
    }

    .panel{
      margin-top: 10px;
      background: rgba(63,91,42,0.75);
      border-radius: 22px;
      padding: 16px 14px 16px;
      min-height: 260px;
    }

    .panelTitle{
      text-align:center;
      color:#fff;
      font-size: 36px;
      font-weight: 1000;
      margin: 10px 0 10px;
    }

    .hint{
      text-align:center;
      color: rgba(255,255,255,0.75);
      font-size: 16px;
      font-weight: 800;
      line-height: 1.35;
      margin: 0 0 10px;
    }

    .list{
      background: rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 10px 10px;
      min-height: 170px;
      border: 3px solid rgba(0,0,0,0.18);
    }

    .playerItem{
      background: rgba(255,255,255,0.92);
      border: 3px solid rgba(0,0,0,0.35);
      border-radius: 14px;
      padding: 10px 10px;
      text-align:center;
      font-weight: 1000;
      font-size: 20px;
      margin: 8px 0;
    }

    /* ✅ مربع اسم المقدم داخل الصندوق وبنفس روح المربعات */
    .hostBoxWrap{
      margin-bottom: 12px;
    }
    .hostBoxWrap .nameInput{
      border-width: 4px;
      border-color: rgba(0,0,0,0.35);
      border-radius: 14px;
      font-size: 20px;
      background: rgba(255,255,255,0.92);
    }

    /* ✅ الأزرار صارت أعلى (فوق مكان السهم الأخضر تقريباً) */
    .btnRow{
      margin-top: 14px;
      display:flex;
      flex-direction:column;
      gap: 12px;
    }

    .btn{
      border: 5px solid #000;
      border-radius: 26px;
      padding: 14px 18px;
      font-weight: 1000;
      cursor:pointer;
      box-shadow: var(--shadow);
      -webkit-tap-highlight-color:transparent;
      font-size: 34px;
    }
    .btn:active{ transform: translateY(1px); box-shadow: 0 9px 0 rgba(0,0,0,0.18); }

    .btnBlue{ background: var(--blue); color:#111; }
    .btnYellow{ background: var(--yellow); color:#111; }
    .btn:disabled{
      opacity: .55;
      cursor:not-allowed;
      transform:none;
    }

    /* زر الرئيسية */
    .homeBtn{
      position:absolute;
      left: var(--homeSide);
      bottom: var(--homeBottom);
      width: 70px;
      height: 70px;
      border-radius: 22px;
      border: 5px solid #000;
      background: #bfe3ff;
      box-shadow: var(--shadowSmall);
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      z-index: 60;
      -webkit-tap-highlight-color:transparent;
    }
    .homeBtn svg{ width:38px; height:38px; fill:#111; }

    /* ====== نافذة مشاركة اللاعبين ====== */
    .overlay{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,0.25);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px 14px;
      z-index: 9999;
    }
    .overlay.show{ display:flex; }

    .modal{
      width: min(520px, 96vw);
      background:#fff;
      border: 6px solid #000;
      border-radius: 22px;
      box-shadow: 0 16px 0 rgba(0,0,0,0.25);
      padding: 14px 14px 16px;
      position: relative;
    }

    .closeX{
      position:absolute;
      left: 14px;
      top: 10px;
      font-size: 34px;
      font-weight: 1000;
      color:#1d4aa7;
      background: transparent;
      border: none;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .modalTitle{
      text-align:center;
      font-weight: 1000;
      font-size: 34px;
      margin: 8px 0 12px;
    }

    .tabs{
      display:flex;
      justify-content:center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .tab{
      border: 4px solid #000;
      border-radius: 16px;
      padding: 10px 16px;
      font-weight: 1000;
      font-size: 22px;
      cursor:pointer;
      box-shadow: 0 8px 0 rgba(0,0,0,0.18);
      -webkit-tap-highlight-color:transparent;
    }
    .tab:active{ transform: translateY(1px); box-shadow: 0 7px 0 rgba(0,0,0,0.18); }

    .tabLink{ background: var(--yellow); }
    .tabCode{ background: #2fa24a; color:#fff; }
    .tabQR{ background: var(--orange); }

    .tab.active{
      filter: brightness(0.98);
      outline: 4px solid rgba(0,0,0,0.15);
    }

    .shareBox{
      border: 3px solid rgba(0,0,0,0.25);
      border-radius: 18px;
      padding: 12px 12px 12px;
      background: #f7f7f7;
    }

    .shareLabel{
      text-align:center;
      font-weight: 1000;
      font-size: 22px;
      margin: 2px 0 8px;
      color:#333;
    }

    .bigCode{
      text-align:center;
      font-weight: 1000;
      font-size: 44px;
      margin: 6px 0 10px;
      letter-spacing: 1px;
    }

    .linkText{
      width:100%;
      border: 3px solid rgba(0,0,0,0.18);
      border-radius: 14px;
      padding: 10px 10px;
      background: #fff;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.4;
      word-break: break-all;
      text-align:left;
      direction:ltr;
    }

    .qrWrap{
      display:flex;
      justify-content:center;
      align-items:center;
      padding: 10px 0 8px;
    }
    .qrImg{
      width: 220px;
      height: 220px;
      border-radius: 16px;
      border: 4px solid #000;
      background:#fff;
      object-fit: contain;
      box-shadow: 0 10px 0 rgba(0,0,0,0.18);
    }

    .copyRow{
      display:flex;
      justify-content:center;
      gap: 12px;
      margin-top: 10px;
    }
    .copyBtn{
      border: 4px solid #000;
      border-radius: 18px;
      padding: 10px 14px;
      background:#fff;
      font-weight: 1000;
      font-size: 20px;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      min-width: 160px;
      box-shadow: 0 8px 0 rgba(0,0,0,0.15);
    }
    .copyBtn:active{ transform: translateY(1px); box-shadow: 0 7px 0 rgba(0,0,0,0.15); }
    .copyBtn.copied{ background: #dff7df; }

    /* ====== شاشة اللاعب (join) ====== */
    .joinTitle{
      margin: 8px 0 14px;
      text-align:center;
      color: var(--green);
      font-size: 44px;
      font-weight: 1000;
    }

    .readyBtn{
      width: min(320px, 85%);
      margin: 0 auto;
      display:block;
      border: 5px solid #000;
      background: var(--yellow);
      color:#111;
      font-weight: 1000;
      font-size: 44px;
      border-radius: 26px;
      padding: 12px 26px;
      box-shadow: var(--shadow);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .readyBtn:active{ transform: translateY(1px); box-shadow: 0 9px 0 rgba(0,0,0,0.18); }

    .buyBtn{
      width: min(360px, 92%);
      margin: 14px auto 0;
      display:block;
      border: 5px solid #000;
      background: var(--blue);
      color:#111;
      font-weight: 1000;
      font-size: 28px;
      border-radius: 22px;
      padding: 12px 22px;
      box-shadow: var(--shadowSmall);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .buyBtn:active{ transform: translateY(1px); box-shadow: 0 7px 0 rgba(0,0,0,0.18); }

    .waitBox{
      margin-top: 14px;
      width: 100%;
      padding: 20px 14px;
      border: 6px solid var(--green);
      border-radius: 22px;
      background: rgba(63,91,42,0.75);
      color:#fff;
      text-align:center;
      font-weight: 1000;
      font-size: 30px;
      min-height: 92px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    @media (max-width: 360px){
      .titleBadge{ font-size: 20px; padding: 9px 12px; }
      .joinTitle{ font-size: 40px; }
      .btn{ font-size: 32px; }
      .readyBtn{ font-size: 40px; }
      .panelTitle{ font-size: 34px; }
      .homeBtn{ width: 66px; height: 66px; }
      .homeBtn svg{ width: 36px; height: 36px; }
    }
  </style>
</head>

<body>
  <!-- Host Screen -->
  <div class="page screen" id="screenHost">
    <div class="frame">
      <div class="topRow">
        <div class="titleBadge">اللعب من اجهزة متعددة</div>
        <img class="logo" src="logo.PNG" alt="logo">
      </div>

      <!-- ✅ نقل الأزرار للأعلى (مكان السهم الأخضر تقريباً) -->
      <div class="btnRow">
        <button class="btn btnBlue" id="shareBtn">مشاركة اللاعبين</button>
        <button class="btn btnYellow" id="startBtn" disabled>ابدأ اللعب</button>
      </div>

      <!-- ✅ نقل مربع اسم المقدم داخل الصندوق -->
      <div class="panel">
        <div class="hostBoxWrap">
          <input id="hostName" class="nameInput" type="text" placeholder="اكتب اسمك هنا" />
        </div>

        <div class="panelTitle">اسماء اللاعبين</div>
        <div class="hint" id="hintHost">شارك الرابط مع اللاعبين وأسماء اللاعبين راح تظهر هنا</div>
        <div class="list" id="playersList"></div>
      </div>

      <div class="homeBtn" id="homeBtnHost" title="الرئيسية" aria-label="الرئيسية">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Join Screen -->
  <div class="page screen" id="screenJoin">
    <div class="frame">
      <div class="topRow">
        <img class="logo" src="logo.PNG" alt="logo">
      </div>

      <div class="joinTitle">لعبة برا السالفة</div>

      <input id="playerName" class="nameInput" type="text" placeholder="اكتب اسمك هنا" />

      <button class="readyBtn" id="readyBtn">جاهز</button>
      <button class="buyBtn" id="buyBtn">للشراء اللعبة اضغط هنا</button>

      <div class="homeBtn" id="homeBtnJoin" title="الرئيسية" aria-label="الرئيسية">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Wait Screen -->
  <div class="page screen" id="screenWait">
    <div class="frame">
      <div class="topRow">
        <img class="logo" src="logo.PNG" alt="logo">
      </div>

      <div class="waitBox" id="waitText">بانتظار مقدم اللعبة…</div>

      <div class="homeBtn" id="homeBtnWait" title="الرئيسية" aria-label="الرئيسية">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Share Modal -->
  <div class="overlay" id="overlay">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="closeX" id="closeModal" aria-label="إغلاق">×</button>
      <div class="modalTitle">مشاركة اللعبة</div>

      <div class="tabs">
        <button class="tab tabLink active" id="tabLink">رابط</button>
        <button class="tab tabCode" id="tabCode">رمز</button>
        <button class="tab tabQR" id="tabQR">باركود</button>
      </div>

      <div class="shareBox">
        <div class="shareLabel" id="shareLabel">رابط الدخول</div>

        <div id="panelLink">
          <div class="linkText" id="linkBox"></div>
          <div class="copyRow">
            <button class="copyBtn" id="copyLinkBtn">نسخ الرابط</button>
          </div>
        </div>

        <div id="panelCode" style="display:none;">
          <div class="shareLabel">رمز الغرفة</div>
          <div class="bigCode" id="codeBox">------</div>
          <div class="copyRow">
            <button class="copyBtn" id="copyCodeBtn">نسخ الرمز</button>
          </div>
        </div>

        <div id="panelQR" style="display:none;">
          <div class="shareLabel">امسح الباركود للدخول</div>
          <div class="qrWrap">
            <img class="qrImg" id="qrImg" alt="QR">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    // ✅ تعديل تقني بسيط فقط لإصلاح مشكلة “مشاركة اللاعبين لا تعمل”
    // (حتى لو تعثر استيراد firebase لأي سبب، واجهة المشاركة تظل تعمل)
    let fb = null;
    try{
      fb = await import("./data/firebase.js");
    }catch(e){
      console.warn("Firebase import failed:", e);
    }

    // ===== Helpers =====
    function randRoom(){ return String(Math.floor(100000 + Math.random() * 900000)); }

    function setPlaceholderBehavior(input){
      document.addEventListener('focusin', (e) => {
        if (e.target === input) {
          e.target.dataset.ph = e.target.placeholder;
          e.target.placeholder = '';
        }
      });
      document.addEventListener('focusout', (e) => {
        if (e.target === input) {
          if (!e.target.value.trim()) {
            e.target.placeholder = e.target.dataset.ph || '';
          }
        }
      });
    }

    function getBaseUrl(){
      const u = new URL(location.href);
      const dir = u.pathname.substring(0, u.pathname.lastIndexOf('/') + 1);
      return u.origin + dir;
    }
    function makeJoinLink(roomId){
      return getBaseUrl() + "players.html?room=" + encodeURIComponent(roomId);
    }
    function qrUrl(data){
      return "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" + encodeURIComponent(data);
    }

    function renderPlayers(listEl, players){
      listEl.innerHTML = "";
      const names = (players || [])
        .map(p => (p && p.name ? String(p.name).trim() : ""))
        .filter(Boolean);

      if(!names.length){
        listEl.innerHTML = `<div class="playerItem" style="opacity:.75;">لا يوجد لاعبين بعد</div>`;
        return;
      }
      names.forEach(n => {
        const div = document.createElement("div");
        div.className = "playerItem";
        div.textContent = n;
        listEl.appendChild(div);
      });
    }

    async function copyText(btn, text){
      const original = btn.textContent;
      try{
        await navigator.clipboard.writeText(text);
      }catch(e){
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
      btn.classList.add("copied");
      btn.textContent = "تم النسخ ✓";
      setTimeout(() => {
        btn.classList.remove("copied");
        btn.textContent = original;
      }, 1200);
    }

    // ===== Elements =====
    const params = new URLSearchParams(location.search);
    const roomParam = (params.get("room") || "").trim();

    const screenHost = document.getElementById("screenHost");
    const screenJoin = document.getElementById("screenJoin");
    const screenWait = document.getElementById("screenWait");

    const hostName = document.getElementById("hostName");
    const playerName = document.getElementById("playerName");

    const playersList = document.getElementById("playersList");
    const shareBtn = document.getElementById("shareBtn");
    const startBtn = document.getElementById("startBtn");

    const homeBtnHost = document.getElementById("homeBtnHost");
    const homeBtnJoin = document.getElementById("homeBtnJoin");
    const homeBtnWait = document.getElementById("homeBtnWait");

    const overlay = document.getElementById("overlay");
    const closeModal = document.getElementById("closeModal");

    const tabLink = document.getElementById("tabLink");
    const tabCode = document.getElementById("tabCode");
    const tabQR = document.getElementById("tabQR");

    const panelLink = document.getElementById("panelLink");
    const panelCode = document.getElementById("panelCode");
    const panelQR = document.getElementById("panelQR");

    const linkBox = document.getElementById("linkBox");
    const codeBox = document.getElementById("codeBox");
    const qrImg = document.getElementById("qrImg");

    const copyLinkBtn = document.getElementById("copyLinkBtn");
    const copyCodeBtn = document.getElementById("copyCodeBtn");

    const readyBtn = document.getElementById("readyBtn");
    const buyBtn = document.getElementById("buyBtn");
    const waitText = document.getElementById("waitText");

    setPlaceholderBehavior(hostName);
    setPlaceholderBehavior(playerName);

    function show(screen){
      [screenHost, screenJoin, screenWait].forEach(s => s.classList.remove("show"));
      screen.classList.add("show");
    }
    function goHome(){ location.href = "index.html"; }

    homeBtnHost.addEventListener("click", goHome);
    homeBtnJoin.addEventListener("click", goHome);
    homeBtnWait.addEventListener("click", goHome);

    // ===== Waiting animation =====
    const seq = [
      "بانتظار",
      "بانتظار مقدم",
      "بانتظار مقدم اللعبة",
      "بانتظار مقدم اللعبة.",
      "بانتظار مقدم اللعبة..",
      "بانتظار مقدم اللعبة...",
      ""
    ];
    let wI = 0, wTimer = null;
    function startWaitAnim(){
      if (wTimer) clearInterval(wTimer);
      wI = 0;
      wTimer = setInterval(() => {
        waitText.textContent = seq[wI];
        wI++;
        if (wI >= seq.length) wI = 0;
      }, 380);
    }

    // ===== Modal tabs =====
    function setActiveTab(which){
      [tabLink, tabCode, tabQR].forEach(t => t.classList.remove("active"));
      panelLink.style.display = "none";
      panelCode.style.display = "none";
      panelQR.style.display = "none";

      if(which === "link"){
        tabLink.classList.add("active");
        panelLink.style.display = "block";
      }else if(which === "code"){
        tabCode.classList.add("active");
        panelCode.style.display = "block";
      }else{
        tabQR.classList.add("active");
        panelQR.style.display = "block";
      }
    }

    tabLink.addEventListener("click", () => setActiveTab("link"));
    tabCode.addEventListener("click", () => setActiveTab("code"));
    tabQR.addEventListener("click", () => setActiveTab("qr"));

    closeModal.addEventListener("click", () => overlay.classList.remove("show"));
    overlay.addEventListener("click", (e) => { if(e.target === overlay) overlay.classList.remove("show"); });

    // ===== Host flow =====
    let currentRoom = null;
    let unsub = null;

    async function initHost(){
      show(screenHost);

      currentRoom = sessionStorage.getItem("multi_room");
      if(!currentRoom){
        currentRoom = randRoom();
        sessionStorage.setItem("multi_room", currentRoom);
      }

      const link = makeJoinLink(currentRoom);
      linkBox.textContent = link;
      codeBox.textContent = currentRoom;
      qrImg.src = qrUrl(link);

      // ✅ زر مشاركة اللاعبين يعمل مباشرة
      shareBtn.addEventListener("click", () => {
        setActiveTab("link");
        overlay.classList.add("show");
      });

      copyLinkBtn.addEventListener("click", () => copyText(copyLinkBtn, link));
      copyCodeBtn.addEventListener("click", () => copyText(copyCodeBtn, currentRoom));

      // Firebase (لو شغال) نستخدمه لتحديث قائمة اللاعبين
      if(fb?.ensureRoom){
        await fb.ensureRoom(currentRoom);
        if (unsub) unsub();
        unsub = fb.listenRoom(currentRoom, (data) => {
          const players = data && Array.isArray(data.players) ? data.players : [];
          renderPlayers(playersList, players);
          startBtn.disabled = players.length === 0;
        });
      }else{
        // fallback UI فقط
        renderPlayers(playersList, []);
        startBtn.disabled = true;
      }

      startBtn.addEventListener("click", async () => {
        startBtn.disabled = true;
        if(fb?.setRoomStatus){
          await fb.setRoomStatus(currentRoom, "playing");
        }
        startBtn.disabled = false;
      });
    }

    // ===== Player flow =====
    async function initPlayer(roomId){
      show(screenJoin);

      if(fb?.ensureRoom) await fb.ensureRoom(roomId);

      buyBtn.addEventListener("click", () => {
        window.open("https://sandooq-m.com", "_blank");
      });

      readyBtn.addEventListener("click", async () => {
        const name = (playerName.value || "").trim();
        if(!name){ alert("اكتب اسمك أولاً"); return; }

        if(fb?.addPlayer){
          await fb.addPlayer(roomId, name);
        }

        show(screenWait);
        startWaitAnim();

        if(fb?.listenRoom){
          if (unsub) unsub();
          unsub = fb.listenRoom(roomId, (data) => {
            // لاحقاً: عند status=playing ننقل لصفحة اللعب
          });
        }
      });
    }

    // ===== Init =====
    (async function(){
      if(roomParam){
        await initPlayer(roomParam);
      }else{
        await initHost();
      }
    })();
  </script>
</body>
</html>
