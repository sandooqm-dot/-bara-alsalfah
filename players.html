<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مشاركة اللاعبين</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#e9e4d6;
      --olive:#3f4a1f;
      --panel:#6e7b46;
      --yellow:#ffd21a;
      --black:#111;
      --blue:#bfe4ff;
      --shadow:0 10px 0 rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"Baloo Bhaijaan 2",Arial,sans-serif}
    .wrap{min-height:100svh;display:flex;justify-content:center;padding:18px}
    .card{width:min(560px,100%)}

    h1{text-align:center;color:var(--olive);font-size:44px;font-weight:900;margin-bottom:14px}

    .panel{
      background:var(--panel);
      border-radius:26px;
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .hostBox{
      background:rgba(0,0,0,.1);
      border-radius:20px;
      padding:12px;
    }
    .hostBox label{
      display:block;
      color:#fff;
      font-size:22px;
      font-weight:900;
      text-align:center;
      margin-bottom:8px;
    }
    .hostBox input{
      width:100%;
      border-radius:999px;
      border:5px solid var(--black);
      padding:12px;
      font-size:24px;
      font-weight:900;
      text-align:center;
    }

    .playersTitle{
      text-align:center;
      color:#fff;
      font-size:30px;
      font-weight:900;
    }

    .list{
      background:rgba(0,0,0,.1);
      border-radius:20px;
      padding:12px;
      min-height:160px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .player{
      background:var(--bg);
      border:4px solid var(--black);
      border-radius:999px;
      padding:10px;
      text-align:center;
      font-size:24px;
      font-weight:900;
    }

    .empty{
      text-align:center;
      color:#fff;
      font-weight:900;
      font-size:20px;
      margin:auto;
    }

    button{
      width:100%;
      border-radius:999px;
      border:5px solid var(--black);
      padding:14px;
      font-size:32px;
      font-weight:900;
      cursor:pointer;
      box-shadow:var(--shadow);
    }

    .share{background:var(--blue)}
    .start{background:var(--yellow)}
    button:disabled{opacity:.5;cursor:not-allowed}

    /* ===== Modal ===== */
    .overlay{
      position:fixed;inset:0;
      background:rgba(0,0,0,.4);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:100;
      padding:16px;
    }
    .overlay.show{display:flex}

    .modal{
      background:#fff;
      width:min(420px,100%);
      border-radius:22px;
      padding:16px;
      text-align:center;
      box-shadow:0 20px 40px rgba(0,0,0,.3);
    }

    .modal h3{
      margin:0 0 10px;
      font-size:26px;
      font-weight:900;
    }

    .tabs{
      display:flex;
      gap:8px;
      justify-content:center;
      margin-bottom:10px;
    }

    .tab{
      padding:10px 14px;
      border-radius:14px;
      border:3px solid var(--black);
      font-weight:900;
      cursor:pointer;
      background:#eee;
    }
    .tab.active{background:var(--yellow)}

    .box{display:none}
    .box.active{display:block}

    .url{
      font-size:14px;
      word-break:break-all;
      background:#f5f5f5;
      padding:10px;
      border-radius:12px;
      margin:8px 0;
    }

    .code{
      font-size:40px;
      font-weight:900;
      letter-spacing:2px;
      margin:12px 0;
    }

    .copy{
      margin-top:8px;
      padding:10px;
      border-radius:999px;
      border:4px solid var(--black);
      background:var(--blue);
      font-weight:900;
      cursor:pointer;
    }

    .close{
      margin-top:12px;
      font-weight:900;
      color:#d00;
      cursor:pointer;
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <h1>مشاركة اللاعبين</h1>

    <div class="panel">
      <div class="hostBox">
        <label>اسم المقدم</label>
        <input id="hostName" placeholder="اكتب اسمك">
      </div>

      <div class="playersTitle">اللاعبون</div>

      <div id="playersList" class="list">
        <div id="empty" class="empty">بانتظار اللاعبين...</div>
      </div>

      <button id="shareBtn" class="share">مشاركة اللاعبين</button>
      <button id="startBtn" class="start" disabled>ابدأ اللعب</button>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="overlay" class="overlay">
  <div class="modal">
    <h3>مشاركة اللعبة</h3>

    <div class="tabs">
      <div class="tab active" data-tab="link">رابط</div>
      <div class="tab" data-tab="code">رمز</div>
      <div class="tab" data-tab="qr">باركود</div>
    </div>

    <div id="box-link" class="box active">
      <div id="shareUrl" class="url"></div>
      <div class="copy" onclick="copyText()">نسخ الرابط</div>
    </div>

    <div id="box-code" class="box">
      <div class="code" id="roomCode"></div>
      <div class="copy" onclick="copyText()">نسخ الرمز</div>
    </div>

    <div id="box-qr" class="box">
      <img id="qrImg" style="width:220px">
    </div>

    <div class="close" onclick="closeModal()">إغلاق</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, doc, setDoc, updateDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDQx4gJZMHNWQBeMYsU4fknZHG0WFJ_ckc",
  authDomain: "bara-alsalfah.firebaseapp.com",
  projectId: "bara-alsalfah",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let room = new URLSearchParams(location.search).get("room");
if(!room){
  room = String(Math.floor(100000 + Math.random()*900000));
  location.replace("players.html?room=" + room);
}

const roomRef = doc(db,"bara_rooms",room);

await setDoc(roomRef,{
  room,players:[],hostName:"",status:"lobby",createdAt:serverTimestamp()
},{merge:true});

const hostInput = document.getElementById("hostName");
const list = document.getElementById("playersList");
const empty = document.getElementById("empty");
const startBtn = document.getElementById("startBtn");

function render(players){
  list.innerHTML="";
  if(players.length===0){
    list.appendChild(empty);
    empty.style.display="block";
  }else{
    empty.style.display="none";
    players.forEach(p=>{
      const d=document.createElement("div");
      d.className="player";
      d.textContent=p;
      list.appendChild(d);
    });
  }
  startBtn.disabled = !(hostInput.value.trim() && players.length>=1);
}

hostInput.oninput=()=>updateDoc(roomRef,{hostName:hostInput.value.trim()});

onSnapshot(roomRef,(snap)=>{
  const data=snap.data()||{};
  render(data.players||[]);
  if(!hostInput.value && data.hostName) hostInput.value=data.hostName;
});

startBtn.onclick=async()=>{
  await updateDoc(roomRef,{status:"categories"});
  location.href="categories.html?mode=multi&room="+room;
};

/* ===== Modal logic ===== */
const overlay=document.getElementById("overlay");
const tabs=document.querySelectorAll(".tab");
const boxes=document.querySelectorAll(".box");

document.getElementById("shareBtn").onclick=()=>{
  const url=location.origin+"/join.html?room="+room;
  document.getElementById("shareUrl").textContent=url;
  document.getElementById("roomCode").textContent=room;
  document.getElementById("qrImg").src=
    "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="+encodeURIComponent(url);
  overlay.classList.add("show");
};

tabs.forEach(t=>{
  t.onclick=()=>{
    tabs.forEach(x=>x.classList.remove("active"));
    boxes.forEach(b=>b.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("box-"+t.dataset.tab).classList.add("active");
  };
});

window.copyText=()=>{
  const active=document.querySelector(".box.active");
  const text=active.innerText.trim();
  navigator.clipboard.writeText(text);
};

window.closeModal=()=>overlay.classList.remove("show");
</script>

</body>
</html>
