<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>لعبة برا السالفة - أجهزة متعددة</title>

  <style>
    :root{
      --bg:#e9e3d6;
      --green:#3f5b2a;
      --green2:#6e8554;
      --yellow:#f2c300;
      --blue:#bfe3ff;
      --purple:#8b49b9;
      --text:#1a1a1a;
      --muted:#9a9a9a;

      --shadow: 0 10px 0 rgba(0,0,0,0.18);
      --shadowSmall: 0 8px 0 rgba(0,0,0,0.18);

      --homeSide: 18px;
      --homeBottom: calc(18px + env(safe-area-inset-bottom));
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--text);
    }

    .page{
      min-height: 100vh;
      padding: 14px 12px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .frame{
      width: min(520px, 100%);
      background: var(--bg);
      border: 6px solid var(--green);
      border-radius: 26px;
      padding: 18px 16px 24px;
      position: relative;

      min-height: calc(100vh - 28px);
      display:flex;
      flex-direction:column;
    }

    /* رأس الصفحة */
    .topRow{
      position: relative;
      min-height: 86px;
      margin-bottom: 8px;
      padding-left: 118px;
    }

    .title{
      position:absolute;
      right: 18px;
      top: 18px;
      font-weight: 900;
      color: var(--green);
      font-size: 22px;
      line-height: 1.2;
      text-align:right;
      white-space:nowrap;
    }

    .logo{
      position:absolute;
      left: 10px;
      top: 2px;
      width: 98px;
      height: 98px;
      object-fit: contain;
      opacity: 0.98;
      pointer-events:none;
    }

    /* مربع اسم المقدم */
    .hostInput{
      width: 100%;
      padding: 14px 14px;
      border: 4px solid var(--green2);
      border-radius: 18px;
      background:#fff;
      font-size: 20px;
      font-weight: 800;
      color:#111;
      outline:none;
      text-align:center;
      margin: 10px 0 14px;
    }
    .hostInput::placeholder{
      color: var(--muted);
      font-weight: 900;
      font-size: 18px;
      opacity: 0.75;
    }

    /* صندوق قائمة الأسماء */
    .listCard{
      width:100%;
      background: var(--green2);
      border-radius: 22px;
      padding: 14px 14px 16px;
      box-shadow: inset 0 0 0 0 rgba(0,0,0,0);
      border: 0;
      flex: 1;
      min-height: 280px;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    .listTitle{
      color:#fff;
      font-weight: 1000;
      font-size: 28px;
      text-align:center;
      margin: 2px 0 2px;
      letter-spacing: .2px;
    }

    .namesArea{
      background: rgba(255,255,255,0.16);
      border-radius: 18px;
      padding: 12px 12px;
      flex: 1;
      overflow:auto;
    }

    .nameRow{
      background:#fff;
      border: 4px solid #000;
      border-radius: 18px;
      box-shadow: var(--shadowSmall);
      padding: 10px 12px;
      font-size: 22px;
      font-weight: 900;
      text-align:center;
      margin-bottom: 12px;
    }
    .nameRow:last-child{ margin-bottom:0; }

    .emptyHint{
      color: rgba(255,255,255,.95);
      text-align:center;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.55;
      padding: 14px 10px;
    }

    /* أزرار تحت */
    .btns{
      display:flex;
      flex-direction:column;
      gap: 14px;
      align-items:center;
      margin: 16px 0 10px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
    }

    .btn{
      width: min(420px, 92%);
      height: 70px;
      border-radius: 24px;
      border: 4px solid #000;
      box-shadow: var(--shadow);
      font-size: 30px;
      font-weight: 1000;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
      transition: transform .08s ease;
      color:#111;
    }
    .btn:active{ transform: translateY(1px); box-shadow: 0 9px 0 rgba(0,0,0,0.18); }

    .btn.blue{ background: var(--blue); }
    .btn.yellow{ background: var(--yellow); }
    .btn[disabled]{
      opacity:.55;
      cursor:not-allowed;
      transform:none;
    }

    /* زر الرئيسية */
    .homeBtn{
      position:absolute;
      left: var(--homeSide);
      bottom: var(--homeBottom);
      width: 64px;
      height: 64px;
      border-radius: 18px;
      border: 4px solid #000;
      background: #bfe3ff;
      box-shadow: var(--shadowSmall);
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      z-index: 5;
      -webkit-tap-highlight-color:transparent;
    }
    .homeBtn svg{
      width: 34px;
      height: 34px;
      fill: #111;
    }

    /* ====== مودال المشاركة ====== */
    .modalBack{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px 14px;
      z-index: 9999;
    }
    .modalBack.show{ display:flex; }

    .modal{
      width: min(520px, 100%);
      background:#fff;
      border-radius: 22px;
      border: 4px solid #000;
      box-shadow: 0 12px 0 rgba(0,0,0,.2);
      padding: 14px 14px 16px;
      position: relative;
    }

    .modalClose{
      position:absolute;
      left: 12px;
      top: 10px;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 0;
      background: transparent;
      color:#1b4aa0;
      font-size: 34px;
      font-weight: 900;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .modalTitle{
      text-align:center;
      font-weight: 1000;
      font-size: 26px;
      margin: 6px 0 12px;
    }

    .tabs{
      display:flex;
      gap: 10px;
      justify-content:center;
      margin: 6px 0 12px;
    }
    .tab{
      border: 4px solid #000;
      border-radius: 18px;
      box-shadow: var(--shadowSmall);
      padding: 8px 14px;
      font-size: 22px;
      font-weight: 1000;
      cursor:pointer;
      user-select:none;
      min-width: 96px;
      text-align:center;
    }
    .tab.yellow{ background: var(--yellow); color:#111; }
    .tab.green{ background: #22a654; color:#fff; }
    .tab.orange{ background: #f39c12; color:#111; }
    .tab.active{
      outline: 4px solid rgba(0,0,0,.25);
      outline-offset: 0;
    }

    .panel{
      background:#f3f3f3;
      border-radius: 18px;
      border: 3px solid rgba(0,0,0,.15);
      padding: 14px 12px;
    }

    .roomLabel{
      text-align:center;
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 6px;
      color:#333;
    }
    .roomCode{
      text-align:center;
      font-size: 42px;
      font-weight: 1000;
      letter-spacing: 2px;
      color:#111;
      margin: 6px 0 10px;
    }

    .copyRow{
      display:flex;
      gap: 10px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top: 8px;
    }
    .miniBtn{
      border: 4px solid #000;
      border-radius: 18px;
      box-shadow: var(--shadowSmall);
      padding: 10px 14px;
      font-size: 18px;
      font-weight: 1000;
      cursor:pointer;
      background:#fff;
      min-width: 140px;
      -webkit-tap-highlight-color:transparent;
    }
    .miniBtn:active{ transform: translateY(1px); }

    .toast{
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      background: #111;
      color:#fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 16px;
      opacity: 0;
      pointer-events:none;
      transition: opacity .2s ease, transform .2s ease;
      z-index: 10000;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .qrBox{
      display:flex;
      justify-content:center;
      margin-top: 10px;
    }
    .qrBox img{
      width: 180px;
      height: 180px;
      border-radius: 16px;
      border: 4px solid #000;
      background:#fff;
      box-shadow: var(--shadowSmall);
    }

    @media (max-width: 360px){
      .logo{ width: 90px; height: 90px; left: 10px; top: 2px; }
      .title{ font-size: 20px; right: 16px; top: 16px; }
      .hostInput{ font-size: 18px; }
      .btn{ font-size: 28px; height: 66px; }
      .homeBtn{ width: 60px; height: 60px; }
      .homeBtn svg{ width: 32px; height: 32px; }
      .roomCode{ font-size: 38px; }
      .tab{ font-size: 20px; min-width: 90px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="frame">

      <div class="topRow">
        <div class="title">اللعب من اجهزة متعددة</div>
        <img class="logo" src="logo.PNG" alt="logo">
      </div>

      <input id="hostName" class="hostInput" type="text" placeholder="اكتب اسمك هنا" autocomplete="off" />

      <div class="listCard">
        <div class="listTitle">اسماء اللاعبين</div>
        <div class="namesArea" id="namesArea">
          <div class="emptyHint" id="emptyHint">شارِك الرابط مع اللاعبين<br/>وأسماء اللاعبين راح تظهر هنا</div>
        </div>
      </div>

      <div class="btns">
        <button class="btn blue" id="shareBtn">مشاركة اللاعبين</button>
        <button class="btn yellow" id="startBtn" disabled>ابدأ اللعب</button>
      </div>

      <div class="homeBtn" id="homeBtn" title="الرئيسية" aria-label="الرئيسية">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- مودال مشاركة اللعبة -->
  <div class="modalBack" id="modalBack" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modalClose" id="modalClose" aria-label="إغلاق">×</button>
      <div class="modalTitle">مشاركة اللعبة</div>

      <div class="tabs">
        <div class="tab orange active" id="tabCode">باركود</div>
        <div class="tab green" id="tabQr">رمز</div>
        <div class="tab yellow" id="tabLink">رابط</div>
      </div>

      <div class="panel" id="panel">
        <!-- يتعبّى بالجافاسكربت -->
      </div>
    </div>
  </div>

  <div class="toast" id="toast">تم نسخ الرابط</div>

  <script>
    /* =========================================================
       players.html (أجهزة متعددة) — صفحة المقدم
       - نفس ستايل نمط جهاز واحد
       - اسم المقدم (اكتب اسمك هنا)
       - قائمة أسماء اللاعبين اللي يدخلون
       - مشاركة: رابط + رمز + باركود (QR)
       - نسخ رابط مع حركة/Toast
       ========================================================= */

    const hostNameEl = document.getElementById("hostName");
    const namesArea = document.getElementById("namesArea");
    const emptyHint = document.getElementById("emptyHint");
    const shareBtn = document.getElementById("shareBtn");
    const startBtn = document.getElementById("startBtn");
    const homeBtn = document.getElementById("homeBtn");

    const modalBack = document.getElementById("modalBack");
    const modalClose = document.getElementById("modalClose");
    const panel = document.getElementById("panel");
    const toast = document.getElementById("toast");

    const tabCode = document.getElementById("tabCode");
    const tabQr = document.getElementById("tabQr");
    const tabLink = document.getElementById("tabLink");

    const STORE_URL = "https://sandooq-m.com";

    // صفحة دخول اللاعب (بننشئها بعدين)
    // خلي الرابط جاهز من الآن
    const JOIN_PAGE = "join.html";

    // ========= Helpers =========
    function safeJSONParse(v){
      try{ return JSON.parse(v); } catch(e){ return null; }
    }
    function setSessionJSON(key,val){
      sessionStorage.setItem(key, JSON.stringify(val));
    }
    function getSessionJSON(key){
      const v = sessionStorage.getItem(key);
      return v ? safeJSONParse(v) : null;
    }

    function genRoomCode(){
      // 6 أرقام
      return String(Math.floor(100000 + Math.random()*900000));
    }

    function showToast(msg){
      toast.textContent = msg || "تم";
      toast.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(()=> toast.classList.remove("show"), 1100);
    }

    async function copyText(txt){
      try{
        await navigator.clipboard.writeText(txt);
        showToast("تم نسخ الرابط");
        return true;
      }catch(e){
        // fallback
        try{
          const t = document.createElement("textarea");
          t.value = txt;
          t.style.position = "fixed";
          t.style.left = "-9999px";
          document.body.appendChild(t);
          t.select();
          document.execCommand("copy");
          document.body.removeChild(t);
          showToast("تم نسخ الرابط");
          return true;
        }catch(err){
          alert("ما قدرت أنسخ. انسخ يدويًا.");
          return false;
        }
      }
    }

    // ========= مفاتيح التخزين =========
    // نخزن كل شيء مربوط برمز الغرفة عشان ما يتلخبط
    let roomCode = (sessionStorage.getItem("bara_md_room") || "").trim();
    if(!roomCode){
      roomCode = genRoomCode();
      sessionStorage.setItem("bara_md_room", roomCode);
    }

    const LS_KEY_PLAYERS = "bara_md_players_" + roomCode;
    const LS_KEY_HOST    = "bara_md_host_" + roomCode;

    // قناة بث (Real-time) بين صفحات نفس الدومين
    let bc = null;
    try{
      bc = new BroadcastChannel("bara_md_" + roomCode);
    }catch(e){ bc = null; }

    // ========= تحميل أولي =========
    function loadHostName(){
      const v = (sessionStorage.getItem("bara_md_host_name") || "").trim();
      if(v){
        hostNameEl.value = v;
        return;
      }
      const saved = (localStorage.getItem(LS_KEY_HOST) || "").trim();
      if(saved){
        hostNameEl.value = saved;
        sessionStorage.setItem("bara_md_host_name", saved);
      }
    }

    function loadPlayers(){
      const arr = safeJSONParse(localStorage.getItem(LS_KEY_PLAYERS));
      if(Array.isArray(arr)) return arr;
      return [];
    }

    function savePlayers(arr){
      localStorage.setItem(LS_KEY_PLAYERS, JSON.stringify(arr));
      // دفع تحديث للمقدم/اللاعبين
      if(bc){
        bc.postMessage({ type:"players", players: arr });
      }
    }

    function renderPlayers(){
      const players = loadPlayers();
      // امسح الصفوف القديمة (واترك emptyHint لو موجود)
      namesArea.innerHTML = "";
      if(!players.length){
        namesArea.appendChild(emptyHint);
        startBtn.disabled = true;
        return;
      }

      // عرض الأسماء
      players.forEach(n=>{
        const d = document.createElement("div");
        d.className = "nameRow";
        d.textContent = n;
        namesArea.appendChild(d);
      });

      // زر ابدأ اللعب يتفعل إذا: اسم المقدم موجود + على الأقل 1 لاعب (أنت تحدد لاحقًا)
      const hostOk = !!hostNameEl.value.trim();
      startBtn.disabled = !(hostOk && players.length >= 1);
    }

    // ========= حفظ اسم المقدم =========
    hostNameEl.addEventListener("focusin", (e)=>{
      hostNameEl.dataset.ph = hostNameEl.placeholder;
      hostNameEl.placeholder = "";
    });
    hostNameEl.addEventListener("focusout", (e)=>{
      if(!hostNameEl.value.trim()){
        hostNameEl.placeholder = hostNameEl.dataset.ph || "اكتب اسمك هنا";
      }
    });

    hostNameEl.addEventListener("input", ()=>{
      const v = hostNameEl.value.trim();
      sessionStorage.setItem("bara_md_host_name", v);
      localStorage.setItem(LS_KEY_HOST, v);
      renderPlayers();

      if(bc){
        bc.postMessage({ type:"host", name: v });
      }
    });

    // ========= تحديثات قادمة من اللاعب =========
    if(bc){
      bc.onmessage = (ev)=>{
        const data = ev.data || {};
        if(data.type === "players"){
          // تحديث فوري
          renderPlayers();
        }
      };
    }

    // كمان نسمع لتغير localStorage (fallback)
    window.addEventListener("storage", (e)=>{
      if(e.key === LS_KEY_PLAYERS){
        renderPlayers();
      }
    });

    // ========= المودال =========
    function setActiveTab(which){
      [tabCode, tabQr, tabLink].forEach(t=> t.classList.remove("active"));
      if(which === "code") tabCode.classList.add("active");
      if(which === "qr") tabQr.classList.add("active");
      if(which === "link") tabLink.classList.add("active");
    }

    function getJoinLink(){
      const base = location.origin + location.pathname.replace(/\/[^\/]*$/, "/");
      // رابط دخول اللاعب
      return base + JOIN_PAGE + "?room=" + encodeURIComponent(roomCode);
    }

    function renderPanel(mode){
      const joinLink = getJoinLink();

      if(mode === "code"){
        panel.innerHTML = `
          <div class="roomLabel">رمز الغرفة</div>
          <div class="roomCode">${roomCode}</div>
          <div class="copyRow">
            <button class="miniBtn" id="copyCodeBtn">نسخ الرمز</button>
            <button class="miniBtn" id="openStoreBtn">فتح المتجر</button>
          </div>
        `;
        document.getElementById("copyCodeBtn").addEventListener("click", ()=> copyText(roomCode));
        document.getElementById("openStoreBtn").addEventListener("click", ()=> window.open(STORE_URL, "_blank"));
        return;
      }

      if(mode === "qr"){
        // QR باستخدام Google Chart API
        const qrUrl = "https://chart.googleapis.com/chart?cht=qr&chs=300x300&chl=" + encodeURIComponent(joinLink);
        panel.innerHTML = `
          <div class="roomLabel">امسح الباركود للدخول</div>
          <div class="qrBox"><img src="${qrUrl}" alt="QR"></div>
          <div class="copyRow">
            <button class="miniBtn" id="copyLinkBtn2">نسخ الرابط</button>
            <button class="miniBtn" id="openStoreBtn2">فتح المتجر</button>
          </div>
        `;
        document.getElementById("copyLinkBtn2").addEventListener("click", ()=> copyText(joinLink));
        document.getElementById("openStoreBtn2").addEventListener("click", ()=> window.open(STORE_URL, "_blank"));
        return;
      }

      // link
      panel.innerHTML = `
        <div class="roomLabel">رابط الدخول</div>
        <div style="word-break:break-all; text-align:center; font-weight:900; font-size:16px; line-height:1.5; margin:10px 0;">
          ${joinLink}
        </div>
        <div class="copyRow">
          <button class="miniBtn" id="copyLinkBtn">نسخ الرابط</button>
          <button class="miniBtn" id="openStoreBtn3">فتح المتجر</button>
        </div>
      `;
      document.getElementById("copyLinkBtn").addEventListener("click", ()=> copyText(joinLink));
      document.getElementById("openStoreBtn3").addEventListener("click", ()=> window.open(STORE_URL, "_blank"));
    }

    function openModal(){
      modalBack.classList.add("show");
      modalBack.setAttribute("aria-hidden","false");
      setActiveTab("code");
      renderPanel("code");
    }
    function closeModal(){
      modalBack.classList.remove("show");
      modalBack.setAttribute("aria-hidden","true");
    }

    shareBtn.addEventListener("click", openModal);
    modalClose.addEventListener("click", closeModal);
    modalBack.addEventListener("click", (e)=>{
      if(e.target === modalBack) closeModal();
    });

    tabCode.addEventListener("click", ()=>{
      setActiveTab("code");
      renderPanel("code");
    });
    tabQr.addEventListener("click", ()=>{
      setActiveTab("qr");
      renderPanel("qr");
    });
    tabLink.addEventListener("click", ()=>{
      setActiveTab("link");
      renderPanel("link");
    });

    // ========= زر ابدأ اللعب =========
    startBtn.addEventListener("click", ()=>{
      const host = hostNameEl.value.trim();
      if(!host){
        alert("اكتب اسمك أولاً");
        hostNameEl.focus();
        return;
      }

      const joined = loadPlayers(); // أسماء اللاعبين اللي دخلوا
      // نكوّن قائمة اللاعبين النهائية (المقدم + البقية)
      const finalPlayers = [host, ...joined];

      // نخزن مثل نمط جهاز واحد عشان categories.html / single_game.html يفهمون
      sessionStorage.setItem("players", JSON.stringify(finalPlayers));
      sessionStorage.setItem("bara_players", JSON.stringify(finalPlayers));
      sessionStorage.setItem("bara_mode", "multi");

      // نحفظ رقم الغرفة عشان نستخدمه لاحقاً في نمط الأجهزة المتعددة
      sessionStorage.setItem("bara_md_room", roomCode);

      // نفس التدفق: روح للكتاغوريات
      window.location.href = "categories.html";
    });

    // ========= زر الرئيسية =========
    function clearAllMultiState(){
      // امسح بيانات الغرفة الحالية فقط
      localStorage.removeItem(LS_KEY_PLAYERS);
      localStorage.removeItem(LS_KEY_HOST);

      sessionStorage.removeItem("bara_md_room");
      sessionStorage.removeItem("bara_md_host_name");
      sessionStorage.removeItem("bara_mode");

      // مفاتيح اللعب العامة
      sessionStorage.removeItem("players");
      sessionStorage.removeItem("bara_players");
      sessionStorage.removeItem("categoryKey");
      sessionStorage.removeItem("singleState");
    }

    homeBtn.addEventListener("click", ()=>{
      clearAllMultiState();
      window.location.href = "index.html";
    });

    // ========= Boot =========
    (function init(){
      loadHostName();
      // تهيئة قائمة اللاعبين (لو ما فيه شيء)
      const existing = loadPlayers();
      if(!Array.isArray(existing)) savePlayers([]);
      renderPlayers();
    })();
  </script>
</body>
</html>

<!-- players.html برا السالفة – إصدار 1 -->
