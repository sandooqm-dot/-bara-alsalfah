<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>العب من اجهزة متعددة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{--bg:#e9e4d6;--olive:#3f4a1f;--panel:#6e7b46;--black:#111;--yellow:#ffd21a;--blue:#bfe1ff}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:"Baloo Bhaijaan 2",Arial,sans-serif;color:#111}
    .wrap{min-height:100svh;display:flex;justify-content:center;padding:18px 14px 30px}
    .card{width:min(560px,100%);position:relative}
    .logo{position:absolute;left:8px;top:10px;width:92px;height:92px;object-fit:contain;pointer-events:none}
    h1{margin:40px 0 10px;text-align:center;color:var(--olive);font-weight:900;font-size:44px}

    .panel{background:var(--panel);border-radius:28px;padding:18px 18px;margin:0 8px 16px}
    .titleInside{color:#fff;font-weight:900;font-size:34px;text-align:center;margin:0 0 12px}

    .bigArea{
      height:56vh;
      min-height:360px;
      background:var(--panel);
      border-radius:26px;
      padding:12px;
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }
    .listBox{
      width:100%;
      height:100%;
      background:transparent;
      border-radius:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:rgba(255,255,255,.75);
      font-weight:900;
      font-size:24px;
      text-align:center;
    }

    .btnRow{display:flex;flex-direction:column;gap:14px;margin-top:14px}
    .btnBig{
      width:100%;
      border:5px solid var(--black);
      border-radius:999px;
      padding:16px 16px;
      font-weight:900;
      font-size:38px;
      box-shadow:0 10px 0 rgba(0,0,0,.18);
      cursor:pointer;
      background:#fff;
    }
    .btnBig:active{transform:translateY(2px)}
    .btnShare{background:var(--blue)}
    .btnStart{background:var(--yellow)}

    /* زر المنزل */
    .homeBtn{
      position:fixed;left:16px;bottom:16px;
      width:64px;height:64px;border-radius:999px;
      border:4px solid var(--black);
      background:#bfe1ff;
      box-shadow:0 8px 0 rgba(0,0,0,.18);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;z-index:20;
    }
    .homeBtn:active{transform:translateY(2px)}
    .homeIcon{width:34px;height:34px}

    /* نافذة مشاركة اللاعبين */
    .overlay{
      position:fixed;inset:0;background:rgba(0,0,0,.35);
      display:none;justify-content:center;align-items:center;
      padding:16px;z-index:50;
    }
    .overlay.show{display:flex}
    .modal{
      width:min(560px,100%);
      background:#fff;
      border-radius:22px;
      border:4px solid rgba(0,0,0,.10);
      box-shadow:0 18px 40px rgba(0,0,0,.25);
      overflow:hidden;
    }
    .modalHead{
      padding:14px 16px 0;
      display:flex;align-items:center;justify-content:center;
      position:relative;
    }
    .closeX{
      position:absolute;left:14px;top:14px;
      width:36px;height:36px;border-radius:10px;
      border:0;background:transparent;
      color:#2d7bdc;
      font-size:30px;font-weight:900;
      cursor:pointer;
    }
    .modalTitle{font-weight:900;font-size:28px}
    .tabs{display:flex;gap:12px;justify-content:center;padding:10px 14px 6px}
    .tab{
      border:0;border-radius:14px;
      padding:10px 16px;
      font-weight:900;
      font-size:22px;
      box-shadow:0 6px 0 rgba(0,0,0,.18);
      cursor:pointer;
      background:#eee;
    }
    .tab.link{background:#ffd21a}
    .tab.code{background:#35a853;color:#fff}
    .tab.qr{background:#f0a12d;color:#fff}
    .content{padding:10px 16px 16px}
    .box{
      background:#f5f5f5;
      border:3px solid rgba(0,0,0,.10);
      border-radius:18px;
      padding:14px 14px;
      text-align:center;
      font-weight:900;
      font-size:22px;
      word-break:break-word;
    }
    .roomLabel{font-size:20px;color:#555;font-weight:900;margin-top:10px}
    .roomCode{font-size:44px;letter-spacing:2px}
    .copyBtn{
      margin-top:12px;
      width:100%;
      border:4px solid #111;
      border-radius:18px;
      padding:12px 12px;
      font-weight:900;
      font-size:22px;
      background:#fff;
      box-shadow:0 8px 0 rgba(0,0,0,.18);
      cursor:pointer;
    }
    .copyBtn:active{transform:translateY(2px)}
    .qrWrap{display:flex;justify-content:center;margin-top:10px}
    canvas{max-width:240px;max-height:240px}
  </style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <img class="logo" src="logo.PNG" alt="logo">
      <h1>العب من اجهزة متعددة</h1>

      <div class="panel">
        <div class="titleInside">اسماء اللاعبين</div>

        <div class="bigArea">
          <div id="playersBox" class="listBox">بانتظار اللاعبين…</div>
        </div>

        <div class="btnRow">
          <button id="shareBtn" class="btnBig btnShare" type="button">مشاركة اللاعبين</button>
          <button id="startBtn" class="btnBig btnStart" type="button">ابدأ اللعب</button>
        </div>
      </div>
    </div>
  </div>

  <button class="homeBtn" type="button" onclick="location.href='index.html'" aria-label="الصفحة الرئيسية">
    <svg class="homeIcon" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10.5 12 3l9 7.5"></path>
      <path d="M5 10v10h14V10"></path>
      <path d="M9 20v-6h6v6"></path>
    </svg>
  </button>

  <!-- نافذة مشاركة اللاعبين -->
  <div id="overlay" class="overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modalHead">
        <button id="closeBtn" class="closeX" type="button">×</button>
        <div class="modalTitle">مشاركة اللعبة</div>
      </div>

      <div class="tabs">
        <button class="tab link" type="button" data-tab="link">رابط</button>
        <button class="tab code" type="button" data-tab="code">رمز</button>
        <button class="tab qr" type="button" data-tab="qr">باركود</button>
      </div>

      <div class="content">
        <div id="contentBox"></div>
      </div>
    </div>
  </div>

  <!-- مكتبة QR -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<script>
  localStorage.setItem('bara_mode','multi');

  // رمز غرفة (6 أرقام)
  function genRoom(){
    return String(Math.floor(100000 + Math.random()*900000));
  }
  let room = localStorage.getItem('bara_room');
  if(!room){
    room = genRoom();
    localStorage.setItem('bara_room', room);
  }

  const playersBox = document.getElementById('playersBox');

  // (مبدئي) قراءة أسماء اللاعبين من التخزين — للواجهة فقط
  function readPlayers(){
    try{
      const arr = JSON.parse(localStorage.getItem('bara_players_multi') || "[]");
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }
  function renderPlayers(){
    const players = readPlayers();
    if(players.length === 0){
      playersBox.textContent = "بانتظار اللاعبين…";
      return;
    }
    playersBox.innerHTML = players.map(p => `<div style="color:#fff;font-size:28px;margin:8px 0;font-weight:900">${p}</div>`).join("");
  }
  renderPlayers();

  // مشاركة
  const shareBtn = document.getElementById('shareBtn');
  const startBtn = document.getElementById('startBtn');
  const overlay = document.getElementById('overlay');
  const closeBtn = document.getElementById('closeBtn');
  const contentBox = document.getElementById('contentBox');

  const joinUrl = () => {
    const base = location.origin + location.pathname.replace(/\/[^\/]*$/, '/');
    return base + "join.html?room=" + encodeURIComponent(room);
  };

  function showLink(){
    const url = joinUrl();
    contentBox.innerHTML = `
      <div class="box">
        <div style="font-weight:900;margin-bottom:10px">رابط اللعبة</div>
        <div style="font-size:18px;font-weight:800">${url}</div>
        <button class="copyBtn" type="button" id="copyLink">نسخ الرابط</button>
      </div>
    `;
    document.getElementById('copyLink').onclick = async () => {
      try{ await navigator.clipboard.writeText(url); }catch(e){}
    };
  }

  function showCode(){
    contentBox.innerHTML = `
      <div class="box">
        <div class="roomLabel">رمز الغرفة</div>
        <div class="roomCode">${room}</div>
        <button class="copyBtn" type="button" id="copyCode">نسخ الرمز</button>
      </div>
    `;
    document.getElementById('copyCode').onclick = async () => {
      try{ await navigator.clipboard.writeText(room); }catch(e){}
    };
  }

  function showQR(){
    const url = joinUrl();
    contentBox.innerHTML = `
      <div class="box">
        <div style="font-weight:900;margin-bottom:10px">باركود QR</div>
        <div class="qrWrap"><canvas id="qrc"></canvas></div>
        <div style="margin-top:10px;font-size:16px;color:#666;font-weight:900">${url}</div>
      </div>
    `;
    const canvas = document.getElementById('qrc');
    QRCode.toCanvas(canvas, url, { width: 240, margin: 1 }, function(){});
  }

  function openModal(){
    overlay.classList.add('show');
    overlay.setAttribute('aria-hidden','false');
    showCode(); // افتراضي
  }
  function closeModal(){
    overlay.classList.remove('show');
    overlay.setAttribute('aria-hidden','true');
  }

  shareBtn.onclick = openModal;
  closeBtn.onclick = closeModal;
  overlay.onclick = (e) => { if(e.target===overlay) closeModal(); };

  document.querySelectorAll('.tab').forEach(btn=>{
    btn.onclick = () => {
      const t = btn.dataset.tab;
      if(t==='link') showLink();
      if(t==='code') showCode();
      if(t==='qr') showQR();
    };
  });

  startBtn.onclick = () => {
    location.href = 'categories.html';
  };
</script>
</body>
</html>
