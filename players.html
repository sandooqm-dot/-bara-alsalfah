<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>اللعب من أجهزة متعددة</title>

  <style>
    :root{
      --bg:#e9e3d6;
      --green:#3f5b2a;
      --green2:#6e8554;
      --yellow:#f2c300;
      --orange:#f0a11a;
      --blue:#bfe3ff;
      --text:#1a1a1a;
      --muted:#9a9a9a;

      --shadow: 0 10px 0 rgba(0,0,0,0.18);
      --shadowSmall: 0 8px 0 rgba(0,0,0,0.18);

      --homeSide: 18px;
      --homeBottom: calc(18px + env(safe-area-inset-bottom));
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--text);
    }

    .page{
      min-height: 100vh;
      padding: 14px 12px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .frame{
      width: min(520px, 100%);
      background: var(--bg);
      border: 6px solid var(--green);
      border-radius: 26px;
      padding: 18px 16px 24px;
      position: relative;

      min-height: calc(100vh - 28px);
      display:flex;
      flex-direction:column;
      gap: 14px;
    }

    .topRow{
      position: relative;
      min-height: 86px;
      margin-bottom: 6px;
      padding-left: 118px;
    }

    .title{
      position:absolute;
      right: 18px;
      top: 18px;
      font-weight: 900;
      color: var(--green);
      font-size: 22px;
      line-height: 1.1;
      text-align:right;
      white-space:nowrap;
    }

    .logo{
      position:absolute;
      left: 10px;
      top: 2px;
      width: 98px;
      height: 98px;
      object-fit: contain;
      opacity: 0.98;
      pointer-events:none;
    }

    /* مربع اسم المقدم */
    .hostInput{
      width: 100%;
      padding: 14px 14px;
      border: 4px solid var(--green2);
      border-radius: 18px;
      background:#fff;
      font-size: 20px;
      font-weight: 800;
      color:#111;
      outline:none;
      text-align:center;
    }
    .hostInput::placeholder{
      color: var(--muted);
      font-weight: 900;
      font-size: 18px;
      opacity: 0.75;
    }

    /* لوحة أسماء اللاعبين */
    .board{
      background: rgba(63,91,42,0.85);
      border-radius: 18px;
      border: 4px solid rgba(0,0,0,0.0);
      padding: 16px 14px;
      min-height: 290px;
      box-shadow: inset 0 0 0 0 rgba(0,0,0,0);
    }

    .boardTitle{
      text-align:center;
      color:#fff;
      font-size: 34px;
      font-weight: 900;
      margin: 4px 0 12px;
      opacity: 0.78;
    }

    .boardHint{
      text-align:center;
      color:#fff;
      opacity:0.55;
      font-weight:800;
      font-size: 16px;
      margin: 0 0 10px;
      line-height:1.5;
    }

    .playersList{
      margin-top: 8px;
      display:flex;
      flex-direction:column;
      gap:10px;
      padding: 0 6px;
    }

    .pItem{
      background: rgba(255,255,255,0.20);
      border: 3px solid rgba(0,0,0,0.0);
      border-radius: 14px;
      padding: 12px 10px;
      text-align:center;
      color:#fff;
      font-weight: 900;
      font-size: 22px;
    }

    /* أزرار أسفل */
    .btnWrap{
      display:flex;
      flex-direction:column;
      gap: 14px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
    }

    .btn{
      width: min(320px, 80%);
      margin: 0 auto;
      border: 4px solid #000;
      border-radius: 22px;
      font-weight: 900;
      font-size: 28px;
      padding: 12px 18px;
      box-shadow: var(--shadow);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      background: #fff;
      color:#111;
    }

    .btnShare{
      background: var(--blue);
    }
    .btnStart{
      background: var(--yellow);
    }

    /* زر الرئيسية ثابت */
    .homeBtn{
      position:absolute;
      left: var(--homeSide);
      bottom: var(--homeBottom);
      width: 64px;
      height: 64px;
      border-radius: 18px;
      border: 4px solid #000;
      background: #bfe3ff;
      box-shadow: var(--shadowSmall);
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      z-index: 30;
      -webkit-tap-highlight-color:transparent;
    }
    .homeBtn svg{ width:34px; height:34px; fill:#111; }

    /* ===== نافذة المشاركة ===== */
    .overlay{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,0.35);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px 12px;
      z-index: 999;
    }
    .overlay.show{ display:flex; }

    .modal{
      width: min(520px, 96%);
      background:#fff;
      border: 4px solid #000;
      border-radius: 18px;
      box-shadow: 0 16px 0 rgba(0,0,0,0.25);
      overflow:hidden;
      position:relative;
    }

    .modalHead{
      padding: 14px 14px 10px;
      text-align:center;
      font-weight: 900;
      font-size: 26px;
      color:#111;
      position:relative;
    }

    .closeX{
      position:absolute;
      left: 12px;
      top: 10px;
      width: 38px;
      height: 38px;
      border: 0;
      background: transparent;
      font-size: 32px;
      font-weight: 900;
      line-height: 1;
      cursor:pointer;
      color:#1b3f7a;
    }

    .tabs{
      display:flex;
      justify-content:center;
      gap: 10px;
      padding: 0 14px 12px;
    }

    .tabBtn{
      border: 4px solid #000;
      border-radius: 14px;
      padding: 10px 14px;
      font-weight: 900;
      font-size: 22px;
      cursor:pointer;
      box-shadow: var(--shadowSmall);
      background:#fff;
      -webkit-tap-highlight-color:transparent;
      min-width: 92px;
    }
    .tab-link{ background: var(--yellow); }
    .tab-code{ background: #2aa552; color:#fff; }
    .tab-qr{ background: var(--orange); color:#111; }

    .tabBtn.active{
      transform: translateY(1px);
      box-shadow: 0 7px 0 rgba(0,0,0,0.18);
      filter: saturate(1.15);
    }

    .modalBody{
      padding: 0 14px 16px;
    }

    .box{
      background: #f4f4f4;
      border: 3px solid rgba(0,0,0,0.18);
      border-radius: 14px;
      padding: 12px;
    }

    .boxTitle{
      text-align:center;
      font-weight: 900;
      font-size: 18px;
      color:#333;
      margin-bottom: 8px;
    }

    .linkText{
      direction:ltr;
      text-align:center;
      font-weight: 800;
      font-size: 16px;
      line-height: 1.35;
      word-break: break-all;
      color:#111;
      background:#fff;
      border: 2px solid rgba(0,0,0,0.18);
      border-radius: 12px;
      padding: 10px 10px;
      margin-bottom: 12px;
    }

    .rowBtns{
      display:flex;
      gap: 12px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .miniBtn{
      border: 4px solid #000;
      border-radius: 16px;
      padding: 10px 16px;
      font-weight: 900;
      font-size: 20px;
      cursor:pointer;
      background: #fff;
      color:#1b3f7a;
      box-shadow: var(--shadowSmall);
      -webkit-tap-highlight-color:transparent;
      min-width: 150px;
    }

    .toast{
      position:fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      color:#fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 16px;
      z-index: 2000;
      opacity:0;
      pointer-events:none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show{
      opacity:1;
      transform: translateX(-50%) translateY(2px);
    }

    .codeBig{
      font-size: 46px;
      font-weight: 1000;
      text-align:center;
      letter-spacing: 2px;
      color:#111;
      background:#fff;
      border: 2px solid rgba(0,0,0,0.18);
      border-radius: 14px;
      padding: 16px 10px;
      margin-top: 6px;
    }

    .qrWrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 10px;
      padding-top: 2px;
    }
    .qrImg{
      width: 220px;
      height: 220px;
      border-radius: 14px;
      background:#fff;
      border: 2px solid rgba(0,0,0,0.18);
      display:block;
    }

    .section{ display:none; }
    .section.show{ display:block; }

    @media (max-width: 360px){
      .title{ font-size: 20px; }
      .boardTitle{ font-size: 30px; }
      .btn{ font-size: 26px; }
      .tabBtn{ font-size: 20px; }
      .miniBtn{ font-size: 18px; min-width: 140px; }
      .qrImg{ width: 200px; height: 200px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="frame">
      <div class="topRow">
        <div class="title">اللعب من أجهزة متعددة</div>
        <img class="logo" src="logo.PNG" alt="logo">
      </div>

      <input id="hostName" class="hostInput" type="text" placeholder="اكتب اسمك هنا" />

      <div class="board">
        <div class="boardTitle">اسماء اللاعبين</div>
        <div class="boardHint">شارك الرابط مع اللاعبين<br>وأسماء اللاعبين راح تظهر هنا</div>

        <div class="playersList" id="playersList"></div>
      </div>

      <div class="btnWrap">
        <button class="btn btnShare" id="shareBtn">مشاركة اللاعبين</button>
        <button class="btn btnStart" id="startBtn">ابدأ اللعب</button>
      </div>

      <div class="homeBtn" id="homeBtn" title="الرئيسية" aria-label="الرئيسية">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">تم نسخ الرابط ✔</div>

  <!-- Modal -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-label="مشاركة اللعبة">
      <div class="modalHead">
        <button class="closeX" id="closeModal" aria-label="إغلاق">×</button>
        مشاركة اللعبة
      </div>

      <div class="tabs">
        <!-- ✅ ترتيب صحيح -->
        <button class="tabBtn tab-link active" data-tab="link" id="tabLink">رابط</button>
        <button class="tabBtn tab-code" data-tab="code" id="tabCode">رمز</button>
        <button class="tabBtn tab-qr" data-tab="qr" id="tabQr">باركود</button>
      </div>

      <div class="modalBody">
        <!-- رابط -->
        <div class="section show" id="sec-link">
          <div class="box">
            <div class="boxTitle">رابط الدخول</div>
            <div class="linkText" id="joinLinkText">...</div>

            <div class="rowBtns">
              <!-- ✅ فقط نسخ الرابط (حذف فتح المتجر) -->
              <button class="miniBtn" id="copyLinkBtn">نسخ الرابط</button>
            </div>
          </div>
        </div>

        <!-- رمز -->
        <div class="section" id="sec-code">
          <div class="box">
            <div class="boxTitle">رمز الغرفة</div>
            <div class="codeBig" id="roomCodeText">------</div>
          </div>
        </div>

        <!-- باركود -->
        <div class="section" id="sec-qr">
          <div class="box">
            <div class="boxTitle">امسح الباركود للدخول</div>
            <div class="qrWrap">
              <img class="qrImg" id="qrImg" alt="QR" />
              <div style="font-weight:900;color:#555;text-align:center;font-size:14px;opacity:.9">
                إذا ما ظهر الباركود، انتظر ثانية أو افتح تبويب (رابط) وانسخه.
              </div>
            </div>

            <div class="rowBtns" style="margin-top:12px">
              <button class="miniBtn" id="copyLinkBtn2">نسخ الرابط</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // ====== Placeholder behavior (مثل جهاز واحد) ======
    const hostInput = document.getElementById('hostName');
    document.addEventListener('focusin', (e) => {
      if (e.target === hostInput) {
        e.target.dataset.ph = e.target.placeholder;
        e.target.placeholder = '';
      }
    });
    document.addEventListener('focusout', (e) => {
      if (e.target === hostInput) {
        if (!e.target.value.trim()) {
          e.target.placeholder = e.target.dataset.ph || '';
        }
      }
    });

    // ====== عناصر ======
    const playersList = document.getElementById('playersList');
    const shareBtn = document.getElementById('shareBtn');
    const startBtn = document.getElementById('startBtn');
    const homeBtn = document.getElementById('homeBtn');

    const overlay = document.getElementById('overlay');
    const closeModal = document.getElementById('closeModal');

    const tabBtns = document.querySelectorAll('.tabBtn');
    const secLink = document.getElementById('sec-link');
    const secCode = document.getElementById('sec-code');
    const secQr = document.getElementById('sec-qr');

    const joinLinkText = document.getElementById('joinLinkText');
    const roomCodeText = document.getElementById('roomCodeText');
    const qrImg = document.getElementById('qrImg');

    const copyLinkBtn = document.getElementById('copyLinkBtn');
    const copyLinkBtn2 = document.getElementById('copyLinkBtn2');
    const toast = document.getElementById('toast');

    // ====== توليد رمز غرفة ======
    function makeRoomCode(){
      return String(Math.floor(100000 + Math.random() * 900000));
    }

    // نخزن الغرفة بالجلسة للمقدم
    let roomCode = sessionStorage.getItem('multi_room');
    if(!roomCode){
      roomCode = makeRoomCode();
      sessionStorage.setItem('multi_room', roomCode);
    }

    // ====== بناء رابط join بشكل صحيح دائماً ======
    // يبني المسار داخل نفس المجلد (repo) حتى ما يصير 404 بسبب مسار غلط
    function buildJoinUrl(code){
      const base = location.origin + location.pathname.replace(/[^\/]*$/, '');
      return base + 'join.html?room=' + encodeURIComponent(code);
    }

    function updateShareData(){
      const url = buildJoinUrl(roomCode);
      joinLinkText.textContent = url;
      roomCodeText.textContent = roomCode;

      // QR عبر خدمة جاهزة
      const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" + encodeURIComponent(url);
      qrImg.src = qrUrl;
    }

    updateShareData();

    // ====== Toast ======
    let toastTimer = null;
    function showToast(msg){
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1200);
    }

    async function copyText(text){
      try{
        await navigator.clipboard.writeText(text);
        showToast('تم نسخ الرابط ✔');
        return true;
      }catch(e){
        // fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try{
          document.execCommand('copy');
          showToast('تم نسخ الرابط ✔');
          document.body.removeChild(ta);
          return true;
        }catch(err){
          document.body.removeChild(ta);
          alert('ما قدرت أنسخ تلقائياً. انسخه يدويًا من داخل المربع.');
          return false;
        }
      }
    }

    function currentJoinUrl(){
      return joinLinkText.textContent.trim();
    }

    copyLinkBtn.addEventListener('click', () => copyText(currentJoinUrl()));
    copyLinkBtn2.addEventListener('click', () => copyText(currentJoinUrl()));

    // ====== فتح/إغلاق المودال ======
    function openModal(){
      updateShareData();
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden','false');
      // افتراضي: رابط
      setTab('link');
    }
    function closeIt(){
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden','true');
    }

    shareBtn.addEventListener('click', openModal);
    closeModal.addEventListener('click', closeIt);
    overlay.addEventListener('click', (e) => {
      if(e.target === overlay) closeIt();
    });

    // ====== التابات (إصلاح التبديل) ======
    function setTab(which){
      tabBtns.forEach(b => b.classList.remove('active'));
      secLink.classList.remove('show');
      secCode.classList.remove('show');
      secQr.classList.remove('show');

      if(which === 'link'){
        document.getElementById('tabLink').classList.add('active');
        secLink.classList.add('show');
      }else if(which === 'code'){
        document.getElementById('tabCode').classList.add('active');
        secCode.classList.add('show');
      }else{
        document.getElementById('tabQr').classList.add('active');
        secQr.classList.add('show');
      }
    }

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        setTab(btn.getAttribute('data-tab'));
      });
    });

    // ====== قائمة اللاعبين (مؤقتاً محلياً للمظهر) ======
    // (الربط الحقيقي مع join.html + Firebase بنسويه بعد إضافة join.html)
    const localPlayersKey = 'multi_players_' + roomCode;

    function renderPlayers(names){
      playersList.innerHTML = '';
      (names || []).forEach(n => {
        const d = document.createElement('div');
        d.className = 'pItem';
        d.textContent = n;
        playersList.appendChild(d);
      });
    }

    function loadLocalPlayers(){
      try{
        const v = localStorage.getItem(localPlayersKey);
        const arr = v ? JSON.parse(v) : [];
        return Array.isArray(arr) ? arr : [];
      }catch(e){ return []; }
    }

    renderPlayers(loadLocalPlayers());

    // ====== زر ابدأ اللعب (لاحقاً بيروح لصفحة اللعبة المتعددة) ======
    startBtn.addEventListener('click', () => {
      // حالياً فقط تأكيد بسيط (لين نكمل صفحات النمط المتعدد)
      if(!hostInput.value.trim()){
        alert('اكتب اسمك (اسم المقدم) أولاً');
        return;
      }
      sessionStorage.setItem('multi_host', hostInput.value.trim());
      sessionStorage.setItem('multi_room', roomCode);
      alert('تمام. الآن شارك الرابط مع اللاعبين. (بنكمّل صفحات النمط المتعدد بعد join.html)');
    });

    // ====== زر الرئيسية ======
    homeBtn.addEventListener('click', () => {
      // لا نمسح كل شيء عشان ما نخرب النمط، فقط رجوع للرئيسية
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
