<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>بانتظار بدء اللعبة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#e9e4d6;
      --olive:#4e5a2a;
      --panel:#6e7b46;
      --black:#111;
      --shadow:rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--olive);
      font-family:"Baloo Bhaijaan 2", Arial, sans-serif;
      color:var(--black);
    }

    .page{
      min-height:100svh;
      display:flex;
      justify-content:center;
      padding:18px 16px 28px;
    }

    .frame{
      width:min(560px,100%);
      border-radius:26px;
      border:6px solid var(--olive);
      padding:18px 14px 22px;
      position:relative;
      background:var(--bg);
      box-shadow:0 14px 0 rgba(0,0,0,.10);
    }

    .logo{
      position:absolute;
      left:14px;
      top:10px;
      width:92px;
      height:auto;
      object-fit:contain;
      pointer-events:none;
      user-select:none;
    }

    h1{
      margin:70px 0 24px;
      text-align:center;
      font-size:52px;
      color:var(--olive);
      font-weight:900;
      letter-spacing:.5px;
    }

    .panel{
      margin:0 auto;
      width:92%;
      background:var(--panel);
      border-radius:26px;
      padding:22px 16px;
      box-shadow:0 10px 0 rgba(0,0,0,.12);
    }

    .waitBox{
      width:100%;
      background:rgba(255,255,255,.06);
      border-radius:22px;
      padding:22px 16px;
      border:4px solid rgba(0,0,0,.18);
      box-shadow:0 10px 0 var(--shadow) inset;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:86px;
    }

    .waitText{
      color:#fff;
      font-size:42px;
      font-weight:900;
      text-align:center;
      letter-spacing:.2px;
      min-height:48px;
    }

    @media (max-width:430px){
      h1{font-size:46px}
      .waitText{font-size:38px}
      .logo{width:84px}
    }
  </style>
</head>
<body>

  <div class="page">
    <div class="frame">
      <img class="logo" src="logo.PNG" alt="logo">
      <h1>لعبة برا السالفة</h1>

      <div class="panel">
        <div class="waitBox">
          <div id="waitText" class="waitText"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // الحركة المطلوبة:
    // بانتظار -> بانتظار مقدم -> بانتظار مقدم اللعبة -> . -> .. -> ... -> (اختفاء) -> تكرار
    const el = document.getElementById('waitText');
    const frames = [
      'بانتظار',
      'بانتظار مقدم',
      'بانتظار مقدم اللعبة',
      'بانتظار مقدم اللعبة.',
      'بانتظار مقدم اللعبة..',
      'بانتظار مقدم اللعبة...',
      '' // تختفي جميعها
    ];

    let i = 0;
    function tick(){
      el.textContent = frames[i];
      i = (i + 1) % frames.length;
    }
    tick();
    setInterval(tick, 450);
  </script>

</body>
</html>
