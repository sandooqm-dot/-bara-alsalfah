<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>انتظار</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#e9e4d6;
      --olive:#4e5a2a;
      --panel:#6e7b46;
      --black:#111;
      --yellow:#ffd21a;
      --btnShadow:rgba(0,0,0,.22);
      --purple:#6f3cff;
      --blue:#bfe4ff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--olive);
      font-family:"Baloo Bhaijaan 2", Arial, sans-serif;
      color:var(--black);
    }

    .page{
      min-height:100svh;
      display:flex;
      justify-content:center;
      padding:18px 16px 28px;
    }

    .frame{
      width:min(560px,100%);
      border-radius:26px;
      border:6px solid var(--olive);
      padding:18px 14px 22px;
      position:relative;
      background:var(--bg);
      box-shadow:0 14px 0 rgba(0,0,0,.12);
    }

    .logo{
      position:absolute;
      left:14px;
      top:10px;
      width:92px;
      height:auto;
      pointer-events:none;
      user-select:none;
    }

    h1{
      margin:56px 0 18px;
      text-align:center;
      font-size:46px;
      color:var(--olive);
      font-weight:900;
      letter-spacing:.5px;
    }

    .panel{
      margin:0 auto;
      width:92%;
      background:var(--panel);
      border-radius:26px;
      padding:22px 16px;
      box-shadow:0 12px 0 rgba(0,0,0,.14);
    }

    .waitBox{
      background:rgba(0,0,0,.10);
      border:4px solid rgba(0,0,0,.18);
      border-radius:22px;
      padding:18px 14px;
      text-align:center;
      color:#fff;
      font-size:40px;
      font-weight:900;
      min-height:92px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:10px;
    }

    .myName{
      font-size:30px;
      font-weight:900;
      color:#fff;
      opacity:.95;
    }

    .col{
      display:flex;
      flex-direction:column;
      min-height:calc(100svh - 18px - 28px - 18px);
    }
    .spacer{flex:1}

    .buyWrap{
      width:92%;
      margin:18px auto 0;
      display:flex;
      justify-content:center;
    }

    .buyBtn{
      width:100%;
      background:var(--purple);
      color:#fff;
      border:6px solid var(--black);
      border-radius:999px;
      font-size:38px;
      font-weight:900;
      padding:16px 14px;
      box-shadow:0 12px 0 var(--btnShadow);
      cursor:pointer;
      text-decoration:none;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .buyBtn:active{transform:translateY(2px)}

    .homeBtn{
      position:fixed;
      left:14px;
      bottom:14px;
      width:64px;height:64px;
      border-radius:18px;
      border:5px solid var(--black);
      background:var(--blue);
      box-shadow:0 10px 0 rgba(0,0,0,.18);
      display:grid;place-items:center;
      z-index:40;
      cursor:pointer;
    }
    .homeBtn:active{transform:translateY(2px)}
    .homeBtn svg{width:34px;height:34px}
  </style>
</head>

<body>
  <div class="page">
    <div class="frame">
      <img class="logo" src="logo.PNG" alt="logo">

      <div class="col">
        <h1>لعبة برا السالفة</h1>

        <div class="panel">
          <div class="waitBox">
            <div id="waitLine">بانتظار</div>
            <div id="myNameLine" class="myName"></div>
          </div>
        </div>

        <div class="spacer"></div>

        <div class="buyWrap">
          <a class="buyBtn" href="https://sandooq-m.com/" target="_blank">
            لشراء اللعبة اضغط هنا
          </a>
        </div>
      </div>
    </div>
  </div>

  <button id="homeBtn" class="homeBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5">
      <path d="M3 10.5L12 3l9 7.5"></path>
      <path d="M5 10v10h14V10"></path>
      <path d="M9 20v-7h6v7"></path>
    </svg>
  </button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDQx4gJZMHNWQBeMYsU4fknZHG0WFJ_ckc",
      authDomain: "bara-alsalfah.firebaseapp.com",
      projectId: "bara-alsalfah"
    };

    initializeApp(firebaseConfig);
    getFirestore();

    const params = new URLSearchParams(location.search);
    const room = params.get('room') || '';

    const myName = localStorage.getItem(`bara_room_${room}_myname`) || '';
    if(myName){
      document.getElementById('myNameLine').textContent = `اسمك: ${myName}`;
    }

    const steps = [
      'بانتظار',
      'بانتظار مقدم',
      'بانتظار مقدم اللعبة',
      'بانتظار مقدم اللعبة.',
      'بانتظار مقدم اللعبة..',
      'بانتظار مقدم اللعبة...',
      ''
    ];
    let i = 0;
    setInterval(()=>{
      document.getElementById('waitLine').textContent = steps[i];
      i = (i+1) % steps.length;
    }, 450);

    document.getElementById('homeBtn').onclick = ()=>{
      location.href = room ? `join.html?room=${room}` : 'join.html';
    };
  </script>
</body>
</html>
