<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>انتظار</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#e9e4d6;
      --olive:#4e5a2a;
      --panel:#6e7b46;
      --black:#111;
      --yellow:#ffd21a;
      --btnShadow:rgba(0,0,0,.22);
      --purple:#6f3cff;
      --purpleDark:#4f22d6;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--olive);
      font-family:"Baloo Bhaijaan 2", Arial, sans-serif;
      color:var(--black);
    }

    .page{
      min-height:100svh;
      display:flex;
      justify-content:center;
      padding:18px 16px 28px;
    }

    .frame{
      width:min(560px,100%);
      border-radius:26px;
      border:6px solid var(--olive);
      padding:18px 14px 22px;
      position:relative;
      background:var(--bg);
      box-shadow:0 14px 0 rgba(0,0,0,.12);
    }

    .logo{
      position:absolute;
      left:14px;
      top:10px;
      width:92px;
      height:auto;
      pointer-events:none;
      user-select:none;
    }

    h1{
      margin:56px 0 18px;
      text-align:center;
      font-size:46px;
      color:var(--olive);
      font-weight:900;
      letter-spacing:.5px;
    }

    /* الصندوق الزيتوني الكبير */
    .panel{
      margin:0 auto;
      width:92%;
      background:var(--panel);
      border-radius:26px;
      padding:22px 16px;
      box-shadow:0 12px 0 rgba(0,0,0,.14);
    }

    /* صندوق عبارة الانتظار */
    .waitBox{
      background:rgba(0,0,0,.10);
      border:4px solid rgba(0,0,0,.18);
      border-radius:22px;
      padding:18px 14px;
      text-align:center;
      color:#fff;
      font-size:40px;
      font-weight:900;
      min-height:92px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* ترتيب العناصر داخل الإطار: نخلي زر الشراء ينزل لتحت مثل مكان الدائرة الحمراء */
    .col{
      display:flex;
      flex-direction:column;
      min-height:calc(100svh - 18px - 28px - 18px); /* تقريباً داخل الإطار */
    }
    .spacer{flex:1}

    .buyWrap{
      width:92%;
      margin:18px auto 0;
      display:flex;
      justify-content:center;
    }

    .buyBtn{
      width:100%;
      background:var(--purple);
      color:#fff;
      border:6px solid var(--black);
      border-radius:999px;
      font-size:38px;
      font-weight:900;
      padding:16px 14px;
      box-shadow:0 12px 0 var(--btnShadow);
      cursor:pointer;
      text-decoration:none;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:transform .05s ease, filter .15s ease, background .15s ease;
    }
    .buyBtn:active{transform:translateY(2px)}
    .buyBtn:hover{filter:brightness(1.02)}
    .buyBtn:focus{outline:none}

    @media (max-width:430px){
      h1{font-size:40px}
      .waitBox{font-size:34px; min-height:84px}
      .buyBtn{font-size:34px}
      .logo{width:84px}
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="frame">
      <img class="logo" src="logo.PNG" alt="logo">

      <div class="col">
        <h1>لعبة برا السالفة</h1>

        <div class="panel">
          <div id="waitText" class="waitBox">بانتظار</div>
        </div>

        <div class="spacer"></div>

        <!-- ✅ زر الشراء (مكان الدائرة الحمراء) -->
        <div class="buyWrap">
          <a class="buyBtn" href="https://sandooq-m.com/" target="_blank" rel="noopener noreferrer">
            لشراء اللعبة اضغط هنا
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ✅ حركة النص: بانتظار -> بانتظار مقدم -> بانتظار مقدم اللعبة -> . .. ... -> ثم تعاد
    const el = document.getElementById('waitText');

    const steps = [
      'بانتظار',
      'بانتظار مقدم',
      'بانتظار مقدم اللعبة',
      'بانتظار مقدم اللعبة.',
      'بانتظار مقدم اللعبة..',
      'بانتظار مقدم اللعبة...',
      '' // لحظة اختفاء بسيطة قبل الإعادة
    ];

    let i = 0;
    setInterval(() => {
      el.textContent = steps[i];
      i = (i + 1) % steps.length;
    }, 450);
  </script>
</body>
</html>
