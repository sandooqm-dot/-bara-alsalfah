<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>تفعيل اللعبة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --blue:#1f4fa3;
      --blue2:#173e84;
      --yellow:#f4c400;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:rgba(15, 23, 42, .12);
      --shadow: 0 18px 50px rgba(0,0,0,.25);
      --radius:22px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Baloo Bhaijaan 2", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color:#fff;
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px 16px calc(24px + env(safe-area-inset-bottom));
      background:
        radial-gradient(1200px 600px at 50% 105%, rgba(244,196,0,.20), transparent 60%),
        radial-gradient(900px 500px at 10% 10%, rgba(255,255,255,.12), transparent 55%),
        radial-gradient(900px 500px at 90% 0%, rgba(255,255,255,.08), transparent 55%),
        linear-gradient(180deg, var(--blue), var(--blue2));
      overflow-x:hidden;
    }
    body:before{
      content:"";
      position:fixed; inset:0;
      background-image: radial-gradient(rgba(255,255,255,.10) 1px, transparent 1px);
      background-size: 22px 22px;
      opacity:.35;
      pointer-events:none;
      transform: translateZ(0);
    }

    .wrap{width:min(520px, 100%); text-align:center; position:relative;}
    .logo{
      width:160px; max-width:60vw; height:auto; display:block;
      margin:0 auto 14px;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.25));
      user-select:none; pointer-events:none;
    }
    h1{
      margin:0 0 14px;
      font-size: clamp(28px, 5.2vw, 44px);
      font-weight:800;
      color: var(--yellow);
      text-shadow: 0 10px 22px rgba(0,0,0,.28);
    }

    .card{
      background:rgba(255,255,255,.92);
      color:var(--text);
      border:1px solid rgba(255,255,255,.25);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 18px 16px 14px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .label{ text-align:right; font-size:18px; font-weight:800; margin:2px 2px 10px; }

    .input{
      width:100%; height:56px; border-radius:16px;
      border:1px solid var(--border); background:#fff;
      padding:0 14px; font-size:18px; outline:none;
      text-align:left; direction:ltr;
    }
    .input:focus{
      border-color: rgba(31,79,163,.45);
      box-shadow: 0 0 0 4px rgba(31,79,163,.14);
    }

    .btn{
      width:100%; height:58px; margin-top:12px;
      border:0; border-radius:16px;
      background: var(--yellow);
      color:#1b1b1b;
      font-weight:900; font-size:22px;
      cursor:pointer;
      box-shadow: 0 14px 30px rgba(244,196,0,.28);
      transition: transform .08s ease, filter .12s ease;
    }
    .btn:active{transform: scale(.99)}
    .btn[disabled]{opacity:.7; cursor:not-allowed; filter:grayscale(.2)}

    .note{ margin:10px 0 0; color:#334155; font-size:14px; font-weight:700; }

    .msg{
      margin-top:10px; padding:10px 12px; border-radius:14px;
      font-weight:800; display:none; text-align:center;
    }
    .msg.ok{background:#e8fff0; color:#0f5132; border:1px solid rgba(15,81,50,.18)}
    .msg.err{background:#fff1f2; color:#991b1b; border:1px solid rgba(153,27,27,.18)}

    .sub{
      margin-top:14px;
      color: rgba(255,255,255,.85);
      font-size:13px; font-weight:700;
      text-shadow: 0 8px 18px rgba(0,0,0,.22);
    }

    .small{
      margin-top:8px;
      color:#475569;
      font-size:13px;
      font-weight:800;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <img class="logo" src="logo.PNG" alt="صندوق المسابقات" />
    <h1>تفعيل اللعبة</h1>

    <section class="card" aria-label="Activation">
      <div class="label">أدخل كود اللعبة</div>

      <input id="code" class="input" inputmode="text" autocomplete="off" autocapitalize="characters"
             placeholder="مثال: SNDQ-XXXX-XXXX-XXXX" />

      <button id="btn" class="btn">تفعيل</button>

      <div id="msgOk" class="msg ok">تم التفعيل بنجاح ✅</div>
      <div id="msgErr" class="msg err">الكود غير صحيح أو مستخدم.</div>

      <p class="note">بعد التفعيل سيتم ربط الكود بهذا الجهاز.</p>
      <div class="small" id="devHint" style="display:none;"></div>
    </section>

    <div class="sub">© صندوق المسابقات</div>
  </main>

  <script>
    // ✅ رابط Apps Script (اللي أرسلته)
    const API_URL = "https://script.google.com/macros/s/AKfycbwDxN4zps9dwADEcjCNw-RbnlYnGYvoNbwQh1R-6MHXFx8AVA1EVEuA6m4miuyctQm3Eg/exec";

    // مفاتيح التخزين
    const LS_ACTIVE_CODE = "SNDQ_ACTIVE_CODE";
    const LS_DEVICE_KEY  = "SNDQ_DEVICE_KEY";
    const LS_ACTIVE_AT   = "SNDQ_ACTIVE_AT";

    const codeEl = document.getElementById('code');
    const btn = document.getElementById('btn');
    const ok = document.getElementById('msgOk');
    const err = document.getElementById('msgErr');
    const devHint = document.getElementById('devHint');

    function show(el, text){
      ok.style.display = 'none';
      err.style.display = 'none';
      if(text) el.textContent = text;
      el.style.display = 'block';
    }

    function normalizeCode(v){
      return (v || '')
        .trim()
        .toUpperCase()
        .replace(/\s+/g,'')
        .replace(/—/g,'-');
    }

    function isValidFormat(code){
      return /^SNDQ-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code);
    }

    function genDeviceKey(){
      // UUID-ish
      try{
        const a = new Uint8Array(16);
        crypto.getRandomValues(a);
        const hex = [...a].map(b => b.toString(16).padStart(2,'0')).join('');
        return "DEV-" + hex;
      }catch(e){
        return "DEV-" + Math.random().toString(16).slice(2) + Date.now().toString(16);
      }
    }

    function getDeviceKey(){
      let k = localStorage.getItem(LS_DEVICE_KEY);
      if(!k){
        k = genDeviceKey();
        localStorage.setItem(LS_DEVICE_KEY, k);
      }
      return k;
    }

    // JSONP helper (بدون مشاكل CORS)
    function jsonp(url, params){
      return new Promise((resolve, reject) => {
        const cb = "cb_" + Date.now() + "_" + Math.random().toString(16).slice(2);
        const script = document.createElement("script");

        const qs = new URLSearchParams(params);
        qs.set("cb", cb);

        const cleanup = () => {
          try{ delete window[cb]; }catch(_){}
          if(script && script.parentNode) script.parentNode.removeChild(script);
        };

        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("TIMEOUT"));
        }, 12000);

        window[cb] = (data) => {
          clearTimeout(timer);
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          clearTimeout(timer);
          cleanup();
          reject(new Error("NETWORK"));
        };

        script.src = url + (url.includes("?") ? "&" : "?") + qs.toString();
        document.body.appendChild(script);
      });
    }

    function getNext(){
      const u = new URL(location.href);
      return u.searchParams.get("next") || "index.html";
    }

    // إذا الجهاز مفعل من قبل → ودّه مباشرة
    (function autoGoIfActive(){
      const c = localStorage.getItem(LS_ACTIVE_CODE);
      const d = localStorage.getItem(LS_DEVICE_KEY);
      if(c && d){
        // ما نعيد تحقق هنا عشان السرعة (نقدر نسويه لاحقاً بصمت)
        // نوديه للصفحة المطلوبة
        // ملاحظة: نخليها Replace عشان ما يرجع لصفحة التفعيل بالباك
        location.replace(getNext());
      }
    })();

    btn.addEventListener('click', async () => {
      const code = normalizeCode(codeEl.value);
      codeEl.value = code;

      if(!code){
        show(err, 'اكتب الكود أولاً.');
        return;
      }
      if(!isValidFormat(code)){
        show(err, 'صيغة الكود غير صحيحة. مثال: SNDQ-XXXX-XXXX-XXXX');
        return;
      }

      const device = getDeviceKey();
      devHint.style.display = "none";

      btn.disabled = true;
      ok.style.display='none';
      err.style.display='none';

      try{
        // نطلب التحقق من الشيت
        const res = await jsonp(API_URL, { code, device });

        if(res && res.ok){
          localStorage.setItem(LS_ACTIVE_CODE, code);
          localStorage.setItem(LS_ACTIVE_AT, new Date().toISOString());
          // deviceKey محفوظ مسبقاً

          show(ok, 'تم التفعيل بنجاح ✅');
          // نرجع للصفحة المطلوبة بعد ثانية
          setTimeout(() => location.replace(getNext()), 650);
        }else{
          const msg = (res && res.msg) ? res.msg : 'الكود غير صحيح أو مستخدم.';
          show(err, msg);
          // تلميح اختياري للمساعدة
          if(res && res.status === "USED"){
            devHint.style.display = "block";
            devHint.textContent = "ملاحظة: هذا الكود مربوط بجهاز آخر.";
          }
        }
      }catch(e){
        show(err, 'تعذر الاتصال بالخادم. جرّب مرة ثانية.');
      }finally{
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
