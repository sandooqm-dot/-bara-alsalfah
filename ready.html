<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>لعبة برا السالفة - جاهز</title>

  <style>
    :root{
      --bg:#e9e3d6;
      --green:#3f5b2a;
      --greenCard:#6e8554;
      --yellow:#f2c300;
      --text:#1a1a1a;

      --shadow: 0 10px 0 rgba(0,0,0,0.18);
      --shadowSmall: 0 8px 0 rgba(0,0,0,0.18);

      --frameRadius: 28px;
      --frameBorder: 6px;

      --cardRadius: 22px;
      --nameRadius: 22px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--text);
    }

    .page{
      min-height: 100vh;
      padding: 14px 12px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .frame{
      width: min(520px, 100%);
      background: var(--bg);
      border: var(--frameBorder) solid var(--green);
      border-radius: var(--frameRadius);
      padding: 18px 16px 26px;
      position: relative;

      min-height: calc(100vh - 28px);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .topRow{
      position: relative;
      min-height: 86px;
      margin-bottom: 4px;
      padding-left: 118px;
    }
    .logo{
      position:absolute;
      left: 10px;
      top: 2px;
      width: 98px;
      height: 98px;
      object-fit: contain;
      opacity: 0.98;
      pointer-events:none;
    }
    .h1{
      position:absolute;
      right: 18px;
      top: 22px;
      margin:0;
      text-align:right;
      color: var(--green);
      font-weight: 1000;
      font-size: 34px;
      letter-spacing: .2px;
      line-height: 1.15;
      white-space:nowrap;
    }

    .sub{
      text-align:center;
      color:#2a2a2a;
      font-weight: 900;
      font-size: 18px;
      margin: 6px 0 14px;
    }

    .center{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      flex-direction:column;
      padding: 6px 0 18px;
      gap: 14px;
    }

    .namePill{
      width: min(440px, 92%);
      background: rgba(216,207,177,0.9);
      border-radius: var(--nameRadius);
      padding: 16px 14px;
      text-align:center;
      color: var(--green);
      font-weight: 1000;
      font-size: 42px;
      line-height: 1;
      letter-spacing: .2px;
    }
    .namePill.hidden{ display:none; }

    .flipWrap{
      width: min(460px, 92%);
      perspective: 1100px;
    }
    .flip{
      width:100%;
      position:relative;
      transform-style: preserve-3d;
      transition: transform .75s ease;
      min-height: 420px;
    }
    .flip.isFlipped{
      transform: rotateY(180deg);
    }

    .cardFace{
      position:absolute;
      inset:0;
      border-radius: var(--cardRadius);
      backface-visibility: hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding: 22px 18px;
      gap: 18px;
    }

    .front,
    .back{
      background: var(--greenCard);
    }
    .back{
      transform: rotateY(180deg);
    }

    .frontText{
      color:#fff;
      font-weight: 1000;
      font-size: 36px;
      line-height: 1.35;
      padding: 0 6px;
      margin-bottom: 12px; /* ✅ فراغ بين الكلام وزر جاهز */
    }

    .revealText{
      color:#fff;
      font-weight: 1000;
      font-size: 58px;
      line-height: 1.1;
      letter-spacing: .2px;
      padding: 0 10px;
    }

    /* ✅ (تعديل) نخلي "انت برا السالفة👀" بسطر واحد + تصغير بسيط إذا ضاق المكان */
    .revealText.small{
      font-size: clamp(40px, 7vw, 52px);
      white-space: nowrap;
      line-height: 1.15;
    }

    .btn{
      width: min(360px, 82%);
      border: 0;
      border-radius: 22px;
      padding: 16px 18px;
      font-size: 46px;
      font-weight: 1000;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      text-align:center;
      background: var(--yellow);
      color:#111;
      box-shadow: var(--shadowSmall);
    }
    .btn:active{ transform: translateY(1px); box-shadow: 0 7px 0 rgba(0,0,0,0.18); }
    .btn[disabled]{
      opacity:.55;
      cursor:not-allowed;
      transform:none;
    }

    .note{
      color: rgba(255,255,255,0.9);
      font-weight: 900;
      font-size: 16px;
      line-height: 1.5;
      opacity: .95;
      display:none;
    }

    .err{
      width: min(460px, 92%);
      text-align:center;
      color:#b00020;
      font-weight: 900;
      font-size: 16px;
      display:none;
      line-height: 1.4;
      margin: 10px auto 0;
    }

    .homeBtn{
      position:absolute;
      left: 18px;
      bottom: 18px;
      width:72px;
      height:72px;
      border-radius:50%;
      border:6px solid #000;
      background:#a9dbff;
      display:none;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:0 8px 0
