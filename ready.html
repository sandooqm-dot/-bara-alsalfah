<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>لعبة برا السالفة - جاهز</title>

  <style>
    :root{
      --bg:#e9e3d6;
      --green:#3f5b2a;
      --green2:#6e8554;
      --yellow:#f2c300;
      --blue:#bfe3ff;
      --text:#1a1a1a;
      --muted:#9a9a9a;

      --shadow: 0 10px 0 rgba(0,0,0,0.18);
      --shadowSmall: 0 8px 0 rgba(0,0,0,0.18);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--text);
    }

    .page{
      min-height: 100vh;
      padding: 14px 12px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    .frame{
      width: min(520px, 100%);
      background: var(--bg);
      border: 6px solid var(--green);
      border-radius: 26px;
      padding: 18px 16px 22px;
      position: relative;

      min-height: calc(100vh - 28px);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .topRow{
      position: relative;
      min-height: 86px;
      margin-bottom: 6px;
      padding-left: 118px;
    }
    .logo{
      position:absolute;
      left: 10px;
      top: 2px;
      width: 98px;
      height: 98px;
      object-fit: contain;
      opacity: 0.98;
      pointer-events:none;
    }
    .h1{
      position:absolute;
      right: 18px;
      top: 22px;
      margin:0;
      text-align:right;
      color: var(--green);
      font-weight: 1000;
      font-size: 34px;
      letter-spacing: .2px;
      line-height: 1.15;
      white-space:nowrap;
    }

    .sub{
      text-align:center;
      color:#2a2a2a;
      font-weight: 900;
      font-size: 18px;
      margin: 6px 0 12px;
    }

    .center{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px 0 18px;
    }

    /* Card flip */
    .flipWrap{
      width: min(460px, 92%);
      perspective: 1100px;
    }
    .flip{
      width:100%;
      position:relative;
      transform-style: preserve-3d;
      transition: transform .75s ease;
    }
    .flip.isFlipped{
      transform: rotateY(180deg);
    }

    .cardFace{
      width:100%;
      min-height: 340px;
      border-radius: 22px;
      border: 6px solid #000;
      box-shadow: var(--shadow);
      background:#fff;
      padding: 18px 16px 16px;
      backface-visibility: hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 14px;
      text-align:center;
    }

    .front{
      background: rgba(255,255,255,0.9);
    }

    .back{
      position:absolute;
      inset:0;
      transform: rotateY(180deg);
      background: rgba(191,227,255,0.55);
    }

    .bigTitle{
      color:#111;
      font-weight: 1000;
      font-size: 34px;
      line-height: 1.15;
      margin: 0;
    }
    .hint{
      color:#3a3a3a;
      font-weight: 900;
      font-size: 16px;
      line-height: 1.45;
      max-width: 360px;
    }

    .wordBox{
      width: min(360px, 88%);
      background:#fff;
      border: 5px solid var(--green2);
      border-radius: 18px;
      padding: 14px 12px;
      font-weight: 1000;
      font-size: 34px;
      letter-spacing: .2px;
      box-shadow: 0 8px 0 rgba(0,0,0,0.10);
      color:#111;
    }

    .outsiderBox{
      width: min(360px, 88%);
      background: rgba(242,195,0,0.25);
      border: 5px solid rgba(0,0,0,0.25);
      border-radius: 18px;
      padding: 14px 12px;
      font-weight: 1000;
      font-size: 30px;
      color:#111;
      line-height: 1.2;
    }

    .btn{
      width: min(360px, 82%);
      border: 4px solid #000;
      border-radius: 22px;
      padding: 14px 18px;
      font-size: 28px;
      font-weight: 1000;
      box-shadow: var(--shadowSmall);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      text-align:center;
      background: var(--yellow);
      color:#111;
    }
    .btn.secondary{
      background: var(--blue);
    }
    .btn:active{ transform: translateY(1px); box-shadow: 0 7px 0 rgba(0,0,0,0.18); }
    .btn[disabled]{
      opacity:.55;
      cursor:not-allowed;
      transform:none;
    }

    .smallNote{
      margin-top: 6px;
      color:#4a4a4a;
      font-weight: 900;
      font-size: 14px;
      line-height: 1.5;
      max-width: 420px;
    }

    .err{
      width: min(460px, 92%);
      text-align:center;
      color:#b00020;
      font-weight: 900;
      font-size: 16px;
      display:none;
      line-height: 1.4;
      margin: 10px auto 0;
    }

    @media (max-width: 360px){
      .h1{ font-size: 30px; top: 20px; right: 16px; }
      .logo{ width: 90px; height: 90px; }
      .bigTitle{ font-size: 30px; }
      .wordBox{ font-size: 30px; }
      .outsiderBox{ font-size: 28px; }
      .btn{ font-size: 26px; }
      .cardFace{ min-height: 320px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="frame">

      <div class="topRow">
        <img class="logo" src="logo.PNG" alt="logo">
        <div class="h1">لعبة برا السالفة</div>
      </div>

      <div class="sub">اضغط "جاهز" عشان تنقلب البطاقة وتظهر لك السالفة</div>

      <div class="center">
        <div class="flipWrap">
          <div class="flip" id="flip">

            <!-- Front -->
            <div class="cardFace front">
              <h2 class="bigTitle">جاهز؟</h2>
              <div class="hint">إذا انقلبت البطاقة لا توري أحد، خلك مركز 👀</div>
              <button class="btn" id="readyBtn">جاهز</button>
              <div class="smallNote" id="frontNote"></div>
            </div>

            <!-- Back -->
            <div class="cardFace back">
              <div id="revealBox" class="wordBox" style="display:none;"></div>
              <div id="outsiderBox" class="outsiderBox" style="display:none;">أنت برا السالفة</div>

              <div class="hint" id="backHint">إذا فهمت السالفة اضغط "فهمت"</div>
              <button class="btn secondary" id="understoodBtn" disabled>فهمت</button>

              <div class="smallNote" id="backNote"></div>
            </div>

          </div>
        </div>
      </div>

      <div id="err" class="err"></div>

    </div>
  </div>
