<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>تحويل...</title>

  <!-- منع الكاش قدر الإمكان -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <script>
    (function () {
      // يحافظ على نفس باراميترات الرابط مثل ?room=xxxx&name=...
      var qs = window.location.search || "";
      var target = "reveal.html" + qs;

      // كسر الكاش (إضافة v)
      target += (qs.includes("?") ? "&" : "?") + "v=" + Date.now();

      // تحويل فوري
      window.location.replace(target);
    })();
  </script>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background:#e9e4d6;
      color:#1b1b1b;
    }
    .box{
      padding:18px 16px;
      border:4px solid #3f5a2a;
      border-radius:18px;
      background:#fff;
      font-weight:800;
      font-size:18px;
      text-align:center;
      max-width:320px;
    }
  </style>
</head>
<body>
  <div class="box">جاري التحويل لصفحة الكشف…</div>
</body>
</html>
